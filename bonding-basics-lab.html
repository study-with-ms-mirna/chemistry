<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bonding Basics Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@600&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf0f8;--grid:#dbe4f1;--ink:#18233a;--muted:#5a6780;--line:#c9d4e6;--shadow:#c3cfe3;
--teal:#0f8b8d;--blue:#2b59c3;--plum:#8a4fbf;--amber:#e8962a;--coral:#e2708a;--red:#d8434a;--accent:#0f8b8d}
*{box-sizing:border-box}
html,body{margin:0}
html{color-scheme:light}
body{background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.4}
.wrap{max-width:1260px;margin:0 auto;padding:18px 20px 34px}
header{display:flex;align-items:center;gap:14px;margin-bottom:16px}
header svg{flex:none;width:62px;height:62px}
.brand{font-family:Caveat,cursive;font-size:22px;color:var(--muted);line-height:1}
.brand b{font-family:Pacifico,cursive;font-weight:400;font-size:20px;color:var(--teal)}
h1{font-family:Fredoka,sans-serif;font-weight:600;font-size:32px;margin:0;line-height:1.1}
.sub{color:var(--muted);font-size:16px}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tab{font-family:Fredoka,sans-serif;font-weight:500;font-size:16px;padding:8px 14px;border-radius:16px;border:2px solid var(--line);background:#fff;box-shadow:0 4px 0 var(--shadow);cursor:pointer;display:flex;align-items:center;gap:8px}
.tab i{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-block}
.tab.on{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 4px 0 rgba(24,35,58,.22)}
.tab.on i{background:#fff}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.step{font-family:Fredoka,sans-serif;font-size:16px;padding:6px 14px 6px 7px;border-radius:999px;border:2px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;gap:8px}
.step b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--line);font-weight:600;font-size:14px}
.step.on{border-color:var(--accent);color:var(--accent)}
.step.on b{background:var(--accent);color:#fff}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:960px){.main{grid-template-columns:1fr}}
.card{background:#fff;border:2px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--shadow);padding:16px}
.stage h2{font-family:Fredoka,sans-serif;font-weight:600;font-size:22px;margin:0 0 10px;color:var(--accent)}
canvas{width:100%;height:auto;display:block;border-radius:14px;background:#f6f8fc;touch-action:manipulation}
canvas.click{cursor:pointer}
.controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-top:14px}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grp>span{font-family:Fredoka,sans-serif;font-weight:500;font-size:15px;color:var(--muted);margin-right:2px}
.chip{font-family:Fredoka,sans-serif;font-weight:500;font-size:15px;padding:5px 11px;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer;min-width:38px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.btn{font-family:Fredoka,sans-serif;font-weight:500;font-size:16px;padding:9px 16px;border-radius:14px;border:2px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer;box-shadow:0 3px 0 var(--shadow)}
.btn.fill{background:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.ctl{display:flex;align-items:center;gap:10px;font-family:Fredoka,sans-serif;font-size:16px}
.ctl output{min-width:70px;font-weight:600;color:var(--accent)}
input[type=range]{-webkit-appearance:none;appearance:none;width:260px;max-width:56vw;height:10px;border-radius:999px;background:#dfe6f2;outline:none;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;background:var(--accent);border:4px solid #fff;box-shadow:0 0 0 2px var(--accent),0 2px 3px rgba(0,0,0,.25);cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:4px solid #fff;box-shadow:0 0 0 2px var(--accent);cursor:pointer}
.ans{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:12px;font-family:Fredoka,sans-serif;font-size:18px}
.ans label{display:flex;align-items:center;gap:6px}
.ans input{width:58px;font-family:Fredoka,sans-serif;font-size:20px;font-weight:600;text-align:center;border:2px solid var(--line);border-radius:10px;padding:4px;-webkit-appearance:none;appearance:none;background:#fff;color:var(--ink)}
.ans input.ok{border-color:#2e9e5b;background:#e8f6ee}.ans input.no{border-color:#d8434a;background:#fdeeee}
.fb{margin-top:12px;border-radius:14px;padding:10px 14px;font-size:17px;background:#f3f6fb;border:2px solid var(--line);display:none}
.fb.show{display:block}
.fb.ok{background:#e8f6ee;border-color:#2e9e5b}
.fb.bad{background:#fdeeee;border-color:#d8434a}
.fb.hint{background:#fff6e8;border-color:#e8962a}
.side{display:flex;flex-direction:column;gap:14px}
.lbl{font-family:Fredoka,sans-serif;font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.q{font-size:19px;font-weight:700}
.reads{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rd{background:#f3f6fb;border-radius:14px;padding:8px 10px}
.rd span{display:block;font-size:13px;color:var(--muted)}
.rd b{font-family:Fredoka,sans-serif;font-weight:600;font-size:19px}
.rd.wide{grid-column:1/-1}
.rulebtn{font-family:Fredoka,sans-serif;font-weight:500;font-size:16px;padding:9px 16px;border-radius:14px;border:none;background:var(--red);color:#fff;cursor:pointer;box-shadow:0 3px 0 #a52f35;align-self:flex-start}
.rule{border:3px dashed var(--red);border-radius:18px;padding:12px 14px;background:#fff;display:none}
.rule.show{display:block;animation:fadein .4s ease}
.rule .lbl{color:var(--red)}
.rule ul{margin:0;padding-left:20px}
.rule li{margin:5px 0}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
table.sum{border-collapse:collapse;width:100%;margin-top:12px;font-size:15.5px}
table.sum th,table.sum td{border:2px solid #e2e9f4;padding:7px 8px;text-align:left;vertical-align:top}
table.sum th{background:#f2f6fb;font-family:Fredoka,sans-serif;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:13px;height:13px;border-radius:50%;display:inline-block}
sub,sup{font-size:.65em}
.score{font-family:Fredoka,sans-serif;font-weight:600;color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <rect x="2" y="2" width="60" height="60" rx="16" fill="#fff" stroke="#c9d4e6" stroke-width="2"/>
    <circle cx="22" cy="34" r="12" fill="none" stroke="#9aa6ba" stroke-width="1.6" stroke-dasharray="3 3"/>
    <circle cx="22" cy="34" r="5.5" fill="#e2708a"/><text x="22" y="37" font-family="Arial" font-weight="700" font-size="8" fill="#fff" text-anchor="middle">+</text>
    <circle cx="34" cy="34" r="3" fill="#0f8b8d"/>
    <path d="M36 28 q6 -9 13 -2" fill="none" stroke="#e8962a" stroke-width="2.2" stroke-linecap="round"/><path d="M47 22 l3 5 -6 0z" fill="#e8962a"/>
    <circle cx="48" cy="40" r="8" fill="#9fb7d4" stroke="#18233a" stroke-width="1.4"/><text x="48" y="44" font-family="Arial" font-weight="700" font-size="11" fill="#18233a" text-anchor="middle">–</text>
  </svg>
  <div>
    <div class="brand">Study with <b>Ms. Mirna</b></div>
    <h1>Bonding Basics Lab</h1>

  </div>
</header>
<nav class="tabs" id="tabs"></nav>
<div class="steps" id="steps"></div>
<div class="main">
  <section class="card stage">
    <h2 id="stitle"></h2>
    <canvas id="cv" width="800" height="500" aria-label="Bonding simulation"></canvas>
    <div class="controls" id="controls"></div>

    <div class="fb" id="fb"></div>
  </section>
  <aside class="side">
    <div class="card"><div class="lbl">Think</div><div class="q" id="q"></div></div>
    <div class="card"><div class="lbl">Readings</div><div class="reads" id="reads"></div></div>
    <button class="rulebtn" id="rulebtn">Reveal our rule</button>
    <div class="rule" id="rule"><div class="lbl">Our rule</div><ul id="rulelist"></ul></div>
  </aside>
</div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=800,H=500;
function fit(){var d=Math.max(2,window.devicePixelRatio||1);cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);}fit();window.addEventListener('resize',fit);
function $(id){return document.getElementById(id);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}
function ease(t){t=clamp(t,0,1);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
var INK='#18233a',MUTED='#5a6780',LINE='#c9d4e6',TEAL='#0f8b8d',CORAL='#e2708a',AMBER='#e8962a',BLUE='#2b59c3',PLUM='#8a4fbf',RED='#d8434a',GREEN='#2e9e5b';
var ECOL='#2b8fd8',ECOL2='#e8962a',NUC='#e2708a',ANION='#9fb7d4',CATION='#f2b8c6';
var FONT='Fredoka, "Atkinson Hyperlegible", Arial, sans-serif';

/* ---------- elements 1-20 ---------- */
var EL=[null,
['H','Hydrogen',1,1,'nonmetal'],['He','Helium',1,18,'noble'],['Li','Lithium',2,1,'metal'],['Be','Beryllium',2,2,'metal'],
['B','Boron',2,13,'metalloid'],['C','Carbon',2,14,'nonmetal'],['N','Nitrogen',2,15,'nonmetal'],['O','Oxygen',2,16,'nonmetal'],
['F','Fluorine',2,17,'nonmetal'],['Ne','Neon',2,18,'noble'],['Na','Sodium',3,1,'metal'],['Mg','Magnesium',3,2,'metal'],
['Al','Aluminium',3,13,'metal'],['Si','Silicon',3,14,'metalloid'],['P','Phosphorus',3,15,'nonmetal'],['S','Sulfur',3,16,'nonmetal'],
['Cl','Chlorine',3,17,'nonmetal'],['Ar','Argon',3,18,'noble'],['K','Potassium',4,1,'metal'],['Ca','Calcium',4,2,'metal']];
var BYSYM={};for(var z=1;z<=20;z++)BYSYM[EL[z][0]]=z;
var TYPECOL={metal:'#fde3ea',nonmetal:'#dff1f1',noble:'#efe4fa',metalloid:'#fdf0dc'};
var TYPEBORDER={metal:CORAL,nonmetal:TEAL,noble:PLUM,metalloid:AMBER};
var TYPENAME={metal:'metal',nonmetal:'nonmetal',noble:'noble gas',metalloid:'metalloid'};
function arrangement(n){var caps=[2,8,8,2],a=[];for(var i=0;i<4&&n>0;i++){var k=Math.min(caps[i],n);a.push(k);n-=k;}return a;}
function valence(Z){var a=arrangement(Z);return a[a.length-1];}
function col8(g){return g<=2?g-1:g-11;}
function SUBN(n){var s='₀₁₂₃₄₅₆₇₈₉';return String(n).split('').map(function(c){return s[+c];}).join('');}
function SUPC(q){if(q===0)return '';var s={'1':'¹','2':'²','3':'³','4':'⁴'};var m=Math.abs(q);return (m>1?s[m]:'')+(q>0?'⁺':'⁻');}
function chargeTxt(q){return q===0?'0 (neutral)':(q>0?q+'+':(-q)+'−');}
function bracketIon(sym,x,y,S,q,dots){var g=glyph(sym,S),pad=dots?S*.2+20:14;drawSym(sym,x,y,S);var by=y+g.capH*0.5;
  ctx.font='400 '+Math.round(S*1.15)+'px '+FONT;ctx.fillStyle=MUTED;ctx.textBaseline='alphabetic';ctx.textAlign='right';ctx.fillText('[',x-g.w/2-pad,by+S*.12);ctx.textAlign='left';ctx.fillText(']',x+g.w/2+pad,by+S*.12);
  var bw=tw(']',Math.round(S*1.15),400);txt((Math.abs(q)>1?Math.abs(q):'')+(q>0?'+':'−'),x+g.w/2+pad+bw+3,y-g.capH*.75,{s:Math.round(S*.4),c:q>0?RED:BLUE,a:'left',w:700});}

/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function txt(s,x,y,o){o=o||{};ctx.font=(o.w||600)+' '+(o.s||15)+'px '+FONT;ctx.fillStyle=o.c||INK;ctx.textAlign=o.a||'center';ctx.textBaseline=o.b||'middle';ctx.fillText(s,x,y);return ctx.measureText(s).width;}
function tw(s,size,w){ctx.font=(w||600)+' '+size+'px '+FONT;return ctx.measureText(s).width;}
function circ(x,y,r,fill,stroke,lw,dash){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||2;ctx.setLineDash(dash||[]);ctx.stroke();ctx.setLineDash([]);}}
function seg(x1,y1,x2,y2,c,w,dash){ctx.strokeStyle=c;ctx.lineWidth=w||2;ctx.setLineDash(dash||[]);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);}
function arrow(x1,y1,x2,y2,c,w){seg(x1,y1,x2,y2,c,w||3);var a=Math.atan2(y2-y1,x2-x1),h=11;ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x2+Math.cos(a)*3,y2+Math.sin(a)*3);ctx.lineTo(x2-Math.cos(a-.5)*h,y2-Math.sin(a-.5)*h);ctx.lineTo(x2-Math.cos(a+.5)*h,y2-Math.sin(a+.5)*h);ctx.closePath();ctx.fill();}
function dblarrow(x1,y1,x2,y2,c,w){arrow((x1+x2)/2,(y1+y2)/2,x2,y2,c,w);arrow((x1+x2)/2,(y1+y2)/2,x1,y1,c,w);}
function pill(s,x,y,bg,fg,size){size=size||15;var w=tw(s,size);rr(x-w/2-10,y-size*.85,w+20,size*1.7,size*.85);ctx.fillStyle=bg;ctx.fill();txt(s,x,y,{s:size,c:fg||'#fff'});}
function banner(s,col){var w=tw(s,17)+30;rr(W/2-w/2,12,w,34,14);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=col||TEAL;ctx.stroke();txt(s,W/2,29,{s:17,c:col||TEAL});}
function box(x,y,w,h,fill,stroke){rr(x,y,w,h,14);ctx.fillStyle=fill||'#fff';ctx.fill();ctx.strokeStyle=stroke||LINE;ctx.lineWidth=2;ctx.stroke();}
function clear(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#f6f8fc';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#e7edf6';ctx.lineWidth=1;for(var x=28;x<W;x+=28){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}for(var y=28;y<H;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}}
function electron(x,y,c,r){r=r||5.5;circ(x,y,r+3,'rgba(43,143,216,0.15)');ctx.fillStyle=c||ECOL;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();}
function ball(x,y,r,c,label,lc,ls){var g=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);g.addColorStop(0,'#ffffff');g.addColorStop(.25,c);g.addColorStop(1,c);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(24,35,58,.45)';ctx.lineWidth=1.4;ctx.stroke();if(label)txt(label,x,y+1,{s:ls||Math.max(10,r*.7),c:lc||INK,w:700});}
/* symbol with atomic number as subscript on the bottom left */
var GB={};
function glyph(sym,size){var k=sym+'|'+size;if(GB[k])return GB[k];ctx.font='700 '+size+'px '+FONT;ctx.textBaseline='alphabetic';ctx.textAlign='left';var m=ctx.measureText(sym),h=ctx.measureText('H');
  var r={w:(m.actualBoundingBoxLeft!=null&&m.actualBoundingBoxRight!=null)?(m.actualBoundingBoxLeft+m.actualBoundingBoxRight):m.width,capH:h.actualBoundingBoxAscent||size*.7,desc:Math.max(0,m.actualBoundingBoxDescent||0)};GB[k]=r;return r;}
if(document.fonts){document.fonts.ready.then(function(){GB={};});document.fonts.addEventListener&&document.fonts.addEventListener('loadingdone',function(){GB={};});}
function drawSym(sym,x,y,size,col){var g=glyph(sym,size);ctx.font='700 '+size+'px '+FONT;ctx.fillStyle=col||INK;ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillText(sym,x,y+g.capH/2);return g;}
function symZ(sym,Z,x,y,size,col,gap){var g=drawSym(sym,x,y,size,col);if(Z){ctx.font='600 '+Math.round(size*.42)+'px '+FONT;ctx.fillStyle=MUTED;ctx.textAlign='right';ctx.textBaseline='alphabetic';ctx.fillText(String(Z),x-g.w/2-4-(gap||0),y+g.capH/2+size*.08);}return g.w;}

/* Bohr model. n = electrons shown; Z = protons. opt: scale, fade (inner faded), hiOuter, labels, extra (array of animated electrons), hidden */
function shellR(i,sc){return (52+i*40)*sc;}
function drawAtom(cx,cy,Z,n,t,opt){opt=opt||{};var sc=opt.scale||1,a=arrangement(n),levels=Math.max(a.length,opt.minLevels||0);
  for(var i=0;i<levels;i++){var r=shellR(i,sc),full=(a[i]===[2,8,8,2][i]);
    circ(cx,cy,r,null,full&&opt.labels!==false?'#7fc4a0':'#a9b5c9',full?2:1.6,[6,6]);}
  var nr=26*sc;ball(cx,cy,nr,NUC,null);txt(Z+' p⁺',cx,cy-(opt.neutrons?6:0)*sc,{s:Math.round(15*sc),c:'#fff',w:700});
  if(opt.neutrons)txt(opt.neutrons+' n⁰',cx,cy+9*sc,{s:Math.round(12*sc),c:'#fff',w:600});
  var pos=[];
  for(i=0;i<a.length;i++){var r2=shellR(i,sc),k=a[i],rot=t*(0.35/(i+1))+i*0.4;
    for(var j=0;j<k;j++){var ang=rot+j*2*Math.PI/k,ex=cx+r2*Math.cos(ang),ey=cy+r2*Math.sin(ang);
      var outer=(i===a.length-1);var c=ECOL;if(opt.hiOuter&&outer)c=ECOL2;
      var isLast=(i===a.length-1&&j===k-1);
      if(!(opt.skipLast&&isLast)&&!(opt.hideOuter&&outer)){ctx.globalAlpha=(opt.fade&&!outer)?0.35:1;electron(ex,ey,c,5.5*Math.max(.8,sc));ctx.globalAlpha=1;}
      pos.push({x:ex,y:ey,level:i,outer:outer});}
    if(opt.labels!==false){var full2=(k===[2,8,8,2][i]);var lx=cx+r2*Math.cos(-0.8),ly=cy+r2*Math.sin(-0.8);
      if(full2&&!opt.nofull)pill(k+' · full',lx+28,ly-6,GREEN,'#fff',12);else pill(String(k),lx+16,ly-6,'#fff',INK,12);}}
  return pos;}

/* electron-dot diagram */
var SIDES=[[0,-1],[1,0],[0,1],[-1,0]];
function dotSlots(n){var c=[0,0,0,0];for(var i=0;i<n;i++)c[i%4]++;return c;}
function dotXY(cx,cy,side,slot,count,size,sym){var g=glyph(sym||'O',size),gap=Math.max(size*.2,9),o=Math.max(size*.16,5.5),px=cx,py=cy;
  if(side===0)py=cy-g.capH/2-gap;else if(side===2)py=cy+g.capH/2+g.desc+gap;else if(side===1)px=cx+g.w/2+gap*.85;else px=cx-g.w/2-gap*.85;
  if(count===2){if(side===0||side===2)px+=slot===0?-o:o;else py+=slot===0?-o:o;}return {x:px,y:py};}
function dotList(cx,cy,n,size,sym){var c=dotSlots(n),L=[];for(var s=0;s<4;s++)for(var k=0;k<c[s];k++)L.push(dotXY(cx,cy,s,k,c[s],size,sym));return L;}
function drawDots(cx,cy,sym,n,size,opt){opt=opt||{};symZ(sym,opt.Z,cx,cy,size,opt.col);var L=dotList(cx,cy,n,size,sym);
  L.forEach(function(p,i){var c=opt.dotCol?(typeof opt.dotCol==='function'?opt.dotCol(i):opt.dotCol):INK;circ(p.x,p.y,Math.max(3,size*.075),c);});return L;}

/* ---------- side panel + controls ---------- */

function drawFormula(d,reveal){var x=400,wsum=0;d.s.forEach(function(p){wsum+=tw(p[0],64,700)+(p[1]>1?tw(String(p[1]),34,700)+4:6);});var cx=x-wsum/2;
  d.s.forEach(function(p){var c=COLS[p[0]]||'#8a94a6';if(c==='#ffffff'||c==='#c9ced8')c='#8a94a6';if(c==='#59606e')c=INK;if(c==='#ead45a')c='#c9a600';var w=txt(p[0],cx,90,{s:64,a:'left',c:c,w:700});cx+=w;if(p[1]>1){var w2=txt(String(p[1]),cx+2,112,{s:34,a:'left',c:PLUM,w:700});cx+=w2+4;}else cx+=6;});
  txt(d.n,x,150,{s:20,c:MUTED});
  if(!reveal){box(220,200,360,120,'#fff');txt('?',400,260,{s:60,c:'#c4cede'});return;}
  var colw=(W-120)/d.s.length,tot=0;
  d.s.forEach(function(p,i){var bx=60+i*colw+colw/2,n=p[1],r=n>6?13:(n>3?17:22),per=n>6?6:(n>3?4:n),sp=r*2+6,rows=Math.ceil(n/per);
    for(var k=0;k<n;k++){var row=Math.floor(k/per),colk=k%per,inRow=Math.min(per,n-row*per);var ox=(colk-(inRow-1)/2)*sp,oy=(row-(rows-1)/2)*sp;ball(bx+ox,240+oy,r,COLS[p[0]]||'#dfe5ee',p[0],p[0]==='C'?'#fff':INK,r>15?15:11);}
    txt(n+' × '+p[0],bx,240+rows*sp/2+26,{s:20,c:PLUM});tot+=n;});
  box(150,350,500,110,'#fff');
  txt('Elements: '+d.s.length+'   ·   Atoms in total: '+tot,400,380,{s:20});
  txt(d.s.length>1?'two or more different elements → a COMPOUND':'only one element → an ELEMENT (a molecule of '+d.n+')',400,410,{s:16,c:d.s.length>1?GREEN:BLUE});
  txt(d.b==='ionic'?'ionic: the formula gives the RATIO of ions':'covalent: the formula shows the atoms in ONE molecule',400,438,{s:15,c:MUTED});}
var T5F={k:'H2O'};
function t5fDraw(t){var d=FORM[T5F.k];drawFormula(d,true);
  setReads(d.s.map(function(p){return [p[0]+' atoms',String(p[1])];}).concat([['Elements',String(d.s.length)],['Total atoms',String(fTotal(d))]]));}
function t5fInit(){ctrlClear();fb();
  mkChips('',[{v:'H2O',t:'H₂O'},{v:'CO2',t:'CO₂'},{v:'O2',t:'O₂'},{v:'NH3',t:'NH₃'},{v:'CH4',t:'CH₄'},{v:'NaCl',t:'NaCl'},{v:'MgCl2',t:'MgCl₂'},{v:'CaCO3',t:'CaCO₃'}],T5F.k,function(v){T5F.k=v;});
  setQ('What does the small number after a symbol tell you? What is the difference between the number of <b>elements</b> and the number of <b>atoms</b>?');
  setRule(['A <b>chemical formula</b> shows which elements are in a substance and how many atoms of each.','<b>Elements</b> = the different symbols (each starts with a capital letter).','<b>Atoms</b> = add up all the subscripts. No subscript means <b>1</b>.','For ionic compounds the formula gives the <b>ratio</b> of ions (NaCl = 1 Na⁺ : 1 Cl⁻).']);}
/* my turn: formulas */
var T5T={d:null,checked:false};
function t5tDraw(t){var dk=T5T.d;if(dk.done){doneScreen(dk,'formulas');return;}var d=FORM[FTURN[dk.order[dk.i]]];drawFormula(d,T5T.checked);progressLine(dk,'Formula');
  setReads([['Elements','count the capital letters',1],['Atoms','add the subscripts (no number = 1)',1]]);}
function t5tInit(){ctrlClear();fb();if(!T5T.d){T5T.d=newDeck(FTURN.length);T5T.checked=false;}var dk=T5T.d;
  var box1=document.createElement('div');box1.className='ans';box1.innerHTML='<label>Number of elements <input id="fe" inputmode="numeric"></label><label>Number of atoms <input id="fa" inputmode="numeric"></label>';$('extra').appendChild(box1);
  mkBtn('Check',true,function(){if(dk.done||T5T.checked)return;var d=FORM[FTURN[dk.order[dk.i]]],e=$('fe'),a=$('fa');if(e.value.trim()===''||a.value.trim()===''){fb('Fill in both boxes first.','hint');return;}
    var ge=+e.value===d.s.length,ga=+a.value===fTotal(d);e.className=ge?'ok':'no';a.className=ga?'ok':'no';T5T.checked=true;
    var parts=d.s.map(function(p){return p[1];}).join(' + ');
    if(ge&&ga){dk.score++;fb('<b>Correct!</b> '+d.s.length+' element'+(d.s.length>1?'s':'')+' ('+d.s.map(function(p){return p[0];}).join(', ')+') and '+parts+' = '+fTotal(d)+' atoms.','ok');}
    else fb((ge?'Elements ✓. ':'<b>Elements:</b> count the different symbols → '+d.s.map(function(p){return p[0];}).join(', ')+' = '+d.s.length+'. ')+(ga?'Atoms ✓.':'<b>Atoms:</b> add the subscripts → '+parts+' = '+fTotal(d)+'.'),'bad');
    nb.textContent=dk.i===dk.n-1?'See my score':'Next formula';});
  var nb=mkBtn(dk.i===dk.n-1?'See my score':'Next formula',false,function(){if(dk.done)return;if(!T5T.checked){fb('Check your answer first.','hint');return;}dk.i++;T5T.checked=false;$('fe').value='';$('fa').value='';$('fe').className='';$('fa').className='';fb();if(dk.i>=dk.n)dk.done=true;else nb.textContent=dk.i===dk.n-1?'See my score':'Next formula';});
  mkBtn('Start again',false,function(){T5T.d=newDeck(FTURN.length);T5T.checked=false;t5tInit();});
  setQ('How many different <b>elements</b> are in this formula? How many <b>atoms</b> in total? Predict, then check.');
  setRule(['<b>Elements</b>: count the different symbols (capital letters). H₂SO₄ → H, S, O = 3 elements.','<b>Atoms</b>: add all the subscripts; no subscript = 1. H₂SO₄ → 2 + 1 + 4 = 7 atoms.','A substance can have few elements but many atoms: C₆H₁₂O₆ has 3 elements but 24 atoms.']);}

var TABS=[
 {t:'1. Electron arrangement',c:TEAL,s:[['Build the atom','Electrons fill the energy levels',t1Init,t1Draw,t1Click],['My turn','Write the electron arrangement',function(){t1mInit();},t1mDraw,null]]},
 {t:'2. Electron-dot diagrams',c:BLUE,s:[['From model to dots','Only the valence electrons become dots',t2Init,t2Draw,null],['Draw it yourself','Place the dots around the symbol',t2dInit,t2dDraw,t2dClick],['Families','Same group, same dots',t2fInit,t2fDraw,t2fClick]]},
 {t:'3. Types of bonds',c:PLUM,s:[['Ionic','Electrons are transferred',t3iInit,t3iDraw,null],['Covalent','Electrons are shared',t3cInit,t3cDraw,null],['Polar or nonpolar?','Is the sharing fair?',t3pInit,t3pDraw,null],['Metallic','A sea of electrons',t3mInit,t3mDraw,null],['Predict the bond','Metal or nonmetal?',t3xInit,t3xDraw,null]]},
 {t:'4. Properties',c:AMBER,s:[['Melting point','Heat the three solids',t4meltInit,t4meltDraw,null],['Electricity','Which ones conduct?',t4elInit,t4elDraw,null],['Hammer test','Brittle or malleable?',t4hInit,t4hDraw,null],['Summary','Compare the three bonds',t4sInit,t4sDraw,null],['Test me','Ionic, covalent or metallic?',t4tInit,t4tDraw,null]]},
 {t:'5. Ions & formulas',c:CORAL,s:[['Make an ion','Lose or gain electrons',t5Init,t5Draw,null],['Atom, ion, molecule or compound?','Sort the particles',t5sInit,t5sDraw,null],['Read a formula','Count the atoms',t5fInit,t5fDraw,null],['My turn','Elements or atoms?',t5tInit,t5tDraw,null]]}];
var cur={tab:0,step:0};
function renderNav(){var tb=$('tabs');tb.innerHTML='';TABS.forEach(function(T,i){var b=document.createElement('button');b.type='button';b.className='tab'+(i===cur.tab?' on':'');b.style.setProperty('--c',T.c);b.innerHTML='<i></i>'+T.t;b.addEventListener('click',function(){go(i,0);});tb.appendChild(b);});
  var st=$('steps');st.innerHTML='';TABS[cur.tab].s.forEach(function(s,j){var b=document.createElement('button');b.type='button';b.className='step'+(j===cur.step?' on':'');b.innerHTML='<b>'+(j+1)+'</b>'+s[0];b.addEventListener('click',function(){go(cur.tab,j);});st.appendChild(b);});}
function go(tab,step){cur.tab=tab;cur.step=step;var T=TABS[tab],S=T.s[step];document.documentElement.style.setProperty('--accent',T.c);
  renderNav();$('stitle').textContent=S[1];lastReads='';hideRule();S[2]();cv.className=S[4]?'click':'';}
cv.addEventListener('click',function(ev){var S=TABS[cur.tab].s[cur.step];if(!S[4])return;var r=cv.getBoundingClientRect();S[4]((ev.clientX-r.left)*W/r.width,(ev.clientY-r.top)*H/r.height);});
function loop(){var t=now();clear();try{TABS[cur.tab].s[cur.step][3](t);}catch(err){console.error(err);}requestAnimationFrame(loop);}
go(0,0);requestAnimationFrame(loop);
})();
