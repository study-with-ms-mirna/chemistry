<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radioactive Decay Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf0f8;--grid:#dbe4f1;--ink:#18233a;--muted:#5a6780;--line:#c9d4e6;--shadow:#c3cfe3;
--teal:#0f8b8d;--blue:#2b59c3;--plum:#8a4fbf;--amber:#e8962a;--coral:#e2708a;--red:#d8434a;--accent:#0f8b8d}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.4}
.wrap{max-width:1260px;margin:0 auto;padding:18px 20px 34px}
header{display:flex;align-items:center;gap:14px;margin-bottom:16px}
header svg{flex:none}
h1{font-family:Fredoka,sans-serif;font-weight:600;font-size:32px;margin:0;line-height:1.1}
.sub{color:var(--muted);font-size:16px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
.tab{font-family:Fredoka,sans-serif;font-weight:500;font-size:18px;padding:10px 18px;border-radius:16px;border:2px solid var(--line);background:#fff;box-shadow:0 4px 0 var(--shadow);cursor:pointer;display:flex;align-items:center;gap:8px}
.tab i{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-block}
.tab.on{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 4px 0 rgba(24,35,58,.22)}
.tab.on i{background:#fff}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.step{font-family:Fredoka,sans-serif;font-size:16px;padding:6px 14px 6px 7px;border-radius:999px;border:2px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;gap:8px}
.step b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--line);font-weight:600;font-size:14px}
.step.on{border-color:var(--accent);color:var(--accent)}
.step.on b{background:var(--accent);color:#fff}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:960px){.main{grid-template-columns:1fr}}
.card{background:#fff;border:2px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--shadow);padding:16px}
.stage h2{font-family:Fredoka,sans-serif;font-weight:600;font-size:22px;margin:0 0 10px;color:var(--accent)}
canvas{width:100%;height:auto;display:block;border-radius:14px;background:#f6f8fc}
.controls{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin-top:14px}
.ctl{display:flex;align-items:center;gap:10px;font-family:Fredoka,sans-serif;font-size:16px}
.ctl output{min-width:84px;font-weight:600;color:var(--accent)}
.btn{font-family:Fredoka,sans-serif;font-weight:500;font-size:16px;padding:9px 16px;border-radius:14px;border:2px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer;box-shadow:0 3px 0 var(--shadow)}
.btn.fill{background:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn.sel{background:var(--accent);color:#fff}
input[type=range]{-webkit-appearance:none;appearance:none;width:260px;max-width:60vw;height:10px;border-radius:999px;background:#dfe6f2;outline:none;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;background:var(--accent);border:4px solid #fff;box-shadow:0 0 0 2px var(--accent),0 2px 3px rgba(0,0,0,.25);cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:4px solid #fff;box-shadow:0 0 0 2px var(--accent);cursor:pointer}
input[type=range]:disabled{opacity:.4}
.side{display:flex;flex-direction:column;gap:14px}
.lbl{font-family:Fredoka,sans-serif;font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.q{font-size:19px;font-weight:700}
.rule{border:3px dashed var(--red);border-radius:18px;padding:12px 14px;background:#fff}
.rule .lbl{color:var(--red)}
.rule ul{margin:0;padding-left:20px}
.rule li{margin:4px 0}
.reads{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rd{background:#f3f6fb;border-radius:14px;padding:8px 10px}
.rd span{display:block;font-size:13px;color:var(--muted)}
.rd b{font-family:Fredoka,sans-serif;font-weight:600;font-size:22px}
.rd.wide{grid-column:1/-1}
.bar{height:14px;border-radius:999px;background:#e6ebf3;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:999px;transition:width .15s}
/* equation view */
.eqview{display:none;min-height:420px;padding:10px 6px;background:#f6f8fc;border-radius:14px}
.eqrow{display:flex;align-items:center;justify-content:center;gap:18px;height:230px;font-family:Fredoka,sans-serif;font-weight:600}
.big{display:inline-flex;flex-direction:column;align-items:center;transition:font-size .2s;line-height:1}
.big small{font-size:15px;font-weight:500;color:var(--muted);margin-top:4px}
.op{font-size:64px;color:#8d99b0}
.k{font-size:80px;color:#8d99b0}
.frac{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.fr{display:flex;align-items:center;gap:6px;padding-left:46px}
.frac hr{width:100%;min-width:120px;border:0;border-top:6px solid var(--ink);margin:2px 0;border-radius:3px}
.arrowtag{font-size:40px;margin-left:4px}
.up{color:var(--coral)}.down{color:var(--blue)}
.nums{text-align:center;font-family:Fredoka,sans-serif;font-size:24px;margin:4px 0 10px}
.pair{text-align:center;font-size:19px;margin:8px auto;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px;max-width:640px}
.chip{display:block;width:max-content;max-width:100%;margin:10px auto 0;font-family:Fredoka,sans-serif;font-size:19px;padding:8px 16px;border-radius:999px;background:var(--accent);color:#fff}
.bars2{display:grid;grid-template-columns:110px 1fr 90px;gap:8px 12px;align-items:center;max-width:560px;margin:8px auto 0;font-family:Fredoka,sans-serif}
.bars2 .bar{height:20px;margin:0}
/* combined strip */
.cstrip{margin-top:12px;background:#f6f8fc;border-radius:14px;padding:12px}
.ceq{display:flex;align-items:center;justify-content:center;gap:22px;font-family:Fredoka,sans-serif;font-weight:600;font-size:40px;flex-wrap:wrap}
.cf{display:inline-flex;flex-direction:column;align-items:center}
.cf hr{width:100%;min-width:110px;border:0;border-top:4px solid var(--ink);margin:2px 0}
.v{position:relative;display:inline-block;padding:0 2px}
.v.x{color:#b3bccb}
.v.x::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;border-top:5px solid var(--red);transform:rotate(-20deg)}
.lawname{text-align:center;font-family:Fredoka,sans-serif;font-size:21px;margin-top:8px;color:var(--accent);min-height:28px}
.holds{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
sub{font-size:.6em}

.reads .rd b{font-size:19px}
/* ===== nuclear equation practice ===== */
.neq{display:none}
.modebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.seg button{border:none;background:#fff;padding:8px 16px;font-size:16px;cursor:pointer;color:var(--ink);font-family:Fredoka,sans-serif;font-weight:500}
.seg button.on{background:var(--accent);color:#fff}
.small{font-size:14px;color:var(--muted)}
.task{font-size:18px;background:#f3f6fb;border-radius:14px;padding:10px 14px;margin-bottom:10px}
.eqbig{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;background:#f6f8fc;border-radius:16px;padding:22px 10px 14px;font-family:Fredoka,sans-serif;font-weight:600;font-size:46px;min-height:150px}
.term{display:inline-flex;flex-direction:column;align-items:center;gap:6px}
.term .cap{font-family:'Atkinson Hyperlegible',sans-serif;font-weight:400;font-size:14px;color:var(--muted);white-space:nowrap}
.nz{display:inline-flex;align-items:center;line-height:1;font-family:Fredoka,sans-serif;font-weight:600}
.nz .nn{display:inline-flex;flex-direction:column;align-items:flex-end;font-size:.48em;line-height:1.08;margin-right:4px;gap:2px}
.nz .A{color:#0f8b8d}.nz .Z{color:#d8434a}
.nz .sy{font-size:1em}
.nz .box{display:inline-block;min-width:1.6em;text-align:center;border:2px dashed #9aa6ba;border-radius:8px;color:#9aa6ba;padding:0 3px}
.nz .box.big{min-width:1.3em;border-width:3px}
.nz .new{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(1.5);background:#fff4d6}100%{transform:scale(1)}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.arr{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:70px}
.arr .tg{font-size:15px;padding:2px 10px;border-radius:999px;color:#fff;visibility:hidden}
.arr .tg.on{visibility:visible;animation:pop .5s ease}
.arr .tg.a{background:#0f8b8d}.arr .tg.z{background:#d8434a}
.plus{color:#8d99b0}
.eqbig input{font-family:Fredoka,sans-serif;font-weight:600;border:2px solid var(--line);border-radius:8px;text-align:center;color:var(--ink);background:#fff;padding:2px 4px;-webkit-appearance:none;appearance:none}
.eqbig input.ia{width:2.9em;font-size:22px;color:#0f8b8d}
.eqbig input.iz{width:2.9em;font-size:22px;color:#d8434a}
.eqbig input.is{width:2.2em;font-size:40px}
.eqbig input.ok{border-color:#2e9e5b;background:#e8f6ee}
.eqbig input.no{border-color:#d8434a;background:#fdeeee}
.steps3{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.st{border:2px solid var(--line);border-radius:16px;padding:10px 14px;display:none;background:#fff}
.st.on{display:block;animation:fadein .45s ease}
.st.cur{border-color:var(--accent)}
.st .sh{display:flex;align-items:center;gap:8px;font-family:Fredoka,sans-serif;font-weight:600;font-size:18px}
.st .sh .n{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px;flex:none}
.st .ln{font-size:17px;margin-top:6px;line-height:1.7}
.st .ln .nz{font-size:28px;vertical-align:middle;margin-right:4px}
#rule .nz{font-size:22px;vertical-align:middle}
.st .mth{font-family:Fredoka,sans-serif;font-size:24px;font-weight:600}
.st .mth .a{color:#0f8b8d}.st .mth .z{color:#d8434a}
.st .why{font-size:16px;color:var(--muted)}
.pc{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:-2px;margin:0 1px;box-shadow:inset -2px -2px 0 rgba(0,0,0,.12)}
.pc.p{background:#e2708a}.pc.n{background:#9aa6ba}.pc.e{background:#2b8fd8;width:11px;height:11px}
.stepbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.stepdots{display:flex;gap:6px}
.stepdots i{width:11px;height:11px;border-radius:50%;background:var(--line);display:block}
.stepdots i.on{background:var(--accent)}
.strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.el{width:74px;border:2px solid var(--line);border-radius:12px;background:#fff;text-align:center;padding:4px 2px;font-family:Fredoka,sans-serif}
.el small{display:block;font-size:12px;color:var(--muted);font-family:'Atkinson Hyperlegible',sans-serif}
.el b{display:block;font-size:24px;font-weight:600;line-height:1.1}
.el .zn{font-size:13px;color:#d8434a;font-weight:600}
.el.hi{border-color:#e8962a;background:#fff4e5;box-shadow:0 0 0 3px rgba(232,150,42,.35)}
.hintbox{display:none;margin-top:10px;background:#fff4e5;border:2px solid #e8962a;border-radius:14px;padding:10px 14px;font-size:16px}
.hintbox.on{display:block}
.feedback{margin-top:10px;font-size:17px}
.feedback .bad{color:#d8434a}.feedback .good{color:#2e9e5b;font-family:Fredoka,sans-serif;font-weight:600}
.feedback ul{margin:4px 0 0;padding-left:20px}
.step.done b{background:#2e9e5b;color:#fff}
.chk{font-family:Fredoka,sans-serif;font-size:20px}
.chk .a{color:#0f8b8d}.chk .z{color:#d8434a}
</style>
</head>

  function cell(k,val,cls){return show(k)?'<b class="'+cls+nw(k)+'">'+val+'</b>':(tryM?null:BOX);}
  if(tryM&&!done){var inA='<input class="ia" id="ia" inputmode="numeric" autocomplete="off" placeholder="?">',inZ='<input class="iz" id="iz" inputmode="numeric" autocomplete="off" placeholder="?">',inS='<input class="is" id="is" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="?">';
   unknown='<span class="nz"><span class="nn">'+inA+inZ+'</span><span class="sy">'+inS+'</span></span>';cap2=p.k==='particle'?'missing particle':'new element';}
  else{var tA=p.k==='particle'?4:p.dA,tZ=p.k==='particle'?2:p.dZ,tS=p.k==='particle'?'He':ELS[p.dZ][0];
   unknown='<span class="nz"><span class="nn">'+cell(2,tA,'A')+cell(3,tZ,'Z')+'</span><span class="sy">'+(show(4)?'<span class="'+nw(4).trim()+'">'+tS+'</span>':BIGBOX)+'</span></span>';
   cap2=show(4)?(p.k==='particle'?'alpha particle':isoName(p.dZ,p.dA)):'?';}
  unknown='<span class="term">'+unknown+'<span class="cap">'+cap2+'</span></span>';
  var tgA={alpha:'−4',beta:'same'}[p.k],tgZ={alpha:'−2',beta:'+1'}[p.k];
  var arrow='<span class="arr">'+(tgA?'<span class="tg a'+(show(2)?' on':'')+'">'+tgA+'</span>':'')+'<span>→</span>'+(tgZ?'<span class="tg z'+(show(3)?' on':'')+'">'+tgZ+'</span>':'')+'</span>';
  if(p.k==='particle'){var dau='<span class="term">'+nzH(p.dA,p.dZ,ELS[p.dZ][0])+'<span class="cap">'+isoName(p.dZ,p.dA)+'</span></span>';
   var gam='<span class="term"><span>2γ</span><span class="cap">2 gamma rays</span></span>';
   return '<div class="eqbig">'+parent+arrow+dau+'<span class="plus">+</span>'+unknown+'<span class="plus">+</span>'+gam+'</div>';}
  var part='<span class="term">'+(p.k==='alpha'?ALPHA:BETA)+'<span class="cap">'+(p.k==='alpha'?'alpha particle':'beta particle')+'</span></span>';
  return '<div class="eqbig">'+parent+arrow+unknown+'<span class="plus">+</span>'+part+'</div>';},
 cards:function(p){var A=p.A,Z=p.Z,nm=isoName(Z,A),c=[];
  var know='<div class="ln">'+nzH(A,Z,ELS[Z][0])+'&nbsp;'+cap(nm)+': mass number <b style="color:#0f8b8d">'+A+'</b> on top (protons + neutrons), atomic number <b style="color:#d8434a">'+Z+'</b> at the bottom (protons)</div>';
  if(p.k==='alpha'){
   c.push(['Write what you know',know+'<div class="ln">'+ALPHA+'&nbsp; an alpha particle = '+pc('p',2)+pc('n',2)+' 2 protons + 2 neutrons (a helium nucleus)</div><div class="ln why">So: '+nm+' → ? + alpha particle</div>']);
   c.push(['Mass number (top): take away 4','<div class="ln mth"><span class="a">'+A+' − 4 = '+p.dA+'</span></div><div class="ln why">The alpha particle carries away 4 particles: '+pc('p',2)+pc('n',2)+' 2 protons + 2 neutrons.</div>']);
   c.push(['Atomic number (bottom): take away 2','<div class="ln mth"><span class="z">'+Z+' − 2 = '+p.dZ+'</span></div><div class="ln why">The atomic number only counts protons, and '+pc('p',2)+' 2 protons left.</div>']);}
  else if(p.k==='beta'){
   c.push(['Write what you know',know+'<div class="ln">'+BETA+'&nbsp; a beta particle = an electron '+pc('e',1)+': mass number 0, charge −1</div><div class="ln why">Inside the nucleus: '+pc('n',1)+' neutron → '+pc('p',1)+' proton + '+pc('e',1)+' electron. The electron shoots out as the beta particle.</div>']);
   c.push(['Mass number (top): stays the same','<div class="ln mth"><span class="a">'+A+' − 0 = '+p.dA+'</span></div><div class="ln why">One '+pc('n',1)+' neutron became a '+pc('p',1)+' proton, so the nucleus still has the same number of particles.</div>']);
   c.push(['Atomic number (bottom): add 1','<div class="ln mth"><span class="z">'+Z+' + 1 = '+p.dZ+'</span></div><div class="ln why">The nucleus gained 1 new '+pc('p',1)+' proton.</div>']);}
  else{
   c.push(['Write what you know','<div class="ln">'+cap(nm)+' → thorium-234 + ? + 2 gamma rays</div><div class="ln why">Gamma rays (γ) are only energy: no mass and no charge, so they do not change any numbers.</div>']);
   c.push(['Mass number of the missing particle','<div class="ln mth"><span class="a">238 − 234 = 4</span></div><div class="ln why">The top numbers must balance: 238 = 234 + ?</div>']);
   c.push(['Atomic number of the missing particle','<div class="ln mth"><span class="z">92 − 90 = 2</span></div><div class="ln why">The bottom numbers must balance: 92 = 90 + ?</div>']);}
  if(p.k==='particle')c.push(['Name the particle','<div class="ln">Mass number 4 and atomic number 2 = '+ALPHA+'&nbsp; a helium nucleus = an <b>alpha particle</b></div>'+stripH(p,2)]);
  else c.push(['Find the new element','<div class="ln">Atomic number <b style="color:#d8434a">'+p.dZ+'</b> on the periodic table is <b>'+ELS[p.dZ][1]+' ('+ELS[p.dZ][0]+')</b>. The number of protons decides the element.</div>'+stripH(p,p.dZ)]);
  var pA=p.k==='particle'?4:(p.k==='alpha'?4:0),pZ=p.k==='particle'?2:(p.k==='alpha'?2:'(−1)'),dA=p.k==='particle'?p.dA:p.dA,dZ=p.k==='particle'?p.dZ:p.dZ;
  var extra=p.k==='particle'?' + 0':'';
  c.push(['Check: both sides balance','<div class="ln chk">Top: <span class="a">'+A+' = '+dA+' + '+pA+extra+'</span> ✓</div><div class="ln chk">Bottom: <span class="z">'+Z+' = '+dZ+' + '+pZ+extra+'</span> ✓</div><div class="ln">'+(p.k==='particle'?'The missing particle is an <b>alpha particle</b>, so this is <b>alpha decay</b>.':'<b>'+cap(isoName(p.dZ,p.dA))+'</b> is formed.')+'</div>']);
  return c;},
 hint:function(p){return {alpha:'<b>Alpha decay</b>: the mass number (top) goes down by <b>4</b> and the atomic number (bottom) goes down by <b>2</b>. Then find the new atomic number in the strip to get the symbol.',
  beta:'<b>Beta decay</b>: the mass number (top) <b>stays the same</b> and the atomic number (bottom) goes <b>up by 1</b> (a neutron became a proton). Then find the new atomic number in the strip.',
  particle:'Make both sides balance. Top: 238 = 234 + ?   Bottom: 92 = 90 + ?   Which particle has those two numbers?'}[p.k];},
 render:function(){var me=this,p=NP[this.pi],tryM=this.mode==='try';this.chips();
  $('q').innerHTML={alpha:'In alpha decay, why does the mass number go down by 4 but the atomic number only by 2?',beta:'In beta decay, why does the atomic number go up by 1 while the mass number stays the same?',particle:'Gamma rays are in the equation. Why don’t they change the mass number or the atomic number?'}[p.k];
  var h='<div class="modebar"><div class="seg"><button id="mShow"'+(tryM?'':' class="on"')+'>Show me</button><button id="mTry"'+(tryM?' class="on"':'')+'>My turn</button></div><span class="small">'+(tryM?'Fill in the three boxes, then check.':'Step by step. Press Next step.')+'</span><span class="small" style="margin-left:auto">'+p.src+'</span></div>';
  h+='<div class="task">'+this.task(p)+'</div>'+this.eq(p);
  if(!tryM){var cs=this.cards(p);h+='<div class="steps3">'+cs.map(function(c,i){return '<div class="st'+(me.st>=i+1?' on':'')+(me.st===i+1?' cur':'')+'"><div class="sh"><span class="n">'+(i+1)+'</span>'+c[0]+'</div>'+c[1]+'</div>';}).join('')+'</div>';
   h+='<div class="stepbar"><button class="btn" id="nBack"'+(this.st===0?' disabled':'')+'>◀ Back</button><button class="btn fill" id="nNext"'+(this.st>=cs.length?' style="display:none"':'')+'>'+(this.st===0?'Start ▶':'Next step ▶')+'</button>'+
    (this.st>=cs.length?'<button class="btn fill" id="nTry">Now try it yourself ▶</button>':'')+'<div class="stepdots">'+cs.map(function(c,i){return '<i class="'+(i<me.st?'on':'')+'"></i>';}).join('')+'</div></div>';}
  else{h+='<div class="small" style="margin-top:10px">Part of the periodic table:</div>'+stripH(p,p.solved?(p.k==='particle'?2:p.dZ):-1);
   h+='<div class="stepbar">'+(p.solved?'':'<button class="btn fill" id="nCheck">Check my answer</button><button class="btn" id="nHint">Hint</button><button class="btn" id="nClear">Clear</button>')+
    '<button class="btn fill" id="nNextP"'+(p.solved?'':' style="display:none"')+'>Next problem ▶</button></div><div class="hintbox" id="nHintBox">'+this.hint(p)+'</div><div class="feedback" id="nFb"></div>';
   if(p.solved){var cs2=this.cards(p),last=cs2[cs2.length-1];h+='<div class="steps3"><div class="st on"><div class="sh"><span class="n">✓</span>'+last[0]+'</div>'+last[1]+'</div></div>';}}
  $('neq').innerHTML=h;
  $('mShow').onclick=function(){me.mode='show';me.st=0;me.render();};$('mTry').onclick=function(){me.mode='try';me.render();};
  if(!tryM){$('nBack').onclick=function(){me.st=Math.max(0,me.st-1);me.render();};$('nNext').onclick=function(){me.st++;me.render();};var t=$('nTry');if(t)t.onclick=function(){me.mode='try';me.render();};}
  else{var nx=$('nNextP');if(nx)nx.onclick=function(){me.pi=(me.pi+1)%NP.length;me.st=0;me.render();};
   if(!p.solved){$('nCheck').onclick=function(){me.check();};$('nHint').onclick=function(){$('nHintBox').classList.toggle('on');};$('nClear').onclick=function(){me.render();};
    ['ia','iz','is'].forEach(function(id){$(id).addEventListener('keydown',function(e){if(e.key==='Enter')me.check();});});}}},
 check:function(){var p=NP[this.pi],num=function(id){var v=$(id).value.trim().replace('−','-');return v===''?null:(/^-?\d+$/.test(v)?parseInt(v,10):NaN);};
  var a=num('ia'),z=num('iz'),sRaw=$('is').value.trim(),s=sRaw?sRaw.charAt(0).toUpperCase()+sRaw.slice(1).toLowerCase():'';
  var tA,tZ,tS,okS,msgs=[];
  if(p.k==='particle'){tA=4;tZ=2;tS='He';okS=s==='He'||sRaw==='α'||/^alpha$/i.test(sRaw);}else{tA=p.dA;tZ=p.dZ;tS=ELS[tZ][0];okS=s===tS;}
  var okA=a===tA,okZ=z===tZ;
  [['ia',okA,a!==null],['iz',okZ,z!==null],['is',okS,sRaw!=='']].forEach(function(r){var e=$(r[0]);e.classList.toggle('ok',r[1]);e.classList.toggle('no',!r[1]&&r[2]);});
  if(a===null||z===null||!sRaw)msgs.push('Fill in all three boxes: mass number (top), atomic number (bottom) and the symbol.');
  if(a!==null&&!okA){if(p.k==='alpha')msgs.push(a===p.A-2?'You took <b>2</b> away from the mass number. An alpha particle takes away <b>4</b> (2 protons + 2 neutrons): '+p.A+' − 4.':'Mass number: an alpha particle takes away 4, so '+p.A+' − 4 = ?');
   else if(p.k==='beta')msgs.push('In beta decay the <b>mass number stays the same</b> ('+p.A+'): a neutron just turns into a proton, so the number of particles does not change.');
   else msgs.push('Top numbers: 238 = 234 + ?');}
  if(z!==null&&!okZ){if(p.k==='alpha')msgs.push(z===p.Z-4?'You took <b>4</b> away from the atomic number. Only the <b>2 protons</b> count: '+p.Z+' − 2.':'Atomic number: 2 protons leave, so '+p.Z+' − 2 = ?');
   else if(p.k==='beta')msgs.push(z===p.Z-1?'Careful: a neutron turns <b>into</b> a proton, so the atomic number goes <b>up</b> by 1: '+p.Z+' + 1.':z===p.Z?'The atomic number changes: the nucleus gains <b>1 proton</b>, so '+p.Z+' + 1 = ?':'Atomic number: one new proton, so '+p.Z+' + 1 = ?');
   else msgs.push('Bottom numbers: 92 = 90 + ?');}
  if(sRaw&&!okS){if(p.k==='particle')msgs.push('Which particle has mass number 4 and atomic number 2? It is the nucleus of helium.');
   else if(z!==null&&!okZ&&ELS[z]&&s===ELS[z][0])msgs.push('Your symbol matches your atomic number, so fix the atomic number first.');
   else if(!okZ)msgs.push('Fix the atomic number first, then find it in the strip below to get the symbol.');
   else msgs.push('Find atomic number <b>'+tZ+'</b> in the strip below to get the symbol.');}
  if(okA&&okZ&&okS){p.solved=true;this.render();$('nFb').innerHTML='<span class="good">Correct! '+(p.k==='particle'?'The missing particle is an alpha particle.':cap(isoName(p.dZ,p.dA))+' is formed.')+'</span>';return;}
  $('nFb').innerHTML='<span class="bad">Not yet.</span><ul>'+msgs.map(function(m){return '<li>'+m+'</li>';}).join('')+'</ul>';}
};

var LAWS=[{name:'1. Stable or unstable?',c:'#0f8b8d',k:'compare'},{name:'2. Radioactive decay',c:'#e2708a',k:'decay'},{name:'3. How rare are they?',c:'#8a4fbf',k:'rare'},{name:'4. Nuclear equations',c:'#e8962a',k:'neq'}];
var tabI=0,lastRead=0;
function renderTabs(){$('tabs').innerHTML=LAWS.map(function(l,i){return '<button class="tab'+(i===tabI?' on':'')+'" style="--c:'+l.c+'" data-i="'+i+'"><i></i>'+l.name+'</button>';}).join('');
 Array.prototype.forEach.call($('tabs').children,function(b){b.onclick=function(){go(+b.getAttribute('data-i'));};});}
function go(i){tabI=i;var L=LAWS[i];document.documentElement.style.setProperty('--accent',L.c);cur=S[L.k];renderTabs();$('steps').innerHTML='';
 var isN=L.k==='neq';$('cv').style.display=isN?'none':'';$('neq').style.display=isN?'block':'none';$('controls').style.display=isN?'none':'';
 $('stitle').textContent=cur.title;$('controls').innerHTML=cur.controls();cur.init();cur.bind();
 if(cur.q)$('q').textContent=cur.q;$('rule').innerHTML=cur.rule.map(function(r){return '<li>'+r+'</li>';}).join('');
 $('reads').innerHTML=cur.reads.map(function(r){return '<div class="rd'+(r[2]?' wide':'')+'"><span>'+r[1]+'</span><b id="r_'+r[0]+'">–</b></div>';}).join('');lastRead=0;}
var last=performance.now();
function loop(now){var dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
 if(cur){cur.update(dt);ctx.clearRect(0,0,W,H);cur.draw(T);
  if(now-lastRead>150){lastRead=now;var v=cur.read();for(var k in v){var e=$('r_'+k);if(e)e.textContent=v[k];}}}
 requestAnimationFrame(loop);}
var hm={'#stable':0,'#decay':1,'#rare':2,'#equations':3};go(hm[location.hash]||0);requestAnimationFrame(loop);
})();
