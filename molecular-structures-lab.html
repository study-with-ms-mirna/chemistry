<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Molecular Structures Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>

:root{--bg:#eaf0f8;--grid:#dbe4f1;--ink:#18233a;--muted:#5a6780;--line:#c9d4e6;--shadow:#c3cfe3;
--teal:#0f8b8d;--blue:#2b59c3;--plum:#8a4fbf;--amber:#e8962a;--coral:#e2708a;--red:#d8434a;--accent:#0f8b8d}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.4}
.wrap{max-width:1260px;margin:0 auto;padding:18px 20px 34px}
header{display:flex;align-items:center;gap:14px;margin-bottom:16px}
header svg{flex:none}
h1{font-family:Fredoka,sans-serif;font-weight:600;font-size:32px;margin:0;line-height:1.1}
.sub{color:var(--muted);font-size:16px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
.tab{font-family:Fredoka,sans-serif;font-weight:500;font-size:18px;padding:10px 18px;border-radius:16px;border:2px solid var(--line);background:#fff;box-shadow:0 4px 0 var(--shadow);cursor:pointer;display:flex;align-items:center;gap:8px}
.tab i{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-block}
.tab.on{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 4px 0 rgba(24,35,58,.22)}
.tab.on i{background:#fff}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.step{font-family:Fredoka,sans-serif;font-size:16px;padding:6px 14px 6px 7px;border-radius:999px;border:2px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;gap:8px}
.step b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--line);font-weight:600;font-size:14px}
.step.on{border-color:var(--accent);color:var(--accent)}
.step.on b{background:var(--accent);color:#fff}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:960px){.main{grid-template-columns:1fr}}
.card{background:#fff;border:2px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--shadow);padding:16px}
.stage h2{font-family:Fredoka,sans-serif;font-weight:600;font-size:22px;margin:0 0 10px;color:var(--accent)}
canvas{width:100%;height:auto;display:block;border-radius:14px;background:#f6f8fc}
.controls{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin-top:14px}
.ctl{display:flex;align-items:center;gap:10px;font-family:Fredoka,sans-serif;font-size:16px}
.ctl output{min-width:84px;font-weight:600;color:var(--accent)}
.btn{font-family:Fredoka,sans-serif;font-weight:500;font-size:16px;padding:9px 16px;border-radius:14px;border:2px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer;box-shadow:0 3px 0 var(--shadow)}
.btn.fill{background:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn.sel{background:var(--accent);color:#fff}
input[type=range]{-webkit-appearance:none;appearance:none;width:260px;max-width:60vw;height:10px;border-radius:999px;background:#dfe6f2;outline:none;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;background:var(--accent);border:4px solid #fff;box-shadow:0 0 0 2px var(--accent),0 2px 3px rgba(0,0,0,.25);cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:4px solid #fff;box-shadow:0 0 0 2px var(--accent);cursor:pointer}
input[type=range]:disabled{opacity:.4}
.side{display:flex;flex-direction:column;gap:14px}
.lbl{font-family:Fredoka,sans-serif;font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.q{font-size:19px;font-weight:700}
.rule{border:3px dashed var(--red);border-radius:18px;padding:12px 14px;background:#fff}
.rule .lbl{color:var(--red)}
.rule ul{margin:0;padding-left:20px}
.rule li{margin:4px 0}
.reads{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rd{background:#f3f6fb;border-radius:14px;padding:8px 10px}
.rd span{display:block;font-size:13px;color:var(--muted)}
.rd b{font-family:Fredoka,sans-serif;font-weight:600;font-size:22px}
.rd.wide{grid-column:1/-1}
.bar{height:14px;border-radius:999px;background:#e6ebf3;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:999px;transition:width .15s}
.reads .rd b{font-size:19px}
.step.done b{background:#2e9e5b;color:#fff}
.fb{margin-top:12px;border-radius:14px;padding:10px 14px;font-size:17px;background:#f3f6fb;border:2px solid var(--line);display:none}
.fb.show{display:block}
.fb.ok{background:#e8f6ee;border-color:#2e9e5b}
.fb.bad{background:#fdeeee;border-color:#d8434a}
.fb.hint{background:#fff6e8;border-color:#e8962a}
.cnt{display:none;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-top:12px;padding:10px 14px;border-radius:14px;background:#f6f8fc}
.cnt.show{display:flex}
.stp{display:inline-flex;align-items:center;gap:8px;font-family:Fredoka,sans-serif;font-size:17px}
.stp button{width:34px;height:34px;border-radius:50%;border:2px solid var(--accent);background:#fff;color:var(--accent);font-family:Fredoka,sans-serif;font-size:20px;line-height:1;cursor:pointer;padding:0}
.stp b{min-width:26px;text-align:center;font-size:22px}
#cv.click{cursor:pointer}
sub{font-size:.65em}
.tab{font-size:15.5px;padding:8px 12px}
/* extra2 */
/* ===== show me / my turn panels ===== */
.modebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0 10px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.seg button{border:none;background:#fff;padding:8px 16px;font-size:16px;cursor:pointer;color:var(--ink);font-family:Fredoka,sans-serif;font-weight:500}
.seg button.on{background:var(--accent);color:#fff}
.small{font-size:14px;color:var(--muted)}
.task{font-size:18px;background:#f3f6fb;border-radius:14px;padding:10px 14px;margin-bottom:10px}
.molbox{display:flex;justify-content:center;align-items:center;background:#f6f8fc;border-radius:16px;padding:14px;min-height:150px}
.molbox svg{max-width:100%;height:auto}
.steps3{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.st{border:2px solid var(--line);border-radius:16px;padding:10px 14px;display:none;background:#fff}
.st.on{display:block;animation:fadein .45s ease}
.st.cur{border-color:var(--accent)}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.st .sh{display:flex;align-items:center;gap:8px;font-family:Fredoka,sans-serif;font-weight:600;font-size:18px}
.st .sh .n{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px;flex:none}
.st .ln{font-size:17px;margin-top:6px;line-height:1.6}
.st .mth{font-family:Fredoka,sans-serif;font-size:23px;font-weight:600}
.st .why{font-size:16px;color:var(--muted)}
.sg{color:#0f8b8d;font-weight:700}.pp{color:#e2708a;font-weight:700}
.stepbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.stepdots{display:flex;gap:6px}
.stepdots i{width:11px;height:11px;border-radius:50%;background:var(--line);display:block}
.stepdots i.on{background:var(--accent)}
.hintbox{display:none;margin-top:10px;background:#fff4e5;border:2px solid #e8962a;border-radius:14px;padding:10px 14px;font-size:16px}
.hintbox.on{display:block}
.feedback{margin-top:10px;font-size:17px}
.feedback .bad{color:#d8434a;font-family:Fredoka,sans-serif;font-weight:600}.feedback .good{color:#2e9e5b;font-family:Fredoka,sans-serif;font-weight:600}
.feedback ul{margin:4px 0 0;padding-left:20px}
.ansrow{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:12px;font-family:Fredoka,sans-serif;font-size:20px}
.ansrow input{width:70px;font-family:Fredoka,sans-serif;font-size:22px;font-weight:600;text-align:center;border:2px solid var(--line);border-radius:10px;padding:4px;-webkit-appearance:none;appearance:none;background:#fff;color:var(--ink)}
.ansrow input.ok{border-color:#2e9e5b;background:#e8f6ee}.ansrow input.no{border-color:#d8434a;background:#fdeeee}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:700px){.sumgrid{grid-template-columns:1fr}}
.sumc{border:2px solid var(--line);border-radius:18px;padding:12px;text-align:center;background:#fff}
.sumc h3{font-family:Fredoka,sans-serif;font-weight:600;font-size:20px;margin:0 0 4px}
.sumc .res{font-family:Fredoka,sans-serif;font-weight:600;font-size:26px;margin-top:4px}
.sumc svg{width:100%;height:auto;display:block}
.bigrule{margin-top:12px;border:3px dashed var(--red);border-radius:18px;padding:10px 14px;font-size:18px;text-align:center}
.qcard{font-size:19px;font-weight:700;margin-bottom:12px}
.opts{display:flex;gap:12px;flex-wrap:wrap}
.opt{flex:1 1 180px;border:2px solid var(--line);border-radius:18px;background:#fff;padding:12px;cursor:pointer;text-align:center;font-family:Fredoka,sans-serif;font-size:18px;box-shadow:0 4px 0 var(--shadow);color:var(--ink)}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:#2e9e5b;background:#e8f6ee}.opt.wrong{border-color:#d8434a;background:#fdeeee}
.opt:disabled{cursor:default}
.opt svg{display:block;margin:0 auto 4px}
.opt .val{display:block;font-size:14px;color:var(--muted);margin-top:4px;min-height:18px}
.dt{width:100%;border-collapse:separate;border-spacing:0;margin:6px 0;font-family:Fredoka,sans-serif;font-size:17px;text-align:center;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.dt th{background:var(--accent);color:#fff;font-weight:600;padding:7px 6px;font-size:15px}
.dt td{padding:7px 6px;border-top:1px solid #e3e9f2;background:#fff}
.dt tr:nth-child(odd) td{background:#f6f8fc}
.dt tr[data-r]{cursor:pointer}
.dt tr.sel td{background:#fff1cc!important;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.cmp{display:inline-flex;align-items:center;gap:8px;border:2px solid;border-radius:999px;padding:4px 6px 4px 12px;font-family:Fredoka,sans-serif;font-size:17px;background:#fff}
.cmp i{font-style:normal;color:#fff;border-radius:999px;padding:2px 10px;font-weight:600}
.solve{font-family:Fredoka,sans-serif;font-weight:600;font-size:30px;margin:6px 0}
.ladder{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.rung{font-family:Fredoka,sans-serif;font-size:16px;padding:4px 10px;border-radius:10px;background:#eef2f8;color:var(--ink)}
.rung.hit{color:#fff;font-weight:600;transform:scale(1.08)}
.solverow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.big2{font-family:Fredoka,sans-serif;font-weight:600;font-size:21px;margin-top:6px}
.lawbig{font-family:Fredoka,sans-serif;font-weight:600;font-size:32px;text-align:center;margin:10px 0;padding:8px;background:#f6f8fc;border-radius:14px}
.lawsm{font-family:Fredoka,sans-serif;font-weight:600;font-size:20px}
.center{text-align:center;font-size:18px}
.mysteq{font-family:Fredoka,sans-serif;font-weight:600;font-size:28px;text-align:center;padding:10px;background:#f6f8fc;border-radius:14px;margin-bottom:10px}
.mysteq sup.q{color:var(--accent);font-size:.7em}
.runbar,.ansrow2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.runbar .lab,.ansrow2 .lab{font-family:Fredoka,sans-serif;font-size:16px;margin-left:6px}
.ansrow2{font-family:Fredoka,sans-serif;font-size:20px;border-top:2px solid var(--line);padding-top:10px;margin-top:10px}
.cmpbox{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;font-family:Fredoka,sans-serif;font-size:16px}
.cmpbox .cmp{margin:6px 6px 0 0}
.warn{margin-top:8px;color:#d8434a;font-weight:600}
.gsec{border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin-top:10px;background:#fff}
.gsec h4{margin:0 0 6px;font-family:Fredoka,sans-serif;font-weight:600;font-size:19px}
.gin{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-family:Fredoka,sans-serif;font-size:18px;margin:6px 0}
.gin input,.gin select{width:80px;font-family:Fredoka,sans-serif;font-size:18px;font-weight:600;text-align:center;border:2px solid var(--line);border-radius:10px;padding:4px;background:#fff;color:var(--ink)}
.gin select{width:64px}
.gin input.ok,.gin select.ok{border-color:#2e9e5b;background:#e8f6ee}.gin input.no,.gin select.no{border-color:#d8434a;background:#fdeeee}
.good2{color:#2e9e5b;font-weight:700}.bad2{color:#d8434a;font-weight:700}
.mk{min-width:18px}
.hintbox .ladder{display:inline-flex}

/* ===== ideal gas law lab ===== */
#panel:empty{display:none}
#panel{margin-top:12px}
.task{font-size:18px;background:#f3f6fb;border-radius:14px;padding:12px 14px;margin-bottom:10px;line-height:1.5}
.task .src{display:inline-block;font-family:Fredoka,sans-serif;font-size:13px;padding:2px 10px;border-radius:999px;color:#fff;background:var(--accent);margin-right:8px;vertical-align:2px}
.frow{display:flex;align-items:flex-start;gap:10px;border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin-top:10px;background:#fff}
.frow .fn{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:Fredoka,sans-serif;font-weight:600;font-size:15px;flex:none;margin-top:2px}
.frow .fb2{flex:1;min-width:0}
.frow .fl{font-family:Fredoka,sans-serif;font-weight:500;font-size:18px;margin-bottom:6px}
.chs{display:flex;flex-wrap:wrap;gap:8px}
.chs button{font-family:Fredoka,sans-serif;font-size:17px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 14px;cursor:pointer;color:var(--ink)}
.chs button.on{border-color:var(--accent);background:var(--accent);color:#fff}
.chs button.ok{border-color:#2e9e5b;background:#2e9e5b;color:#fff}
.chs button.no{border-color:#d8434a;background:#d8434a;color:#fff}
.nin{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:Fredoka,sans-serif;font-size:19px}
.nin input{width:120px;font-family:Fredoka,sans-serif;font-size:20px;font-weight:600;text-align:center;border:2px solid var(--line);border-radius:10px;padding:4px;background:#fff;color:var(--ink)}
.nin input.ok{border-color:#2e9e5b;background:#e8f6ee}.nin input.no{border-color:#d8434a;background:#fdeeee}
.fmark{font-weight:700;font-size:20px;min-width:22px;margin-top:2px}
.mathl{font-family:Fredoka,sans-serif;font-size:21px;font-weight:500;margin:6px 0;line-height:1.5}
.mathl b{font-weight:600}
.ansb{font-family:Fredoka,sans-serif;font-weight:600;font-size:24px;color:var(--accent)}
.tip{font-size:14px;color:var(--muted);margin-top:6px}
.dtab{border-collapse:separate;border-spacing:0;width:100%;margin-top:6px;font-family:Fredoka,sans-serif;font-size:18px}
.dtab th{background:var(--accent);color:#fff;font-weight:600;padding:6px 8px}
.dtab th:first-child{border-radius:10px 0 0 0}.dtab th:last-child{border-radius:0 10px 0 0}
.dtab td{padding:6px 8px;text-align:center;border-bottom:2px solid #eef1f6}
.dtab td input{width:90px;font-family:Fredoka,sans-serif;font-size:18px;font-weight:600;text-align:center;border:2px solid var(--line);border-radius:10px;padding:3px}
.dtab td input.ok{border-color:#2e9e5b;background:#e8f6ee}.dtab td input.no{border-color:#d8434a;background:#fdeeee}
.mapflow{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;font-family:Fredoka,sans-serif;font-size:17px;margin:8px 0}
.mapflow .bx{border:2px solid var(--line);border-radius:12px;padding:6px 12px;background:#fff;font-weight:600}
.mapflow .bx.hi{background:var(--accent);color:#fff;border-color:var(--accent)}
.mapflow .ar{color:var(--accent);font-weight:600;text-align:center;line-height:1.1}
.mapflow .ar small{display:block;font-size:13px}
.excards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.exc{border:2px solid var(--line);border-radius:18px;padding:12px;background:#fff}
.exc .eh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.exc .eh svg{flex:none}
.exc h3{font-family:Fredoka,sans-serif;font-weight:600;font-size:19px;margin:0}
.exc .tag{display:inline-block;font-family:Fredoka,sans-serif;font-size:13px;padding:2px 10px;border-radius:999px;color:#fff;margin-bottom:6px}
.exc p{margin:4px 0;font-size:16px}
.rv{border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:10px;background:#fff}
.rv .rq{font-size:18px;font-weight:700}
.rv .ra{display:none;margin-top:8px;background:#e8f6ee;border-radius:12px;padding:8px 12px;font-size:17px}
.rv.open .ra{display:block}
.rv .btn{margin-top:8px}
.bigeq{font-family:Fredoka,sans-serif;font-weight:600;font-size:34px;text-align:center;color:var(--accent);background:#f6f8fc;border-radius:14px;padding:10px;margin:8px 0}
.ltab{border-collapse:collapse;width:100%;font-size:17px;margin-top:6px}
.ltab td,.ltab th{border:2px solid #eef1f6;padding:6px 8px;text-align:center}
.ltab th{background:#f3f6fb;font-family:Fredoka,sans-serif;font-weight:600}
.subbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.subbar .btn.sel{background:var(--accent);color:#fff}
.note{font-size:15px;color:var(--muted)}

.hv-chg{background:#fde3cc;color:#b35a0c;font-weight:700;border-radius:6px;padding:0 4px}
.hv-ask{background:#d6efef;color:#0b6f71;font-weight:700;border-radius:6px;padding:0 4px}
.hv-cst{border-bottom:3px dashed #8d99b0;font-weight:700;padding:0 2px}

.tfhead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;font-size:18px;margin-bottom:4px}
.tfrow{display:flex;align-items:flex-start;gap:10px;border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin-top:10px;background:#fff}
.tfrow.good{border-color:#2e9e5b;background:#f3fbf6}.tfrow.bad{border-color:#d8434a;background:#fdf4f4}
.tfrow .fn{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:Fredoka,sans-serif;font-weight:600;font-size:15px;flex:none;margin-top:2px}
.tfq{flex:1;font-size:18px;line-height:1.45}
.tfx{font-size:16px;margin-top:6px;color:var(--ink)}
.tfb{display:flex;gap:8px;flex:none}
.tfbtn{width:48px;height:44px;border-radius:12px;border:2px solid var(--line);background:#fff;font-family:Fredoka,sans-serif;font-weight:600;font-size:20px;cursor:pointer;color:var(--ink)}
.tfbtn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.tfbtn:disabled{cursor:default;opacity:.55}
.tfbtn.right{background:#2e9e5b;border-color:#2e9e5b;color:#fff;opacity:1}
.tfbtn.wrong{background:#d8434a;border-color:#d8434a;color:#fff;opacity:1}

/* ===== shared lab styles ===== */
.objbar{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-left:8px solid var(--accent);border-radius:14px;padding:8px 14px;margin-bottom:12px;font-size:17px}
.objbar b{font-family:Fredoka,sans-serif;font-weight:600;color:var(--accent);white-space:nowrap}
.vhead{display:flex;align-items:center;gap:8px;font-family:Fredoka,sans-serif;font-weight:600;font-size:20px;color:var(--accent);margin:18px 0 10px}
.vhead svg{flex:none}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.vid{border:2px solid var(--line);border-radius:18px;padding:8px 8px 10px;background:#fff;box-shadow:0 4px 0 var(--shadow)}

var rnd=Math.random;

/* ================= particle engine ================= */

  if(P.every(function(q){return (x-q.x)*(x-q.x)+(y-q.y)*(y-q.y)>(r+q.r+3)*(r+q.r+3);})){var a=rnd()*6.283;P.push({x:x,y:y,vx:v*Math.cos(a),vy:v*Math.sin(a),r:r,a:rnd()*6.283,w:(rnd()-.5)*3,k:kind||0});}}

function stepParts(P,box,dt,o){o=o||{};var e=o.e==null?1:o.e,n=P.length,coll=o.coll!==false,sub=Math.max(1,Math.ceil(dt/0.008)),h=dt/sub;

  for(i=0;i<n;i++){var p=P[i],gg=p.g!=null?p.g:o.g;if(gg)p.vy+=gg*h;p.x+=p.vx*h;p.y+=p.vy*h;p.a+=p.w*h;var r=p.r,ew=o.ew==null?1:o.ew;
   if(p.x<box.x0+r){p.x=box.x0+r;p.vx=Math.abs(p.vx)*ew;if(o.hit)o.hit(p,'l');}
   if(p.x>box.x1-r){p.x=box.x1-r;p.vx=-Math.abs(p.vx)*ew;if(o.hit)o.hit(p,'r');}
   if(p.y<box.y0+r){p.y=box.y0+r;p.vy=Math.abs(p.vy)*ew+(box.vy0||0);if(o.hit)o.hit(p,'t');}
   if(p.y>box.y1-r){p.y=box.y1-r;p.vy=-Math.abs(p.vy)*(gg?ew*.8:ew);if(o.hit)o.hit(p,'b');}}
  if(coll){for(i=0;i<n;i++)for(j=i+1;j<n;j++){a=P[i];b=P[j];dx=b.x-a.x;dy=b.y-a.y;d=Math.sqrt(dx*dx+dy*dy);lim=a.r+b.r;
    if(d>0&&d<lim){var nx=dx/d,ny=dy/d,ma=a.m||1,mb=b.m||1,rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
     if(rv<0){var J=-(1+e)*rv/(1/ma+1/mb);a.vx-=J*nx/ma;a.vy-=J*ny/ma;b.vx+=J*nx/mb;b.vy+=J*ny/mb;if(o.bump)o.bump(a,b);}
     var ov=(lim-d)/2;a.x-=ov*nx;a.y-=ov*ny;b.x+=ov*nx;b.y+=ov*ny;}}}}
 if(o.lang&&o.vt!=null){var gm=o.lang,sg=Math.sqrt(gm*o.vt*o.vt*dt);P.forEach(function(p){p.vx+=-gm*p.vx*dt+sg*gauss();p.vy+=-gm*p.vy*dt+sg*gauss();});return;}
 if(o.vt!=null&&n){var ke=0;P.forEach(function(p){ke+=p.vx*p.vx+p.vy*p.vy;});ke=Math.sqrt(ke/n);var sc=1+(o.kT||2)*dt*(o.vt/Math.max(ke,1)-1);sc=clamp(sc,.9,1.1);P.forEach(function(p){p.vx*=sc;p.vy*=sc;});}}

 {q:'How many lone pairs are on the central atom of <b>H₂O</b>?',o:['2','1','0','4'],a:0,w:'8 electrons: 2 bonds + 2 lone pairs on O.'},

 {q:'ClO₂ has 19 valence electrons, so it…',o:['has an odd number of electrons','has a suboctet','has resonance only','obeys the octet rule'],a:0,w:'19 is odd: one electron cannot pair.'}];

var QZ1=mkQuiz(Q1),QZ2=mkQuiz(Q2),QZ3=mkQuiz(Q3),QZX=mkQuiz(QX,true);

var TABS=[
 {n:'1 · Lewis structures',c:TEAL,hash:'lewis',obj:'Use the six basic steps to draw Lewis structures for molecules and polyatomic ions.',
  rule:['1 · central atom (least attraction; never H)','2 · count the valence electrons','3 · ÷ 2 = bonding pairs','4 · single bonds first','5 · lone pairs: terminal atoms, then central','6 · no octet? lone pairs → double/triple bonds'],
  steps:[['The six steps',SC_B1]].concat(PL.slice(0,6).map(function(p){return [p.chip,lewisProbScene(p)];})).concat([['Polyatomic ions',SC_B2]]).concat(PL.slice(6).map(function(p){return [p.chip,lewisProbScene(p,'Do you add or subtract electrons for this charge?')];})).concat([['Quiz me',quizScene(QZ1,'Quiz me: drawing Lewis structures','Say the six steps in order before you start.')]])},
 {n:'2 · Resonance',c:BLUE,hash:'resonance',obj:'Explain why resonance occurs and draw resonance structures.',

  steps:[['More than one structure',SC_R1],['The real molecule',SC_R2]].concat(PR.map(function(p){return [p.chip,resProbScene(p)];})).concat([['Quiz me',quizScene(QZ2,'Quiz me: resonance','Where can the double bond go?')]])},
 {n:'3 · Exceptions',c:PLUM,hash:'exceptions',obj:'Identify molecules that are exceptions to the octet rule and explain why they occur.',

  steps:[['Odd electrons',SC_X1],['Suboctet',SC_X2],['Expanded octet',SC_X3]].concat(PX.map(function(p){return [p.chip,lewisProbScene(p,'Is the central atom in period 3 or lower? How many electrons does it end with?')];})).concat([['Which exception?',SC_X4],['Quiz me',quizScene(QZ3,'Quiz me: exceptions to the octet rule','Count the electrons around the central atom first.')]])},
 {n:'Exit ticket',c:CORAL,hash:'exit-ticket',obj:'Show what you learned today: 10 questions from all three objectives.',

function mixFields(P){(P.fields||[]).forEach(function(f){if(f.t!=='c'||f.keep||P.keep)return;var idx=shuffle(f.opts.map(function(_,i){return i;})),o=f.opts;f.opts=idx.map(function(i){return o[i];});f.ok=idx.indexOf(f.ok);if(f.bad){var nb={};Object.keys(f.bad).forEach(function(k){nb[idx.indexOf(+k)]=f.bad[k];});f.bad=nb;}});}
TABS.forEach(function(t){t.steps.forEach(function(s){if(s[1].prob)mixFields(s[1].prob);});});

function mkQuiz(L,exit){return {L:L,exit:!!exit,ord:null,player:null};}
var SCORE_URL='https://script.google.com/macros/s/AKfycbxqxWcG4jS6gWBLKroZBscjhfJEBmSRwIjZ4OtamJe55XvdfLjX0Jj9j2xgfPAr0Mbu6g/exec';
var CLASSES=['9-A','9-B','10-A','10-B','11-A','11-B','12-A','12-B'];
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function qzStart(Q){Q.i=0;Q.score=0;Q.pick=null;Q.hist=[];Q.done=false;Q.sent=false;Q.started=Date.now();Q.ord=Q.L.map(function(q){return shuffle(q.o.map(function(_,k){return k;}));});}
function qzDots(Q){return '<div class="qzdots">'+Q.L.map(function(_,k){var h=Q.hist[k];return '<i class="'+(h===true?'ok':(h===false?'no':(k===Q.i&&!Q.done?'cur':'')))+'"></i>';}).join('')+'</div>';}
function exStartHtml(Q){var me={};try{me=JSON.parse(lsGet('msm-student')||'{}')||{};}catch(e){}var nm=Q.player?Q.player.name:(me.name||''),cl=Q.player?Q.player.cls:(me.cls||'');
 return '<div class="qz"><div class="lbl">Exit ticket · Chapter 8.3</div><div class="qzq" style="margin-top:4px">Show what you learned today: '+Q.L.length+' questions from all three objectives. One try per question.</div>'+
  '<div class="namerow"><label for="exName">Your full name</label><input id="exName" autocomplete="name" maxlength="60" placeholder="e.g. Sara Ahmed" value="'+esc(nm)+'"></div>'+
  '<div class="namerow"><label for="exCls">Class</label><select id="exCls"><option value="">Choose…</option>'+CLASSES.map(function(c){return '<option'+(c===cl?' selected':'')+'>'+c+'</option>';}).join('')+'</select></div>'+
  '<div class="exerr" id="exErr" role="alert"></div><div class="stepbar"><button class="btn fill" id="exGo">Start the exit ticket ▶</button></div></div>';}
function exResult(Q){var N=Q.L.length,now=new Date(),mins=Math.max(1,Math.round((Date.now()-Q.started)/60000)),
 when=now.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}),
 hh=(Q.player.name+'|'+Q.player.cls+'|'+Q.score*100+'|'+Q.score+'|'+now.toISOString().slice(0,16)).split('').reduce(function(a,c){return (a*31+c.charCodeAt(0))>>>0;},7),
 code='MS-'+('000000'+hh.toString(36).toUpperCase()).slice(-6);
 Q.res={when:when,code:code,payload:{game:'Molecular Structures Lab: Exit Ticket',chapter:8,name:Q.player.name,cls:Q.player.cls,score:Q.score*100,correct:Q.score,total:N,mins:mins,when:when,code:code,
  missed:Q.hist.map(function(h,k){return h?'':'Q'+(k+1);}).filter(Boolean).join(' ')}};}
function exSend(Q){var st=$('exSt'),rt=$('exRetry');if(!st)return;st.className='sendst';st.textContent='Sending your result to your teacher…';if(rt)rt.style.display='none';
 fetch(SCORE_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Q.res.payload)})
  .then(function(){Q.sent=true;var s2=$('exSt');if(s2){s2.className='sendst ok';s2.textContent='✓ Your result was sent to your teacher.';}})
  .catch(function(){var s2=$('exSt'),r2=$('exRetry');if(s2){s2.className='sendst err';s2.textContent='Could not send. Check your internet, then tap Send again.';}if(r2)r2.style.display='';});}
function qzHtml(Q){if(Q.exit&&!Q.player)return exStartHtml(Q);if(!Q.ord)qzStart(Q);var N=Q.L.length;
 if(Q.done){var pct=Q.score/N,msg=pct>=.8?'Excellent! You have got this objective.':(pct>=.6?'Good work. Look at the ones you missed, then try again.':'Go back through the steps in this tab, then try again.');
  if(Q.exit)msg=pct>=.8?'Excellent work today!':(pct>=.6?'Good effort. Review the questions you missed.':'Review this lesson again before the next class.');
  return '<div class="qz qzend">'+(Q.exit?'<div class="ticket"><div class="lbl">Exit ticket · Chapter 8.3 Molecular structures</div><div class="tname">'+esc(Q.player.name)+' · '+esc(Q.player.cls)+'</div><div class="small">'+Q.res.when+' · check code '+Q.res.code+'</div><div class="qzbig">'+Q.score+' / '+N+'</div><div>'+msg+'</div>'+qzDots(Q)+
   '<div class="stepbar" style="justify-content:center"><span class="'+(Q.sent?'sendst ok':'sendst')+'" id="exSt">'+(Q.sent?'✓ Your result was sent to your teacher.':'Sending your result to your teacher…')+'</span><button class="btn" id="exRetry" style="display:none">Send again</button></div></div>':'<div class="qzbig">'+Q.score+' / '+N+'</div><div style="font-size:18px">'+msg+'</div>'+qzDots(Q))+
   '<div class="qzrev">'+Q.L.map(function(q,k){return '<div class="'+(Q.hist[k]?'ok':'no')+'">'+(Q.hist[k]?'✓':'✗')+' <b>'+(k+1)+'.</b> '+q.q.replace(/<span class="small">.*<\/span>/,'')+' → <b>'+q.o[q.a]+'</b></div>';}).join('')+'</div>'+
   '<div class="stepbar" style="justify-content:center"><button class="btn fill" id="qzR">'+(Q.exit?'Start again':'Try again')+'</button></div></div>';}
 var q=Q.L[Q.i],ans=Q.pick!==null;
 var h='<div class="qz">'+(Q.exit?'<div class="small" style="margin-bottom:6px">'+esc(Q.player.name)+' · '+esc(Q.player.cls)+'</div>':'')+'<div class="qzh"><b>Question '+(Q.i+1)+' of '+N+'</b>'+qzDots(Q)+'<span>Score: '+Q.score+'</span></div>';
 if(q.picF&&!q.pic)q.pic=q.picF();h+='<div class="qzq">'+q.q+'</div>'+(q.pic?'<div class="qzpic">'+q.pic+'</div>':'');
 h+='<div class="qzopts">'+Q.ord[Q.i].map(function(k,j){var cls=ans?(k===q.a?' right':(k===Q.pick?' wrong':'')):'';return '<button class="qzb'+cls+'" data-k="'+k+'"'+(ans?' disabled':'')+'><span class="L">'+'ABCD'.charAt(j)+'</span><span>'+q.o[k]+'</span></button>';}).join('')+'</div>';
 if(ans)h+='<div class="qzfb '+(Q.pick===q.a?'ok':'no')+'"><b>'+(Q.pick===q.a?'Correct!':'Not quite.')+'</b> '+(Q.pick===q.a?'':'The answer is <b>'+q.o[q.a]+'</b>. ')+q.w+'</div><div class="stepbar"><button class="btn fill" id="qzN">'+(Q.i<N-1?'Next question ▶':'See my score ▶')+'</button></div>';
 return h+'</div>';}
function qzRender(Q){$('panel').innerHTML=qzHtml(Q);qzBind(Q);}
function qzBind(Q){each('.qzb',function(b){b.onclick=function(){if(Q.pick!==null)return;var q=Q.L[Q.i];Q.pick=+b.getAttribute('data-k');var ok=Q.pick===q.a;if(ok)Q.score++;Q.hist[Q.i]=ok;qzRender(Q);};});
 var n=$('qzN');if(n)n.onclick=function(){if(Q.i<Q.L.length-1){Q.i++;Q.pick=null;qzRender(Q);}else{Q.done=true;if(Q.exit)exResult(Q);renderSteps();qzRender(Q);if(Q.exit)exSend(Q);}};
 var r=$('qzR');if(r)r.onclick=function(){if(Q.exit){Q.ord=null;Q.done=false;var keep=Q.player;Q.player=null;Q.last=keep;qzRender(Q);return;}qzStart(Q);renderSteps();qzRender(Q);};
 var rt=$('exRetry');if(rt)rt.onclick=function(){exSend(Q);};
 var go=$('exGo');if(go){var nm=$('exName'),cl=$('exCls');if(Q.last&&!nm.value){nm.value=Q.last.name;cl.value=Q.last.cls;}
  var start=function(){var v=nm.value.trim().replace(/\s+/g,' '),c=cl.value,er=$('exErr');nm.classList.toggle('no',v.length<2);cl.classList.toggle('no',!c);
   if(v.length<2||v.indexOf(' ')<0){er.textContent='Please type your full name (first and last).';nm.classList.add('no');nm.focus();return;}
   if(!c){er.textContent='Please choose your class.';cl.focus();return;}
   Q.player={name:v,cls:c};qzStart(Q);renderSteps();qzRender(Q);};
  go.onclick=start;nm.onkeydown=function(e){if(e.key==='Enter')start();};}}
function quizScene(Q,title,think){return {title:title,q:think,canvas:false,quiz:Q,html:function(){return qzHtml(Q);},bindHtml:function(){qzBind(Q);},
 reads:function(){if(Q.exit&&!Q.player)return [['Status','enter name and class']];if(!Q.ord)qzStart(Q);return [['Question',Math.min(Q.i+1,Q.L.length)+' / '+Q.L.length],['Score',Q.score]];}};}
var tabI=0,stepI=0,cur=null,lastReads='';
TABS.forEach(function(t,ti){t.steps.forEach(function(s,si){if(s[1].prob){s[1].prob.next=function(){if(si+1<t.steps.length)go(ti,si+1);else if(ti+1<TABS.length)go(ti+1,0);};}});});
function renderTabs(){$('tabs').innerHTML=TABS.map(function(t,i){return '<button class="tab'+(i===tabI?' on':'')+'" style="--c:'+t.c+'" data-i="'+i+'"><i></i>'+t.n+'</button>';}).join('');
 Array.prototype.forEach.call($('tabs').children,function(b){b.onclick=function(){go(+b.getAttribute('data-i'),0);};});}
function renderSteps(){$('steps').innerHTML=TABS[tabI].steps.map(function(s,i){var p=s[1].prob,done=(p&&p.solved)||(s[1].quiz&&s[1].quiz.done);return '<button class="step'+(i===stepI?' on':'')+(done?' done':'')+'" data-i="'+i+'"><b>'+(done?'✓':(i+1))+'</b>'+s[0]+'</button>';}).join('');
 Array.prototype.forEach.call($('steps').children,function(b){b.onclick=function(){go(tabI,+b.getAttribute('data-i'));};});}
function go(t,s){tabI=t;stepI=s||0;var T=TABS[t];cur=T.steps[stepI][1];document.documentElement.style.setProperty('--accent',T.c);
 renderTabs();renderSteps();$('obj').innerHTML='<b>'+(t<3?'Objective '+(t+1):'Exit ticket')+'</b><span>'+T.obj+'</span>';
 $('stitle').textContent=cur.title;$('q').innerHTML=cur.q;$('rule').innerHTML=(cur.rule||T.rule).map(function(r){return '<li>'+r+'</li>';}).join('');
 $('cv').style.display=cur.canvas?'':'none';$('controls').innerHTML='';$('controls').style.display=cur.canvas?'':'none';$('panel').innerHTML='';$('ov').innerHTML='';cv.style.touchAction='';lastReads='';
 if(cur.enter)cur.enter();
 if(cur.prob){if(cur.prob.mode==null)cur.prob.mode='show';probUI(cur.prob);}else if(cur.cards){cur.cards.st=cur.cards.st||0;cardsUI(cur.cards);}else if(cur.html){$('panel').innerHTML=cur.html();if(cur.bindHtml)cur.bindHtml();}
 $('vids').innerHTML=cur.vids?vidHtml(cur.vids):'';if(cur.vids)vidBind();
 try{history.replaceState(null,'','#'+T.hash);}catch(e){}if(window.scrollY>200)window.scrollTo(0,0);}
function solvedIn(t){var a=TABS[t].steps.filter(function(s){return s[1].prob&&s[1].prob.chip;});return [a.filter(function(s){return s[1].prob.solved;}).length,a.length];}
function reads(){var r=cur.reads?cur.reads():[];if(cur.prob&&!cur.canvas&&!cur.reads){var s=solvedIn(tabI);r=[['Problems solved',s[0]+' / '+s[1]],['Mode',cur.prob.mode==='try'?'My turn':'Show me']];}
 if(!r.length)r=[['Step',(stepI+1)+' of '+TABS[tabI].steps.length]];
 var h=r.map(function(x){return '<div class="rd"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>';}).join('');if(h!==lastReads){$('reads').innerHTML=h;lastReads=h;}}

['down','move','up','cancel'].forEach(function(k){cv.addEventListener('pointer'+k,function(e){if(!cur||!cur.ptr)return;var q=cvXY(e),used=cur.ptr(k==='cancel'?'up':k,q[0],q[1]);if(used&&k==='down'){try{cv.setPointerCapture(e.pointerId);}catch(x){}}if(used&&k!=='up')e.preventDefault();});});
var hi=TABS.map(function(t){return t.hash;}).indexOf(location.hash.slice(1));go(hi>=0?hi:0,0);
window.addEventListener('hashchange',function(){var k=TABS.map(function(t){return t.hash;}).indexOf(location.hash.slice(1));if(k>=0&&k!==tabI)go(k,0);});
