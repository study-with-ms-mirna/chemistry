<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Periodic Table Lab · Study with Ms. Mirna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@600&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eaf0f8; --grid:#dbe4f1; --ink:#18233a; --muted:#56637d;
    --card:#ffffff; --border:#c9d4e6; --shadow:#c3cfe3;
    --teal:#0f8b8d; --blue:#2b59c3; --plum:#8a4fbf; --amber:#e8962a; --coral:#e2708a; --red:#d4486e;
    --good:#23915a; --goodbg:#dcf3e6; --bad:#d14343; --badbg:#fbe3e3;
    --tealbg:#dcf2f2; --bluebg:#e3ebfb; --amberbg:#fdf0dc; --plumbg:#efe5f8;
    --metal:#a9dceb; --metalloid:#a8d17e; --nonmetal:#f9d96a;
    --disp:"Fredoka",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background-color:var(--bg);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:28px 28px;
    color:var(--ink);
    font-family:"Atkinson Hyperlegible",Arial,sans-serif;
    font-size:16px; line-height:1.45;
  }
  button{font:inherit;color:inherit}
  button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
  .wrap{max-width:1240px;margin:0 auto;padding:18px 16px 40px}
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .logo{width:58px;height:58px;flex:none}
  .brand{font-family:"Caveat",cursive;font-size:22px;color:var(--muted);line-height:1}
  .brand b{font-family:"Pacifico",cursive;font-weight:400;font-size:20px;color:var(--teal)}
  h1{font-family:var(--disp);font-weight:700;font-size:34px;margin:2px 0 0;line-height:1.1}
  .sub{color:var(--muted);margin:2px 0 0}
  .tabs{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 16px}
  .tab{-webkit-appearance:none;appearance:none;font-family:var(--disp);font-size:16px;font-weight:600;color:var(--ink);
    background:#fff;border:2px solid var(--border);border-radius:16px;padding:9px 14px;box-shadow:0 4px 0 var(--shadow);cursor:pointer;display:flex;align-items:center;gap:8px}
  .tab .n{display:inline-flex;width:26px;height:26px;border-radius:50%;align-items:center;justify-content:center;color:#fff;font-size:14px}
  .tab.active{border-color:var(--ink);transform:translateY(2px);box-shadow:0 2px 0 var(--shadow)}
  .steps{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
  .step{-webkit-appearance:none;appearance:none;font-family:var(--disp);font-weight:600;font-size:15px;background:#fff;border:2px solid var(--border);border-radius:12px;padding:7px 12px;cursor:pointer;color:var(--ink)}
  .step.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .step.done::after{content:" \2713";color:var(--good)}
  .step.on.done::after{color:#9be3b8}
  .grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
  .stack{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
  .grid>*,.stack>*{min-width:0}
  @media (max-width:900px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:2px solid var(--border);border-radius:22px;box-shadow:0 6px 0 var(--shadow);padding:16px}
  .btn{-webkit-appearance:none;appearance:none;font-family:var(--disp);font-size:15px;font-weight:600;color:#fff;background:var(--teal);border:none;border-radius:14px;padding:9px 14px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.18);line-height:1.1}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  .btn.blue{background:var(--blue)} .btn.plum{background:var(--plum)} .btn.amber{background:var(--amber)} .btn.coral{background:var(--red)} .btn.go{background:var(--good)}
  .btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--border);box-shadow:0 4px 0 var(--shadow)}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
  .chip{-webkit-appearance:none;appearance:none;font-family:var(--disp);font-size:15px;font-weight:600;color:var(--ink);background:#fff;border:2px solid var(--border);border-radius:12px;padding:7px 11px;cursor:pointer;line-height:1.1;display:inline-flex;align-items:center;gap:6px}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip i{display:inline-block;width:14px;height:14px;border-radius:4px;border:1.5px solid rgba(0,0,0,.25)}
  h2{font-family:var(--disp);font-size:24px;margin:0 0 4px}
  h3{font-family:var(--disp);font-size:17px;margin:14px 0 6px;color:var(--teal)}
  .panel p{margin:6px 0}
  .panel ol,.panel ul{margin:4px 0;padding-left:22px}
  .panel li{margin:4px 0}
  .bigq{font-family:var(--disp);font-weight:500;font-size:19px;line-height:1.35;background:#f2f6fb;border:2px solid #e2e9f4;border-radius:16px;padding:12px 14px;margin:10px 0 10px}
  .bigq span{display:block;font-size:14px;font-weight:600;color:var(--teal);margin-bottom:4px}
  .ans{display:none;margin-top:8px;font-family:"Atkinson Hyperlegible",Arial,sans-serif;font-size:16px;background:#fff;border-left:4px solid var(--teal);padding:6px 10px;border-radius:0 10px 10px 0}
  .ans.show{display:block}
  .rule{display:none;margin-top:12px;border:2.5px dashed #c00000;border-radius:16px;padding:10px 12px;background:#fff6f6}
  .rule.show{display:block}
  .rule strong{font-family:var(--disp);color:#c00000;font-size:17px;display:block;margin-bottom:2px}
  .readout{font-family:var(--disp);font-weight:500;background:#f2f6fb;border:2px solid #e2e9f4;border-radius:12px;padding:8px 12px;margin-top:12px;font-size:15px;min-height:42px}
  .readout.good{background:var(--goodbg);border-color:var(--good)}
  .readout.bad{background:var(--badbg);border-color:var(--bad)}
  .hidden{display:none !important}
  .note{font-size:14px;color:var(--muted)}

  /* ---------- sorting boards ---------- */
  .tray{display:flex;flex-wrap:wrap;gap:8px;min-height:70px;padding:10px;border:2px dashed var(--border);border-radius:16px;background:#f7f9fd}
  .tray .empty{color:var(--muted);font-size:14px;align-self:center}
  .ocard,.ecard{-webkit-appearance:none;appearance:none;background:#fff;border:2px solid var(--border);border-radius:14px;cursor:pointer;text-align:center;padding:6px 4px;line-height:1.15;transition:transform .08s,border-color .15s,background .15s;color:var(--ink)}
  .ocard{width:112px}
  .ocard svg{width:46px;height:46px;display:block;margin:0 auto 2px}
  .ocard b{display:block;font-family:var(--disp);font-weight:600;font-size:14px}
  .ocard em{display:block;font-style:normal;font-family:var(--disp);font-weight:700;color:var(--blue);font-size:15px}
  .ocard:hover,.ecard:hover{transform:translateY(-2px);border-color:var(--blue)}
  .ocard.sel,.ecard.sel{border-color:var(--amber);background:var(--amberbg);box-shadow:0 0 0 3px rgba(232,150,42,.25)}
  .ocard.right,.ecard.right{border-color:var(--good);background:var(--goodbg)}
  .ocard.wrong,.ecard.wrong{border-color:var(--bad);background:var(--badbg)}
  .ocard.gapfill{border-color:var(--plum);background:var(--plumbg);animation:pop .4s ease-out}
  .board{display:grid;gap:8px;margin-top:12px}
  .board.obj{grid-template-columns:repeat(4,minmax(0,1fr))}
  .slot{min-height:112px;border:2px dashed var(--border);border-radius:14px;background:#f7f9fd;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;padding:4px}
  .slot.hot{border-color:var(--amber);background:#fffaf0}
  .slot .ocard,.slot .ecard{width:100%;position:relative;z-index:1}
  .slot .lbl{position:absolute;top:4px;left:8px;font-family:var(--disp);font-weight:600;font-size:12px;color:#9aa6bd}
  .rowlbl{font-family:var(--disp);font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:center}
  .board.el{grid-template-columns:repeat(7,minmax(0,1fr));min-width:620px}
  .board.el .slot{min-height:128px}
  .ecard{width:118px;padding:6px 5px}
  .ecard .sy{font-family:var(--disp);font-weight:700;font-size:28px;line-height:1}
  .ecard .ms{font-family:var(--disp);font-weight:700;color:var(--blue);font-size:15px}
  .ecard .nm{font-size:12px;color:var(--muted)}
  .ecard .pr{font-size:12px;margin-top:3px}
  .ecard .fm{font-family:var(--disp);font-weight:600;font-size:13px;color:var(--plum)}
  .board.el.cols .slot.c0{outline:3px dashed #c00000;outline-offset:2px}
  .board.el.cols .slot.cx{outline:3px solid var(--teal);outline-offset:2px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .opt{-webkit-appearance:none;appearance:none;display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:2px solid var(--border);border-radius:14px;padding:10px 12px;min-height:50px;cursor:pointer;color:var(--ink)}
  .opt .k{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-family:var(--disp);font-weight:700;background:var(--bluebg);color:var(--blue)}
  .opt:hover:not(:disabled){border-color:var(--blue)}
  .opt.right{border-color:var(--good);background:var(--goodbg)} .opt.right .k{background:var(--good);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--badbg)} .opt.wrong .k{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default}
  @media (max-width:560px){.opts{grid-template-columns:1fr}}

  /* octave */
  .oct{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin-top:10px}
  .oct .ec{border:2px solid var(--border);border-radius:12px;background:#fff;text-align:center;padding:6px 2px;transition:all .2s}
  .oct .ec b{display:block;font-family:var(--disp);font-size:26px;line-height:1.1}
  .oct .ec small{font-family:var(--disp);color:var(--blue);font-weight:600}
  .oct .ec.lit{border-color:var(--amber);background:var(--amberbg);transform:translateY(-4px)}
  .oct .ec.same{border-color:var(--teal);background:var(--tealbg)}
  .keys{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;margin-top:8px}
  .key{height:120px;border:2px solid var(--ink);border-radius:0 0 12px 12px;background:#fff;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-family:var(--disp);font-weight:700;font-size:18px;transition:background .15s;cursor:pointer;-webkit-appearance:none;appearance:none;color:var(--ink)}
  .key.lit{background:#ffe7b8}
  .key.same{background:var(--tealbg)}
  .octrows{margin-top:16px;display:grid;grid-template-columns:70px repeat(7,minmax(0,1fr));gap:6px;align-items:stretch}
  .octrows .h{font-family:var(--disp);font-weight:600;color:var(--muted);font-size:14px;display:flex;align-items:center}
  .octrows .c{border:2px solid var(--border);border-radius:10px;text-align:center;background:#fff;padding:4px 0}
  .octrows .c b{font-family:var(--disp);font-size:20px;display:block;line-height:1.1}
  .octrows .c small{font-family:var(--disp);font-weight:600;color:var(--plum);font-size:13px}
  .octrows .c.bad{border-color:#c00000;border-style:dashed}
  .octrows .note{grid-column:1 / -1}

  /* ---------- periodic tables ---------- */
  .ptwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .pt{display:grid;grid-template-columns:24px repeat(18,minmax(34px,1fr));gap:3px;min-width:700px;position:relative}
  .pt .gl,.pt .pl{font-family:var(--disp);font-weight:600;font-size:12px;color:var(--muted);display:flex;align-items:flex-end;justify-content:center}
  .pt .pl{align-items:center}
  .pt .sp{height:10px}
  .cell{-webkit-appearance:none;appearance:none;position:relative;aspect-ratio:1/1.08;border:1.5px solid #b9c6da;border-radius:7px;background:#fff;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:background .2s,opacity .2s,box-shadow .2s;color:var(--ink);min-width:0}
  .cell .z{position:absolute;top:2px;left:3px;font-size:9px;font-weight:700;color:#56637d}
  .cell .s{font-family:var(--disp);font-weight:700;font-size:clamp(12px,1.35vw,18px)}
  .cell.dim{opacity:.22}
  .cell.sel{box-shadow:0 0 0 3px var(--ink);z-index:2}
  .cell.hlp{background:#d9e4fb !important}
  .cell.hlg{background:#c9eeee !important}
  .cell.hlb{background:#c9eeee !important;box-shadow:0 0 0 3px var(--teal);z-index:1}
  .cell.c-metal{background:var(--metal)} .cell.c-metalloid{background:var(--metalloid)} .cell.c-nonmetal{background:var(--nonmetal)}
  .cell.t-rep{background:#bfe8e6} .cell.t-tr{background:#fbe6a6} .cell.t-in{background:#f6d0dc}
  .cell.bR{border-right:4px solid #111} .cell.bT{border-top:4px solid #111} .cell.bL{border-left:4px solid #111}
  .cell.qright{background:var(--goodbg) !important;box-shadow:0 0 0 3px var(--good);z-index:2}
  .cell.qwrong{background:var(--badbg) !important;box-shadow:0 0 0 3px var(--bad);z-index:2}
  .fam-alk{background:#f7b6b6} .fam-ae{background:#fbd3a2} .fam-tm{background:#fbe6a6} .fam-itm{background:#f3c7e4} .fam-hal{background:#b9e6b0} .fam-ng{background:#d4c6f3} .fam-onm{background:#fff1b8} .fam-om{background:#cfdcf5} .fam-md{background:#a8d17e}
  .infobox{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:12px;background:#f2f6fb;border:2px solid #e2e9f4;border-radius:14px;padding:10px 12px;min-height:92px}
  .ebox{width:84px;height:84px;border:2px solid #b08a00;border-radius:8px;background:var(--nonmetal);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;flex:none}
  .ebox .z{font-family:var(--disp);font-weight:600;font-size:13px}
  .ebox .s{font-family:var(--disp);font-weight:700;font-size:30px}
  .ebox .n{font-size:11px;font-weight:700}
  .ebox .m{font-size:12px;font-weight:700}
  .infobox .ebox.cell{aspect-ratio:auto;cursor:default;border:2px solid #8a95aa;border-radius:8px;width:84px;height:84px}
  .infobox .ebox .z{position:static;font-size:13px;color:#18233a}
  .infobox .txt{flex:1;min-width:200px;font-size:16px}
  .infobox .txt b.big{font-family:var(--disp);font-size:20px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  /* element key (labels line up with the box) */
  .key4{display:grid;grid-template-columns:120px auto;gap:0 10px;align-items:stretch;margin:10px 0}
  .key4 .bx{grid-row:1 / 5;border:2px solid #b08a00;background:var(--nonmetal);border-radius:8px;display:grid;grid-template-rows:repeat(4,1fr);text-align:center}
  .key4 .bx div{display:flex;align-items:center;justify-content:center;font-weight:700;line-height:1}
  .key4 .bx .a{font-family:var(--disp);font-size:18px;color:#444}
  .key4 .bx .b{font-family:var(--disp);font-size:40px}
  .key4 .bx .c{font-size:14px}
  .key4 .bx .d{font-size:15px}
  .key4 .lb{display:flex;align-items:center;gap:6px;font-family:var(--disp);font-weight:600;color:var(--teal);height:38px;opacity:0;transform:translateX(-6px);transition:all .3s}
  .key4 .lb.show{opacity:1;transform:none}
  .key4 .lb::before{content:"";width:26px;height:0;border-top:2.5px solid var(--teal)}

  /* history board */
  .hb{position:relative;width:100%;min-width:700px}
  .oct,.keys{min-width:0}
  @media (max-width:560px){.board.obj .ocard svg{width:34px;height:34px}.board.obj .ocard b{font-size:12px}.key{height:90px;font-size:14px}.oct .ec b{font-size:18px}.octrows{grid-template-columns:50px repeat(7,minmax(0,1fr))}}
  .hb .hc{position:absolute;border-radius:8px;border:1.5px solid #b9c6da;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:left .9s ease,top .9s ease,opacity .6s,background .4s,border-color .4s;cursor:pointer;-webkit-appearance:none;appearance:none;padding:0;color:var(--ink)}
  .hb .hc .s{font-family:var(--disp);font-weight:700;font-size:clamp(13px,1.5vw,20px)}
  .hb .hc .v{font-size:clamp(8px,.8vw,11px);font-weight:700;color:var(--blue);margin-top:2px}
  .hb .hc .y{position:absolute;bottom:-1px;right:-1px;font-size:9px;font-weight:700;background:var(--plum);color:#fff;border-radius:6px 0 7px 0;padding:1px 3px}
  .hb .hc.gap{border:2px dashed var(--plum);background:var(--plumbg)}
  .hb .hc.gap .s{color:var(--plum)}
  .hb .hc.new{background:#f3ecfb;border-color:var(--plum)}
  .hb .hc.ng{background:#e9e2fb;border-color:#8a4fbf}
  .hb .hc.off{opacity:0;pointer-events:none}
  .hb .hc.bad{background:var(--badbg);border:2.5px solid var(--bad)}
  .hb .hc.fix{background:var(--goodbg);border:2.5px solid var(--good)}
  .hb .hc.sel{box-shadow:0 0 0 3px var(--ink);z-index:3}
  .hb .colt{position:absolute;font-family:var(--disp);font-weight:600;font-size:11px;text-align:center;color:var(--muted);line-height:1.1;transition:opacity .5s}
  .predict{width:100%;border-collapse:collapse;margin-top:8px;font-size:15px}
  .predict th,.predict td{border:2px solid #e2e9f4;padding:5px 6px;text-align:center}
  .predict th{background:#f2f6fb;font-family:var(--disp);font-weight:600}
  .timeline{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .timeline span{font-family:var(--disp);font-weight:600;font-size:13px;background:var(--plumbg);color:var(--plum);border-radius:8px;padding:3px 8px}

  /* ---------- quiz (Periodic Table Quest style) ---------- */
  .overlay{position:fixed;inset:0;background:rgba(24,35,58,.45);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;z-index:20;-webkit-overflow-scrolling:touch}
  .qwrap{width:100%;max-width:780px}
  .hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .stage,.stat{font-family:var(--disp);font-weight:600;font-size:15px;background:#fff;border:2px solid var(--border);border-radius:12px;padding:4px 12px;display:inline-flex;align-items:center;gap:6px}
  .stat.hot{border-color:var(--amber);color:var(--amber)}
  .hud .grow{flex:1}
  .pbar{height:12px;background:#fff;border:2px solid var(--border);border-radius:99px;overflow:hidden;margin-bottom:14px}
  .pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));width:0;transition:width .4s}
  .qcard{background:#fff;border:2px solid var(--border);border-radius:22px;box-shadow:0 6px 0 var(--shadow);padding:22px 22px 20px;display:grid;gap:16px}
  .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .tag{font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase;border-radius:8px;padding:3px 9px}
  .tag.skill{background:var(--tealbg);color:var(--teal)} .tag.type{background:var(--plumbg);color:var(--plum)}
  .qnum{font-family:var(--disp);color:var(--muted);font-weight:600;margin-left:auto;font-size:14px}
  .prompt{font-size:21px;font-weight:700;line-height:1.35}
  .tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tf .opt{justify-content:center;font-family:var(--disp);font-size:22px;font-weight:700;min-height:70px}
  .pool{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;padding:10px;border:2px dashed var(--border);border-radius:14px}
  .qchip{-webkit-appearance:none;appearance:none;background:#fff;border:2px solid var(--border);border-radius:12px;padding:7px 12px;font-weight:700;cursor:pointer;font-family:var(--disp);font-size:17px;color:var(--ink)}
  .qchip.sel{border-color:var(--amber);background:var(--amberbg)}
  .qchip.right{border-color:var(--good);background:var(--goodbg)} .qchip.wrong{border-color:var(--bad);background:var(--badbg)}
  .buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .bucket{-webkit-appearance:none;appearance:none;border:2px solid var(--border);border-radius:16px;padding:10px;min-height:100px;display:flex;flex-direction:column;gap:8px;background:var(--bg);text-align:left;cursor:pointer;color:var(--ink)}
  .bucket h4{font-family:var(--disp);font-size:16px;margin:0}
  .bucket .in{display:flex;flex-wrap:wrap;gap:6px}
  .bucket.ready{border-color:var(--amber);border-style:dashed}

  var steps=['A. Everyday objects','B. Element cards','C. The law of octaves'];
  $('main').innerHTML='<div class="steps" id="ss">'+steps.map(function(s,i){return '<button class="step'+(i===sortStep?' on':'')+(sortDone[i]?' done':'')+'" data-i="'+i+'">'+s+'</button>';}).join('')+'</div><div id="sbody"></div>';
  [].forEach.call($('ss').children,function(b){b.onclick=function(){sortStep=+b.dataset.i;renderSorting();};});
  [sortObjects,sortElements,octaves][sortStep]();
}
function nextSortStep(){sortDone[sortStep]=true;if(sortStep<2){sortStep++;renderSorting();}else go(1);window.scrollTo({top:0,behavior:'smooth'});}

function objCard(o){return '<button class="ocard" data-id="'+o.id+'">'+ICONS[o.id]+'<b>'+o.name+'</b><em>'+o.mass+' g</em></button>';}

/* generic tap-to-place board */
function Placer(opts){
  // opts: trayEl, boardEl, items[{id,html}], slots(n), slotClass(i), onChange
  var place={},sel=null,self=this;
  this.place=place;
  function render(){
    var inBoard={};Object.keys(place).forEach(function(k){inBoard[place[k]]=k;});
    var tray=opts.items.filter(function(it){return !(it.id in inBoard);});
    opts.trayEl.innerHTML=tray.length?tray.map(function(it){return it.html;}).join(''):'<span class="empty">All cards placed. Tap a placed card to send it back.</span>';
    var html='';
    for(var i=0;i<opts.slots;i++){
      var id=place[i];var it=id?opts.items.filter(function(x){return x.id===id;})[0]:null;
      html+=(opts.before?opts.before(i):'')+'<div class="slot '+(opts.slotClass?opts.slotClass(i):'')+'" data-slot="'+i+'">'+(opts.label?'<span class="lbl">'+opts.label(i)+'</span>':'')+(it?it.html:'')+'</div>';
    }
    opts.boardEl.innerHTML=html;
    [].forEach.call(opts.trayEl.querySelectorAll('[data-id]'),function(b){
      if(b.dataset.id===sel)b.classList.add('sel');
      b.onclick=function(){sel=(sel===b.dataset.id?null:b.dataset.id);render();};
    });
    [].forEach.call(opts.boardEl.querySelectorAll('.slot'),function(s){
      if(sel)s.classList.add('hot');
      s.onclick=function(){
        var i=+s.dataset.slot;
        if(sel){ if(place[i])delete place[i]; place[i]=sel; sel=null; }
        else if(place[i]){ delete place[i]; }
        render(); if(opts.onChange)opts.onChange();
      };
    });
  }
  this.render=render;
  this.reset=function(){Object.keys(place).forEach(function(k){delete place[k];});sel=null;render();};
  this.mark=function(fn){[].forEach.call(opts.boardEl.querySelectorAll('.slot'),function(s){var i=+s.dataset.slot;var c=s.querySelector('[data-id]');if(c){c.classList.remove('right','wrong');c.classList.add(fn(i,place[i])?'right':'wrong');}});};
  render();
}

function sortObjects(){
  var items=OBJECTS.filter(function(o){return !o.missing;});
  $('sbody').innerHTML='<div class="grid"><div class="card">'+
    '<h2>Sort the objects</h2><p class="note">Tap a card, then tap a box. Tap a placed card to send it back.</p>'+
    '<div class="tray" id="otray"></div><div class="board obj" id="oboard"></div>'+
    '<div class="controls"><button class="btn" id="ochk">Check my table</button><button class="btn ghost" id="oshow">Show me</button><button class="btn ghost" id="oreset">Start again</button></div>'+
    '<div class="readout" id="ored">15 cards to place.</div></div>'+
    '<div class="card panel"><h2>Warm-up: make a table</h2>'+
    '<div class="bigq"><span>Your task</span>Arrange the 15 objects in a table so that similar objects are easy to find.</div>'+
    '<ol><li>Put the <b>same kind</b> of object in the <b>same column</b>.</li><li>In each column, go <b>from lightest (top) to heaviest (bottom)</b>.</li><li>Each row is a "size level": row 1 has the lightest object of each kind, row 4 the heaviest.</li><li>One kind has only <b>3</b> objects. Leave a gap where the missing one should go!</li></ol>'+
    '<div id="ogap" class="hidden"><h3>Predict the missing object</h3><p>Look at the gap. Which object belongs there?</p><div class="opts" id="gopts"></div><div id="gfb"></div></div>'+
    '<div class="rule" id="orule"><strong>Our rule</strong>Putting similar things in columns and in order of mass makes a pattern. A gap in the pattern lets us <b>predict</b> a missing object, even its mass! Chemists did the same thing with the elements.</div>'+
    '<div class="controls hidden" id="onext"><button class="btn blue" id="onb">Next: element cards &rarr;</button></div></div></div>';
  var P=new Placer({trayEl:$('otray'),boardEl:$('oboard'),items:shuffle(items).map(function(o){return {id:o.id,html:objCard(o)};}),slots:16,
    onChange:function(){var n=Object.keys(P.place).length;$('ored').className='readout';$('ored').textContent=(15-n)+' card'+(15-n===1?'':'s')+' left to place.';}});
  function rank(o){var fam=OBJECTS.filter(function(x){return x.kind===o.kind;}).sort(function(a,b){return a.mass-b.mass;});return fam.indexOf(o);}
  function O(id){return OBJECTS.filter(function(x){return x.id===id;})[0];}
  function check(){
    var n=Object.keys(P.place).length;
    if(n<15){$('ored').className='readout bad';$('ored').textContent='Place all 15 cards first ('+(15-n)+' left).';return;}
    // each column must hold one kind
    var colKind={},okCols=true;
    for(var c=0;c<4;c++){var kinds={};for(var r=0;r<4;r++){var id=P.place[r*4+c];if(id)kinds[O(id).kind]=1;}var ks=Object.keys(kinds);if(ks.length!==1)okCols=false;colKind[c]=ks.length===1?ks[0]:null;}
    var allRight=true;
    P.mark(function(i,id){var o=O(id);var c=i%4,r=Math.floor(i/4);var ok=colKind[c]===o.kind&&rank(o)===r;if(!ok)allRight=false;return ok;});
    if(allRight){$('ored').className='readout good';$('ored').innerHTML='Great table! Every column is one kind, lightest at the top. Now look at the <b>gap</b>.';showGap();}
    else{$('ored').className='readout bad';$('ored').textContent=okCols?'Each column is one kind. Now check the order: lightest at the top, and is the gap in the right row?':'Red cards are in the wrong place. Is each column only one kind of object?';}
  }
  function gapSlot(){for(var i=0;i<16;i++)if(!P.place[i])return i;return -1;}
  function showGap(){
    $('ogap').classList.remove('hidden');
    var g=gapSlot();var s=$('oboard').querySelector('[data-slot="'+g+'"]');if(s){s.style.borderColor='#8a4fbf';s.style.background='#efe5f8';s.innerHTML='<span style="font-family:Fredoka;font-weight:700;font-size:34px;color:#8a4fbf">?</span>';}
    var o=[['Banana, 120 g',1],['Tennis ball, 58 g',0],['Grape, 5 g',0],['Pumpkin, 5000 g',0]];
    var ord=shuffle([0,1,2,3]);
    $('gopts').innerHTML=ord.map(function(k,n){return '<button class="opt" data-k="'+k+'"><span class="k">'+'ABCD'[n]+'</span><span>'+o[k][0]+'</span></button>';}).join('');
    [].forEach.call($('gopts').children,function(b){b.onclick=function(){
      var k=+b.dataset.k;
      if(o[k][1]){[].forEach.call($('gopts').children,function(x){x.disabled=true;});b.classList.add('right');
        $('gfb').innerHTML='<p><b>Yes!</b> It must be a <b>fruit</b> (same column) heavier than the strawberry (12 g) and lighter than the watermelon (3000 g).</p>';
        var s2=$('oboard').querySelector('[data-slot="'+g+'"]');s2.style.borderColor='';s2.style.background='';s2.innerHTML=objCard(O('banana')).replace('class="ocard"','class="ocard gapfill"');
        $('orule').classList.add('show');$('onext').classList.remove('hidden');sortDone[0]=true;
      } else {b.classList.add('wrong');b.disabled=true;$('gfb').innerHTML='<p>Not quite. Which <b>column</b> is the gap in? And which row: how heavy should it be?</p>';}
    };});
  }
  $('ochk').onclick=check;
  $('oreset').onclick=function(){P.reset();$('ogap').classList.add('hidden');$('orule').classList.remove('show');$('onext').classList.add('hidden');$('ored').className='readout';$('ored').textContent='15 cards to place.';};
  $('oshow').onclick=function(){
    var kinds=['Stationery','Fruit','Ball','Kitchen'];P.reset();
    kinds.forEach(function(k,c){OBJECTS.filter(function(o){return o.kind===k;}).sort(function(a,b){return a.mass-b.mass;}).forEach(function(o,r){if(!o.missing)P.place[r*4+c]=o.id;});});
    P.render();check();
  };
  $('onb').onclick=nextSortStep;
}

function elCard(c,mini){return '<button class="ecard" data-id="'+c.s+'"><div class="sy">'+c.s+'</div><div class="ms">'+c.m+'</div>'+(mini?'':'<div class="nm">'+c.n+'</div><div class="pr">'+c.p+'</div><div class="fm">forms '+c.f+'</div>')+'</button>';}
function sortElements(){
  $('sbody').innerHTML='<div class="grid"><div class="card">'+
    '<h2>14 element cards</h2><p class="note">Each card shows the symbol, the <b style="color:#2b59c3">atomic mass</b> and some properties. Tap a card, then tap a box.</p>'+
    '<div class="tray" id="etray"></div><div class="ptwrap"><div class="board el" id="eboard"></div></div>'+
    '<div class="controls"><button class="btn" id="echk">Check the order</button><button class="btn ghost" id="eshow">Show me</button><button class="btn ghost" id="ereset">Start again</button></div>'+
    '<div class="readout" id="ered">Put the cards in order of increasing atomic mass: box 1 is the lightest.</div></div>'+
    '<div class="card panel"><h2>Do properties repeat?</h2>'+
    '<div class="bigq"><span>Your task</span>Put the 14 elements in order of <b>increasing atomic mass</b>, in rows of 7.</div>'+
    '<div id="eq" class="hidden">'+
    '<div class="bigq"><span>Predict</span>Will similar properties come back if we keep going in order? How often?</div>'+
    '<div class="bigq"><span>Observe</span>Look down each column. Which pairs of elements are alike?<button class="btn ghost" id="eobs" style="margin-top:8px;display:block">Show the columns</button><div class="ans" id="eobsA">Li and Na are both soft, very reactive metals. So are the pairs Be/Mg, B/Al, C/Si, N/P and O/S: look at what they <b>form</b>. Only H and F do not match (red).</div></div>'+
    '<div class="bigq"><span>Explain</span>Count from Li to Na. Which element in the list repeats the properties of Li?<button class="btn ghost" id="eexp" style="margin-top:8px;display:block">Show answer</button><div class="ans" id="eexpA">Na is the <b>8th</b> element counting from Li. Properties repeat every 8th element.</div></div>'+
    '<div class="rule" id="erule"><strong>Our rule</strong>In order of atomic mass, properties <b>repeat in a regular pattern</b>. A pattern that repeats is called <b>periodic</b>.</div>'+
    '<div class="controls hidden" id="enext"><button class="btn blue" id="enb">Next: the law of octaves &rarr;</button></div></div></div></div>';
  var P=new Placer({trayEl:$('etray'),boardEl:$('eboard'),items:shuffle(CARDS14).map(function(c){return {id:c.s,html:elCard(c)};}),slots:14,

  var order=CARDS14.map(function(c){return c.s;});
  function check(){
    var n=Object.keys(P.place).length;

    $('eboard').classList.add('cols');$('eobsA').classList.add('show');};
  $('eexp').onclick=function(){$('eexpA').classList.add('show');$('erule').classList.add('show');$('enext').classList.remove('hidden');sortDone[1]=true;};
  $('enb').onclick=nextSortStep;
}

/* octave with sound */
var AC=null,audioTimers=[];
function tone(f,t){try{if(!AC){var A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A();}
  if(AC.state==='suspended')AC.resume();
  var o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(AC.destination);
  var n=AC.currentTime;g.gain.setValueAtTime(0.0001,n);g.gain.exponentialRampToValueAtTime(0.25,n+0.02);g.gain.exponentialRampToValueAtTime(0.0001,n+(t||0.45));o.start(n);o.stop(n+(t||0.45)+0.05);}catch(e){}}
function stopAudio(){audioTimers.forEach(clearTimeout);audioTimers=[];}
var NOTES=['Do','Re','Mi','Fa','Sol','La','Ti','Do'];
var FREQ=[261.63,293.66,329.63,349.23,392.00,440.00,493.88,523.25];
function octaves(){
  var eight=['Li','Be','B','C','N','O','F','Na'];
  $('sbody').innerHTML='<div class="grid"><div class="card">'+
    '<h2>Do, Re, Mi&hellip; with elements</h2><p class="note">Play the notes. Watch what happens on the 8th note.</p>'+
    '<div class="oct" id="oct">'+eight.map(function(s,i){var c=CARDS14.filter(function(x){return x.s===s;})[0];return '<div class="ec" data-i="'+i+'"><b>'+s+'</b><small>'+c.m+'</small></div>';}).join('')+'</div>'+
    '<div class="keys" id="keys">'+NOTES.map(function(n,i){return '<button class="key" data-i="'+i+'">'+n+'</button>';}).join('')+'</div>'+
    '<div class="controls"><button class="btn amber" id="play">Play the octave</button><button class="btn ghost" id="rows">Show both rows</button></div>'+
    '<div id="orows"></div></div>'+
    '<div class="card panel"><h2>The law of octaves</h2>'+
    '<p>In music, the 8 notes Do Re Mi Fa Sol La Ti <b>Do</b> make an <b>octave</b>: the 8th note sounds like the 1st, only higher.</p>'+
    '<div class="bigq"><span>Think</span>Which element is the "8th note" if lithium is Do? Is it like lithium?<button class="btn ghost" id="oa" style="margin-top:8px;display:block">Show answer</button><div class="ans" id="oaA">Sodium (Na). Like lithium, it is a soft, very reactive metal. The 8th element repeats the properties of the 1st.</div></div>'+
    '<div class="rule" id="orl"><strong>Our rule: the law of octaves (1864)</strong>When elements are arranged by increasing atomic mass, their properties repeat every <b>8th</b> element, like the notes of a musical scale.</div>'+
    '<p class="note hidden" id="olim">The pattern worked for the lightest elements but failed for heavier ones. Next, see how scientists found a better way.</p>'+
    '<div class="controls hidden" id="onx"><button class="btn plum" id="onb2">Next: History on the table &rarr;</button></div></div></div>';
  function lightK(i,on){var k=$('keys').children[i],c=$('oct').children[i];k.classList.toggle('lit',on);c.classList.toggle('lit',on);}
  function play(){
    stopAudio();[].forEach.call($('oct').children,function(c){c.classList.remove('same','lit');});[].forEach.call($('keys').children,function(k){k.classList.remove('same','lit');});
    for(var i=0;i<8;i++)(function(i){
      audioTimers.push(setTimeout(function(){tone(FREQ[i]);lightK(i,true);if(i>0)lightK(i-1,false);},i*600));
    })(i);
    audioTimers.push(setTimeout(function(){lightK(7,false);[0,7].forEach(function(i){$('oct').children[i].classList.add('same');$('keys').children[i].classList.add('same');});
      tone(FREQ[0],0.6);tone(FREQ[7],0.6);},8*600));
  }
  $('play').onclick=play;
  [].forEach.call($('keys').children,function(k){k.onclick=function(){var i=+k.dataset.i;tone(FREQ[i]);lightK(i,true);setTimeout(function(){lightK(i,false);},350);};});
  $('oa').onclick=function(){$('oaA').classList.add('show');$('orl').classList.add('show');$('olim').classList.remove('hidden');$('onx').classList.remove('hidden');sortDone[2]=true;};
  $('rows').onclick=function(){
    var r1=['H','Li','Be','B','C','N','O'],r2=['F','Na','Mg','Al','Si','P','S'];
    function cell(s,i,bad){var c=CARDS14.filter(function(x){return x.s===s;})[0];return '<div class="c'+(bad?' bad':'')+'"><b>'+s+'</b><small>'+c.f+'</small></div>';}
    $('orows').innerHTML='<div class="octrows"><div class="h">1st&ndash;7th</div>'+r1.map(function(s,i){return cell(s,i,i===0);}).join('')+
      '<div class="h">8th&ndash;14th</div>'+r2.map(function(s,i){return cell(s,i,i===0);}).join('')+
      '<div class="note">Each element sits under the one 7 places before it, so it is the <b>8th</b> counting from that element. Li/Na, Be/Mg, B/Al, C/Si, N/P and O/S form compounds with the same pattern. H and F (red) do not fit.</div></div>';
  };
  $('onb2').onclick=nextSortStep;
}

/* ======================= 2. HISTORY ======================= */
var hStep=0;
var GAPS={Sc:{eka:'eka-boron',pm:'44',yr:1879},Ga:{eka:'eka-aluminium',pm:'68',yr:1875},Ge:{eka:'eka-silicon',pm:'72',yr:1886},Tc:{eka:'eka-manganese',pm:'100',yr:1937}};
var NOBLE={He:1895,Ne:1898,Ar:1894,Kr:1898,Xe:1898};
var SWAPS=['Ar','K','Co','Ni','Te','I'];
var hState={found:{},noble:false,strict:false,byZ:false,sel:null};
var HSTEPS=[
  {t:'1869: by atomic mass',c:'#2b59c3'},
  {t:'The gaps get filled',c:'#8a4fbf'},
  {t:'Noble gases added',c:'#8a4fbf'},
  {t:'Problems with the order',c:'#d4486e'},
  {t:'Atomic number & the periodic law',c:'#0f8b8d'}];
function hSetStep(i){
  hStep=i;
  if(i===0){hState={found:{},noble:false,strict:false,byZ:false,sel:null};}
  if(i>=1&&i!==1){['Ga','Sc','Ge','Tc'].forEach(function(s){hState.found[s]=true;});}
  if(i===1){hState.found={};}
  hState.noble=i>=3; hState.strict=false; hState.byZ=i>=4;
  renderHistory();
}
function renderHistory(){
  $('main').innerHTML='<div class="steps" id="hs">'+HSTEPS.map(function(s,i){return '<button class="step'+(i===hStep?' on':'')+'" data-i="'+i+'">'+(i+1)+'. '+s.t+'</button>';}).join('')+'</div>'+
   '<div class="stack"><div class="card"><div class="ptwrap"><div class="hb" id="hb"></div></div><div class="readout" id="hinfo">Tap any box to learn more about it.</div><div class="controls" id="hctl"></div></div>'+
   '<div class="card panel" id="hpanel"></div></div>';
  [].forEach.call($('hs').children,function(b){b.onclick=function(){hSetStep(+b.dataset.i);};});
  buildHB();hPanel();
  window.onresize=layoutHB;
}
var hbCells={};
function visibleHist(){return EL.filter(function(e){return e.Z<=54;});}
function buildHB(){
  var hb=$('hb');hb.innerHTML='';hbCells={};
  var labels=[[1,'alkali metals'],[2,'alkaline earth'],[17,'halogens'],[18,'noble gases']];
  labels.forEach(function(l){var d=h('<div class="colt" data-g="'+l[0]+'">'+l[1]+'</div>');hb.appendChild(d);});
  visibleHist().forEach(function(e){
    var b=h('<button class="hc" data-s="'+e.s+'"><span class="s"></span><span class="v"></span></button>');
    b.onclick=function(){hState.sel=e.s;hInfo(e);[].forEach.call(hb.querySelectorAll('.hc'),function(x){x.classList.toggle('sel',x===b);});};
    hb.appendChild(b);hbCells[e.s]=b;
  });
  layoutHB();
}
function hbSlotOf(e){ // returns element whose position this card takes
  if(!hState.strict)return e;
  var list=visibleHist().slice().sort(function(a,b){return a.mv-b.mv;});
  var idx=list.indexOf(e); return EL[idx];
}
function layoutHB(){
  var hb=$('hb');if(!hb)return;
  var W=hb.clientWidth,gap=4,cw=(W-gap*17)/18,ch=cw*1.08,top=30;
  hb.style.height=(top+5*(ch+gap))+'px';
  [].forEach.call(hb.querySelectorAll('.colt'),function(d){var g=+d.dataset.g;d.style.left=((g-1)*(cw+gap))+'px';d.style.width=cw+'px';d.style.top='0px';
    d.style.opacity=(g===18&&!hState.noble)?0:1;});
  visibleHist().forEach(function(e){
    var b=hbCells[e.s],pos=hbSlotOf(e);
    b.style.left=((pos.col-1)*(cw+gap))+'px';b.style.top=(top+(pos.row-1)*(ch+gap))+'px';b.style.width=cw+'px';b.style.height=ch+'px';
    var gapEl=GAPS[e.s],isNoble=e.s in NOBLE;
    var cls='hc';
    var sTxt=e.s,vTxt=(hState.byZ?'Z = '+e.Z:e.m),yr='';
    if(isNoble){ if(!hState.noble)cls+=' off'; else {cls+=' ng';yr=NOBLE[e.s];} }
    if(gapEl){ if(!hState.found[e.s]){cls+=' gap';sTxt='?';vTxt='&asymp; '+gapEl.pm;} else {cls+=' new';yr=gapEl.yr;} }
    if(hStep===3&&SWAPS.indexOf(e.s)>=0)cls+=hState.strict?' bad':'';
    if(hStep===4&&SWAPS.indexOf(e.s)>=0)cls+=' fix';
    if(hState.sel===e.s)cls+=' sel';
    b.className=cls;
    b.innerHTML='<span class="s">'+sTxt+'</span><span class="v">'+vTxt+'</span>'+(yr&&hStep<4?'<span class="y">'+yr+'</span>':'');
  });
}
function hInfo(e){
  var t;
  if(GAPS[e.s]&&!hState.found[e.s]){var g=GAPS[e.s];t='<b>A gap!</b> Mendeleev left this space empty and called the missing element <b>'+g.eka+'</b>. He predicted its atomic mass would be about <b>'+g.pm+'</b>.';}
  else if((e.s in NOBLE)&&!hState.noble){t='';}
  else{t='<b>'+e.n+' ('+e.s+')</b> &middot; atomic mass '+e.m+(hState.byZ?' &middot; atomic number <b>'+e.Z+'</b>':'');
    if(GAPS[e.s])t+=' &middot; discovered in '+GAPS[e.s].yr+(e.s==='Tc'?' (made in a laboratory)':'')+'. Mendeleev predicted it.';
    if(e.s in NOBLE)t+=' &middot; a noble gas, discovered in '+NOBLE[e.s]+'.';

/* ======================= mini periodic table ======================= */
function ptHTML(opts){
  opts=opts||{};var html='<div class="pt">';
  html+='<div></div>';for(var g=1;g<=18;g++)html+='<div class="gl">'+g+'</div>';
  var cells={};EL.forEach(function(e){cells[e.row+'-'+e.col]=e;});
  for(var r=1;r<=10;r++){
    if(r===8){html+='<div class="sp" style="grid-column:1 / -1"></div>';continue;}
    html+='<div class="pl">'+(r<=7?r:'')+'</div>';
    for(var c=1;c<=18;c++){var e=cells[r+'-'+c];
      if(e)html+='<button class="cell" data-s="'+e.s+'"><span class="z">'+e.Z+'</span><span class="s">'+e.s+'</span></button>';
      else html+='<div></div>';}
  }
  return html+'</div>';
}
function cellsOf(root){var m={};[].forEach.call(root.querySelectorAll('.cell'),function(c){m[c.dataset.s]=c;});return m;}
function stairStep(C){
  var pt=C.H.parentNode; var old=pt.querySelector('.stair'); if(old)old.remove();
  if(!pt.offsetWidth)return;
  var P=pt.getBoundingClientRect();
  function R(s){return C[s].getBoundingClientRect();}
  function X(c){var a=R(EL[17+c].s),b=R(EL[18+c].s);return (a.right+b.left)/2-P.left;}   // between group c and c+1 (row 4)
  var col18=['He','Ne','Ar','Kr','Xe','Rn','Og'];
  function Y(r){if(r>=7)return R('Og').bottom-P.top+1;var a=R(col18[r-1]),b=R(col18[r]);return (a.bottom+b.top)/2-P.top;}
  var pts=[[X(12),Y(2)],[X(13),Y(2)],[X(13),Y(3)],[X(14),Y(3)],[X(14),Y(4)],[X(15),Y(4)],[X(15),Y(5)],[X(16),Y(5)],[X(16),Y(6)]];
  var svg='<svg class="stair" width="'+P.width+'" height="'+P.height+'" style="position:absolute;left:0;top:0;pointer-events:none;overflow:visible" aria-hidden="true"><polyline points="'+pts.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1);}).join(' ')+'" fill="none" stroke="#111" stroke-width="4.5" stroke-linejoin="miter" stroke-linecap="square"/></svg>';
  pt.insertAdjacentHTML('beforeend',svg);
}

var RENDER={
  mcq:function(q,el){
    var ord=shuffle(q.o.map(function(t,k){return k;}));
    el.innerHTML='<div class="opts">'+ord.map(function(k,n){return '<button class="opt" data-k="'+k+'"><span class="k">'+'ABCD'[n]+'</span><span>'+q.o[k]+'</span></button>';}).join('')+'</div>';

      [].forEach.call(el.querySelectorAll('.opt'),function(x){x.disabled=true;if(+x.dataset.k===q.a)x.classList.add('right');});
      if(!ok)b.classList.add('wrong');qDone(ok,q,q.o[q.a]);};});
  },
  tf:function(q,el){
    el.innerHTML='<div class="tf"><button class="opt" data-v="1">True</button><button class="opt" data-v="0">False</button></div>';
    [].forEach.call(el.querySelectorAll('.opt'),function(b){b.onclick=function(){
      var v=b.dataset.v==='1',ok=v===q.a;
      [].forEach.call(el.querySelectorAll('.opt'),function(x){x.disabled=true;if((x.dataset.v==='1')===q.a)x.classList.add('right');});
      if(!ok)b.classList.add('wrong');qDone(ok,q,q.a?'True':'False');};});
  },
  sort:function(q,el){
    var where={},sel=null,locked=false;
    function draw(){
      var pool=q.items.filter(function(it){return !(it[0] in where);});
      el.innerHTML='<div class="pool" id="pool">'+(pool.length?shuffleStable(pool).map(function(it){return '<button class="qchip'+(sel===it[0]?' sel':'')+'" data-c="'+it[0]+'">'+it[0]+'</button>';}).join(''):'<span class="note">All placed. Tap a chip to move it back.</span>')+'</div>'+
        '<div class="buckets" style="margin-top:10px">'+q.b.map(function(b,k){return '<div class="bucket'+(sel?' ready':'')+'" data-b="'+k+'"><h4>'+b+'</h4><div class="in">'+q.items.filter(function(it){return where[it[0]]===k;}).map(function(it){return '<button class="qchip" data-c="'+it[0]+'" data-in="1">'+it[0]+'</button>';}).join('')+'</div></div>';}).join('')+'</div>';
      [].forEach.call(el.querySelectorAll('.qchip'),function(c){c.onclick=function(ev){ev.stopPropagation();if(locked)return;
        if(c.dataset.in){ if(sel){where[sel]=where[c.dataset.c];sel=null;} else delete where[c.dataset.c]; }
        else sel=(sel===c.dataset.c?null:c.dataset.c);draw();};});
      [].forEach.call(el.querySelectorAll('.bucket'),function(b){b.onclick=function(){if(locked||!sel)return;where[sel]=+b.dataset.b;sel=null;draw();};});
      $('qact').innerHTML=locked?$('qact').innerHTML:'<button class="qbtn" id="chk"'+(Object.keys(where).length===q.items.length?'':' disabled')+'>Check</button>';
      if($('chk'))$('chk').onclick=function(){locked=true;var all=true;
        [].forEach.call(el.querySelectorAll('.bucket .qchip'),function(c){var it=q.items.filter(function(x){return x[0]===c.dataset.c;})[0];var ok=where[it[0]]===it[1];if(!ok)all=false;c.classList.add(ok?'right':'wrong');});
        qDone(all,q,q.b.map(function(b,k){return b+': '+q.items.filter(function(it){return it[1]===k;}).map(function(it){return it[0];}).join(', ');}).join(' &middot; '));};
    }
    var order=shuffle(q.items.map(function(it){return it[0];}));
    function shuffleStable(list){return list.slice().sort(function(a,b){return order.indexOf(a[0])-order.indexOf(b[0]);});}
    draw();
  },
  tap:function(q,el){
    el.innerHTML='<div class="readout" style="margin-top:0">Tap your answer on the periodic table above.</div>';

      C[e.s].classList.add(ok?'qright':'qwrong');

      qDone(ok,q,q.ok.length>1?q.ok.join(', '):BY[q.ok[0]].n+' ('+q.ok[0]+')');};});
    Z.tapped=false;
  }

  var code='PL-'+hh.toString(36).toUpperCase().padStart(6,'0').slice(-6);
  var summary='Periodic Table Lab: Exit Ticket (Chemistry Chapter 6)\nName: '+Z.player.name+'\nClass: '+Z.player.cls+'\nScore: '+Z.score+' points\nCorrect: '+correct+'/'+n+'\nTime: '+mins+' min\nDate: '+when+'\nCheck code: '+code;
  var msg=correct>=n-1?'Excellent!':correct>=n*0.7?'Great work!':correct>=n*0.5?'Good effort. Review the parts you missed.':'Go back through the lab, then try again.';
  Z.root.innerHTML='<div class="qcard enter"><div class="meta"><span class="tag skill">Exit ticket complete</span></div>'+
    '<div style="display:flex;gap:24px;flex-wrap:wrap;align-items:end"><div><div class="big">'+Z.score+'</div><div class="best">points</div></div><div><div class="big" style="color:var(--blue)">'+correct+'/'+n+'</div><div class="best">correct</div></div></div><h2>'+msg+'</h2>'+
    '<div class="cert"><div class="row"><b class="nm">'+esc(Z.player.name)+'</b><span>Class '+esc(Z.player.cls)+'</span></div><div class="row"><span>Periodic Table Lab &middot; Exit ticket</span><span>'+when+'</span></div><div class="row"><span><b>'+Z.score+'</b> points &middot; <b>'+correct+'/'+n+'</b> correct &middot; '+mins+' min</span><span>Check code <code>'+code+'</code></span></div></div>'+
    '<div class="actions"><span class="sendst" id="sendst">Sending your result to your teacher&hellip;</span><button class="qbtn ghost hidden" id="retry">Try again</button><button class="qbtn go" id="copy">Copy my result</button></div><span class="note" id="copied"></span>'+
    '<textarea id="sumtxt" readonly aria-label="Result text" style="position:absolute;left:-9999px">'+esc(summary)+'</textarea>'+
    missHTML()+'<div class="actions"><button class="qbtn" id="again">Back to start</button></div></div>';
  $('copy').onclick=function(){var ok=function(){$('copied').textContent='Copied! Paste it in your message to your teacher.';};
    var fb=function(){var t=$('sumtxt');t.style.position='static';t.style.width='100%';t.rows=8;t.focus();t.select();$('copied').textContent='Select the text below and copy it.';};
    try{navigator.clipboard.writeText(summary).then(ok,fb);}catch(e){fb();}};
  var payload={game:'Periodic Table Lab: Exit Ticket',chapter:6,name:Z.player.name,cls:Z.player.cls,score:Z.score,correct:correct,total:n,mins:mins,when:when,code:code,
    missed:Z.results.filter(function(r){return !r.ok;}).map(function(r){return 'Q'+(Z.qs.indexOf(r.q)+1);}).join(' ')};
  var st=$('sendst'),rt=$('retry');
  function send(){st.className='sendst';st.textContent='Sending your result to your teacher…';rt.classList.add('hidden');
    fetch(SCORE_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
      .then(function(){st.className='sendst ok';st.textContent='✓ Your result was sent to your teacher.';})
      .catch(function(){st.className='sendst err';st.textContent='Could not send. Check your internet, then tap Try again.';rt.classList.remove('hidden');});}
  rt.onclick=send; if(SCORE_URL&&!window.__noSend)send(); else st.textContent='';
  $('again').onclick=renderExit;
}

drawTabs();renderSorting();
})();
</script>
