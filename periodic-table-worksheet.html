<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter 6 Worksheet · The Periodic Table</title>
<style>
:root{--paper:#fff;--ink:#111;--soft:#555;--good:#1e8a4c;--goodbg:#e3f5ea;--bad:#d03b3b;--badbg:#fde6e6;--blue:#2b59c3;--line:#c9d4e6;--bg:#eaf0f8;--grid:#dbe4f1}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:"Times New Roman",Times,"Liberation Serif",Georgia,serif;font-size:17px;line-height:1.35;
  background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.sheet{max-width:860px;margin:22px auto;background:var(--paper);box-shadow:0 4px 18px rgba(24,35,58,.14);border-radius:4px;padding:26px 44px 30px}
.logos{display:flex;align-items:center;gap:14px}.logos img{height:46px;width:auto}.logos .cog{margin-left:auto;height:52px}
.hrow{display:flex;justify-content:space-between;gap:14px;font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:15px;margin-top:12px;flex-wrap:wrap}
.hrow label{display:flex;align-items:flex-end;gap:4px;flex:1}
.hrow input{flex:1;font:inherit;font-weight:400;border:0;border-bottom:1.5px solid #333;padding:0 4px;min-width:80px;background:transparent}
.hrow input.date{flex:0 0 150px}
.chap{display:flex;align-items:baseline;gap:28px;margin-top:16px;padding-bottom:6px;border-bottom:4px solid;border-image:linear-gradient(90deg,#111 0%,#111 45%,#ddd 100%) 1}
.chap .n{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:20px;letter-spacing:.12em}
.chap .t{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:28px}
.pageno{font-family:Arial,sans-serif;font-size:13px;color:var(--soft);text-align:right;margin:10px 0 2px}
.cols{column-count:2;column-gap:40px;column-rule:1.5px solid #222;margin-top:10px}
.q{break-inside:avoid;margin:0 0 22px;display:block}
.qt{display:flex;gap:10px;font-size:16.5px}
.qt b{min-width:20px}
.fig{display:block;margin:8px auto 6px}
.opt{display:flex;align-items:center;gap:10px;margin:7px 0 0 28px;cursor:pointer;width:fit-content;max-width:calc(100% - 28px);border-radius:8px;padding:1px 6px 1px 0;background:none;border:0;font:inherit;color:inherit;text-align:left}
.opt .c{flex:none;width:23px;height:23px;border-radius:50%;border:1.6px solid #777;display:grid;place-items:center;font-family:"Times New Roman",serif;font-weight:700;font-size:15px;transition:background .12s}
.opt:hover .c{border-color:#111}
.opt.sel .c{background:#111;color:#fff;border-color:#111}
.opt img{display:block}
.opt:focus-visible{outline:2.5px solid #e8962a;outline-offset:2px}
.q.done .opt{cursor:default}
.opt.right .c{background:var(--good);border-color:var(--good);color:#fff}
.opt.right{background:var(--goodbg)}
.opt.wrong .c{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.wrong{background:var(--badbg)}
.mark{font-family:Arial,sans-serif;font-weight:700;font-size:14px;margin-left:6px}
.mark.ok{color:var(--good)}.mark.no{color:var(--bad)}.mark.na{color:var(--soft);font-weight:400}
.nav{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.msg{flex:1 1 220px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1.5px solid #ddd;margin-top:6px;padding-top:16px;font-family:Arial,Helvetica,sans-serif}
.btn{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:10px;padding:10px 18px;background:#18233a;color:#fff;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.go{background:var(--good)}.btn.ghost{background:#fff;color:#18233a;border:2px solid #c9d4e6}
.msg{font-size:15px;color:var(--soft)}
.score{font-weight:700;font-size:17px}
.score.good{color:var(--good)}
.summary{text-align:center;padding:30px 10px;font-family:Arial,sans-serif}
.summary .big{font-size:54px;font-weight:700;color:#18233a}
.summary table{margin:18px auto;border-collapse:collapse;font-size:15px}
.summary td,.summary th{border:1px solid #999;padding:5px 12px}
@media (max-width:680px){.sheet{margin:0;border-radius:0;padding:18px 16px}.cols{column-count:1}.chap{gap:14px}.chap .t{font-size:22px}.logos img{height:36px}.logos .cog{height:40px}}
@media print{.bar{display:none}body{background:#fff}.sheet{box-shadow:none;margin:0}}
</style></head>

const pages=Math.ceil(Q.length/PER);
let pg=0; const ans={}, checked={};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const dt=document.getElementById('dt'); dt.value=new Date().toLocaleDateString('en-GB');
const nm=document.getElementById('nm'); nm.value=store.get('ws-name')||''; nm.oninput=()=>store.set('ws-name',nm.value);
const body=document.getElementById('body');
function render(){
  if(pg>=pages) return summary();
  const from=pg*PER, to=Math.min(Q.length,from+PER), ks=[...Array(to-from).keys()].map(i=>from+i);
  const nChecked=ks.filter(k=>checked[k]).length, pending=ks.filter(k=>ans[k]!==undefined&&!checked[k]).length, blank=ks.filter(k=>ans[k]===undefined).length;
  let h=`<div class="pageno">Page ${pg+1} of ${pages} · Questions ${from+1}–${to}</div><div class="cols">`;
  for(const k of ks){const q=Q[k], lock=!!checked[k];
    h+=`<div class="q ${lock?'done':''}" data-k="${k}"><div class="qt"><b>${k+1}</b><span>${q.q}</span></div>`;
    if(q.fig) h+=`<img class="fig" src="${FIGS[q.fig]}" style="width:${q.fw}px" alt="">`;
    q.o.forEach((o,n)=>{let cls='opt'; if(ans[k]===n) cls+=' sel';
      if(lock){ if(n===q.a) cls+=' right'; else if(ans[k]===n) cls+=' wrong'; }
      const inner=o.img?`<img src="${FIGS[o.img]}" style="width:${o.w}px" alt="option ${'ABCD'[n]}">`:`<span>${o.t}</span>`;
      h+=`<button class="${cls}" data-k="${k}" data-n="${n}" ${lock?'disabled':''} aria-pressed="${ans[k]===n}"><span class="c">${'ABCD'[n]}</span>${inner}</button>`;});
    if(lock) h+= ans[k]===q.a?'<span class="mark ok">✓ correct</span>':'<span class="mark no">✗ the answer is '+'ABCD'[q.a]+'</span>';
    else if(nChecked && ans[k]===undefined) h+='<span class="mark na">not answered yet</span>';
    h+='</div>';}
  h+='</div>';
  const right=ks.filter(k=>checked[k]&&ans[k]===Q[k].a).length;
  let msg;
  if(pending) msg=blank?`${blank} not answered. Only the questions you answered will be checked.`:'Ready to check!';
  else if(nChecked) msg=blank?`You can still answer the ${blank} question${blank>1?'s':''} left and check again.`:'';
  else msg='Choose your answers, or skip this page.';
  const last=pg+1>=pages;
  const fwd=nChecked?`<button class="btn go" id="next">${last?'See my total →':'Next page →'}</button>`:`<button class="btn ghost" id="next">${last?'Skip to my total →':'Skip page →'}</button>`;
  h+=`<div class="bar">${nChecked?`<span class="score ${right===nChecked?'good':''}">${right} / ${nChecked} correct on this page</span>`:''}${pending||!nChecked?`<button class="btn" id="chk" ${pending?'':'disabled'}>Check my answers</button>`:''}<span class="msg" id="msg">${msg}</span><span class="nav">${pg>0?'<button class="btn ghost" id="back">← Previous page</button>':''}${fwd}</span></div>`;
  body.innerHTML=h;
  body.querySelectorAll('.opt:not([disabled])').forEach(b=>b.onclick=()=>{ans[+b.dataset.k]=+b.dataset.n;
    const y=window.scrollY; render(); window.scrollTo(0,y);});
  const c=document.getElementById('chk'); if(c) c.onclick=()=>{ks.forEach(k=>{if(ans[k]!==undefined)checked[k]=true;}); const y=window.scrollY; render(); window.scrollTo(0,y);};
  const nx=document.getElementById('next'); if(nx) nx.onclick=()=>{pg++; render(); window.scrollTo({top:0,behavior:'smooth'});};
  const bk=document.getElementById('back'); if(bk) bk.onclick=()=>{pg--; render(); window.scrollTo({top:0,behavior:'smooth'});};
}
function summary(){
  let tot=0, att=0, rows='';
  for(let p=0;p<pages;p++){const from=p*PER,to=Math.min(Q.length,from+PER);let r=0,a=0;
    for(let k=from;k<to;k++) if(checked[k]){a++; if(ans[k]===Q[k].a) r++;}
    tot+=r; att+=a; rows+=`<tr><td>Page ${p+1}</td><td>${a?`${r} / ${a}`:'skipped'}</td></tr>`;}
  body.innerHTML=`<div class="summary"><div class="pageno" style="text-align:center">Worksheet complete</div><div class="big">${tot} / ${att}</div><p>correct out of the ${att} question${att===1?'':'s'} you checked${att<Q.length?` (${Q.length} in total)`:''}</p><p>${nm.value?nm.value+' · ':''}${dt.value}</p><table><tr><th>Page</th><th>Correct</th></tr>${rows}</table>
    <div class="bar" style="justify-content:center;border:0"><button class="btn ghost" id="review">← Review the last page</button><button class="btn" id="again">Start again</button></div></div>`;
  document.getElementById('review').onclick=()=>{pg=pages-1;render();window.scrollTo({top:0,behavior:'smooth'});};
  document.getElementById('again').onclick=()=>{for(const k in ans)delete ans[k];for(const k in checked)delete checked[k];pg=0;render();window.scrollTo({top:0,behavior:'smooth'});};
}
render();
</script>
