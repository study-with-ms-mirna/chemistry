<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Atomic Theory Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: title slide as hero (navy atom disc + teal arc with diamond badges), then one part at a time on the cream ground. */
:root{
  --bg:#eaf0f8; --grid:#dbe4f1; --surface:#ffffff; --sand:#fdf0dc; --ink:#18233a; --muted:#5b6780;
  --head:#18233a; --navy:#18233a; --on-navy:#eaf0fb; --teal:#0f8b8d; --tealbg:#dcf2f2;
  --red:#0f8b8d; --red-fill:#2b59c3; --orange:#e8962a; --sand-fill:#c9d4e6;
  --line:#c9d4e6; --good:#23915a; --good-bg:#dcf3e6; --bad:#d14343; --bad-bg:#fbe3e3;
  --btn:#2b59c3; --btn-ink:#FFFFFF; --focus:#e8962a; --bluebg:#e3ebfb; --plum:#8a4fbf;
  color-scheme:light;
  --serif:"Fredoka","Trebuchet MS",sans-serif;
  --sans:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
h1,h2,h3{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.15}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.eyebrow{align-self:flex-start;font-family:var(--serif);font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;color:var(--teal);background:var(--tealbg);border-radius:8px;padding:3px 9px;font-weight:600}

/* HERO */
.hero{display:grid;grid-template-columns:1.05fr 1fr;overflow:hidden}
.hero-left{padding:32px 16px 32px max(16px,5vw);display:flex;flex-direction:column;gap:18px;justify-content:center}
.hero-atom{width:min(230px,52vw)}
.hero h1{color:var(--ink);font-weight:700;font-size:clamp(2rem,4.2vw,2.8rem)}.hero h1 span{color:var(--teal)}
.hero p{margin:0;color:var(--muted);max-width:42ch}
.name-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.name-row label{font-weight:700;font-size:.9rem}
.name-row input,.name-row select{padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);min-width:0;flex:1;max-width:260px;width:auto}.name-row label{font-family:var(--serif);font-weight:600}
.hero-right{background:var(--tealbg);border-left:6px solid var(--teal);border-radius:55% 0 0 55% / 70% 0 0 70%;padding:28px 16px 28px 16%;display:flex;flex-direction:column;justify-content:center;gap:10px}
.nav-item{display:flex;align-items:center;gap:14px;background:none;border:0;padding:6px 8px;border-radius:10px;cursor:pointer;text-align:left;color:var(--ink)}
.nav-item:hover{background:color-mix(in srgb,var(--surface) 35%,transparent)}
.nav-item[aria-current="true"]{background:var(--surface)}
.nav-item:nth-child(1),.nav-item:nth-child(6){margin-left:34px}
.nav-item:nth-child(2),.nav-item:nth-child(5){margin-left:12px}
.diamond{width:30px;height:30px;flex:none;background:var(--red-fill);transform:rotate(45deg);border-radius:4px;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.diamond span{transform:rotate(-45deg);color:#fff;font-weight:700;font-size:.9rem}
.nav-item.done .diamond{background:var(--navy)}
.nav-text{display:flex;flex-direction:column;min-width:0}
.nav-text b{font-family:var(--serif);font-size:1.05rem}
.nav-text small{color:var(--ink);opacity:.8;font-variant-numeric:tabular-nums}

/* STATUS BAR */
.status{font-family:var(--serif);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--on-navy);padding:10px 16px}
.status-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:.95rem}
.track{flex:1;min-width:120px;height:8px;border-radius:99px;background:color-mix(in srgb,var(--on-navy) 20%,transparent);overflow:hidden}
.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4fd3d5,#7fa2ff);transition:width .4s}
.status b{font-variant-numeric:tabular-nums}

/* MAIN */
main{scroll-margin-top:60px;max-width:880px;margin:0 auto;padding:32px 16px 64px}
.part{display:flex;flex-direction:column;gap:20px}
.part-head{display:flex;flex-direction:column;gap:8px}
.part-head h2{color:var(--head);font-size:clamp(1.7rem,3.4vw,2.3rem)}
.part-head p{margin:0;color:var(--muted);max-width:65ch}
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;box-shadow:0 6px 0 #c3cfe3;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.qnum{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.q-text{margin:0;font-weight:700;font-size:1.08rem}
.hint{margin:0;color:var(--muted);font-size:.92rem}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--btn)}
.opt .let{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-family:var(--serif);font-weight:700;background:var(--bluebg);color:var(--btn)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.fb{margin:0;font-size:.97rem}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.fb .why{color:var(--ink);display:block;margin-top:2px}
.fig{display:flex;justify-content:center}
.fig svg{width:130px;height:130px}
.btn{align-self:flex-start;background:var(--btn);color:var(--btn-ink);border:0;border-radius:14px;padding:11px 22px;font-family:var(--serif);font-weight:600;font-size:1.05rem;cursor:pointer;box-shadow:0 4px 0 #1b3a86}.btn.go{background:var(--good);box-shadow:0 4px 0 #166b40}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--muted);border:2px solid var(--line);box-shadow:none}

/* knowledge box (like "Did you know?") */
.know{background:var(--sand);border:2px solid var(--orange);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px}
.know h3{color:var(--orange);font-size:1.25rem}
.know p{margin:0}
.cmp{overflow-x:auto}
.cmp table{border-collapse:collapse;width:100%;min-width:520px;font-size:.96rem}
.cmp th,.cmp td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp thead th{font-family:var(--serif);font-size:1.1rem;color:var(--head)}
.cmp tbody th{font-weight:700;color:var(--muted);width:22%}

/* sort */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;padding:10px;border:1.5px dashed var(--line);border-radius:10px}
.pool.empty::after{content:"All cards placed. Press Check answers.";color:var(--muted);font-size:.92rem}
.chip{padding:8px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;text-align:left;font-size:.95rem;max-width:100%}
.chip.sel{border-color:var(--orange);box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 35%,transparent)}
.chip.ok{border-color:var(--good);background:var(--good-bg)}
.chip.no{border-color:var(--bad);background:var(--bad-bg)}
.chip .fix{display:block;font-size:.85rem;color:var(--bad);font-weight:700}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.bin{border:1.5px solid var(--line);border-radius:12px;background:var(--bg);display:flex;flex-direction:column;min-width:0}
.bin.over{border-color:var(--orange)}
.bin-head{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--navy);color:var(--on-navy);border:0;border-radius:10px 10px 0 0;padding:10px 12px;cursor:pointer;font-family:var(--serif);font-size:1.1rem;font-weight:700;text-align:left}
.bin-add{font-family:var(--sans);font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--orange);opacity:.35}
.placing .bin-add{opacity:1}
.bin-drop{display:flex;flex-direction:column;gap:6px;padding:10px;min-height:70px}

/* match */
.match{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:12px;align-items:center}
.mrow b{font-family:var(--serif);font-size:1.08rem;color:var(--head)}
select{padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);width:100%;min-width:0}
select.ok{border-color:var(--good);background:var(--good-bg)} select.no{border-color:var(--bad);background:var(--bad-bg)}
.corr{grid-column:2;font-size:.88rem;color:var(--bad);margin-top:-6px}

/* order */
.order{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.ocard{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer}
.ocard svg{width:92px;height:92px}
.ocard b{font-family:var(--serif);color:var(--red);font-size:1rem;text-align:center}
.ocard small{color:var(--muted);text-align:center;font-size:.85rem;line-height:1.25}
.ocard .badge{position:absolute;top:8px;left:8px;width:26px;height:26px}
.ocard.ok{border-color:var(--good);background:var(--good-bg)} .ocard.no{border-color:var(--bad);background:var(--bad-bg)}
.ocard .should{font-size:.8rem;color:var(--bad);font-weight:700}

/* particle table */
.ptable{overflow-x:auto}
.ptable table{border-collapse:collapse;width:100%;min-width:560px}
.ptable th,.ptable td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
.ptable thead th{font-family:var(--serif);color:var(--head)}
.pdot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px}

/* model svg */
.m-bg{fill:var(--navy);stroke:var(--orange);stroke-width:3}
.f-orange{fill:#e8962a} .f-sand{fill:#c9d4e6} .f-red{fill:#d14343} .f-navy{fill:#18233a} .f-cream{fill:#eaf0fb}
.ring{fill:none;stroke:#eaf0fb;stroke-width:1.2;stroke-dasharray:3 3;opacity:.7}

/* SIMULATION */
.sim{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.sim-view{background:var(--navy);border:4px solid var(--orange);border-radius:50%;aspect-ratio:1;max-width:100%;overflow:hidden}
.sim-view svg{width:100%;height:100%;display:block}
.sim-ctrl{display:flex;flex-direction:column;gap:12px}
.crow{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:10px;align-items:center}
.crow .lbl{font-weight:700}
.crow .cnt{font-family:var(--serif);font-size:1.5rem;font-weight:700;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.pm{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:1.3rem;font-weight:700;cursor:pointer;line-height:1}
.pm:hover{border-color:var(--orange)}
.readout{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.readout div{background:var(--bg);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;min-width:0}
.readout small{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}
.readout b{font-family:var(--serif);font-size:1.2rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;align-self:flex-start}
.seg button{border:0;background:var(--bg);padding:8px 14px;cursor:pointer;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.challenge{border:2px solid var(--orange);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.challenge .ctitle{font-weight:700;color:var(--red);letter-spacing:.14em;text-transform:uppercase;font-size:.8rem}
.challenge p{margin:0}
.crow-btns{display:flex;gap:10px;flex-wrap:wrap}
@media (prefers-reduced-motion: reduce){.track i{transition:none}}
.levels{display:flex;gap:8px;flex-wrap:wrap}
.lv{font-size:.88rem;font-weight:700;padding:4px 10px;border-radius:99px;border:1.5px solid var(--line);background:var(--bg);font-variant-numeric:tabular-nums}
.lv.full{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}

/* results */
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 60px;gap:12px;align-items:center}
.bar .t{height:14px;border-radius:99px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.bar .t i{display:block;height:100%;background:var(--teal)}
.bar b{font-variant-numeric:tabular-nums;text-align:right}
.big{font-family:var(--serif);font-weight:700;font-size:3.4rem;color:var(--teal);line-height:1}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:8px}

@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .hero-left{align-items:center;text-align:center}
  .hero p{margin-inline:auto}
  .name-row{justify-content:center}
  .hero-right{border-left:0;border-top:6px solid var(--teal);border-radius:50% 50% 0 0 / 38px 38px 0 0;padding:30px 16px 20px}
  .nav-item:nth-child(n){margin-left:0}
  .sim{grid-template-columns:1fr}
  .sim-view{width:min(340px,100%);margin:0 auto}
  .mrow{grid-template-columns:1fr}
  .corr{grid-column:1}
  .bar{grid-template-columns:1fr 60px}
  .bar .t{grid-column:1/-1;grid-row:2}
}
</style>

<header class="hero">
  <div class="hero-left">
    <svg class="hero-atom" viewBox="-100 -100 200 200" role="img" aria-label="Atom drawing">
      <circle r="98" fill="var(--navy)"/>
      <g fill="none" stroke="#eaf0fb" stroke-width="2">
        <ellipse rx="78" ry="27"/><ellipse rx="78" ry="27" transform="rotate(60)"/><ellipse rx="78" ry="27" transform="rotate(120)"/>
      </g>
      <g fill="var(--navy)" stroke="#eaf0fb" stroke-width="2">
        <circle cx="78" cy="0" r="6"/><circle cx="-39" cy="-67.5" r="6"/><circle cx="-39" cy="67.5" r="6"/>
        <circle cx="-78" cy="0" r="6"/><circle cx="39" cy="67.5" r="6"/><circle cx="39" cy="-67.5" r="6"/>
        <circle cx="-6" cy="-6" r="7"/><circle cx="6" cy="-6" r="7"/><circle cx="-6" cy="6" r="7"/><circle cx="6" cy="6" r="7"/><circle cx="0" cy="-12" r="7"/><circle cx="0" cy="12" r="7"/>
      </g>
    </svg>
    <span class="eyebrow">Chemistry · End-of-topic assessment</span>
    <h1>Development of <span>Atomic Theory</span></h1>
    <p>Five parts, from early ideas about matter to building the modern atom yourself. Write your name and class, then press Start. Questions come one at a time.</p>
    <div class="name-row"><label for="sname">Your name</label><input id="sname" type="text" autocomplete="name" placeholder="Type your full name"></div>
    <div class="name-row"><label for="sclass">Class</label><input id="sclass" type="text" maxlength="20" placeholder="e.g. 9-A"></div>
    <div class="name-row"><button class="btn" id="startB" type="button">Start assessment →</button></div>
    <p class="fb" id="startFb" aria-live="polite"></p>
  </div>
  <nav class="hero-right" id="nav" aria-label="Assessment parts"></nav>
</header>

<div class="status" role="status" id="status" hidden>
  <div class="status-in">
    <span>Score <b id="sc">0</b> / <b id="scmax">0</b></span>
    <div class="track" aria-hidden="true"><i id="bar"></i></div>
    <span><b id="done">0</b> of <b id="total">0</b> marks answered</span>
  </div>
</div>

<main id="main" hidden></main>

<script>
(function(){
"use strict";
// Google Apps Script web-app URL: results go to the same Quest Results sheet.
const SCORE_URL='https://script.google.com/macros/s/AKfycbxqxWcG4jS6gWBLKroZBscjhfJEBmSRwIjZ4OtamJe55XvdfLjX0Jj9j2xgfPAr0Mbu6g/exec';
let T0=Date.now();
const h=(tag,attrs,...kids)=>{const e=document.createElement(tag);for(const [k,v] of Object.entries(attrs||{})){if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k==="html")e.innerHTML=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?"":v);}for(const k of kids.flat()){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(k));}return e;};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(a,seed){const r=rng(seed),b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
const L="ABCDEFG";

/* ---------- model pictures ---------- */
const MODELS={
  dalton:{name:"Solid ball",desc:"Atoms are tiny solid spheres",svg:'<circle r="26" class="f-orange"/><circle cx="-9" cy="-9" r="7" class="f-sand" opacity=".85"/>'},
  thomson:{name:"Plum pudding",desc:"Electrons in a positive dough",svg:'<circle r="31" class="f-sand"/>'+[[-12,-15],[10,-17],[-19,3],[3,-2],[17,7],[-6,17],[11,20]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.4" class="f-navy"/>`).join("")},
  rutherford:{name:"Nuclear atom",desc:"Tiny nucleus, mostly empty space",svg:'<circle r="4.5" class="f-red"/>'+[[-27,-19],[24,-27],[31,15],[-19,27]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" class="f-orange"/>`).join("")},
  bohr:{name:"Energy levels",desc:"Electrons in fixed shells",svg:'<circle r="17" class="ring"/><circle r="32" class="ring"/><circle r="5" class="f-red"/>'+[[0,-17],[0,17],[32,0],[-22.6,22.6]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" class="f-orange"/>`).join("")},
  chadwick:{name:"Protons + neutrons",desc:"Nucleus with two kinds of particle",svg:'<circle r="25" class="ring"/><circle r="38" class="ring"/>'+[[-4,-5,"f-red"],[5,-4,"f-cream"],[-6,4,"f-cream"],[5,5,"f-red"],[0,0,"f-red"]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4.6" class="${p[2]}"/>`).join("")+[[25,0],[-25,0],[0,-38],[27,27]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.6" class="f-orange"/>`).join("")}
};
const modelSVG=(k,label)=>`<svg viewBox="-50 -50 100 100" role="img" aria-label="${label||MODELS[k].name+" model"}"><circle r="47" class="m-bg"/>${MODELS[k].svg}</svg>`;

/* ---------- content ---------- */
const PARTS=[
{ key:"Hypothesis or theory", title:"Hypothesis or Theory?",
  intro:"Scientists use both words, but they do not mean the same thing. Read the box, then show you can tell them apart.",
  blocks:[
   {type:"know",title:"Know the difference",html:`
    <div class="cmp"><table>
     <thead><tr><th></th><th>Hypothesis</th><th>Theory</th></tr></thead>
     <tbody>
      <tr><th>What it is</th><td>A proposed, testable explanation or prediction</td><td>A well-tested explanation supported by a lot of evidence</td></tr>
      <tr><th>Based on</th><td>A few observations or a question</td><td>Many experiments, repeated by many scientists</td></tr>
      <tr><th>Scope</th><td>Usually one situation or experiment</td><td>Explains a wide range of observations</td></tr>
      <tr><th>How it looks</th><td>Often an “If … then …” statement</td><td>A set of connected ideas, like Dalton’s atomic theory</td></tr>
      <tr><th>Can it change?</th><td>Yes. It is tested, then supported or rejected</td><td>Yes. It is revised when new evidence disagrees with it</td></tr>
     </tbody></table></div>
    <p><b>Watch out:</b> in everyday talk, “theory” means a guess. In science, a theory is the opposite of a guess. It is our best explanation, backed by evidence. That is why the atomic model changed each time new evidence appeared.</p>`},
   {type:"sort",prompt:"Sort each statement: does it describe a hypothesis or a theory?",bins:["Hypothesis","Theory"],items:[
     {t:"If the positive charge in an atom is spread out, alpha particles will pass straight through gold foil.",b:0},
     {t:"A proposed explanation that has not been tested yet.",b:0},
     {t:"Can be checked with an experiment, then supported or rejected.",b:0},
     {t:"Supported by the results of many experiments by many scientists.",b:1},

        for(let j=0;j<m;j++){const a=j/m*2*Math.PI-Math.PI/2+k*.4;g+=`<circle cx="${(R*Math.cos(a)).toFixed(1)}" cy="${(R*Math.sin(a)).toFixed(1)}" r="7" fill="#e8962a" stroke="#fff" stroke-width="1.2"/>`;}
        outer+=g+"</g>";});}
    else{const r=rng(S.e*97+3);const reach=S.e<=2?80:S.e<=10?115:145;for(let i=0;i<S.e*45;i++){const u=Math.sqrt(r()),rr=24+u*(reach-24)*(0.55+0.45*r()),a=r()*Math.PI*2;
        outer+=`<circle cx="${(rr*Math.cos(a)).toFixed(1)}" cy="${(rr*Math.sin(a)).toFixed(1)}" r="1.8" fill="#e8962a" opacity=".45"/>`;}}
    let rest=S.e;rd.lv.innerHTML="";cap.forEach((c,k)=>{const m=Math.min(rest,c);rest-=m;rd.lv.append(h("span",{class:"lv"+(m===c?" full":"")},`Level ${k+1}: ${m}/${c}`+(m===c?" full":"")));});
    view.innerHTML=`<svg viewBox="-160 -160 320 320" role="img" aria-label="Atom with ${S.p} protons, ${S.n} neutrons and ${S.e} electrons">${outer}${nuc}</svg>`;
  }
  // orbit animation: rotate each energy level around the nucleus at (0,0)
  let ang=0,last=null;const still=matchMedia("(prefers-reduced-motion: reduce)");
  function tick(t){if(last!==null&&!still.matches)ang+=(t-last)/1000;last=t;
    view.querySelectorAll(".orbit").forEach(g=>g.setAttribute("transform",`rotate(${(ang*360/+g.dataset.s)%360})`));
    requestAnimationFrame(tick);}
  requestAnimationFrame(tick);
  draw();
  card.append(h("div",{class:"sim"},view,ctrl),h("p",{class:"hint"},"Note: the energy-level view comes from Bohr’s model. Scientists today picture electrons as a cloud around the nucleus, with the nucleus very much smaller than shown here."));

}

/* ---------- build slides: one item at a time ---------- */
const sections=[];const slideInfo=[];
PARTS.forEach((p,pi)=>{
  p.blocks.forEach((b,bi)=>{const id=`${pi}_${bi}`,seed=(pi+1)*100+bi*7+3;
    const sec=h("section",{class:"part",hidden:true},
      h("div",{class:"part-head"},h("span",{class:"eyebrow"},`Part ${pi+1} of ${PARTS.length}`),h("h2",{},p.title),bi===0?h("p",{},p.intro):null));
    let need=[id];
    if(b.type==="know"){need=[];sec.append(h("div",{class:"know"},h("h3",{},b.title),h("div",{html:b.html,style:"display:flex;flex-direction:column;gap:12px"})));}
    else if(b.type==="mcq")sec.append(renderMCQ(pi,b,id));
    else if(b.type==="sort")sec.append(renderSort(pi,b,id,seed));
    else if(b.type==="match")sec.append(renderMatch(pi,b,id,seed));
    else if(b.type==="order")sec.append(renderOrder(pi,b,id,seed));
    else if(b.type==="table")sec.append(renderTable(pi,b,id));
    else if(b.type==="sim"){need=CHALLENGES.map((_,k)=>id+"_c"+k);sec.append(renderSim(pi,id));}
    const k=sections.length;
    const nextB=h("button",{class:"btn",type:"button",disabled:need.length>0,onclick:()=>show(k+1)},"Next question →");
    sec.append(h("div",{class:"pager"},h("span",{class:"hint"},need.length?"Answer to continue.":""),nextB));
    main.append(sec);sections.push(sec);slideInfo.push({pi,need,nextB});});});
slideInfo[slideInfo.length-1].nextB.textContent="See my results →";

// results
const resSec=h("section",{class:"part",id:"results",hidden:true});
const bigEl=h("span",{class:"big"}),msgEl=h("p",{style:"margin:0"}),barsEl=h("div",{class:"bars"}),nameEl=h("span");
const sendB=h("button",{class:"btn",type:"button"},"Send to my teacher");
const copyB=h("button",{class:"btn go",type:"button"},"Copy my results");const copyFb=h("p",{class:"fb","aria-live":"polite"});
const copyTxt=h("textarea",{id:"copytxt",readonly:true,rows:"8",hidden:true,style:"width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg)"});
resSec.append(h("div",{class:"part-head"},h("span",{class:"eyebrow"},"Results"),h("h2",{},"Your results"),h("p",{},"You have finished the assessment. Send your score to your teacher below.")),
  h("div",{class:"card"},h("div",{style:"display:flex;align-items:baseline;gap:14px;flex-wrap:wrap"},bigEl,nameEl),msgEl,barsEl),
  h("div",{class:"know"},h("h3",{},"Think about it"),h("p",{},"Every model on the timeline replaced the one before because of new evidence. Choose one change (for example, plum pudding to nuclear atom) and explain in your own words what evidence caused it and why that makes atomic theory a theory, not a hypothesis.")),
  h("div",{class:"card"},h("p",{class:"q-text"},"Send your score to your teacher"),h("p",{class:"hint"},"Click Send once. You can also copy the summary."),h("div",{style:"display:flex;gap:10px;flex-wrap:wrap"},SCORE_URL?sendB:null,copyB),copyTxt,copyFb));
main.append(resSec);sections.push(resSec);

function summary(){const nm=document.getElementById("sname").value.trim()||"(no name)";const cl=document.getElementById("sclass").value.trim();let t=`Atomic Theory Assessment\nName: ${nm}\n`+(cl?`Class: ${cl}\n`:"");
  PARTS.forEach((p,i)=>{t+=`Part ${i+1} ${p.key}: ${partScore(i).g}/${partMax[i]}\n`;});
  const g=PARTS.reduce((a,_,i)=>a+partScore(i).g,0);return t+`Total: ${g}/${TOTAL} (${Math.round(g/TOTAL*100)}%)`;}
sendB.addEventListener("click",()=>{
  const nm=document.getElementById("sname").value.trim(), cl=document.getElementById("sclass").value.trim();
  if(nm.length<2){copyFb.className="fb no";copyFb.textContent="Name is missing.";return;}
  const g=PARTS.reduce((a,_,i)=>a+partScore(i).g,0), d=Object.values(marks).reduce((a,m)=>a+m.max,0);
  const now=new Date(), when=now.toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
  const hsh=[...(nm+"|"+cl+"|"+g+"|"+now.toISOString().slice(0,16))].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
  const code="AT-"+hsh.toString(36).toUpperCase().padStart(6,"0").slice(-6);
  const payload={game:"Atomic Theory Assessment",chapter:"",name:nm,cls:cl,score:g,correct:g,total:TOTAL,mins:Math.max(1,Math.round((Date.now()-T0)/60000)),when,code,
    missed:PARTS.map((p,i)=>"P"+(i+1)+" "+partScore(i).g+"/"+partMax[i]).join(", ")+(d<TOTAL?" (unfinished: "+d+"/"+TOTAL+" answered)":"")};
  sendB.disabled=true;sendB.textContent="Sending…";
  fetch(SCORE_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)})
    .then(()=>{sendB.textContent="Sent ✓";copyFb.className="fb ok";copyFb.textContent="Your result was sent to your teacher. Check code "+code;})
    .catch(()=>{sendB.disabled=false;sendB.textContent="Send to my teacher";copyFb.className="fb no";copyFb.textContent="Could not send. Check your internet and try again.";});
});
copyB.addEventListener("click",()=>{const t=summary();copyTxt.value=t;
  const fail=()=>{copyTxt.hidden=false;copyTxt.focus();copyTxt.select();copyFb.className="fb";copyFb.textContent="Select the text above and copy it.";};
  try{navigator.clipboard.writeText(t).then(()=>{copyFb.className="fb ok";copyFb.textContent="Copied. Paste it where your teacher asks.";},fail);}catch(e){fail();}});

function update(){
  slideInfo.forEach(si=>{if(si.need.every(x=>marks[x])){si.nextB.disabled=false;const hn=si.nextB.previousSibling;if(hn)hn.textContent="";}});
  let g=0,d=0;for(const m of Object.values(marks)){g+=m.got;d+=m.max;}
  document.getElementById("sc").textContent=g;document.getElementById("scmax").textContent=TOTAL;
  document.getElementById("done").textContent=d;document.getElementById("total").textContent=TOTAL;
  document.getElementById("bar").style.width=(d/TOTAL*100)+"%";
  PARTS.forEach((p,i)=>{const s=partScore(i);navItems[i].querySelector("small").textContent=`${s.g} / ${partMax[i]}`+(s.d===partMax[i]?" · done":"");navItems[i].classList.toggle("done",s.d===partMax[i]);});
  const pct=Math.round(g/TOTAL*100);bigEl.textContent=`${g} / ${TOTAL}`;
  nameEl.textContent=`${pct}%`+(document.getElementById("sname").value.trim()?` · ${document.getElementById("sname").value.trim()}`:"");
  msgEl.textContent=d<TOTAL?`You have answered ${d} of ${TOTAL} marks so far.`:pct>=90?"Excellent. You can explain how and why the model of the atom changed.":pct>=70?"Good work. Review the parts with the lowest scores.":pct>=50?"A fair start. Go over the five discoveries and the particle table again.":"Review the lessons with your teacher, then try again.";
  barsEl.innerHTML="";PARTS.forEach((p,i)=>{const s=partScore(i);barsEl.append(h("div",{class:"bar"},h("span",{},`Part ${i+1}: ${p.key}`),h("span",{class:"t"},h("i",{style:`width:${s.g/partMax[i]*100}%`})),h("b",{},`${s.g}/${partMax[i]}`)));});
}
document.getElementById("sname").addEventListener("input",update);

let cur=0;
function show(i){cur=Math.max(0,Math.min(sections.length-1,i));sections.forEach((s,k)=>s.hidden=k!==cur);
  window.scrollTo({top:0,behavior:"auto"});}
document.getElementById("startB").addEventListener("click",()=>{
  const nm=document.getElementById("sname").value.trim(),cl=document.getElementById("sclass").value.trim(),fb=document.getElementById("startFb");
  if(nm.length<2||!cl){fb.className="fb no";fb.textContent="Write your full name and your class first.";return;}
  T0=Date.now();document.querySelector("header.hero").hidden=true;document.getElementById("status").hidden=false;main.hidden=false;show(0);});
update();
})();
