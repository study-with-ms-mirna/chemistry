<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Reactions and Equations Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#eaf0f8;--grid:#dbe4f1;--ink:#18233a;--muted:#5a6780;--line:#c9d4e6;--shadow:#c3cfe3;--accent:#0f8b8d}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.4}
.wrap{max-width:1260px;margin:0 auto;padding:18px 20px 90px}
header{display:flex;align-items:center;gap:14px;margin-bottom:16px}
header svg{flex:none}
h1{font-family:Fredoka,sans-serif;font-weight:600;font-size:32px;margin:0;line-height:1.1}
.sub{color:var(--muted);font-size:16px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
.tab{font-family:Fredoka,sans-serif;font-weight:500;font-size:15.5px;padding:8px 12px;border-radius:16px;border:2px solid var(--line);background:#fff;box-shadow:0 4px 0 var(--shadow);cursor:pointer;display:flex;align-items:center;gap:8px}
.tab i{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-block}
.tab.on{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 4px 0 rgba(24,35,58,.22)}
.tab.on i{background:#fff}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.step{font-family:Fredoka,sans-serif;font-size:16px;padding:6px 14px 6px 7px;border-radius:999px;border:2px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;gap:8px}
.step b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--line);font-weight:600;font-size:14px}
.step.on{border-color:var(--accent);color:var(--accent)}
.step.on b{background:var(--accent);color:#fff}
.step.done b{background:#2e9e5b;color:#fff}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:960px){.main{grid-template-columns:1fr}}
.card{background:#fff;border:2px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--shadow);padding:16px}
.stage h2{font-family:Fredoka,sans-serif;font-weight:600;font-size:22px;margin:0 0 10px;color:var(--accent)}
canvas{width:100%;height:auto;display:block;border-radius:14px;background:#f6f8fc}
.controls{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;margin-top:14px}
.controls:empty{display:none}
.ctl{display:flex;align-items:center;gap:10px;font-family:Fredoka,sans-serif;font-size:16px}
.ctl output{min-width:84px;font-weight:600;color:var(--accent)}
.btn{font-family:Fredoka,sans-serif;font-weight:500;font-size:16px;padding:9px 16px;border-radius:14px;border:2px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer;box-shadow:0 3px 0 var(--shadow)}
.btn.fill,.btn.sel{background:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
input[type=range]{-webkit-appearance:none;appearance:none;width:260px;max-width:60vw;height:10px;border-radius:999px;background:#dfe6f2;outline:none;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;background:var(--accent);border:4px solid #fff;box-shadow:0 0 0 2px var(--accent),0 2px 3px rgba(0,0,0,.25);cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:4px solid #fff;box-shadow:0 0 0 2px var(--accent);cursor:pointer}
.side{display:flex;flex-direction:column;gap:14px}
.lbl{font-family:Fredoka,sans-serif;font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.q{font-size:19px;font-weight:700}
.rule{border:3px dashed #d8434a;border-radius:18px;padding:12px 14px;background:#fff}
.rule .lbl{color:#d8434a}
.rule ul{margin:0;padding-left:20px}
.rule li{margin:4px 0}
.reads{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rd{background:#f3f6fb;border-radius:14px;padding:8px 10px}

.rd b{font-family:Fredoka,sans-serif;font-weight:600;font-size:19px}
.rd.wide{grid-column:1/-1}
sub{font-size:.65em}
#panel:empty{display:none}
#panel{margin-top:12px}
.small{font-size:14px;color:var(--muted)}
.task{font-size:18px;background:#f3f6fb;border-radius:14px;padding:10px 14px;margin-bottom:10px}
.stepbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.stepdots{display:flex;gap:6px}
.stepdots i{width:11px;height:11px;border-radius:50%;background:var(--line);display:block}
.stepdots i.on{background:var(--accent)}
.modebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.seg button{border:none;background:#fff;padding:8px 16px;font-size:16px;cursor:pointer;color:var(--ink);font-family:Fredoka,sans-serif;font-weight:500}
.seg button.on{background:var(--accent);color:#fff}
.st{border:2px solid var(--line);border-radius:16px;padding:10px 14px;background:#fff;margin-top:10px;animation:fadein .4s ease}
.st.cur{border-color:var(--accent)}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.9);opacity:0}60%{transform:scale(1.03);opacity:1}100%{transform:none;opacity:1}}
.sh{display:flex;align-items:center;gap:8px;font-family:Fredoka,sans-serif;font-weight:600;font-size:18px}
.sh .n{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px;flex:none}
.ln{font-size:18px;margin-top:6px;line-height:1.65}
.ansb{font-family:Fredoka,sans-serif;font-weight:600;border:2px solid var(--accent);border-radius:8px;padding:0 8px;color:var(--accent);white-space:nowrap}

.f{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-family:Fredoka,sans-serif;font-size:19px;margin:9px 0}

.f input.ke{width:60px;font-size:16px;padding:3px}
.f input:focus{outline:none;border-color:var(--accent)}
.f input.ok{border-color:#2e9e5b;background:#e8f6ee}.f input.no{border-color:#d8434a;background:#fdeeee}

.f sup{font-size:.75em;vertical-align:.6em}
.fb{margin-top:12px;border-radius:14px;padding:10px 14px;font-size:17px;border:2px solid}
.fb.ok{background:#e8f6ee;border-color:#2e9e5b;animation:pop .4s}.fb.no{background:#fdeeee;border-color:#d8434a}
.fb ul{margin:4px 0 0;padding-left:20px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}

.qb:disabled{cursor:default}
.qb .L{flex:none;width:27px;height:27px;border-radius:50%;background:#eef2f8;display:grid;place-items:center;font-family:Fredoka,sans-serif;font-weight:600;font-size:15px}
.qb>span:last-child{min-width:0;overflow-wrap:anywhere}
.qb.right{border-color:#2e9e5b;background:#e8f6ee}.qb.right .L{background:#2e9e5b;color:#fff}
.qb.wrong{border-color:#d8434a;background:#fdeeee}.qb.wrong .L{background:#d8434a;color:#fff}

.mq>b{font-size:18px}
.note{margin-top:8px;font-size:16.5px}

.dt{width:100%;border-collapse:separate;border-spacing:0;margin:6px 0;font-family:Fredoka,sans-serif;font-size:17px;text-align:center;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.dt th{background:var(--accent);color:#fff;font-weight:600;padding:7px 6px;font-size:15px}
.dt td{padding:7px 6px;border-top:1px solid #e3e9f2;background:#fff}
.bigrule{margin-top:12px;border:3px dashed #d8434a;border-radius:18px;padding:10px 14px;font-size:18px;text-align:center}
.eqrow{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:10px 0;font-family:Fredoka,sans-serif;font-size:21px}

.sp{font-family:Fredoka,sans-serif;font-size:21px;font-weight:500;padding:4px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;box-shadow:0 2px 0 var(--shadow);color:var(--ink)}

.kdone{border:2px solid #2e9e5b;background:#f3fbf6;border-radius:12px;padding:6px 12px;margin-top:8px;font-size:16px}
.qz{border:2px solid var(--line);border-radius:18px;padding:14px;background:#fff}
.qzh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-family:Fredoka,sans-serif;font-size:18px}
.qzdots{display:flex;gap:6px;flex-wrap:wrap}
.qzdots i{width:13px;height:13px;border-radius:50%;background:var(--line);display:block}
.qzdots i.cur{background:var(--accent)}.qzdots i.ok{background:#2e9e5b}.qzdots i.no{background:#d8434a}
.qzq{font-size:21px;font-weight:700;margin:12px 0 10px;line-height:1.4}
.qzend{text-align:center}
.qzend .qzdots{justify-content:center;margin:10px 0}
.qzend .stepbar{justify-content:center}
.qzbig{font-family:Fredoka,sans-serif;font-weight:700;font-size:48px;color:var(--accent);line-height:1.1;margin:6px 0}
.big{font-family:Fredoka,sans-serif;font-weight:600;font-size:28px;line-height:1.15;margin:4px 0 6px}
.qzrev{text-align:left;margin-top:12px;display:flex;flex-direction:column;gap:6px}
.qzrev div{border:2px solid var(--line);border-radius:12px;padding:6px 10px;font-size:15px}
.qzrev div.ok{border-color:#2e9e5b;background:#f3fbf6}.qzrev div.no{border-color:#d8434a;background:#fdf4f4}
.namerow{display:flex;flex-direction:column;gap:4px;margin:10px 0;max-width:380px}
.namerow label{font-family:Fredoka,sans-serif;font-weight:600}
.namerow input,.namerow select{font:inherit;font-size:18px;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none}
.namerow .no{border-color:#d8434a}
.exerr{color:#d8434a;font-weight:700;min-height:22px;margin:4px 0}
.sendst{font-family:Fredoka,sans-serif;font-size:15px;color:var(--muted)}.sendst.ok{color:#2e9e5b;font-weight:600}.sendst.err{color:#d8434a;font-weight:600}
#tools{position:fixed;right:14px;bottom:14px;z-index:9998;display:flex;gap:8px}
.tb{height:44px;min-width:44px;border-radius:999px;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:0 12px;box-shadow:0 4px 0 var(--shadow);font-family:Fredoka,sans-serif;font-size:15px}
.tb.on{background:#eef3fc;border-color:#2b59c3}
#conf{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:9999;background:transparent;border-radius:0}
.mqz{margin-top:10px}.mqq{font-size:18px;margin:0 0 6px}
.note{margin-top:8px}.btn.tiny{padding:5px 9px;font-size:14px;min-width:40px}
.bchip{display:inline-block;color:#fff;border-radius:7px;padding:1px 9px;font-weight:600}
#cv{touch-action:pan-y}
#xChip{position:fixed;right:14px;top:14px;z-index:9996;display:none;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;box-shadow:0 4px 0 var(--shadow);font-family:Fredoka,sans-serif;max-width:calc(100vw - 28px);flex-wrap:wrap}
#xChip span{font-size:13px;color:var(--muted)}#xChip b{font-size:20px;font-weight:600;color:#2b59c3}
#xChip.warn{border-color:#e8962a}#xChip.warn b{color:#e8962a}
#xChip.over{border-color:#d8434a}#xChip.over b{color:#d8434a}
#xChip .btn{padding:4px 10px;font-size:14px}
.dt{border-collapse:collapse;width:100%;font-size:16px;margin-top:4px}
.dt th{background:var(--accent);color:#fff;font-family:Fredoka,sans-serif;font-weight:500;padding:6px 8px;text-align:center}
.dt td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:center}
.dt tr:nth-child(odd) td{background:#f6f8fc}
select.pick{font-family:Fredoka,sans-serif;font-size:16px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none;cursor:pointer}
.calc .cdisp{background:#1d2a3a;color:#e9f3ff;border-radius:12px;padding:8px 12px;text-align:right;font-family:Fredoka,sans-serif;margin-bottom:10px;min-height:64px}
.calc #cExp{font-size:14px;opacity:.8;word-break:break-all;min-height:18px}
.calc #cOut{font-size:26px;font-weight:600}
.ckeys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ck{font-family:Fredoka,sans-serif;font-size:16px;padding:9px 0;border-radius:10px;border:2px solid var(--line);background:#f3f6fb;color:var(--ink);cursor:pointer}
.ck.num{background:#fff}
.ck.fn{background:#e8962a;border-color:#e8962a;color:#fff;font-weight:600}
.ck.eq{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.ck:active{transform:translateY(2px)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 4px;line-height:1.25}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 4px}
.lvl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.btn.chip{font-size:14px;padding:6px 11px}
.btn.hold{font-size:18px;padding:11px 22px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
.btn.hold.down{transform:translateY(3px);box-shadow:0 0 0 var(--shadow);background:#d8434a;border-color:#d8434a}
</style>
</head>

<script>
(function(){
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=800,H=500;
function fit(){var d=window.devicePixelRatio||1;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);}fit();window.addEventListener('resize',fit);
function $(id){return document.getElementById(id);}
function each(sel,fn){Array.prototype.forEach.call(document.querySelectorAll(sel),fn);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}
function ease(x){x=clamp(x,0,1);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var INK='#18233a',MUTED='#5a6780',LINE='#c9d4e6',TEAL='#0f8b8d',CORAL='#e2708a',AMBER='#e8962a',BLUE='#2b59c3',PLUM='#8a4fbf',RED='#d8434a',GREEN='#2e9e5b',ORANGE='#e67e22';
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function txt(s,x,y,o){o=o||{};ctx.font=(o.w||600)+' '+(o.s||15)+'px Fredoka, sans-serif';ctx.fillStyle=o.c||INK;ctx.textAlign=o.a||'center';ctx.textBaseline='middle';ctx.fillText(s,x,y);return ctx.measureText(s).width;}
function tw(t,size){ctx.font='600 '+size+'px Fredoka, sans-serif';return ctx.measureText(t).width;}
function fitTxt(t,x,y,size,c,w,max){var m=tw(t,size);max=max||690;if(m>max)size*=max/m;txt(t,x,y,{s:size,c:c,w:w});}
function seg(x1,y1,x2,y2,c,w,dash){ctx.strokeStyle=c;ctx.lineWidth=w||2;ctx.setLineDash(dash||[]);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);}
function pill(s,x,y,bg,fg,size){size=size||15;var w=tw(s,size);rr(x-w/2-10,y-size*.85,w+20,size*1.7,size*.85);ctx.fillStyle=bg;ctx.fill();txt(s,x,y,{s:size,c:fg||'#fff'});return w+20;}
function panel(x,y,w,h){rr(x,y,w,h,14);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle=LINE;ctx.lineWidth=2;ctx.stroke();}
function dotc(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.stroke();}
function clear(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#f6f8fc';ctx.fillRect(0,0,W,H);}
function arrow(x1,y1,x2,y2,c,w){seg(x1,y1,x2,y2,c,w||3);var a=Math.atan2(y2-y1,x2-x1),z=11;ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-z*Math.cos(a-.45),y2-z*Math.sin(a-.45));ctx.lineTo(x2-z*Math.cos(a+.45),y2-z*Math.sin(a+.45));ctx.closePath();ctx.fill();}
