<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chemical Bonding Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@600&family=Fredoka:wght@500;600&family=Pacifico&display=swap" rel="stylesheet">
<style>:root{--bg:#eaf0f8;--grid:#dbe4f1;--ink:#18233a;--muted:#5a6780;--card:#fff;--line:#c9d4e6;--shadow:#c3cfe3;
--teal:#0f8b8d;--blue:#2b59c3;--plum:#8a4fbf;--amber:#e8962a;--coral:#e2708a;--red:#d8434a;--ok:#2e9e5b;--okbg:#e8f6ee;--bad:#d8434a;--badbg:#fdeeee;--accent:#0f8b8d}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.5;
background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;gap:14px;margin-bottom:16px}
header .logo{flex:none;width:62px;height:62px}
.brand{font-family:Caveat,cursive;font-size:22px;color:var(--muted);line-height:1}
.brand b{font-family:Pacifico,cursive;font-weight:400;font-size:20px;color:var(--teal)}
h1.ttl{font-family:Fredoka,sans-serif;font-weight:600;font-size:32px;margin:0;line-height:1.1}
.hsub{color:var(--muted);font-size:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--shadow);padding:22px;margin-bottom:18px}
h1,h2,h3{font-family:Fredoka,sans-serif;font-weight:600;margin:0 0 8px}
h1{font-size:28px}h2{font-size:22px}h3{font-size:18px}
.sub{color:var(--muted);margin:0 0 14px}
label{font-family:Fredoka,sans-serif;font-weight:500;display:block;margin:10px 0 4px}
input[type=text]{width:100%;font:inherit;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none}
input[type=text]:focus{outline:none;border-color:var(--teal)}
.row{display:grid;grid-template-columns:2fr 1fr;gap:12px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:6px}
@media(max-width:560px){.modes{grid-template-columns:1fr}}
.mode{font:inherit;text-align:left;cursor:pointer;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 4px 0 var(--shadow);color:var(--ink);-webkit-appearance:none;appearance:none}
.mode:hover{border-color:var(--teal)}
.mode b{font-family:Fredoka,sans-serif;font-weight:600;display:block;font-size:17px}
.mode span{color:var(--muted);font-size:15px}
.mode.test{grid-column:1/-1;border-color:var(--plum);background:#f6f0fc}
.mode .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.err{color:var(--bad);font-weight:700;min-height:1.5em;margin:8px 0 0}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-family:Fredoka,sans-serif;font-weight:500}
.bar{flex:1;height:12px;background:#fff;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .3s}
.timer{background:#fff;border:2px solid var(--line);border-radius:999px;padding:2px 12px;min-width:76px;text-align:center}
.timer.low{border-color:var(--bad);color:var(--bad)}
.qhead{font-family:Fredoka,sans-serif;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);font-size:15px;margin-bottom:6px}
.stem{font-size:19px;margin:0 0 14px}
.fig{text-align:center;margin:6px 0 14px}
.fig img{max-width:100%;height:auto;border-radius:12px;border:1px solid #e3e9f3}
table{border-collapse:collapse;margin:0 0 14px;width:100%;font-size:16px}
th,td{border:1.5px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:#f2f6fb;font-family:Fredoka,sans-serif;font-weight:500}
.opts{display:grid;gap:10px}
.opt{font:inherit;display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;cursor:pointer;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px;color:var(--ink);-webkit-appearance:none;appearance:none}
.opt:hover:not([disabled]){border-color:var(--teal)}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:Fredoka,sans-serif;font-weight:600}
.opt .t{padding-top:2px}
.opt.sel{border-color:var(--teal);background:#e6f4f4}.opt.sel .l{background:var(--teal);border-color:var(--teal);color:#fff}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.right .l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}.opt.wrong .l{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opts.letters{grid-template-columns:repeat(4,1fr)}.opts.letters .opt{justify-content:center}.opts.letters .t{display:none}
.fb{margin-top:14px;border-radius:16px;padding:12px 16px;display:none}
.fb.ok{display:block;background:var(--okbg);border:2px solid var(--ok)}
.fb.no{display:block;background:var(--badbg);border:2px solid var(--bad)}
.fb b{font-family:Fredoka,sans-serif;font-weight:600}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{font-family:Fredoka,sans-serif;font-weight:500;font-size:17px;cursor:pointer;border:2px solid var(--teal);border-radius:14px;padding:9px 20px;background:var(--teal);color:#fff;box-shadow:0 3px 0 var(--shadow);-webkit-appearance:none;appearance:none}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.alt{background:#fff;color:var(--teal);border:2px solid var(--teal)}
.btn.teal{background:var(--teal)}
.big{font-family:Fredoka,sans-serif;font-weight:600;font-size:56px;line-height:1;color:var(--teal)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.stat{border:2px solid var(--line);border-radius:16px;padding:10px 12px;background:#fbfcfe}
.stat b{display:block;font-family:Fredoka,sans-serif;font-size:15px;font-weight:500;color:var(--muted)}
.stat span{font-family:Fredoka,sans-serif;font-weight:600;font-size:22px}
.rev{border-top:2px dashed var(--line);padding:12px 0}
.rev:first-child{border-top:none}
.rev .q{font-weight:700}
.pill{display:inline-block;font-family:Fredoka,sans-serif;font-weight:500;font-size:13px;border-radius:999px;padding:1px 10px;margin-right:6px}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.no{background:var(--badbg);color:var(--bad)}
.hidden{display:none}
.note{font-size:15px;color:var(--muted)}
.sent{font-weight:700;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
    <rect x="2" y="2" width="60" height="60" rx="16" fill="#fff" stroke="#c9d4e6" stroke-width="2"/>
    <rect x="12" y="12" width="40" height="40" rx="9" fill="#0f8b8d" opacity=".12"/>
    <path d="M21 33l7 7 15-16" fill="none" stroke="#0f8b8d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

<section id="start" class="card">
  <h2>Before you start</h2>
  <p class="sub">Type your name and class, then choose a practice part or the full test.</p>

</section>

<section id="quiz" class="hidden">
  <div class="topbar"><span id="count"></span><div class="bar"><i id="prog"></i></div><span class="timer hidden" id="timer"></span></div>
  <div class="card">
    <div class="qhead" id="qhead"></div>
    <p class="stem" id="stem"></p>
    <div id="tbl"></div>
    <div class="fig" id="fig"></div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb"></div>
    <div class="actions"><button class="btn" id="next" disabled>Next question</button></div>
  </div>
</section>

<section id="result" class="hidden">
  <div class="card">
    <h2 id="rtitle">Your result</h2>
    <div class="big" id="rpct"></div>
    <p class="sub" id="rline"></p>
    <div class="stats" id="rstats"></div>
    <div class="actions" style="justify-content:flex-start">
      <button class="btn teal" id="send">Send to my teacher</button>
      <button class="btn alt" id="again">Back to start</button>
    </div>
    <p class="sent" id="sent"></p>
  </div>
  <div class="card"><h3>Review</h3><div id="review"></div></div>
</section>
</div>

var SCRIPT_URL = "__SCRIPT_URL__";
var DATA = {"Q": [{"n": 1, "part": 1, "stem": "The diagram shows a model of an atom of magnesium, ₁₂Mg. Which electron arrangement matches this model?", "opts": ["2, 10", "2, 8, 2", "8, 2, 2", "2, 2, 8"], "c": 1, "ind": 1, "why": "Count from the nucleus outwards: 2 in level 1, 8 in level 2, 2 in level 3.", "img": "bohr_mg.png"}, {"n": 2, "part": 1, "stem": "In the magnesium atom shown, which energy level has the LOWEST energy?", "opts": ["The first level, closest to the nucleus", "The second level, because it holds the most electrons", "The third level, because it is the outermost level", "All three levels have the same energy"], "c": 0, "ind": 1, "why": "Energy increases moving away from the nucleus; level 1 is lowest, the outermost occupied level is highest.", "img": "bohr_mg.png"}, {"n": 3, "part": 1, "stem": "Sulfur, ₁₆S, has 16 electrons. What is its electron arrangement?", "opts": ["8, 8", "2, 14", "2, 8, 6", "2, 6, 8"], "c": 2, "ind": 1, "why": "Fill level 1 (2), then level 2 (8), the rest (6) go in level 3."}, {"n": 4, "part": 1, "stem": "An element is in Period 3 and Group 1 of the periodic table. What is its electron arrangement?", "opts": ["2, 8, 1", "2, 1", "2, 8, 3", "3, 1"], "c": 0, "ind": 1, "why": "Period 3 → 3 occupied levels; Group 1 → 1 valence electron (sodium)."}, {"n": 5, "part": 1, "stem": "The table shows the electron arrangements of four atoms. Which atom has the MOST electrons in its highest occupied energy level?", "opts": ["P", "Q", "R", "S"], "c": 3, "ind": 1, "why": "S (2, 8, 8) has 8 electrons in its outer level. R has more electrons in total but only 2 in its outer level.", "table": [["Atom", "Electron arrangement"], ["P", "2, 8, 3"], ["Q", "2, 5"], ["R", "2, 8, 8, 2"], ["S", "2, 8, 8"]]}, {"n": 6, "part": 1, "stem": "Potassium, ₁₉K, has 19 electrons. Which electron arrangement is correct?", "opts": ["2, 8, 9", "2, 8, 8, 1", "2, 9, 8", "2, 17"], "c": 1, "ind": 1, "why": "For the first 20 elements the third level takes 8 before the fourth level starts (K is in Period 4, Group 1)."}, {"n": 7, "part": 1, "stem": "Elements in the same GROUP of the periodic table have similar chemical properties mainly because they have the same number of…", "opts": ["valence electrons", "occupied energy levels", "neutrons", "protons"], "c": 0, "ind": 2, "why": "Chemical properties depend on the outer (valence) electrons; same group = same number of valence electrons."}, {"n": 8, "part": 1, "stem": "Atom X has the electron arrangement 2, 7. Which atom is MOST likely to have chemical properties similar to X?", "opts": ["2, 8", "2, 8, 7", "2, 6", "2, 8, 1"], "c": 1, "ind": 2, "why": "Both have 7 valence electrons (F and Cl, Group 17)."}, {"n": 9, "part": 1, "stem": "Sara says: “Sodium and magnesium have similar chemical properties because they are in the same period.” Use the table to choose the BEST response.", "opts": ["Sara is wrong; sodium is more similar to lithium because both have one valence electron", "Sara is right; elements in the same period always have similar properties", "Sara is wrong; sodium is more similar to neon because both have 8 electrons in the second level", "Sara is right; both have three occupied energy levels, so they react in the same way"], "c": 0, "ind": 2, "why": "Same period = same number of levels, NOT similar properties. Similar properties come from the same number of valence electrons (same group).", "table": [["Element", "Electron arrangement"], ["Lithium, Li", "2, 1"], ["Sodium, Na", "2, 8, 1"], ["Magnesium, Mg", "2, 8, 2"], ["Neon, Ne", "2, 8"]]}, {"n": 10, "part": 1, "stem": "Neon (2, 8) and argon (2, 8, 8) rarely react with other elements. Which statement explains this?", "opts": ["They have the same number of energy levels", "They have no valence electrons", "They have the same atomic number", "Their outermost energy levels are full"], "c": 3, "ind": 2, "why": "Noble gases have a full outer level (8 valence electrons), so they are stable. They DO have valence electrons."}, {"n": 11, "part": 1, "stem": "Elements in the same PERIOD of the periodic table have the same number of…", "opts": ["valence electrons", "neutrons", "occupied energy levels", "protons"], "c": 2, "ind": 2, "why": "Period number = number of occupied energy levels."}, {"n": 12, "part": 2, "stem": "In an electron-dot diagram, what do the dots around the chemical symbol represent?", "opts": ["All the electrons in the atom", "The valence electrons", "The protons in the nucleus", "The occupied energy levels"], "c": 1, "ind": 3, "why": "Only the outer-level (valence) electrons are shown as dots."}, {"n": 13, "part": 2, "stem": "Oxygen, ₈O, has the electron arrangement 2, 6. Which is the correct electron-dot diagram for oxygen?", "opts": ["A", "B", "C", "D"], "c": 3, "ind": 3, "why": "6 valence electrons → 6 dots (two pairs and two single dots).", "img": "oxygen_options.png", "imgopts": true}, {"n": 14, "part": 2, "stem": "The electron-dot diagrams of four elements are shown. W, X, Y and Z are NOT the real symbols of the elements. Which element is a noble gas?", "opts": ["W", "X", "Y", "Z"], "c": 3, "ind": 3, "why": "Z has 8 valence electrons → full outer level → noble gas.", "img": "wxyz_dots.png"}, {"n": 15, "part": 2, "stem": "Which element is MOST likely to GAIN one electron and form an ion with a 1– charge?", "opts": ["W", "X", "Y", "Z"], "c": 2, "ind": 3, "why": "Y has 7 valence electrons; gaining 1 gives a full outer level of 8 → Y⁻ (like Cl⁻).", "img": "wxyz_dots.png"}, {"n": 16, "part": 2, "stem": "An atom has three occupied energy levels, and its electron-dot diagram shows 3 dots. What is its electron arrangement?", "opts": ["2, 3", "3, 8, 2", "2, 8, 8, 3", "2, 8, 3"], "c": 3, "ind": 3, "why": "3 levels and 3 valence electrons → 2, 8, 3 (aluminium)."}, {"n": 17, "part": 3, "stem": "Which statement BEST describes a chemical bond?", "opts": ["A force of attraction that holds atoms or ions together", "A change in the nucleus of an atom", "A physical mixing of two substances", "A change from the solid state to the liquid state"], "c": 0, "ind": 4, "why": "A bond is an attraction involving electrons that holds atoms/ions together."}, {"n": 18, "part": 3, "stem": "Which pair of elements is MOST likely to form an IONIC bond?", "opts": ["Carbon and oxygen", "Copper and zinc", "Sodium and chlorine", "Hydrogen and hydrogen"], "c": 2, "ind": 4, "why": "Metal + nonmetal → electron transfer → ionic bond."}, {"n": 19, "part": 3, "stem": "Which substance contains COVALENT bonds only?", "opts": ["NaCl", "MgO", "Fe", "CO₂"], "c": 3, "ind": 4, "why": "C and O are both nonmetals → they share electrons. NaCl and MgO are ionic; Fe is metallic."}, {"n": 20, "part": 3, "stem": "The diagrams show three models of bonding. Which model represents METALLIC bonding?", "opts": ["Model 1", "Model 2", "Model 3", "None of the models"], "c": 1, "ind": 4, "why": "Positive metal ions in a ‘sea’ of electrons that move freely.", "img": "bond_models.png"}, {"n": 21, "part": 3, "stem": "Which substance is BEST represented by Model 1?", "opts": ["Sodium chloride, NaCl", "Chlorine gas, Cl₂", "Copper, Cu", "Water, H₂O"], "c": 0, "ind": 4, "why": "Model 1 is a lattice of positive and negative ions → an ionic compound.", "img": "bond_models.png"}, {"n": 22, "part": 3, "stem": "Which bond is a POLAR covalent bond?", "opts": ["H–H", "Cl–Cl", "H–Cl", "O=O"], "c": 2, "ind": 4, "why": "Two different nonmetals share electrons unequally. Bonds between identical atoms are nonpolar."}, {"n": 23, "part": 3, "stem": "The diagram shows how the shared pair of electrons is spread out in a molecule of hydrogen chloride, HCl. What type of bond does the diagram show?", "opts": ["Ionic, because the electron is completely transferred to chlorine", "Nonpolar covalent, because the electrons are shared equally", "Polar covalent, because the electrons are shared unequally", "Metallic, because the electrons move freely"], "c": 2, "ind": 4, "why": "The electrons are still shared (not transferred) but pulled closer to Cl (δ–), so the bond is polar covalent.", "img": "hcl_cloud.png"}, {"n": 24, "part": 3, "stem": "Sodium (2, 8, 1) reacts with chlorine (2, 8, 7). What happens to their electrons?", "opts": ["Sodium gives one electron to chlorine, and the ions formed attract each other", "Sodium and chlorine share one pair of electrons", "Chlorine gives one electron to sodium", "Both atoms release their electrons into a sea of electrons"], "c": 0, "ind": 4, "why": "Na loses its 1 valence electron → Na⁺; Cl gains it → Cl⁻; opposite charges attract (ionic bond)."}, {"n": 25, "part": 3, "stem": "The table describes three substances. Which choice correctly identifies the type of bonding in each substance?", "opts": ["P covalent, Q ionic, R metallic", "P metallic, Q covalent, R ionic", "P ionic, Q metallic, R covalent", "P ionic, Q covalent, R metallic"], "c": 3, "ind": 4, "why": "High melting point + conducts only when dissolved = ionic; low melting point + no conduction = covalent; shiny + conducts as a solid = metallic.", "table": [["Substance", "Properties"], ["P", "Very high melting point; does not conduct electricity as a solid, but conducts when dissolved in water"], ["Q", "Low melting point (below 100 °C); does not conduct electricity"], ["R", "Shiny solid; conducts electricity as a solid; can be hammered into thin sheets"]]}, {"n": 26, "part": 4, "stem": "A magnesium atom (2, 8, 2) loses two electrons. Which particle is formed?", "opts": ["Mg²⁻, a negative ion", "Mg²⁺, a positive ion", "Mg₂, a molecule", "A new isotope of magnesium"], "c": 1, "ind": 5, "why": "Losing electrons → more protons than electrons → positive ion, Mg²⁺."}, {"n": 27, "part": 4, "stem": "Each box shows the particles in a substance. Which box represents a COMPOUND?", "opts": ["Box 1", "Box 2", "Box 3", "Box 4"], "c": 2, "ind": 5, "why": "Box 3: every particle contains two DIFFERENT elements bonded together.", "img": "particle_boxes.png"}, {"n": 28, "part": 4, "stem": "Which box shows molecules that are NOT a compound?", "opts": ["Box 1", "Box 2", "Box 3", "Box 4"], "c": 1, "ind": 5, "why": "Box 2: molecules made of the same element (like O₂). Box 1 = single atoms of an element; Box 4 = a mixture.", "img": "particle_boxes.png"}, {"n": 29, "part": 4, "stem": "Limestone contains calcium carbonate, CaCO₃. How many atoms in total are shown by the formula CaCO₃?", "opts": ["3", "4", "5", "6"], "c": 2, "ind": 5, "why": "1 Ca + 1 C + 3 O = 5 atoms."}, {"n": 30, "part": 4, "stem": "Which statement about H₂O, O₂ and NaCl is correct?", "opts": ["All three are compounds", "NaCl is made of molecules", "H₂O is made of ions", "O₂ is made of molecules but is not a compound"], "c": 3, "ind": 5, "why": "O₂ is a molecule of one element. H₂O is a covalent compound (molecules); NaCl is an ionic compound (ions, not molecules)."}], "IMG": {"bohr_mg.png": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAhQAAAIUCAIAAADNGCKyAACuoElEQVR42uydd1gU1/rHz8w2YFnq0pfeOwgqYiM27L13NEaNpie/lNtyc2/aTTcmGgsqYkXFiEYUFbEBIkrvvfeyuyxbZ35/HDMhxIKoOLN7Pk+ePMNKmTkzc77nLed9MZIkAQKBQCAQTwKOhgCBQCAQSDwQCAQCgcQDgUAgEEg8EAgEAoHEA4FAIBBIPBAIBAKBQOKBQCAQCCQeCAQCgUDigUAgEAgkHggEAoFA4oFAIBAIBBIPBAKBQCDxQCAQCAQSDwQCgUAg8UAgEAgEEg8EAoFAIJB4IBAIBAKJBwKBQCCQeCAQCAQCiQcCgUAgkHggEAgEAokHAoFAIBBIPBAIBAKBxAOBQCAQSDwQCAQCgcQDgUAgEEg8EAgEAoFA4oFAIBAIJB4IBAKBQOKBQCAQCCQeCAQCgUDigUAgEAgEEg8EAoFAIPFAIBAIBBIPBAKBQCDxQCAQCAQSDwQCgUAgkHggEAgEAokHAoFAIJB4IBAIBAKJBwKBQCCQeCAQCAQCiQcCgUAgEEg8EAgEAvEcYaMhQGg9JEnKZDKJRNLT06NQKJRKpaIP1JdKpVKtVpO/QxAEAADrA47jbDabx+NxuVwej9f3gPrS0NDQyMiIx+NhGIZGHoHEA4GgOwqFoqOjQywWi8ViiUTS9/8SiUSj0QzlyXA4HCMjI4FA0O//RkZGZmZmbDZ67xCMByNJEo0CglloNJqOjo7W1ta2tra2tjZ4IJFIntlb0QeyD8/ql5uamgqFQqFQaGFhAQ+MjY1xHPmQEUg8EIhnB0EQ7e3t9fX19fX1UCc6OjqgT2kg8Pl8au1vaGjYz9HUz/XEYrEeNolD/VCpVH29Xv08YHK5XCqVQltHLBbL5fKBegDYbKgilpaWdnZ2dnZ2xsbGyPGFQOKBQDyxWtTV1UHBaGhoUCgUj/4RQ0NDoVBobm5ubGzc101kaGj4An1ESqWSEhLoQOvq6mpvb29tbX3sFfH5fDs7O5FIhLQEgcQDgXgoUqm0oqKipqbmsWrB5XKFv0O5ffT19Rl0sSRJSqVSyuEGaW9vf0RghtISR0dHJycn     var n=Q.filter(function(q){return q.part==p;}).length;
    h+='<button class="mode" data-mode="p'+p+'"><b><span class="dot" style="background:'+COLORS[p]+'"></span>Practice · Part '+p+'</b><span>'+PARTS[p]+' · '+n+' questions · answers shown as you go</span></button>';
  }
  h+='<button class="mode test" data-mode="test"><b><span class="dot" style="background:#8a4fbf"></span>Full Test · all 30 questions</b><span>'+TEST_MINUTES+' minutes · answers and review at the end</span></button>';
  $('modes').innerHTML=h;
  var bs=$('modes').querySelectorAll('.mode');
  for (var i=0;i<bs.length;i++) bs[i].addEventListener('click',function(){begin(this.getAttribute('data-mode'));});
})();

function begin(mode){
  var nm=$('nm').value.trim(), cl=$('cl').value.trim();
  if(!nm||!cl){$('err').textContent='Please type your name and class first.';return;}
  $('err').textContent='';
  var list = mode==='test'? Q.slice() : Q.filter(function(q){return 'p'+q.part===mode;});
  st={mode:mode,name:nm,cls:cl,list:list,i:0,ans:[],t0:Date.now(),sent:false};
  $('start').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');
  if(mode==='test'){st.end=Date.now()+TEST_MINUTES*60000;$('timer').classList.remove('hidden');tick=setInterval(updTimer,1000);updTimer();}
  else $('timer').classList.add('hidden');
  show();
}
function updTimer(){
  var left=Math.max(0,Math.round((st.end-Date.now())/1000));
  var m=Math.floor(left/60), s=left%60;
  $('timer').textContent='⏱ '+m+':'+(s<10?'0':'')+s;
  $('timer').classList.toggle('low',left<=120);
  if(left<=0){clearInterval(tick);finish(true);}
}
function show(){
  var q=st.list[st.i], test=st.mode==='test';
  $('count').textContent='Question '+(st.i+1)+' of '+st.list.length;
  $('prog').style.width=(st.i/st.list.length*100)+'%';
  $('qhead').textContent='Part '+q.part+' · '+PARTS[q.part];
  $('stem').innerHTML='<b>'+q.n+'.</b> '+esc(q.stem);
  var t='';
  if(q.table){t='<table><tr>'+q.table[0].map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'</tr>';
    for(var r=1;r<q.table.length;r++) t+='<tr>'+q.table[r].map(function(c,ci){return '<td>'+(ci===0?'<b>'+esc(c)+'</b>':esc(c))+'</td>';}).join('')+'</tr>';
    t+='</table>';}
  $('tbl').innerHTML=t;
  $('fig').innerHTML=q.img?'<img alt="Diagram for question '+q.n+'" src="'+IMG[q.img]+'">':'';
  var o='';
  for(var k=0;k<4;k++) o+='<button class="opt" data-k="'+k+'"><span class="l">'+'ABCD'[k]+'</span><span class="t">'+esc(q.opts[k])+'</span></button>';
  $('opts').innerHTML=o; $('opts').className='opts'+(q.imgopts?' letters':'');
  $('fb').className='fb';$('fb').innerHTML='';
  $('next').disabled=true;
  $('next').textContent= st.i===st.list.length-1 ? (test?'Finish test':'See my result') : 'Next question';
  var bs=$('opts').querySelectorAll('.opt');
  for(var j=0;j<bs.length;j++) bs[j].addEventListener('click',pick);
  window.scrollTo(0,0);
}
function pick(){
  var k=+this.getAttribute('data-k'), q=st.list[st.i], bs=$('opts').querySelectorAll('.opt');
  if(st.mode==='test'){
    for(var j=0;j<bs.length;j++) bs[j].classList.toggle('sel',j===k);
    st.ans[st.i]=k; $('next').disabled=false; return;
  }
  st.ans[st.i]=k;
  for(var j=0;j<bs.length;j++){bs[j].disabled=true; if(j===q.c) bs[j].classList.add('right'); else if(j===k) bs[j].classList.add('wrong');}
  var ok=k===q.c;
  $('fb').className='fb '+(ok?'ok':'no');
  $('fb').innerHTML='<b>'+(ok?'Correct! ':'Not quite. The answer is '+'ABCD'[q.c]+'. ')+'</b>'+esc(q.why);
  $('next').disabled=false;
}
$('next').addEventListener('click',function(){
  if(st.i<st.list.length-1){st.i++;show();} else finish(false);
});
function finish(timeUp){
  if(tick){clearInterval(tick);tick=null;}
  $('quiz').classList.add('hidden');$('result').classList.remove('hidden');
  var L=st.list, correct=0, missed=[], byInd={};
  L.forEach(function(q,i){
    var ok=st.ans[i]===q.c; if(ok)correct++; else missed.push(q.n);
    byInd[q.ind]=byInd[q.ind]||[0,0]; byInd[q.ind][1]++; if(ok)byInd[q.ind][0]++;
  });
  var pct=Math.round(correct/L.length*100), mins=Math.max(1,Math.round((Date.now()-st.t0)/60000));
  st.res={correct:correct,total:L.length,pct:pct,mins:mins,missed:missed};
  $('rtitle').textContent=(timeUp?'Time is up, ':'Quiz finished, ')+st.name.split(' ')[0]+'!';
  $('rpct').textContent=pct+'%';
  $('rline').textContent=correct+' out of '+L.length+' correct · '+mins+' min · '+modeName();
  var s='';
  Object.keys(byInd).sort().forEach(function(k){s+='<div class="stat"><b>'+IND[k]+'</b><span>'+byInd[k][0]+' / '+byInd[k][1]+'</span></div>';});
  $('rstats').innerHTML=s;
  var r='';
  L.forEach(function(q,i){
    var a=st.ans[i], ok=a===q.c;
    r+='<div class="rev"><span class="pill '+(ok?'ok">Correct':'no">'+(a==null?'Not answered':'Wrong'))+'</span><span class="q">'+q.n+'. </span>'+esc(q.stem)+
       '<div class="note" style="margin-top:4px">'+(ok?'':'Your answer: '+(a==null?'–':'ABCD'[a]+(q.imgopts?'':' ('+esc(q.opts[a])+')'))+' · ')+'Correct: <b>'+'ABCD'[q.c]+(q.imgopts?'':' ('+esc(q.opts[q.c])+')')+'</b><br>'+esc(q.why)+'</div></div>';
  });
  $('review').innerHTML=r;
  $('sent').textContent='';$('send').disabled=false;$('send').textContent='Send to my teacher';
  window.scrollTo(0,0);
}
function modeName(){return st.mode==='test'?'Full Test':'Practice Part '+st.mode.slice(1);}
function code(str){var h=0;for(var i=0;i<str.length;i++){h=(h*31+str.charCodeAt(i))>>>0;}return h.toString(36).toUpperCase().slice(-5);}
$('send').addEventListener('click',function(){
  if(st.sent) return;
  var r=st.res, when=new Date();
  var body={game:'Chemical Bonding Quiz – '+modeName(),chapter:'Chemical Bonding',name:st.name,cls:st.cls,score:r.pct,correct:r.correct,total:r.total,mins:r.mins,
    when:when.toLocaleString(),code:code(st.name+'|'+st.cls+'|'+r.correct+'|'+r.total+'|'+when.getTime()),missed:r.missed.join(', ')};
  if(!SCRIPT_URL||SCRIPT_URL.indexOf('http')!==0){$('sent').textContent='Sending is not set up yet – please show this screen to your teacher.';return;}
  $('send').disabled=true;$('send').textContent='Sending…';
  fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
   .then(function(){st.sent=true;$('send').textContent='Sent ✓';$('sent').textContent='Your result was sent to Ms. Mirna.';})
   .catch(function(){$('send').disabled=false;$('send').textContent='Send to my teacher';$('sent').textContent='Could not send. Check your internet and try again.';});
});
$('again').addEventListener('click',function(){$('result').classList.add('hidden');$('start').classList.remove('hidden');window.scrollTo(0,0);});
</script>
