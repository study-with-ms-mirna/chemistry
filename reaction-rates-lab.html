<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reaction Rate Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf0f8;--grid:#dbe4f1;--ink:#18233a;--muted:#5a6780;--line:#c9d4e6;--shadow:#c3cfe3;
--teal:#0f8b8d;--blue:#2b59c3;--plum:#8a4fbf;--amber:#e8962a;--coral:#e2708a;--red:#d8434a;--accent:#0f8b8d}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.4}
.wrap{max-width:1260px;margin:0 auto;padding:18px 20px 34px}
header{display:flex;align-items:center;gap:14px;margin-bottom:16px}
header svg{flex:none}
h1{font-family:Fredoka,sans-serif;font-weight:600;font-size:32px;margin:0;line-height:1.1}
.sub{color:var(--muted);font-size:16px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
.tab{font-family:Fredoka,sans-serif;font-weight:500;font-size:18px;padding:10px 18px;border-radius:16px;border:2px solid var(--line);background:#fff;box-shadow:0 4px 0 var(--shadow);cursor:pointer;display:flex;align-items:center;gap:8px}
.tab i{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-block}
.tab.on{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 4px 0 rgba(24,35,58,.22)}
.tab.on i{background:#fff}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.step{font-family:Fredoka,sans-serif;font-size:16px;padding:6px 14px 6px 7px;border-radius:999px;border:2px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;gap:8px}
.step b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--line);font-weight:600;font-size:14px}
.step.on{border-color:var(--accent);color:var(--accent)}
.step.on b{background:var(--accent);color:#fff}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:960px){.main{grid-template-columns:1fr}}
.card{background:#fff;border:2px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--shadow);padding:16px}
.stage h2{font-family:Fredoka,sans-serif;font-weight:600;font-size:22px;margin:0 0 10px;color:var(--accent)}
canvas{width:100%;height:auto;display:block;border-radius:14px;background:#f6f8fc}
.controls{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin-top:14px}
.ctl{display:flex;align-items:center;gap:10px;font-family:Fredoka,sans-serif;font-size:16px}
.ctl output{min-width:84px;font-weight:600;color:var(--accent)}
.btn{font-family:Fredoka,sans-serif;font-weight:500;font-size:16px;padding:9px 16px;border-radius:14px;border:2px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer;box-shadow:0 3px 0 var(--shadow)}
.btn.fill{background:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn.sel{background:var(--accent);color:#fff}
input[type=range]{-webkit-appearance:none;appearance:none;width:260px;max-width:60vw;height:10px;border-radius:999px;background:#dfe6f2;outline:none;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;background:var(--accent);border:4px solid #fff;box-shadow:0 0 0 2px var(--accent),0 2px 3px rgba(0,0,0,.25);cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:4px solid #fff;box-shadow:0 0 0 2px var(--accent);cursor:pointer}
input[type=range]:disabled{opacity:.4}
.side{display:flex;flex-direction:column;gap:14px}
.lbl{font-family:Fredoka,sans-serif;font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.q{font-size:19px;font-weight:700}
.rule{border:3px dashed var(--red);border-radius:18px;padding:12px 14px;background:#fff}
.rule .lbl{color:var(--red)}
.rule ul{margin:0;padding-left:20px}
.rule li{margin:4px 0}
.reads{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rd{background:#f3f6fb;border-radius:14px;padding:8px 10px}
.rd span{display:block;font-size:13px;color:var(--muted)}
.rd b{font-family:Fredoka,sans-serif;font-weight:600;font-size:22px}
.rd.wide{grid-column:1/-1}
.bar{height:14px;border-radius:999px;background:#e6ebf3;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:999px;transition:width .15s}
/* equation view */
.eqview{display:none;min-height:420px;padding:10px 6px;background:#f6f8fc;border-radius:14px}
.eqrow{display:flex;align-items:center;justify-content:center;gap:18px;height:230px;font-family:Fredoka,sans-serif;font-weight:600}
.big{display:inline-flex;flex-direction:column;align-items:center;transition:font-size .2s;line-height:1}
.big small{font-size:15px;font-weight:500;color:var(--muted);margin-top:4px}
.op{font-size:64px;color:#8d99b0}
.k{font-size:80px;color:#8d99b0}
.frac{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.fr{display:flex;align-items:center;gap:6px;padding-left:46px}
.frac hr{width:100%;min-width:120px;border:0;border-top:6px solid var(--ink);margin:2px 0;border-radius:3px}
.arrowtag{font-size:40px;margin-left:4px}
.up{color:var(--coral)}.down{color:var(--blue)}
.nums{text-align:center;font-family:Fredoka,sans-serif;font-size:24px;margin:4px 0 10px}
.pair{text-align:center;font-size:19px;margin:8px auto;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px;max-width:640px}
.chip{display:block;width:max-content;max-width:100%;margin:10px auto 0;font-family:Fredoka,sans-serif;font-size:19px;padding:8px 16px;border-radius:999px;background:var(--accent);color:#fff}
.bars2{display:grid;grid-template-columns:110px 1fr 90px;gap:8px 12px;align-items:center;max-width:560px;margin:8px auto 0;font-family:Fredoka,sans-serif}
.bars2 .bar{height:20px;margin:0}
/* combined strip */
.cstrip{margin-top:12px;background:#f6f8fc;border-radius:14px;padding:12px}
.ceq{display:flex;align-items:center;justify-content:center;gap:22px;font-family:Fredoka,sans-serif;font-weight:600;font-size:40px;flex-wrap:wrap}
.cf{display:inline-flex;flex-direction:column;align-items:center}
.cf hr{width:100%;min-width:110px;border:0;border-top:4px solid var(--ink);margin:2px 0}
.v{position:relative;display:inline-block;padding:0 2px}
.v.x{color:#b3bccb}
.v.x::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;border-top:5px solid var(--red);transform:rotate(-20deg)}
.lawname{text-align:center;font-family:Fredoka,sans-serif;font-size:21px;margin-top:8px;color:var(--accent);min-height:28px}
.holds{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
sub{font-size:.6em}

.reads .rd b{font-size:20px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg width="54" height="54" viewBox="0 0 54 54" aria-hidden="true">
      <path d="M20 6h14M23 6v14L11 44a4 4 0 0 0 3.6 6h24.8a4 4 0 0 0 3.6-6L31 20V6" fill="#fff" stroke="#18233a" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M15.5 36h23l4 8a3 3 0 0 1-2.7 4.3H14.2A3 3 0 0 1 11.5 44z" fill="#0f8b8d" opacity=".25"/>
      <circle cx="21" cy="40" r="3" fill="#2b59c3"/><circle cx="31" cy="42" r="3" fill="#3fae5a"/><circle cx="27" cy="34" r="2.6" fill="#8a4fbf"/>
      <path d="M40 10l3-5M44 15l5-2M38 6l-1-4" stroke="#e8962a" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <div><h1>Reaction Rate Lab</h1><div class="sub">What makes a reaction go faster or slower?</div></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div class="main">
    <section class="card stage">
      <h2 id="stitle"></h2>
      <canvas id="cv" width="800" height="500"></canvas>
      <div class="controls" id="controls"></div>
    </section>
    <aside class="side">
      <div class="card"><div class="lbl">Think</div><div class="q" id="q"></div></div>
      <div class="card"><div class="lbl">Readings</div><div class="reads" id="reads"></div></div>
      <div class="rule"><div class="lbl">Our rule</div><ul id="rule"></ul></div>
    </aside>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=800,H=500;
function fit(){var d=window.devicePixelRatio||1;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);}fit();window.addEventListener('resize',fit);
function $(id){return document.getElementById(id);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}
var INK='#18233a',MUTED='#5a6780',LINE='#c9d4e6',TEAL='#0f8b8d',CORAL='#e2708a',AMBER='#e8962a',BLUE='#2f6fd6',GREEN='#3fae5a',PURPLE='#8a4fbf',PINK='#e2559a',CYAN='#16a9b5',GREY='#8d99b0';
var LEFTC=TEAL,RIGHTC=CORAL;
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function txt(s,x,y,o){o=o||{};ctx.font=(o.w||600)+' '+(o.s||15)+'px Fredoka, sans-serif';ctx.fillStyle=o.c||INK;ctx.textAlign=o.a||'center';ctx.textBaseline='middle';ctx.fillText(s,x,y);}
function gauss(){var u=Math.random()||1e-9,v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function dot(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.arc(x-r*.3,y-r*.3,r*.35,0,Math.PI*2);ctx.fill();}
function star(x,y,t,c){var k=t/0.45;ctx.save();ctx.globalAlpha=k;ctx.strokeStyle=c;ctx.lineWidth=3;ctx.beginPath();for(var i=0;i<8;i++){var a=i*Math.PI/4,r1=6+(1-k)*6,r2=14+(1-k)*12;ctx.moveTo(x+Math.cos(a)*r1,y+Math.sin(a)*r1);ctx.lineTo(x+Math.cos(a)*r2,y+Math.sin(a)*r2);}ctx.stroke();ctx.restore();}

/* ===== chamber: particles in a box ===== */
function Chamber(x,y,w,h,label,col){this.x=x;this.y=y;this.w=w;this.h=h;this.label=label;this.col=col;this.p=[];this.solids=[];this.fx=[];this.count=0;this.log=[];this.t=0;this.sigma=60;this.vth=60;this.vthCat=40;this.hitsOK=0;this.hitsAll=0;this.strip=null;this.pStrip=0;this.deposit=[];this.mode='none';}
Chamber.prototype.add=function(type,r){var R=r||7,p={x:this.x+R+Math.random()*(this.w-2*R),y:this.y+R+Math.random()*(this.h-2*R),r:R,type:type,alive:true,act:0};
  if(this.strip){p.x=Math.max(p.x,this.strip.x+this.strip.w+R+2);}
  var s=this.sigma;p.vx=gauss()*s;p.vy=gauss()*s;this.p.push(p);return p;};
Chamber.prototype.reset=function(){this.p=[];this.solids=[];this.fx=[];this.count=0;this.log=[];this.t=0;this.hitsOK=0;this.hitsAll=0;this.deposit=[];};
Chamber.prototype.thermo=function(dt){var m=this.p.filter(function(q){return q.alive&&q.type!=='S'&&!q.held;});if(!m.length)return;var ke=0;m.forEach(function(q){ke+=q.vx*q.vx+q.vy*q.vy;});var cur=Math.sqrt(ke/(2*m.length));if(cur<1)return;var f=lerp(1,this.sigma/cur,Math.min(1,dt*2));m.forEach(function(q){q.vx*=f;q.vy*=f;});};
Chamber.prototype.react=function(a,b,vn){ // returns true if reaction happened
  var types=a.type+b.type;
  if(types==='AB'||types==='BA'){var A=a.type==='A'?a:b,B=a.type==='A'?b:a;var th=A.act>0?this.vthCat:this.vth;this.hitsAll++;
    if(vn>th){A.type='P';A.r=9;A.vx=(A.vx+B.vx)/2;A.vy=(A.vy+B.vy)/2;B.alive=false;this.count++;this.hitsOK++;this.fx.push({x:(A.x+B.x)/2,y:(A.y+B.y)/2,t:.45,c:AMBER});return true;}
    if(this.showMiss)this.fx.push({x:(A.x+B.x)/2,y:(A.y+B.y)/2,t:.3,c:GREY,miss:true});}
  if((a.type==='A'&&b.type==='C')||(a.type==='C'&&b.type==='A')){(a.type==='A'?a:b).act=3;}
  return false;};
Chamber.prototype.step=function(dt){var self=this;this.t+=dt;var ps=this.p,n=ps.length,i,j;
  var Bt=this.y+this.h-(this.slab?this.slab.h:0);
  for(i=0;i<n;i++){var p=ps[i];if(!p.alive||p.type==='S')continue;if(p.held){p.heldT+=dt;if(p.heldT>10){p.held.occ=null;p.held=null;p.y=Bt-p.r;p.vy=-Math.abs(this.sigma);}continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.spin)p.ang+=p.spin*dt;if(p.act>0)p.act-=dt;
    var L=this.x+p.r;if(this.strip)L=this.strip.x+this.strip.w+p.r;
    if(p.x<L){p.x=L;p.vx=Math.abs(p.vx);if(this.strip&&p.type==='I'&&p.alive&&Math.random()<this.pStrip){this.hitStrip(p);} }
    if(p.x>this.x+this.w-p.r){p.x=this.x+this.w-p.r;p.vx=-Math.abs(p.vx);}
    if(p.y<this.y+p.r){p.y=this.y+p.r;p.vy=Math.abs(p.vy);}if(p.y>Bt-p.r){p.y=Bt-p.r;p.vy=-Math.abs(p.vy);if(this.slab&&p.type==='A'){var st=null;this.slab.sites.forEach(function(z){if(!z.occ&&Math.abs(z.x-p.x)<28)st=z;});if(st){st.occ=p;p.held=st;p.heldT=0;p.x=st.x;p.y=Bt+3;p.vx=0;p.vy=0;p.ang=0;}}}}
  for(i=0;i<n;i++){var a=ps[i];if(!a.alive)continue;for(j=i+1;j<n;j++){var b=ps[j];if(!b.alive)continue;if(a.type==='S'&&b.type==='S')continue;
    var dx=b.x-a.x,dy=b.y-a.y,rs=a.r+b.r;if(Math.abs(dx)>rs||Math.abs(dy)>rs)continue;var d2=dx*dx+dy*dy;if(d2>=rs*rs||d2===0)continue;
    var d=Math.sqrt(d2),nx=dx/d,ny=dy/d,va=a.vx*nx+a.vy*ny,vb=b.vx*nx+b.vy*ny;
    if(a.held||b.held){if(a.held&&b.held)continue;var hh=a.held?a:b,o=a.held?b:a,gx=a.held?nx:-nx,gy=a.held?ny:-ny;
      if(hh.type==='A'&&o.type==='B'&&o.y<hh.y-4){hh.held.occ=null;hh.held=null;hh.type='P';hh.r=9;hh.vx=gauss()*self.sigma*.5;hh.vy=-Math.abs(self.sigma)*1.3;hh.y-=6;o.alive=false;self.count++;self.hitsOK++;self.fx.push({x:hh.x,y:hh.y-8,t:.45,c:AMBER});continue;}
      var ovh=rs-d;o.x+=gx*ovh;o.y+=gy*ovh;var vo=o.vx*gx+o.vy*gy;if(vo<0){o.vx-=2*vo*gx;o.vy-=2*vo*gy;}continue;}
    if(a.type==='S'||b.type==='S'){var m=a.type==='S'?b:a,s=a.type==='S'?a:b,sgn=a.type==='S'?-1:1;var vm=m.vx*nx+m.vy*ny;
      // push mobile out and reflect
      var ov=rs-d;m.x-=sgn*nx*ov;m.y-=sgn*ny*ov;if(sgn*vm>0){m.vx-=2*vm*nx;m.vy-=2*vm*ny;}
      if(m.type==='A'&&s.alive&&Math.random()<self.pSolid){s.alive=false;m.type='Q';m.r=9;m.x=s.x-sgn*nx*4;m.y=s.y-sgn*ny*4;var sp=Math.abs(self.sigma)*1.2;m.vx=-sgn*nx*sp;m.vy=-sgn*ny*sp;self.count++;self.fx.push({x:s.x,y:s.y,t:.45,c:AMBER});}
      continue;}
    if(va-vb<=0)continue;var vn=va-vb;
    if(self.react(a,b,vn)){continue;}
    a.vx+=(vb-va)*nx;a.vy+=(vb-va)*ny;b.vx+=(va-vb)*nx;b.vy+=(va-vb)*ny;var ov2=(rs-d)/2;a.x-=nx*ov2;a.y-=ny*ov2;b.x+=nx*ov2;b.y+=ny*ov2;}}
  this.p=this.p.filter(function(q){return q.alive;});
  this.fx.forEach(function(f){f.t-=dt;});this.fx=this.fx.filter(function(f){return f.t>0;});
  this.thermo(dt);
  if(this.target&&this.count>=this.target&&!this.doneT)this.doneT=this.t;
  if(!this.lastLog||this.t-this.lastLog>=0.25){this.lastLog=this.t;this.log.push([this.t,this.count]);}};
Chamber.prototype.hitStrip=function(p){p.alive=false;this.count++;var s=this.strip;var yy=clamp(p.y,s.y+6,s.y+s.h-6);this.deposit.push({y:yy,len:6+Math.random()*10,a:(Math.random()-.5)*1.2});
  this.fx.push({x:s.x+s.w+4,y:yy,t:.45,c:AMBER});var ion=this.add('M',5);ion.x=s.x+s.w+8;ion.y=yy;ion.vx=Math.abs(ion.vx);};
Chamber.prototype.rate=function(){var L=this.log;if(L.length<2)return 0;var t0=this.t-5,c0=null;for(var i=L.length-1;i>=0;i--){if(L[i][0]<=t0){c0=L[i][1];break;}}if(c0===null)c0=L[0][1];var dtt=Math.min(5,this.t-(L[0][0]));return dtt>0?(this.count-c0)/Math.max(1,Math.min(5,this.t)):0;};
var COLORS={A:BLUE,B:GREEN,P:PURPLE,C:AMBER,I:'#aab4c3',M:'#6aa0e8',S:PINK,X:'#3b4760'};
Chamber.prototype.draw=function(){var self=this;
  ctx.fillStyle='#fff';rr(this.x-4,this.y-4,this.w+8,this.h+8,12);ctx.fill();ctx.strokeStyle=this.col;ctx.lineWidth=3;ctx.stroke();
  if(this.bg){ctx.fillStyle=this.bg;rr(this.x,this.y,this.w,this.h,9);ctx.fill();}
  if(this.slab){var sb=this.slab,sy=this.y+this.h-sb.h;ctx.fillStyle='#c3cad5';rr(this.x,sy,this.w,sb.h,4);ctx.fill();ctx.fillStyle='#fff';sb.sites.forEach(function(z){ctx.beginPath();ctx.moveTo(z.x-12,sy);ctx.lineTo(z.x-7,sy+10);ctx.lineTo(z.x+7,sy+10);ctx.lineTo(z.x+12,sy);ctx.closePath();ctx.fill();if(z.occ==='inh'){ctx.fillStyle='#3b4760';ctx.fillRect(z.x-7,sy-3,14,13);ctx.fillStyle='#fff';}});
    if(this.w>250)txt('catalyst surface with active sites',this.x+this.w/2,sy+16,{s:11,c:'#4b5568',w:500});}
  if(this.trails){this.p.forEach(function(q){if(!q.alive)return;var L=.16;ctx.strokeStyle=COLORS[q.type]||PURPLE;ctx.globalAlpha=.35;ctx.lineWidth=q.r*1.2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(q.x-q.vx*L,q.y-q.vy*L);ctx.stroke();ctx.globalAlpha=1;});}
  if(this.strip){var s=this.strip;ctx.fillStyle=s.c;rr(s.x,s.y,s.w,s.h,4);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1.5;ctx.stroke();txt(s.name,s.x+s.w/2,s.y-12,{s:13,c:MUTED});
    ctx.strokeStyle='#9aa3ad';ctx.lineWidth=3;ctx.lineCap='round';this.deposit.forEach(function(d){var x0=s.x+s.w;ctx.beginPath();ctx.moveTo(x0,d.y);ctx.lineTo(x0+Math.cos(d.a)*d.len,d.y+Math.sin(d.a)*d.len);ctx.stroke();ctx.fillStyle='#c4cad1';ctx.beginPath();ctx.arc(x0+Math.cos(d.a)*d.len,d.y+Math.sin(d.a)*d.len,2.6,0,Math.PI*2);ctx.fill();});}
  this.p.forEach(function(q){if(!q.alive)return;var c=COLORS[q.type];

/* ===== challenge: several factors at once ===== */
var CH_COL=['#0f8b8d','#e2708a','#2b59c3','#e8962a'];
var CHP={aLow:10,aHigh:24,nB:24,cold:55,hot:68,vth:250,vthInh:310,sites:4};window.__CHP=CHP;
function chalChamber(i,set){var P=CHP;var ch=new Chamber(20+i*195,95,170,165,'Box '+'ABCD'[i],CH_COL[i]);ch.reset();
 ch.sigma=set.temp==='hot'?P.hot:P.cold;ch.vth=set.extra==='inh'?P.vthInh:P.vth;ch.slab=null;ch.shapes=true;ch.mode=set.extra==='cat'?'cat':set.extra==='inh'?'inh':'none';
 if(set.extra!=='none'){ch.slab={h:20,sites:[]};for(var k=0;k<P.sites;k++)ch.slab.sites.push({x:ch.x+22+k*(ch.w-44)/(P.sites-1),occ:set.extra==='inh'?'inh':null});}
 ch.bg=set.temp==='hot'?'rgba(235,140,120,.14)':'rgba(120,170,235,.14)';
 var nA=set.conc==='high'?P.aHigh:P.aLow;for(var a=0;a<nA;a++){var pa=ch.add('A',6);pa.ang=Math.random()*6.28;pa.spin=(Math.random()<.5?-1:1)*(1.5+Math.random()*2);}
 for(var b=0;b<P.nB;b++)ch.add('B',6);return ch;}
window.__chalSim=function(set,sec){var ch=chalChamber(0,set),dt=1/180;for(var t=0;t<sec;t+=dt)ch.step(dt);return ch.count;};
var CH_ROUNDS=[
 [{conc:'low',temp:'hot',extra:'none'},{conc:'high',temp:'hot',extra:'cat'},{conc:'low',temp:'cold',extra:'inh'},{conc:'high',temp:'cold',extra:'cat'}],
 [{conc:'low',temp:'cold',extra:'none'},{conc:'high',temp:'cold',extra:'cat'},{conc:'low',temp:'cold',extra:'inh'},{conc:'low',temp:'hot',extra:'cat'}],
 [{conc:'low',temp:'cold',extra:'cat'},{conc:'low',temp:'cold',extra:'inh'},{conc:'high',temp:'hot',extra:'none'},{conc:'low',temp:'hot',extra:'inh'}],
 [{conc:'high',temp:'cold',extra:'cat'},{conc:'low',temp:'cold',extra:'none'},{conc:'high',temp:'hot',extra:'cat'},{conc:'high',temp:'hot',extra:'inh'}]];
var CH_MEAN={'low-cold-none':1.5,'low-cold-cat':8.3,'low-cold-inh':0.1,'low-hot-none':6.7,'low-hot-cat':9.4,'low-hot-inh':1.9,'high-cold-none':5.2,'high-cold-cat':14.7,'high-cold-inh':0.3,'high-hot-none':15.6,'high-hot-cat':19.5,'high-hot-inh':5.8};
function chalExpect(set){return CH_MEAN[set.conc+'-'+set.temp+'-'+set.extra];}
S.chal={tab:'6. Challenge',title:'Challenge: rank the four boxes from fastest to slowest',custom:true,round:0,
 q:'Several factors change at once. Which box will make products fastest? Which will be slowest? Why?',
 rule:['Concentration &uarr; &rarr; collisions happen <b>more often</b>','Temperature &uarr; &rarr; more collisions have <b>enough energy</b>','Catalyst &rarr; holds reactants in the <b>correct orientation</b>; inhibitor &rarr; blocks it','Weigh <b>all</b> the factors before you decide'],
 init:function(){var set=CH_ROUNDS[this.round%CH_ROUNDS.length];this.set=set;this.c=set.map(function(st,i){return chalChamber(i,st);});this.state='predict';this.res=null;this.T=0;},
 controls:function(){var opts=function(){return '<option value="">–</option>'+'ABCD'.split('').map(function(l){return '<option>'+l+'</option>';}).join('');};
  return ['1st (fastest)','2nd','3rd','4th (slowest)'].map(function(l,i){return '<div class="ctl"><b>'+l+'</b> <select class="btn" id="rk'+i+'" style="padding:6px 10px">'+opts()+'</select></div>';}).join('')+
   '<button class="btn fill" id="go">Lock in &amp; race!</button><button class="btn" id="nr">New round</button><span class="ctl" id="cmsg" style="font-size:15px;color:#5a6780;flex-basis:100%">Choose a different box for each place, then lock in your prediction.</span>';},
 bind:function(){var s=this;$('go').onclick=function(){var r=[0,1,2,3].map(function(i){return $('rk'+i).value;});
   if(r.some(function(v){return !v;})||new Set(r).size<4){$('cmsg').textContent='Use each box once: A, B, C and D.';$('cmsg').style.color='#d8434a';return;}
   s.pred=r;s.state='run';s.T=0;[0,1,2,3].forEach(function(i){$('rk'+i).disabled=true;});$('go').disabled=true;$('cmsg').style.color='#5a6780';$('cmsg').textContent='Racing… watch the graph.';};
  $('nr').onclick=function(){s.round++;go(5);};},
 reads:[['p','Your ranking','wide'],['a','Actual ranking','wide'],['sc','Score','wide']],
 read:function(){var c=this.c;if(this.state==='predict')return {p:'not locked in yet',a:'–',sc:'–'};
  var act=this.actual();return {p:this.pred.join(' > '),a:this.state==='done'?act.join(' > '):'racing…',sc:this.state==='done'?this.score+' / 4 places correct':'–'};},
 actual:function(){var c=this.c,exp=this.set.map(chalExpect);return [0,1,2,3].sort(function(i,j){return (c[j].count-c[i].count)||(exp[j]-exp[i]);}).map(function(i){return 'ABCD'[i];});},
 frame:function(dt){var s=this;if(this.state==='run'){this.T+=dt;var h=dt/3;for(var k=0;k<3;k++)this.c.forEach(function(ch){ch.step(h);});
   if(this.T>=20){this.state='done';var act=this.actual();this.score=act.filter(function(l,i){return l===s.pred[i];}).length;
    $('cmsg').innerHTML='<b>'+(this.score===4?'Perfect! ':this.score>=2?'Good try! ':'Look again! ')+'</b>'+this.why();$('cmsg').style.color='#18233a';}}
  ctx.clearRect(0,0,W,H);txt(this.state==='predict'?'Predict first: the race starts when you lock in your ranking':(this.state==='run'?'Racing… '+Math.ceil(20-this.T)+' s':'Race over: compare with your prediction'),400,24,{s:16,c:INK});
  this.c.forEach(function(ch,i){ch.draw();var st=s.set[i],chips=[[st.conc==='high'?'High conc.':'Low conc.','#5a6780'],[st.temp==='hot'?'Hot':'Cold',st.temp==='hot'?'#d8434a':'#2b59c3'],[st.extra==='cat'?'Catalyst':st.extra==='inh'?'Inhibitor':'No catalyst',st.extra==='cat'?'#2e9e5b':st.extra==='inh'?'#3b4760':'#8d99b0']];
   chips.forEach(function(c2,k){var y=272+k*22,x=ch.x+ch.w/2;ctx.fillStyle='#fff';rr(x-70,y,140,19,9);ctx.fill();ctx.strokeStyle=c2[1];ctx.lineWidth=1.5;ctx.stroke();txt(c2[0],x,y+10,{s:12,c:c2[1]});});
});
  // race graph
  var gx=60,gy=378,gw=700,gh=92,tmax=20,ymax=Math.max(8,Math.max.apply(null,this.c.map(function(ch){return ch.count;}))+1);
  ctx.fillStyle='#fff';rr(gx-46,gy-14,gw+62,gh+40,12);ctx.fill();ctx.strokeStyle=LINE;ctx.lineWidth=2;ctx.stroke();
  ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx,gy+gh);ctx.lineTo(gx+gw,gy+gh);ctx.stroke();
  for(var t=0;t<=tmax;t+=5)txt(t+' s',gx+t/tmax*gw,gy+gh+12,{s:11,c:MUTED,w:500});
  ctx.save();ctx.translate(gx-30,gy+gh/2);ctx.rotate(-Math.PI/2);txt('Products',0,0,{s:12,c:MUTED,w:500});ctx.restore();
  this.c.forEach(function(ch,i){ctx.strokeStyle=CH_COL[i];ctx.lineWidth=3.5;ctx.beginPath();ch.log.forEach(function(pt,k){var x=gx+Math.min(pt[0],tmax)/tmax*gw,y=gy+gh-pt[1]/ymax*gh;if(k===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});ctx.stroke();
   if(ch.log.length){var L=ch.log[ch.log.length-1];txt('ABCD'[i]+' '+ch.count,gx+Math.min(L[0],tmax)/tmax*gw+16,gy+gh-L[1]/ymax*gh,{s:12,c:CH_COL[i]});}});},
 why:function(){var s=this;return 'Order: '+this.actual().join(' > ')+'. '+this.actual().map(function(l){var st=s.set['ABCD'.indexOf(l)];return l+': '+(st.conc==='high'?'more particles':'fewer particles')+', '+(st.temp==='hot'?'hot':'cold')+(st.extra==='cat'?', catalyst':st.extra==='inh'?', inhibitor':'');}).join(' • ');}};
var ORDER=['react','conc','surf','temp','cat','chal'],tabI=0,lastRead=0;
function renderTabs(){$('tabs').innerHTML=ORDER.map(function(k,i){return '<button class="tab'+(i===tabI?' on':'')+'" style="--c:#0f8b8d" data-i="'+i+'"><i></i>'+S[k].tab+'</button>';}).join('');
 Array.prototype.forEach.call($('tabs').children,function(b){b.onclick=function(){go(+b.getAttribute('data-i'));};});}
function go(i){tabI=i;cur=S[ORDER[i]];renderTabs();$('stitle').textContent=cur.title;$('controls').innerHTML=cur.controls();cur.init();cur.bind();
 $('q').textContent=cur.q;$('rule').innerHTML=cur.rule.map(function(r){return '<li>'+r+'</li>';}).join('');
 $('reads').innerHTML=cur.reads.map(function(r){return '<div class="rd'+(r[2]?' wide':'')+'"><span>'+r[1]+'</span><b id="r_'+r[0]+'">–</b></div>';}).join('');lastRead=0;}
var last=performance.now();
function loop(now){var dt=Math.min(.04,(now-last)/1000);last=now;
 if(cur&&cur.custom){cur.frame(dt);}
 else if(cur&&cur.view&&cur.view!=='compare'){cur.zt+=dt;ctx.clearRect(0,0,W,H);cur.drawZoom();}
 else if(cur){var h=dt/3;for(var k=0;k<3;k++)cur.c.forEach(function(ch){if(ch.t<30.5)ch.step(h);});
  ctx.clearRect(0,0,W,H);cur.c.forEach(function(ch){ch.draw();});if(cur.extra)cur.extra();race(cur.c[0],cur.c[1],cur.ymax,cur.ylab);
  if(cur.c[0].t>=30.5){txt('Time is up: compare the two lines, then press Run again',400,342,{s:13,c:MUTED,w:500});}}
 if(cur){
  if(now-lastRead>150){lastRead=now;var v=cur.read();for(var key in v){var e=$('r_'+key);if(e)e.textContent=v[key];}}}
 requestAnimationFrame(loop);}

go(hm[location.hash]||0);requestAnimationFrame(loop);
})();
