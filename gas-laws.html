<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gas Laws Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf0f8;--grid:#dbe4f1;--ink:#18233a;--muted:#5a6780;--line:#c9d4e6;--shadow:#c3cfe3;
--teal:#0f8b8d;--blue:#2b59c3;--plum:#8a4fbf;--amber:#e8962a;--coral:#e2708a;--red:#d8434a;--accent:#0f8b8d}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.4}
.wrap{max-width:1260px;margin:0 auto;padding:18px 20px 34px}
header{display:flex;align-items:center;gap:14px;margin-bottom:16px}
header svg{flex:none}
h1{font-family:Fredoka,sans-serif;font-weight:600;font-size:32px;margin:0;line-height:1.1}
.sub{color:var(--muted);font-size:16px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
.tab{font-family:Fredoka,sans-serif;font-weight:500;font-size:18px;padding:10px 18px;border-radius:16px;border:2px solid var(--line);background:#fff;box-shadow:0 4px 0 var(--shadow);cursor:pointer;display:flex;align-items:center;gap:8px}
.tab i{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-block}
.tab.on{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 4px 0 rgba(24,35,58,.22)}
.tab.on i{background:#fff}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.step{font-family:Fredoka,sans-serif;font-size:16px;padding:6px 14px 6px 7px;border-radius:999px;border:2px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;gap:8px}
.step b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--line);font-weight:600;font-size:14px}
.step.on{border-color:var(--accent);color:var(--accent)}
.step.on b{background:var(--accent);color:#fff}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:960px){.main{grid-template-columns:1fr}}
.card{background:#fff;border:2px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--shadow);padding:16px}
.stage h2{font-family:Fredoka,sans-serif;font-weight:600;font-size:22px;margin:0 0 10px;color:var(--accent)}
canvas{width:100%;height:auto;display:block;border-radius:14px;background:#f6f8fc}
.controls{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin-top:14px}
.ctl{display:flex;align-items:center;gap:10px;font-family:Fredoka,sans-serif;font-size:16px}
.ctl output{min-width:84px;font-weight:600;color:var(--accent)}
.btn{font-family:Fredoka,sans-serif;font-weight:500;font-size:16px;padding:9px 16px;border-radius:14px;border:2px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer;box-shadow:0 3px 0 var(--shadow)}
.btn.fill{background:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn.sel{background:var(--accent);color:#fff}
input[type=range]{-webkit-appearance:none;appearance:none;width:260px;max-width:60vw;height:10px;border-radius:999px;background:#dfe6f2;outline:none;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;background:var(--accent);border:4px solid #fff;box-shadow:0 0 0 2px var(--accent),0 2px 3px rgba(0,0,0,.25);cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:4px solid #fff;box-shadow:0 0 0 2px var(--accent);cursor:pointer}
input[type=range]:disabled{opacity:.4}
.side{display:flex;flex-direction:column;gap:14px}
.lbl{font-family:Fredoka,sans-serif;font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.q{font-size:19px;font-weight:700}
.rule{border:3px dashed var(--red);border-radius:18px;padding:12px 14px;background:#fff}
.rule .lbl{color:var(--red)}
.rule ul{margin:0;padding-left:20px}
.rule li{margin:4px 0}
.reads{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rd{background:#f3f6fb;border-radius:14px;padding:8px 10px}
.rd span{display:block;font-size:13px;color:var(--muted)}
.rd b{font-family:Fredoka,sans-serif;font-weight:600;font-size:22px}
.rd.wide{grid-column:1/-1}
.bar{height:14px;border-radius:999px;background:#e6ebf3;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:999px;transition:width .15s}
/* equation view */
.eqview{display:none;min-height:420px;padding:10px 6px;background:#f6f8fc;border-radius:14px}
.eqrow{display:flex;align-items:center;justify-content:center;gap:18px;height:230px;font-family:Fredoka,sans-serif;font-weight:600}
.big{display:inline-flex;flex-direction:column;align-items:center;transition:font-size .2s;line-height:1}
.big small{font-size:15px;font-weight:500;color:var(--muted);margin-top:4px}
.op{font-size:64px;color:#8d99b0}
.k{font-size:80px;color:#8d99b0}
.frac{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.fr{display:flex;align-items:center;gap:6px;padding-left:46px}
.frac hr{width:100%;min-width:120px;border:0;border-top:6px solid var(--ink);margin:2px 0;border-radius:3px}
.arrowtag{font-size:40px;margin-left:4px}
.up{color:var(--coral)}.down{color:var(--blue)}
.nums{text-align:center;font-family:Fredoka,sans-serif;font-size:24px;margin:4px 0 10px}
.pair{text-align:center;font-size:19px;margin:8px auto;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px;max-width:640px}
.chip{display:block;width:max-content;max-width:100%;margin:10px auto 0;font-family:Fredoka,sans-serif;font-size:19px;padding:8px 16px;border-radius:999px;background:var(--accent);color:#fff}
.bars2{display:grid;grid-template-columns:110px 1fr 90px;gap:8px 12px;align-items:center;max-width:560px;margin:8px auto 0;font-family:Fredoka,sans-serif}
.bars2 .bar{height:20px;margin:0}
/* combined strip */
.cstrip{margin-top:12px;background:#f6f8fc;border-radius:14px;padding:12px}
.ceq{display:flex;align-items:center;justify-content:center;gap:22px;font-family:Fredoka,sans-serif;font-weight:600;font-size:40px;flex-wrap:wrap}
.cf{display:inline-flex;flex-direction:column;align-items:center}
.cf hr{width:100%;min-width:110px;border:0;border-top:4px solid var(--ink);margin:2px 0}
.v{position:relative;display:inline-block;padding:0 2px}
.v.x{color:#b3bccb}
.v.x::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;border-top:5px solid var(--red);transform:rotate(-20deg)}
.lawname{text-align:center;font-family:Fredoka,sans-serif;font-size:21px;margin-top:8px;color:var(--accent);min-height:28px}
.holds{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
sub{font-size:.6em}
/* ===== practice problems ===== */
#gpanel{display:none}
.step.done b{background:#2e9e5b;color:#fff}
.modebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.seg button{border:none;background:#fff;padding:8px 16px;font-size:16px;cursor:pointer;color:var(--ink);font-family:Fredoka,sans-serif;font-weight:500}
.seg button.on{background:var(--accent);color:#fff}
.small{font-size:14px;color:var(--muted)}
.task{font-size:18px;background:#f3f6fb;border-radius:14px;padding:10px 14px;margin-bottom:10px}
.lvl{display:inline-block;font-family:Fredoka,sans-serif;font-size:13px;padding:2px 10px;border-radius:999px;color:#fff;margin-right:6px;vertical-align:2px}
.steps3{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.st{border:2px solid var(--line);border-radius:16px;padding:10px 14px;display:none;background:#fff}
.st.on{display:block;animation:fadein .45s ease}
.st.cur{border-color:var(--accent)}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.st .sh{display:flex;align-items:center;gap:8px;font-family:Fredoka,sans-serif;font-weight:600;font-size:18px}
.st .sh .n{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px;flex:none}
.st .ln{font-size:17px;margin-top:6px;line-height:1.6}
.st .why{font-size:16px;color:var(--muted)}
.stepbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.stepdots{display:flex;gap:6px}
.stepdots i{width:11px;height:11px;border-radius:50%;background:var(--line);display:block}
.stepdots i.on{background:var(--accent)}
.hintbox{display:none;margin-top:10px;background:#fff4e5;border:2px solid #e8962a;border-radius:14px;padding:10px 14px;font-size:16px}
.hintbox.on{display:block}
.feedback{margin-top:10px;font-size:17px}
.feedback .bad{color:#d8434a;font-family:Fredoka,sans-serif;font-weight:600}.feedback .good{color:#2e9e5b;font-family:Fredoka,sans-serif;font-weight:600}
.feedback ul{margin:4px 0 0;padding-left:20px}.feedback li{margin:3px 0}
/* equations */
.geq{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-family:Fredoka,sans-serif;font-weight:600;font-size:26px;margin:8px 0;padding:8px;border-radius:12px;background:#f6f8fc}
.geq .eqs{color:#8d99b0}
.gt{display:inline-flex;align-items:baseline;padding:2px 9px;border-radius:9px;color:#fff;font-family:Fredoka,sans-serif;font-weight:600;font-size:22px;line-height:1.25;margin:1px}
.gt sub{font-size:.62em}
.t-P{background:#0f8b8d}.t-V{background:#2b59c3}.t-T{background:#d8434a}
.gt.x{position:relative;opacity:.45}
.gt.x::after{content:"";position:absolute;left:-3px;right:-3px;top:50%;border-top:4px solid #18233a;transform:rotate(-18deg)}
.gf{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle}
.gf>span{display:flex;gap:2px;justify-content:center;padding:2px 4px}
.gf>span+span{border-top:4px solid #18233a}
.gop{display:inline-block;font-family:Fredoka,sans-serif;font-size:15px;color:#fff;background:#8a4fbf;border-radius:999px;padding:3px 12px;margin:4px 0}
.gv{font-family:Fredoka,sans-serif;font-weight:600;font-size:20px;padding:0 3px;white-space:nowrap}
.gv u{text-decoration:none}
.gv u.x{text-decoration:line-through;text-decoration-color:#d8434a;text-decoration-thickness:3px;color:#8d99b0}
.gknown{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:8px;margin-top:6px}
.gk{white-space:nowrap;background:#f3f6fb;border-radius:12px;padding:6px 10px;font-family:Fredoka,sans-serif;font-size:18px}
.gk.unk{background:#fff4e5;border:2px dashed #e8962a}
.gk small{display:block;font-family:'Atkinson Hyperlegible',sans-serif;font-size:13px;color:var(--muted)}
.ans{font-family:Fredoka,sans-serif;font-weight:600;font-size:26px;color:var(--accent)}
/* my turn */
.gsec{border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin-top:10px;background:#fff}
.gsec h4{margin:0 0 6px;font-family:Fredoka,sans-serif;font-weight:600;font-size:18px;display:flex;align-items:center;gap:8px}
.gsec h4 .n{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:14px}
.gin{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-family:Fredoka,sans-serif;font-size:19px;margin:6px 0}
.gin input{width:96px;font-family:Fredoka,sans-serif;font-size:19px;font-weight:600;text-align:center;border:2px solid var(--line);border-radius:10px;padding:4px;-webkit-appearance:none;appearance:none;background:#fff;color:var(--ink)}
.gin input.ok{border-color:#2e9e5b;background:#e8f6ee}.gin input.no{border-color:#d8434a;background:#fdeeee}
.mk{font-weight:700;min-width:18px}
.yn{display:inline-flex;gap:6px}
.yn button{font-family:Fredoka,sans-serif;font-size:16px;border:2px solid var(--line);background:#fff;border-radius:10px;padding:4px 14px;cursor:pointer;color:var(--ink)}
.yn button.on{border-color:var(--accent);background:var(--accent);color:#fff}
.gbuild{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;padding:12px;background:#f6f8fc;border-radius:14px}
.gbuild .gx{font-family:Fredoka,sans-serif;font-weight:600;font-size:28px;display:flex;align-items:center;gap:8px}
.gfrac{display:flex;flex-direction:column;align-items:stretch;min-width:240px}
.gz{min-height:52px;border:3px dashed #b7c1d3;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;padding:4px 8px;background:#fff;position:relative}
.gz:empty::before{content:attr(data-ph);font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;color:#8d99b0}
.gz.hov{border-color:#8a4fbf;background:#f6efff}
.gz.ok{border-color:#2e9e5b;border-style:solid}.gz.no{border-color:#d8434a;border-style:solid}
.gbar{height:5px;background:#18233a;border-radius:3px;margin:6px 0}
.gtray{margin-top:10px;min-height:52px;border:2px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;padding:6px;background:#fff}
.gtray:empty::before{content:"(all tiles used)";font-size:14px;color:#8d99b0}
.gtray .gt,.gz .gt{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:24px;padding:4px 12px}
.ghost{position:fixed;pointer-events:none;z-index:99;opacity:.9;transform:translate(-50%,-50%) scale(1.1);box-shadow:0 6px 14px rgba(0,0,0,.25)}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.facts span{background:#f3f6fb;border-radius:999px;padding:3px 12px;font-family:Fredoka,sans-serif;font-size:15px}
/* lesson cards */
.calc{display:inline-block;background:#18233a;color:#7CFC9A;font-family:'Courier New',monospace;font-size:22px;padding:6px 14px;border-radius:10px;min-width:150px;text-align:right}
.calc.err{color:#ff6b6b}
.bad2{color:#d8434a;font-weight:700}.good2{color:#2e9e5b;font-weight:700}
.vs{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.vs>div{flex:1 1 220px;border-radius:14px;padding:10px;text-align:center;background:#f6f8fc}
.vs svg{display:block;margin:0 auto}

.ktab{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.kh{font-family:Fredoka,sans-serif;font-weight:600;font-size:16px;text-align:center;color:#fff;background:var(--accent);border-radius:10px;padding:4px}
.kc{background:#f3f6fb;border-radius:12px;padding:6px 10px;font-family:Fredoka,sans-serif;font-size:18px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kc.unk{background:#fff4e5;border:2px dashed #e8962a}
.kc.ng{color:#8d99b0;background:#f8f9fc}
.kc input{width:84px;font-family:Fredoka,sans-serif;font-size:18px;font-weight:600;text-align:center;border:2px solid var(--line);border-radius:10px;padding:3px;background:#fff;color:var(--ink)}
.kc input:disabled{background:#eef1f6}
.kc input.ok{border-color:#2e9e5b;background:#e8f6ee}.kc input.no{border-color:#d8434a;background:#fdeeee}
.kc select,.gin select{font-family:Fredoka,sans-serif;font-size:16px;border:2px solid var(--line);border-radius:10px;padding:3px 4px;background:#fff;color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg width="54" height="54" viewBox="0 0 54 54" aria-hidden="true">
      <rect x="12" y="14" width="30" height="34" rx="5" fill="#fff" stroke="#18233a" stroke-width="2.5"/>
      <rect x="13.5" y="22" width="27" height="5" fill="#0f8b8d"/>
      <rect x="25" y="4" width="4" height="18" fill="#18233a"/>
      <circle cx="20" cy="35" r="3" fill="#e2708a"/><circle cx="31" cy="40" r="3" fill="#2b59c3"/><circle cx="34" cy="32" r="3" fill="#e8962a"/><circle cx="23" cy="43" r="3" fill="#8a4fbf"/>
    </svg>
    <div><h1>Gas Laws Lab</h1><div class="sub">Pressure, volume and temperature of a fixed amount of gas</div></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div class="steps" id="steps"></div>
  <div class="main">
    <section class="card stage">
      <h2 id="stitle"></h2>
      <canvas id="cv" width="800" height="500"></canvas>
      <div class="eqview" id="eqview"></div>
      <div id="gpanel"></div>
      <div class="controls" id="controls"></div>
    </section>
    <aside class="side">
      <div class="card"><div class="lbl">Think</div><div class="q" id="q"></div></div>
      <div class="card"><div class="lbl">Readings</div><div class="reads" id="reads"></div></div>
      <div class="rule"><div class="lbl">Our rule</div><ul id="rule"></ul></div>
    </aside>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=800,H=500;
function fit(){var d=window.devicePixelRatio||1;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
fit();
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}
function $(id){return document.getElementById(id);}
var INK='#18233a',MUTED='#5a6780',TEAL='#0f8b8d',BLUE='#2b59c3',PLUM='#8a4fbf',AMBER='#e8962a',CORAL='#e2708a',RED='#d8434a',LINE='#c9d4e6';

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function txt(s,x,y,o){o=o||{};ctx.font=(o.w||600)+' '+(o.s||16)+'px Fredoka, sans-serif';ctx.fillStyle=o.c||INK;ctx.textAlign=o.a||'center';ctx.textBaseline=o.b||'middle';ctx.fillText(s,x,y);}
function arrow(x1,y1,x2,y2,col,w){var a=Math.atan2(y2-y1,x2-x1),hl=Math.max(10,w*2.6);ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2-Math.cos(a)*hl*.6,y2-Math.sin(a)*hl*.6);ctx.stroke();ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-hl*Math.cos(a-.45),y2-hl*Math.sin(a-.45));ctx.lineTo(x2-hl*Math.cos(a+.45),y2-hl*Math.sin(a+.45));ctx.closePath();ctx.fill();}
function tcol(T){var t=clamp((T-150)/400,0,1),a=[43,89,195],b=[222,72,58];return 'rgb('+Math.round(lerp(a[0],b[0],t))+','+Math.round(lerp(a[1],b[1],t))+','+Math.round(lerp(a[2],b[2],t))+')';}
function fmt(v,d){return v.toFixed(d);}
function spd(T){return 15+0.45*T;}

/* ---------- gas particles ---------- */
function Gas(n,box,kind){this.r=6;this.p=[];this.sparks=[];this.cnt=0;this.acc=0;this.rate=0;for(var i=0;i<n;i++)this.add(box,kind||0);}
Gas.prototype.add=function(box,kind,x,y){var a=Math.random()*Math.PI*2,r=this.r;var p={x:x!=null?x:box.x+r+Math.random()*(box.w-2*r),y:y!=null?y:box.y+r+Math.random()*(box.h-2*r),vx:Math.cos(a),vy:Math.sin(a),f:.7+Math.random()*.6,kind:kind,free:false,al:1};this.p.push(p);return p;};
Gas.prototype.spark=function(x,y){this.cnt++;if(this.sparks.length<70)this.sparks.push({x:x,y:y,t:.25});};
Gas.prototype.tick=function(dt){this.acc+=dt;if(this.acc>=.5){this.rate=lerp(this.rate,this.cnt/this.acc,.5);this.cnt=0;this.acc=0;}for(var i=0;i<this.sparks.length;i++)this.sparks[i].t-=dt;this.sparks=this.sparks.filter(function(s){return s.t>0;});this.p=this.p.filter(function(p){return !p.free||p.al>0;});};
Gas.prototype.step=function(dt,b,speed,onTop){var r=this.r;this.spd=speed;for(var i=0;i<this.p.length;i++){var p=this.p[i];
  if(p.free){p.x+=p.vx*speed*dt;p.y+=p.vy*speed*dt;p.al-=dt*1.1;continue;}
  p.x+=p.vx*speed*p.f*dt;p.y+=p.vy*speed*p.f*dt;var h=false;

var GV={P1:['P',1],V1:['V',1],T1:['T',1],P2:['P',2],V2:['V',2],T2:['T',2]};
function lbl(v){return GV[v][0]+(GV[v][1]===1?'₁':'₂');}
function tl(v,cls){var g=GV[v];return '<span class="gt t-'+g[0]+(cls?' '+cls:'')+'" data-v="'+v+'">'+g[0]+'<sub>'+g[1]+'</sub></span>';}
function tls(a,strike){return a.map(function(v){return tl(v,strike&&strike.indexOf(v)>=0?'x':'');}).join('');}
function gfr(top,bot){if(!bot)return top;return '<span class="gf"><span>'+top+'</span><span>'+bot+'</span></span>';}
function geq(l,r){return '<div class="geq">'+l+'<span class="eqs">=</span>'+r+'</div>';}
function gop(s){return '<div style="text-align:center"><span class="gop">'+s+'</span></div>';}
var GLW={boyle:{n:"Boyle's law",nl:['P1','V1'],dl:[],nr:['P2','V2'],dr:[],why:'P and V change, T stays the same'},
 charles:{n:"Charles's law",nl:['V1'],dl:['T1'],nr:['V2'],dr:['T2'],why:'V and T change, P stays the same'},
 gl:{n:"Gay-Lussac's law",nl:['P1'],dl:['T1'],nr:['P2'],dr:['T2'],why:'P and T change, V stays the same'},
 comb:{n:'Combined gas law',nl:['P1','V1'],dl:['T1'],nr:['P2','V2'],dr:['T2'],why:'P, V and T all change'}};
function without(a,x){var i=a.indexOf(x),b=a.slice();if(i>=0)b.splice(i,1);return b;}
function solveFor(law,X){var L=GLW[law];
 if(L.nr.indexOf(X)>=0)return {top:L.nl.concat(L.dr),bot:L.dl.concat(without(L.nr,X))};
 if(L.nl.indexOf(X)>=0)return {top:L.nr.concat(L.dl),bot:L.dr.concat(without(L.nl,X))};
 if(L.dr.indexOf(X)>=0)return {top:L.nr.concat(L.dl),bot:L.nl.slice()};
 return {top:L.nl.concat(L.dr),bot:L.nr.slice()};}
function lawHtml(law){var L=GLW[law];return geq(gfr(tls(L.nl),L.dl.length?tls(L.dl):''),gfr(tls(L.nr),L.dr.length?tls(L.dr):''));}
function rearr(law,X){var L=GLW[law],out=[lawHtml(law)],left=L.nl,right=L.nr;
 if(L.dl.length){left=L.nl.concat(L.dr);right=L.nr.concat(L.dl);
  out.push(gop('Cross-multiply: (top left × bottom right) = (top right × bottom left)'));out.push(geq(tls(left),tls(right)));}
 var xs=right.indexOf(X)>=0?right:left,os=xs===right?left:right,others=without(xs,X);
 if(xs===left){out.push(gop('Flip the sides so '+lbl(X)+' is on the right (an equation reads the same both ways)'));out.push(geq(tls(os),tls(xs)));}
 if(others.length){var o=others.map(lbl).join('');
  out.push(gop(lbl(X)+' is multiplied by '+others.map(lbl).join(' and ')+' → divide BOTH sides by '+o));
  out.push(geq(gfr(tls(os),tls(others)),gfr(tls(xs,others),tls(others,others))));
  out.push(gop(o+' ÷ '+o+' = 1, so it cancels and '+lbl(X)+' is alone'));}
 out.push(geq(tl(X),gfr(tls(os),others.length?tls(others):'')));
 return out;}

 ['An equation is a balance','<div class="ln">Both sides are equal, like a balance. <b>Whatever you do to one side, you must do to the other side</b>, or it stops balancing.</div><div style="text-align:center">'+balanceSvg+'</div>'+
  geq(plain('3 × x'),plain('12'))+gop('x is multiplied by 3 → divide BOTH sides by 3')+geq(gfr(plain('<s style="text-decoration-color:#d8434a;text-decoration-thickness:3px">3</s> × x'),plain('<s style="text-decoration-color:#d8434a;text-decoration-thickness:3px">3</s>')),gfr(plain('12'),plain('3')))+geq(plain('x'),plain('4'))],
 ["Boyle's law: find V₂",rearr('boyle','V2').join('')],
 ["Charles's law: find V₂",'<div class="ln why">This law has fractions, so first we <b>cross-multiply</b> to get rid of them.</div>'+rearr('charles','V2').join('')],
 ["Gay-Lussac's law: find T₂",'<div class="ln why">T₂ is on the bottom this time. Cross-multiplying brings it up.</div>'+rearr('gl','T2').join('')],
 ['Combined gas law: find V₂',rearr('comb','V2').join('')],
 ['The shortcut','<div class="ln" style="font-size:19px"><b>1.</b> Cross-multiply to get rid of the fractions.<br><b>2.</b> Find what is multiplied with the unknown.<br><b>3.</b> Divide <b>both sides</b> by it. It cancels and the unknown is alone.</div><div class="ln why">Check: in your answer every letter appears exactly once, and the unknown is alone on its side.</div>']];
function thermo(){return '<svg width="280" height="170" viewBox="0 0 280 170"><rect x="125" y="10" width="30" height="130" rx="15" fill="#fff" stroke="#18233a" stroke-width="2"/><circle cx="140" cy="148" r="18" fill="#d8434a"/><rect x="133" y="70" width="14" height="80" fill="#d8434a"/>'+
 [['100 °C','373 K',22],['0 °C','273 K',70],['−273 °C','0 K',134]].map(function(r){return '<line x1="118" y1="'+r[2]+'" x2="162" y2="'+r[2]+'" stroke="#18233a" stroke-width="2"/><text x="112" y="'+(r[2]+5)+'" text-anchor="end" font-family="Fredoka, sans-serif" font-size="15" fill="#d8434a">'+r[0]+'</text><text x="168" y="'+(r[2]+5)+'" font-family="Fredoka, sans-serif" font-size="15" fill="#2b59c3">'+r[1]+'</text>';}).join('')+'</svg>';}
function balloon(r,col,lab){return '<svg width="150" height="150" viewBox="0 0 150 150"><ellipse cx="75" cy="'+(70)+'" rx="'+r+'" ry="'+(r*1.15)+'" fill="'+col+'" fill-opacity=".75" stroke="#18233a" stroke-width="2"/><line x1="75" y1="'+(70+r*1.15)+'" x2="75" y2="148" stroke="#18233a"/></svg><div class="ln">'+lab+'</div>';}
var KCARDS=[
 ['0 °C is not "zero heat"','<div class="vs"><div>'+thermo()+'</div><div style="text-align:left"><div class="ln">0 °C is just where water <b>freezes</b>. Gas particles are still moving fast at 0 °C.</div><div class="ln">The <b>real zero</b>, where particles stop moving, is <b>0 K = −273 °C</b>.</div><div class="ln">Gas laws need a scale that starts at the real zero: <b>kelvin</b>.</div></div></div>'],
 ['Problem 1: dividing by zero','<div class="ln">A gas has a volume of 1.00 L at <b>0 °C</b>. It is heated to 25 °C. Use V₂ = V₁ × T₂ ÷ T₁:</div><div class="vs"><div><b>Using °C</b><div class="ln">V₂ = 1.00 × 25 ÷ <span class="bad2">0</span></div><div class="calc err">Error</div><div class="ln bad2">You can never divide by zero. No answer!</div></div><div><b>Using K</b><div class="ln">V₂ = 1.00 × 298 ÷ 273</div><div class="calc">1.09</div><div class="ln good2">1.09 L ✓</div></div></div>'],
 ['Problem 2: impossible negative answers','<div class="ln">Example Problem 3: 5.00 atm at 25.0 °C, cooled to <b>−10.0 °C</b>. P₂ = P₁ × T₂ ÷ T₁:</div><div class="vs"><div><b>Using °C</b><div class="ln">P₂ = 5.00 × (−10.0) ÷ 25.0</div><div class="calc err">-2.00</div><div class="ln bad2">A negative pressure? Impossible!</div></div><div><b>Using K</b><div class="ln">P₂ = 5.00 × 263 ÷ 298</div><div class="calc">4.41</div><div class="ln good2">4.41 atm ✓</div></div></div>'],
 ['Problem 3: wrong sizes','<div class="ln">A balloon is warmed from 10 °C to 20 °C. Did the temperature really <b>double</b>?</div><div class="vs"><div><b>Using °C</b>'+balloon(60,'#e2708a','20 ÷ 10 = 2 → the balloon <span class="bad2">doubles</span>? No!')+'</div><div><b>Using K</b>'+balloon(39,'#0f8b8d','293 ÷ 283 = 1.04 → only <span class="good2">4% bigger</span> ✓')+'</div></div>'],
 ['"Why can\'t I just cancel the 273?"','<div class="ln">With kelvin, Charles\'s law gives V₂ = V₁ × (75.0 + 273) ÷ (40.0 + 273). It is tempting to cross out the 273s:</div>'+
  geq(gfr(plain('75.0 + <s style="text-decoration-color:#d8434a;text-decoration-thickness:3px">273</s>'),plain('40.0 + <s style="text-decoration-color:#d8434a;text-decoration-thickness:3px">273</s>')),plain('<span class="bad2">✗ NOT allowed</span>'))+
  '<div class="ln">You can only cancel numbers that are <b>multiplied</b>, never numbers that are <b>added</b>. Try it with small numbers:</div>'+
  '<div class="vs"><div><b>Added: can\'t cancel</b><div class="ln">(2 + 1) ÷ (3 + 1) = 3 ÷ 4 = <b>0.75</b></div><div class="ln bad2">Cancel the 1s → 2 ÷ 3 = 0.67 ✗ different!</div></div><div><b>Multiplied: can cancel</b><div class="ln">(2 × 5) ÷ (3 × 5) = 10 ÷ 15 = <b>0.67</b></div><div class="ln good2">Cancel the 5s → 2 ÷ 3 = 0.67 ✓ same!</div></div></div><div class="ln">So: 348 ÷ 313 = <b>1.11</b> (correct), but 75 ÷ 40 = 1.88 (wrong). <b>Always add 273 first.</b></div>']];
var UCARDS=[
 ['Same pressure, different numbers','<div class="ln">These are all the <b>same</b> pressure, just written in different units:</div><div class="geq">'+plain('1 atm')+'<span class="eqs">=</span>'+plain('101.3 kPa')+'<span class="eqs">=</span>'+plain('760 mm Hg')+'</div><div class="ln">Volumes too: <b>1 L = 1000 mL</b>.</div>'],
 ['What goes wrong if we mix them?','<div class="ln">2.50 L of gas at 101.3 kPa is <b>squeezed</b> to 1.50 atm. Boyle: V₂ = V₁ × P₁ ÷ P₂</div><div class="vs"><div><b>Mixed units</b><div class="ln">2.50 × 101.3 ÷ 1.50</div><div class="calc err">168.8</div><div class="ln bad2">The gas was squeezed but became 68 times bigger? Impossible!</div></div><div><b>Same units</b><div class="ln">1.50 atm = 152 kPa<br>2.50 × 101.3 ÷ 152</div><div class="calc">1.67</div><div class="ln good2">1.67 L: smaller, as expected ✓</div></div></div>'],
 ['How to convert','<div class="ln">Multiply or divide by the conversion number:</div><div class="ln" style="font-family:Fredoka,sans-serif;font-size:20px">atm → kPa: × 101.3 &nbsp;·&nbsp; kPa → atm: ÷ 101.3<br>L → mL: × 1000 &nbsp;·&nbsp; mL → L: ÷ 1000<br>°C → K: + 273</div><div class="ln why">It does not matter which one you convert, as long as P₁ and P₂ end up in the <b>same</b> unit, and V₁ and V₂ end up in the <b>same</b> unit.</div>'],
 ['Units cancel too','<div class="ln">When the units match, they cancel just like numbers, and only the unit of the answer is left:</div>'+geq(tl('V2'),gfr('<span class="gv">(2.50 L)</span><span class="gv">(101.3 <u class="x">kPa</u>)</span>','<span class="gv">(152 <u class="x">kPa</u>)</span>'))+'<div class="ln" style="text-align:center">kPa ÷ kPa cancels → the answer is in <b>L</b> ✓</div>']];
function panelScene(o){return {title:o.title,canvas:false,panel:true,q:o.q,rule:o.rule,reads:o.reads||[],controls:function(){return '';},init:o.init,bind:function(){},update:function(){},draw:function(){},read:o.read||function(){return {};}};}

S.gpR=panelScene({title:'How to rearrange a gas law equation',q:'What must you always do to BOTH sides of an equation?',rule:GRULE,init:function(){lesson('r',RCARDS);}});

S.gpU=panelScene({title:'Pressures and volumes must have the same units',q:'Is 1 atm bigger, smaller or the same as 101.3 kPa?',rule:GRULE,init:function(){lesson('u',UCARDS);}});

 {id:'charles',name:"Charles's Law",c:'#e2708a',steps:[['Balloon on a bottle','charlesDemo'],['Explore','charlesSim'],['The equation','charlesEq']]},

 Array.prototype.forEach.call($('steps').children,function(b){b.onclick=function(){go(li,+b.getAttribute('data-i'));};});}
