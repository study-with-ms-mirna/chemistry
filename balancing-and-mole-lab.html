<!doctype html>

<title>Balancing &amp; Mole Basics Lab</title>

<style>
:root{--bg:#eaf0f8;--grid:#dbe4f1;--ink:#18233a;--muted:#5a6780;--line:#c9d4e6;--shadow:#c3cfe3;--teal:#0f8b8d;--blue:#2b59c3;--plum:#8a4fbf;--amber:#e8962a;--coral:#e2708a;--red:#d8434a;--green:#2e9e5b;--accent:#0f8b8d}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.4}
.wrap{max-width:1260px;margin:0 auto;padding:18px 20px 34px}
header{display:flex;align-items:center;gap:14px;margin-bottom:16px}
header svg{flex:none}
h1{font-family:Fredoka,sans-serif;font-weight:600;font-size:32px;margin:0;line-height:1.1}
.sub{color:var(--muted);font-size:16px}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tab{font-family:Fredoka,sans-serif;font-weight:500;font-size:17px;padding:9px 15px;border-radius:16px;border:2px solid var(--line);background:#fff;box-shadow:0 4px 0 var(--shadow);cursor:pointer;display:flex;align-items:center;gap:8px}

.tab.on i{background:#fff}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

.step b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--line);font-weight:600;font-size:14px}
.step.on{border-color:var(--accent);color:var(--accent)}
.step.on b{background:var(--accent);color:#fff}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}

.card{background:#fff;border:2px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--shadow);padding:16px}

.side{display:flex;flex-direction:column;gap:14px}

.rule{border:3px dashed var(--red);border-radius:18px;padding:12px 14px;background:#fff}

.reads{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn.fill,.btn.sel{background:var(--accent);color:#fff}

.bar-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.seg button{border:none;background:#fff;padding:8px 16px;font-size:16px;cursor:pointer;font-family:Fredoka,sans-serif;font-weight:500}
.seg button.on{background:var(--accent);color:#fff}
.small{font-size:14px;color:var(--muted)}
.task{font-size:18px;background:#f3f6fb;border-radius:14px;padding:10px 14px;margin-bottom:10px}
.fb{margin-top:12px;border-radius:14px;padding:10px 14px;font-size:17px;border:2px solid var(--line);background:#f3f6fb}
.fb.ok{background:#e8f6ee;border-color:var(--green)}.fb.bad{background:#fdeeee;border-color:var(--red)}.fb.hint{background:#fff6e8;border-color:var(--amber)}
.fb:empty{display:none}

input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;background:var(--accent);border:4px solid #fff;box-shadow:0 0 0 2px var(--accent),0 2px 3px rgba(0,0,0,.25);cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:4px solid #fff;box-shadow:0 0 0 2px var(--accent);cursor:pointer}
.ctl{display:flex;align-items:center;gap:10px;font-family:Fredoka,sans-serif;font-size:16px;flex-wrap:wrap}
.ctl output{font-weight:600;color:var(--accent);min-width:70px}
select,.inp{font-family:Fredoka,sans-serif;font-size:18px;border:2px solid var(--line);border-radius:10px;padding:5px 10px;background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none}
.inp{width:100px;text-align:center}.inp.e{width:62px}
.inp.ok,select.ok{border-color:var(--green);background:#e8f6ee}.inp.no,select.no{border-color:var(--red);background:#fdeeee}

.eq{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:stretch;background:#f6f8fc;border-radius:16px;padding:14px}
.sp{background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 10px;text-align:center;min-width:120px;max-width:100%;flex:0 1 auto;display:flex;flex-direction:column;align-items:center}

.stp button{width:32px;height:32px;border-radius:50%;border:2px solid var(--accent);background:#fff;color:var(--accent);font-family:Fredoka,sans-serif;font-size:20px;line-height:1;cursor:pointer;padding:0}
.stp b{min-width:24px;font-family:Fredoka,sans-serif;font-size:22px}
.tray{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-items:center;margin-top:8px;max-width:270px}
.tally{width:100%;border-collapse:collapse;margin-top:12px;font-size:16px}
.tally th{font-family:Fredoka,sans-serif;font-weight:500;color:var(--muted);text-align:center;padding:4px 6px}
.tally td{padding:5px 6px;border-top:2px solid #eef2f8;text-align:center}
.tally .cnt{font-family:Fredoka,sans-serif;font-weight:600;font-size:21px}
.tally .y{color:var(--green)}.tally .n{color:var(--red)}
.dots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;min-height:14px;max-width:170px;margin:auto}

.ss4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}

.ss{border:2px solid var(--line);border-radius:14px;padding:8px 10px;font-size:15px;line-height:1.3;background:#fff}

.ss.on{border-color:var(--accent);background:#f3f8fb;box-shadow:0 0 0 3px rgba(15,139,141,.12)}
.ss.done b{color:var(--green)}
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

.ptabs button.on{border-color:var(--accent);color:var(--accent)}
.ptabs button.done{background:#e8f6ee;border-color:var(--green)}
/* mole visuals */
.vis{background:#f6f8fc;border-radius:16px;padding:14px;min-height:150px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center}
.pack{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.pack .g{display:grid;gap:2px;justify-content:center}
.pack .g i{display:block;border-radius:50%;background:var(--accent)}
.pack.mole{width:150px;height:110px;display:grid;place-items:center;background:var(--accent);color:#fff;font-family:Fredoka,sans-serif;font-weight:600;border-color:var(--accent);font-size:20px}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.num{background:#f3f6fb;border-radius:14px;padding:10px 12px}
.num span{display:block;font-size:14px;color:var(--muted)}
.num b{font-family:Fredoka,sans-serif;font-weight:600;font-size:22px}
.mrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;border-radius:12px;background:#f6f8fc;margin-top:6px;font-size:18px}
.mrow.tot{background:var(--accent);color:#fff;font-family:Fredoka,sans-serif;font-weight:600;font-size:21px}
/* map */
.map{display:grid;grid-template-columns:1fr 1.1fr 1fr 1.1fr 1fr;gap:6px;align-items:center}

.box{border:3px solid var(--line);border-radius:18px;background:#fff;padding:12px 8px;text-align:center}
.box h3{font-family:Fredoka,sans-serif;font-weight:600;font-size:17px;margin:0 0 4px}
.box b{font-family:Fredoka,sans-serif;font-weight:600;font-size:21px;display:block}
.box.mid{border-color:var(--accent);background:#f3f8fb}
.box.hl{box-shadow:0 0 0 4px rgba(232,150,42,.45);border-color:var(--amber)}
.arw{display:flex;flex-direction:column;gap:6px}
.arw button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:4px 6px;cursor:pointer;font-size:14px;font-family:Fredoka,sans-serif;min-height:48px}
.arw button.on{background:var(--amber);border-color:var(--amber);color:#fff}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.15}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 4px 1px}
.fr>span:last-child{padding:1px 4px 0}
.can{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.calc{font-family:Fredoka,sans-serif;font-size:21px;font-weight:500;background:#f6f8fc;border-radius:14px;padding:12px 14px;margin-top:12px;line-height:1.9}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font-family:Fredoka,sans-serif;font-size:17px;border:2px solid var(--line);border-radius:14px;background:#fff;padding:8px 14px;cursor:pointer}
.opt.on{border-color:var(--accent);background:#f3f8fb}
.opt.ok{border-color:var(--green);background:#e8f6ee}.opt.no{border-color:var(--red);background:#fdeeee}
.st{border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin-top:10px;background:#fff}
.st.cur{border-color:var(--accent)}
.st .sh{display:flex;align-items:center;gap:8px;font-family:Fredoka,sans-serif;font-weight:600;font-size:18px;margin-bottom:6px}
.st .sh i{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px;font-style:normal;flex:none}
.st.dn .sh i{background:var(--green)}
.fld{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.ln{font-size:18px;line-height:1.8}
.why{font-size:16px;color:var(--muted)}
.scale{display:block;width:100%;max-width:560px;margin:auto}
table.rec{width:100%;border-collapse:collapse;margin-top:12px;font-size:16px}
table.rec th,table.rec td{padding:7px;border-bottom:2px solid #eef2f8;text-align:center}
table.rec th{font-family:Fredoka,sans-serif;font-weight:500;color:var(--muted)}
.qz .o{display:block;width:100%;text-align:left;margin-top:8px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--line);margin-right:4px}.dot.g{background:var(--green)}.dot.r{background:var(--red)}
.ss3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
@media (max-width:700px){.ss3{grid-template-columns:1fr}}
.pt{width:100%;max-width:520px;margin:12px auto 0;border-collapse:collapse;font-size:20px}
.pt th{font-family:Fredoka,sans-serif;font-weight:600;background:#f3f6fb;border:2px solid var(--line);padding:6px}
.pt td{border:2px solid var(--line);padding:8px 12px;vertical-align:top;width:50%}
.at{min-height:42px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.at.y b{color:var(--green)}.at.n b{color:var(--red)}
.mul{color:var(--red);font-weight:700}
.inp.sm{width:66px;padding:4px 6px}
.final{text-align:center;font-family:Fredoka,sans-serif;font-weight:600;font-size:24px;margin-top:12px}
.tris{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:flex-start;margin:8px 0}
.trc{text-align:center;flex:1 1 240px}
.calcrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:12px}.calcrow .calc{flex:1 1 300px;margin-top:0}
.rbwrap{overflow-x:auto;background:#f6f8fc;border-radius:16px;padding:12px}
.rb{border-collapse:collapse;margin:auto;font-size:18px}
.rb th{font-family:Fredoka,sans-serif;font-weight:500;color:var(--muted);text-align:right;padding:8px 12px 8px 0;white-space:nowrap}
.rb td{text-align:center;padding:8px 6px;white-space:nowrap}
.rb .eqc{font-family:Fredoka,sans-serif;font-weight:600;font-size:26px}.rb .eqc em{font-style:normal;color:var(--red)}
.rb .sepc{font-family:Fredoka,sans-serif;font-weight:600;font-size:20px;color:var(--muted)}
.rb .v{font-family:Fredoka,sans-serif;font-weight:500}.rb .fresh{color:var(--accent);font-weight:600}
.dock{position:fixed;right:16px;bottom:14px;display:flex;gap:8px;z-index:40}
.dock .btn{background:#18233a;border-color:#18233a;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.tool{position:fixed;z-index:50;right:16px;bottom:66px;background:#fff;border:2px solid #18233a;border-radius:18px;box-shadow:0 8px 28px rgba(24,35,58,.3);padding:12px;display:none}
.tool.on{display:block}
.tool h3{font-family:Fredoka,sans-serif;font-weight:600;font-size:18px;margin:0;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tool h3 button{border:none;background:none;font-size:24px;line-height:1;cursor:pointer;padding:0 6px}
#ptool{width:min(980px,calc(100vw - 32px));max-height:calc(100vh - 90px);overflow:auto}
.pgrid{display:grid;grid-template-columns:repeat(18,minmax(44px,1fr));gap:2px;min-width:820px}
.pel{border-radius:5px;background:#eef2f8;padding:2px 1px;text-align:center;line-height:1.05;font-size:10px}
.pel b{display:block;font-family:Fredoka,sans-serif;font-size:15px;font-weight:600}
.pel.met{background:#dcecf7}.pel.non{background:#fdeed2}.pel.noble{background:#efe3f8}.pel.lan{background:#def3e6}
#ctool{width:280px}
#cdisp{width:100%;font-family:Fredoka,sans-serif;font-size:21px;text-align:right;border:2px solid var(--line);border-radius:10px;padding:8px;min-height:64px;overflow-wrap:anywhere;background:#f6f8fc}
#cdisp small{display:block;color:var(--muted);font-size:14px;min-height:18px}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.cgrid button{font-family:Fredoka,sans-serif;font-size:17px;padding:9px 2px;border:2px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}
.cgrid button.o{background:#f3f6fb}.cgrid button.e{background:var(--accent);border-color:var(--accent);color:#fff}
.wrap{padding-bottom:76px}
</style>
</head>

 if(k==='⌫'){ex=ex.slice(0,-1);show(pretty(ex));return;}
 if(k==='='){try{ans=calc(ex);hist=pretty(ex)+' =';show(fmt(ans));ex='';fresh=true;}catch(e){hist='';show('Check your entry');}return;}
 var numeric=/^[\d.]$/.test(k);if(fresh&&!numeric&&k!=='('&&k!=='Ans'&&k!=='Nₐ'&&k!=='×10ⁿ'){ex=String(ans).replace('e+','E').replace('e-','E−').toUpperCase();}fresh=false;
 if(k==='×10ⁿ')ex+='E';else if(k==='Nₐ')ex+='6.02E23';else if(k==='Ans')ex+=String(ans).replace('e+','E').replace('e-','E−').toUpperCase();else ex+=k;show(pretty(ex));};
})();
