<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rate Laws Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf0f8;--grid:#dbe4f1;--ink:#18233a;--muted:#5a6780;--line:#c9d4e6;--shadow:#c3cfe3;
--teal:#0f8b8d;--blue:#2b59c3;--plum:#8a4fbf;--amber:#e8962a;--coral:#e2708a;--red:#d8434a;--accent:#0f8b8d}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.4}
.wrap{max-width:1260px;margin:0 auto;padding:18px 20px 34px}
header{display:flex;align-items:center;gap:14px;margin-bottom:16px}
header svg{flex:none}
h1{font-family:Fredoka,sans-serif;font-weight:600;font-size:32px;margin:0;line-height:1.1}
.sub{color:var(--muted);font-size:16px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
.tab{font-family:Fredoka,sans-serif;font-weight:500;font-size:18px;padding:10px 18px;border-radius:16px;border:2px solid var(--line);background:#fff;box-shadow:0 4px 0 var(--shadow);cursor:pointer;display:flex;align-items:center;gap:8px}
.tab i{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-block}
.tab.on{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 4px 0 rgba(24,35,58,.22)}
.tab.on i{background:#fff}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.step{font-family:Fredoka,sans-serif;font-size:16px;padding:6px 14px 6px 7px;border-radius:999px;border:2px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;gap:8px}
.step b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--line);font-weight:600;font-size:14px}
.step.on{border-color:var(--accent);color:var(--accent)}
.step.on b{background:var(--accent);color:#fff}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:960px){.main{grid-template-columns:1fr}}
.card{background:#fff;border:2px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--shadow);padding:16px}
.stage h2{font-family:Fredoka,sans-serif;font-weight:600;font-size:22px;margin:0 0 10px;color:var(--accent)}
canvas{width:100%;height:auto;display:block;border-radius:14px;background:#f6f8fc}
.controls{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin-top:14px}
.ctl{display:flex;align-items:center;gap:10px;font-family:Fredoka,sans-serif;font-size:16px}
.ctl output{min-width:84px;font-weight:600;color:var(--accent)}
.btn{font-family:Fredoka,sans-serif;font-weight:500;font-size:16px;padding:9px 16px;border-radius:14px;border:2px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer;box-shadow:0 3px 0 var(--shadow)}
.btn.fill{background:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn.sel{background:var(--accent);color:#fff}
input[type=range]{-webkit-appearance:none;appearance:none;width:260px;max-width:60vw;height:10px;border-radius:999px;background:#dfe6f2;outline:none;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;background:var(--accent);border:4px solid #fff;box-shadow:0 0 0 2px var(--accent),0 2px 3px rgba(0,0,0,.25);cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:4px solid #fff;box-shadow:0 0 0 2px var(--accent);cursor:pointer}
input[type=range]:disabled{opacity:.4}
.side{display:flex;flex-direction:column;gap:14px}
.lbl{font-family:Fredoka,sans-serif;font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.q{font-size:19px;font-weight:700}
.rule{border:3px dashed var(--red);border-radius:18px;padding:12px 14px;background:#fff}
.rule .lbl{color:var(--red)}
.rule ul{margin:0;padding-left:20px}
.rule li{margin:4px 0}
.reads{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rd{background:#f3f6fb;border-radius:14px;padding:8px 10px}
.rd span{display:block;font-size:13px;color:var(--muted)}
.rd b{font-family:Fredoka,sans-serif;font-weight:600;font-size:22px}
.rd.wide{grid-column:1/-1}
.bar{height:14px;border-radius:999px;background:#e6ebf3;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:999px;transition:width .15s}
.reads .rd b{font-size:19px}
.step.done b{background:#2e9e5b;color:#fff}
.fb{margin-top:12px;border-radius:14px;padding:10px 14px;font-size:17px;background:#f3f6fb;border:2px solid var(--line);display:none}
.fb.show{display:block}
.fb.ok{background:#e8f6ee;border-color:#2e9e5b}
.fb.bad{background:#fdeeee;border-color:#d8434a}
.fb.hint{background:#fff6e8;border-color:#e8962a}
.cnt{display:none;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-top:12px;padding:10px 14px;border-radius:14px;background:#f6f8fc}
.cnt.show{display:flex}
.stp{display:inline-flex;align-items:center;gap:8px;font-family:Fredoka,sans-serif;font-size:17px}
.stp button{width:34px;height:34px;border-radius:50%;border:2px solid var(--accent);background:#fff;color:var(--accent);font-family:Fredoka,sans-serif;font-size:20px;line-height:1;cursor:pointer;padding:0}
.stp b{min-width:26px;text-align:center;font-size:22px}
#cv.click{cursor:pointer}
sub{font-size:.65em}
.tab{font-size:15.5px;padding:8px 12px}
/* extra2 */
/* ===== show me / my turn panels ===== */
.modebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0 10px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.seg button{border:none;background:#fff;padding:8px 16px;font-size:16px;cursor:pointer;color:var(--ink);font-family:Fredoka,sans-serif;font-weight:500}
.seg button.on{background:var(--accent);color:#fff}
.small{font-size:14px;color:var(--muted)}
.task{font-size:18px;background:#f3f6fb;border-radius:14px;padding:10px 14px;margin-bottom:10px}
.molbox{display:flex;justify-content:center;align-items:center;background:#f6f8fc;border-radius:16px;padding:14px;min-height:150px}
.molbox svg{max-width:100%;height:auto}
.steps3{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.st{border:2px solid var(--line);border-radius:16px;padding:10px 14px;display:none;background:#fff}
.st.on{display:block;animation:fadein .45s ease}
.st.cur{border-color:var(--accent)}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.st .sh{display:flex;align-items:center;gap:8px;font-family:Fredoka,sans-serif;font-weight:600;font-size:18px}
.st .sh .n{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px;flex:none}
.st .ln{font-size:17px;margin-top:6px;line-height:1.6}
.st .mth{font-family:Fredoka,sans-serif;font-size:23px;font-weight:600}
.st .why{font-size:16px;color:var(--muted)}
.sg{color:#0f8b8d;font-weight:700}.pp{color:#e2708a;font-weight:700}
.stepbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.stepdots{display:flex;gap:6px}
.stepdots i{width:11px;height:11px;border-radius:50%;background:var(--line);display:block}
.stepdots i.on{background:var(--accent)}
.hintbox{display:none;margin-top:10px;background:#fff4e5;border:2px solid #e8962a;border-radius:14px;padding:10px 14px;font-size:16px}
.hintbox.on{display:block}
.feedback{margin-top:10px;font-size:17px}
.feedback .bad{color:#d8434a;font-family:Fredoka,sans-serif;font-weight:600}.feedback .good{color:#2e9e5b;font-family:Fredoka,sans-serif;font-weight:600}
.feedback ul{margin:4px 0 0;padding-left:20px}
.ansrow{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:12px;font-family:Fredoka,sans-serif;font-size:20px}
.ansrow input{width:70px;font-family:Fredoka,sans-serif;font-size:22px;font-weight:600;text-align:center;border:2px solid var(--line);border-radius:10px;padding:4px;-webkit-appearance:none;appearance:none;background:#fff;color:var(--ink)}
.ansrow input.ok{border-color:#2e9e5b;background:#e8f6ee}.ansrow input.no{border-color:#d8434a;background:#fdeeee}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:700px){.sumgrid{grid-template-columns:1fr}}
.sumc{border:2px solid var(--line);border-radius:18px;padding:12px;text-align:center;background:#fff}
.sumc h3{font-family:Fredoka,sans-serif;font-weight:600;font-size:20px;margin:0 0 4px}
.sumc .res{font-family:Fredoka,sans-serif;font-weight:600;font-size:26px;margin-top:4px}
.sumc svg{width:100%;height:auto;display:block}
.bigrule{margin-top:12px;border:3px dashed var(--red);border-radius:18px;padding:10px 14px;font-size:18px;text-align:center}
.qcard{font-size:19px;font-weight:700;margin-bottom:12px}
.opts{display:flex;gap:12px;flex-wrap:wrap}
.opt{flex:1 1 180px;border:2px solid var(--line);border-radius:18px;background:#fff;padding:12px;cursor:pointer;text-align:center;font-family:Fredoka,sans-serif;font-size:18px;box-shadow:0 4px 0 var(--shadow);color:var(--ink)}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:#2e9e5b;background:#e8f6ee}.opt.wrong{border-color:#d8434a;background:#fdeeee}
.opt:disabled{cursor:default}
.opt svg{display:block;margin:0 auto 4px}
.opt .val{display:block;font-size:14px;color:var(--muted);margin-top:4px;min-height:18px}
.dt{width:100%;border-collapse:separate;border-spacing:0;margin:6px 0;font-family:Fredoka,sans-serif;font-size:17px;text-align:center;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.dt th{background:var(--accent);color:#fff;font-weight:600;padding:7px 6px;font-size:15px}
.dt td{padding:7px 6px;border-top:1px solid #e3e9f2;background:#fff}
.dt tr:nth-child(odd) td{background:#f6f8fc}
.dt tr[data-r]{cursor:pointer}
.dt tr.sel td{background:#fff1cc!important;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.cmp{display:inline-flex;align-items:center;gap:8px;border:2px solid;border-radius:999px;padding:4px 6px 4px 12px;font-family:Fredoka,sans-serif;font-size:17px;background:#fff}
.cmp i{font-style:normal;color:#fff;border-radius:999px;padding:2px 10px;font-weight:600}
.solve{font-family:Fredoka,sans-serif;font-weight:600;font-size:30px;margin:6px 0}
.ladder{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.rung{font-family:Fredoka,sans-serif;font-size:16px;padding:4px 10px;border-radius:10px;background:#eef2f8;color:var(--ink)}
.rung.hit{color:#fff;font-weight:600;transform:scale(1.08)}
.solverow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.big2{font-family:Fredoka,sans-serif;font-weight:600;font-size:21px;margin-top:6px}
.lawbig{font-family:Fredoka,sans-serif;font-weight:600;font-size:32px;text-align:center;margin:10px 0;padding:8px;background:#f6f8fc;border-radius:14px}
.lawsm{font-family:Fredoka,sans-serif;font-weight:600;font-size:20px}
.center{text-align:center;font-size:18px}
.mysteq{font-family:Fredoka,sans-serif;font-weight:600;font-size:28px;text-align:center;padding:10px;background:#f6f8fc;border-radius:14px;margin-bottom:10px}
.mysteq sup.q{color:var(--accent);font-size:.7em}
.runbar,.ansrow2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.runbar .lab,.ansrow2 .lab{font-family:Fredoka,sans-serif;font-size:16px;margin-left:6px}
.ansrow2{font-family:Fredoka,sans-serif;font-size:20px;border-top:2px solid var(--line);padding-top:10px;margin-top:10px}
.cmpbox{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;font-family:Fredoka,sans-serif;font-size:16px}
.cmpbox .cmp{margin:6px 6px 0 0}
.warn{margin-top:8px;color:#d8434a;font-weight:600}
.gsec{border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin-top:10px;background:#fff}
.gsec h4{margin:0 0 6px;font-family:Fredoka,sans-serif;font-weight:600;font-size:19px}
.gin{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-family:Fredoka,sans-serif;font-size:18px;margin:6px 0}
.gin input,.gin select{width:80px;font-family:Fredoka,sans-serif;font-size:18px;font-weight:600;text-align:center;border:2px solid var(--line);border-radius:10px;padding:4px;background:#fff;color:var(--ink)}
.gin select{width:64px}
.gin input.ok,.gin select.ok{border-color:#2e9e5b;background:#e8f6ee}.gin input.no,.gin select.no{border-color:#d8434a;background:#fdeeee}
.good2{color:#2e9e5b;font-weight:700}.bad2{color:#d8434a;font-weight:700}
.mk{min-width:18px}
.hintbox .ladder{display:inline-flex}
/* ===== live session ===== */
.wrap{padding-bottom:90px}
.step.lock{opacity:.45}
.qz{border:2px solid var(--line);border-radius:18px;padding:14px;background:#fff}
.lv-head{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin-bottom:10px;font-family:Fredoka,sans-serif;font-size:17px}
.lv-badge{font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--accent);border-radius:999px;padding:4px 12px}
.lv-pts{margin-left:auto;font-weight:600;color:var(--accent)}
.qzdots{display:flex;gap:6px;flex-wrap:wrap}
.qzdots i{width:13px;height:13px;border-radius:50%;background:var(--line);display:block}
.qzdots i.cur{background:var(--accent)}.qzdots i.ok{background:#2e9e5b}.qzdots i.no{background:#d8434a}
.lv-q{font-size:20px;font-weight:700;line-height:1.45;margin:8px 0 10px}
.lv-q .dt{font-weight:400;max-width:520px}
.lv-eq{font-family:Fredoka,sans-serif;font-weight:600;font-size:22px;text-align:center;background:#f6f8fc;border-radius:12px;padding:8px;margin:8px 0}
.lv-f{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-family:Fredoka,sans-serif;font-size:21px;margin:8px 0}
.lv-f input{width:90px;font-family:Fredoka,sans-serif;font-size:21px;font-weight:600;text-align:center;border:2px solid var(--line);border-radius:10px;padding:5px;background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none}
.lv-f input:focus{outline:none;border-color:var(--accent)}
.lv-f input.ok{border-color:#2e9e5b;background:#e8f6ee}.lv-f input.no{border-color:#d8434a;background:#fdeeee}
.lv-f input:disabled{opacity:1;-webkit-text-fill-color:var(--ink)}
.lv-ch{display:inline-flex;gap:6px;flex-wrap:wrap}
.lv-ch .btn{min-width:46px;font-size:19px;padding:6px 12px}
.btn.right{background:#2e9e5b;border-color:#2e9e5b;color:#fff}.btn.wrong{background:#d8434a;border-color:#d8434a;color:#fff}
.lv-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.lv-opts.tf{max-width:420px}
.lv-opts.one{grid-template-columns:1fr}
.lv-opts>.qzb{min-width:0}
.qzb>span:last-child{min-width:0;overflow-wrap:anywhere}
@media (max-width:700px){.lv-opts{grid-template-columns:1fr}}
.qzb{display:flex;align-items:flex-start;gap:10px;text-align:left;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-size:18px;line-height:1.5;border:2px solid var(--line);border-radius:14px;background:#fff;padding:10px 12px;cursor:pointer;box-shadow:0 3px 0 var(--shadow);color:var(--ink)}
.qzb:hover:not(:disabled){border-color:var(--accent)}
.qzb:disabled{cursor:default}
.qzb .L{flex:none;width:28px;height:28px;border-radius:50%;background:#eef2f8;display:grid;place-items:center;font-family:Fredoka,sans-serif;font-weight:600;font-size:15px}
.qzb.pick{border-color:var(--accent);background:#eef3fc}.qzb.pick .L{background:var(--accent);color:#fff}
.qzb.right{border-color:#2e9e5b;background:#e8f6ee}.qzb.right .L{background:#2e9e5b;color:#fff}
.qzb.wrong{border-color:#d8434a;background:#fdeeee}.qzb.wrong .L{background:#d8434a;color:#fff}
.lvfb{margin-top:12px;border-radius:14px;padding:10px 14px;font-size:17px;border:2px solid}
.lvfb.ok{background:#e8f6ee;border-color:#2e9e5b;animation:pop .4s}.lvfb.no{background:#fdeeee;border-color:#d8434a}
@keyframes pop{0%{transform:scale(.9);opacity:0}60%{transform:scale(1.03);opacity:1}100%{transform:none;opacity:1}}
.five{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:8px;margin:10px 0}
.five div{border:2px solid var(--line);border-radius:14px;padding:6px 9px;background:#fff;font-size:14px;line-height:1.25;display:flex;flex-direction:column;gap:3px}
.five .th{display:flex;align-items:center;gap:6px;font-style:normal;font-family:Fredoka,sans-serif;font-weight:600;font-size:13px;color:var(--muted)}
.five .on .th{color:var(--accent)}
.five b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-family:Fredoka,sans-serif;font-size:13px}
.five .on{border-color:var(--accent);background:#eef3fc}.five .on b{background:var(--accent);color:#fff}
.five .done b{background:#2e9e5b;color:#fff}
.five span{min-width:0;overflow-wrap:break-word}
.work{border:2px dashed var(--accent);border-radius:16px;padding:10px 14px;margin-top:12px;background:#fbfcfe}
.work .wl{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid #e6ebf3;font-family:Fredoka,sans-serif;font-size:19px;animation:fadein .45s ease}
.work .lbl+.wl{border-top:none}
.work .wl>span{flex:none;font-size:13px;color:var(--muted);width:76px}
.x{text-decoration:line-through;text-decoration-color:#d8434a;-webkit-text-decoration-color:#d8434a;text-decoration-thickness:2px;color:#8f9bb0}
.boxed{border:2px solid var(--accent);border-radius:8px;padding:0 8px}
.lvrev{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.lvrev div{border:2px solid var(--line);border-radius:12px;padding:6px 10px;font-size:15px}
.lvrev div.ok{border-color:#2e9e5b;background:#f3fbf6}.lvrev div.no{border-color:#d8434a;background:#fdf4f4}
.sendst{font-family:Fredoka,sans-serif;font-size:14px;color:var(--muted)}.sendst.ok{color:#2e9e5b}.sendst.err{color:#d8434a}
.namerow{display:flex;flex-direction:column;gap:4px;margin:10px 0;max-width:380px}
.namerow label{font-family:Fredoka,sans-serif;font-weight:600}
.namerow input,.namerow select{font:inherit;font-size:18px;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none}
.namerow .no{border-color:#d8434a}
.exerr{color:#d8434a;font-weight:700;min-height:22px;margin:4px 0}
.lv-big{font-family:Fredoka,sans-serif;font-weight:600;font-size:28px;line-height:1.15;margin:2px 0 6px}
.lv-hero,.lv-congrats{display:flex;gap:14px;align-items:center}
.lv-hero svg,.lv-congrats svg{flex:none}
.lv-congrats{background:#e8f6ee;border:2px solid #2e9e5b;border-radius:16px;padding:12px 14px;margin-bottom:14px;animation:pop .5s}
.lv-congrats .lv-big{font-size:24px}
.lv-plan{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
@media (max-width:760px){.lv-plan{grid-template-columns:1fr 1fr}}
.lv-plan div{border:2px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.lv-plan b{font-family:Fredoka,sans-serif;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center}
.lv-plan span{font-family:Fredoka,sans-serif;font-weight:600;font-size:17px}.lv-plan i{font-style:normal;font-size:14px;color:var(--muted)}
.lv-rules{margin:6px 0 10px;padding-left:20px;font-size:17px}
.lv-rules li{margin:3px 0}

</div>
<script>
(function(){
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=800,H=500;
function fit(){var d=window.devicePixelRatio||1;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);}fit();window.addEventListener('resize',fit);
function $(id){return document.getElementById(id);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}
var INK='#18233a',MUTED='#5a6780',LINE='#c9d4e6',TEAL='#0f8b8d',CORAL='#e2708a',AMBER='#e8962a',BLUE='#2b59c3',PLUM='#8a4fbf',RED='#d8434a',GREEN='#2e9e5b';
var OCOL=[BLUE,TEAL,CORAL,PLUM];
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function txt(s,x,y,o){o=o||{};ctx.font=(o.w||600)+' '+(o.s||15)+'px Fredoka, sans-serif';ctx.fillStyle=o.c||INK;ctx.textAlign=o.a||'center';ctx.textBaseline='middle';ctx.fillText(s,x,y);return ctx.measureText(s).width;}
function seg(x1,y1,x2,y2,c,w,dash){ctx.strokeStyle=c;ctx.lineWidth=w||2;ctx.setLineDash(dash||[]);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);}
function pill(s,x,y,bg,fg,size){size=size||15;var w=txt(s,0,-999,{s:size});rr(x-w/2-10,y-size*.85,w+20,size*1.7,size*.85);ctx.fillStyle=bg;ctx.fill();txt(s,x,y,{s:size,c:fg||'#fff'});return w+20;}
function panel(x,y,w,h){rr(x,y,w,h,14);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle=LINE;ctx.lineWidth=2;ctx.stroke();}
function dotc(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.stroke();}
function clear(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#f6f8fc';ctx.fillRect(0,0,W,H);}
function brace(x1,y1,x2,y2,lab,col,side){/* bracket with label: horizontal if y1==y2 */
 ctx.strokeStyle=col;ctx.lineWidth=3;ctx.beginPath();
 if(Math.abs(y1-y2)<1){ctx.moveTo(x1,y1-6);ctx.lineTo(x1,y1);ctx.lineTo(x2,y1);ctx.lineTo(x2,y1-6);ctx.stroke();pill(lab,(x1+x2)/2,y1+(side||18),col,'#fff',15);}
 else{ctx.moveTo(x1+6,y1);ctx.lineTo(x1,y1);ctx.lineTo(x1,y2);ctx.lineTo(x1+6,y2);ctx.stroke();pill(lab,x1-(side||30),(y1+y2)/2,col,'#fff',15);}}
var SUP={'0':'⁰','1':'¹','2':'²','3':'³','-':'⁻'};function sup(n){return String(n).split('').map(function(c){return SUP[c]||c;}).join('');}
function fx(v){if(v===0)return '0';var r=Math.abs(v)>=10?v.toFixed(0):Math.abs(v)>=1?v.toFixed(2).replace(/\.?0+$/,''):v.toFixed(2);return r;}
function fac(f){if(Math.abs(f-1)<1e-6)return '×1';if(Math.abs(f-.5)<1e-6)return '×½';if(Math.abs(f-.25)<1e-6)return '×¼';return '×'+(Math.round(f*100)/100);}

/* side panel */
var lastReads='';
function setQ(h,lbl){$('q').innerHTML=h;$('qlbl').textContent=lbl||'Think';}
function setRule(a){$('rule').innerHTML=a.map(function(s){return '<li>'+s+'</li>';}).join('');}
function setReads(a){var h=a.map(function(r){return '<div class="rd'+(r[2]?' wide':'')+'"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>';}).join('');if(h!==lastReads){$('reads').innerHTML=h;lastReads=h;}}

/* =========================================================
   TAB 1  Orders as graphs: y = c, y = ax, y = ax²
   ========================================================= */
var ORD=[{n:'Zero order',math:'y = c',chem:'rate = k[A]⁰ = k',k:2,f:function(x){return 2;},desc:'a flat line'},
 {n:'First order',math:'y = ax',chem:'rate = k[A]¹',k:1,f:function(x){return x;},desc:'a straight line through 0'},
 {n:'Second order',math:'y = ax²',chem:'rate = k[A]²',k:.25,f:function(x){return .25*x*x;},desc:'a curve that gets steeper'}];
var T1={name:'Orders as graphs',c:TEAL,steps:['Zero order: y = c','First order: y = ax','Second order: y = ax²','Compare all three'],x1:1,mult:2,anim:1,
 title:function(s){return ['Zero order looks like y = c','First order looks like y = ax','Second order looks like y = ax²','Compare: same change in [A], different change in rate'][s];},
 enter:function(s){var me=this;this.s=s;this.anim=0;if(s===2&&this.x1<1.5)this.x1=1.5;
  $('controls').innerHTML='<label class="ctl">Starting [A] <input type="range" id="xsl" min="0.4" max="2" step="0.1"><output id="xo"></output></label><span class="ctl">Change [A]:</span>'+
   [[2,'×2'],[3,'×3'],[.5,'×½']].map(function(m){return '<button class="btn'+(m[0]===me.mult?' sel':'')+'" data-m="'+m[0]+'">'+m[1]+'</button>';}).join('')+'<button class="btn fill" id="go1">▶ Show the change</button>';
  $('xsl').value=this.x1;$('xsl').oninput=function(){me.x1=+this.value;me.fixX();me.anim=0;};
  Array.prototype.forEach.call(document.querySelectorAll('[data-m]'),function(b){b.onclick=function(){me.mult=+b.getAttribute('data-m');me.fixX();me.anim=0;Array.prototype.forEach.call(document.querySelectorAll('[data-m]'),function(x){x.classList.toggle('sel',x===b);});};});
  $('go1').onclick=function(){me.anim=0.001;};this.fixX();this.anim=0.001;
  setQ(['Zero order: change [A]. Does the rate change at all?','First order: double [A]. What happens to the rate?','Second order: double [A]. Why does the rate become 4 times bigger?','Same ×2 for [A]. Which order gives the biggest change in rate?'][s]);
  setRule(['rate change = (change in [A])<sup>order</sup>','Zero order (y = c): rate does not change','First order (y = ax): rate changes by the same factor','Second order (y = ax²): rate changes by the factor squared']);},
 fixX:function(){var mx=this.mult>1?4/this.mult:2;if(this.x1>mx){this.x1=mx;}if(this.mult<1&&this.x1<.8)this.x1=.8;var e=$('xsl');if(e)e.value=this.x1;},
 G:{x0:80,x1:500,y0:430,y1:50,xm:4,ym:5},
 X:function(v){return this.G.x0+v/this.G.xm*(this.G.x1-this.G.x0);},Y:function(v){return this.G.y0-v/this.G.ym*(this.G.y0-this.G.y1);},
 axes:function(){var G=this.G,me=this;panel(20,20,520,470);
  for(var v=1;v<=4;v++){seg(this.X(v),G.y0,this.X(v),G.y1,'#eef2f8',1);txt(String(v),this.X(v),G.y0+16,{s:13,c:MUTED,w:500});}
  for(v=1;v<=5;v++){seg(G.x0,this.Y(v),G.x1,this.Y(v),'#eef2f8',1);txt(String(v),G.x0-14,this.Y(v),{s:13,c:MUTED,w:500});}
  seg(G.x0,G.y0,G.x1+10,G.y0,INK,2.5);seg(G.x0,G.y0,G.x0,G.y1-10,INK,2.5);txt('0',G.x0-12,G.y0+12,{s:13,c:MUTED,w:500});
  txt('[A] (mol/L) → x',G.x1+12,G.y0+46,{s:14,c:INK,a:'right'});
  ctx.save();ctx.translate(36,(G.y0+G.y1)/2);ctx.rotate(-Math.PI/2);txt('rate (×10⁻³ mol/(L·s))   →   y',0,0,{s:15});ctx.restore();},
 curve:function(o,col,lw,al){var me=this;ctx.globalAlpha=al||1;ctx.strokeStyle=col;ctx.lineWidth=lw||4;ctx.beginPath();for(var i=0;i<=200;i++){var x=4*i/200,y=ORD[o].f(x);if(y>5.2)break;var X=me.X(x),Y=me.Y(y);if(i)ctx.lineTo(X,Y);else ctx.moveTo(X,Y);}ctx.stroke();ctx.globalAlpha=1;},
 marker:function(x,y,col,lab,side){var X=this.X(x),Y=this.Y(y),G=this.G;seg(X,Y,X,G.y0,col,2,[6,5]);seg(X,Y,G.x0,Y,col,2,[6,5]);dotc(X,Y,8,col);
  rr(X-24,G.y0-30,48,22,8);ctx.fillStyle=col;ctx.fill();txt(fx(x),X,G.y0-19,{s:13,c:'#fff'});
  rr(G.x0+4,Y-11-(side||0),48,22,8);ctx.fillStyle=col;ctx.fill();txt(fx(y),G.x0+28,Y-(side||0),{s:13,c:'#fff'});
  if(lab)txt(lab,X+16,Y-18,{s:14,c:col,a:'left'});},
 frame:function(dt){var me=this,s=this.s;clear();if(this.anim>0&&this.anim<1)this.anim=Math.min(1,this.anim+dt*.8);
  this.axes();$('xo').textContent=fx(this.x1)+' M';
  var x1=this.x1,x2=x1*this.mult,t=this.anim,xa=lerp(x1,x2,t);
  if(s<3){var o=s,col=OCOL[o],y1=ORD[o].f(x1),y2=ORD[o].f(x2),ya=ORD[o].f(xa);this.curve(o,col,4);
   this.marker(x1,y1,col,'1');if(t>0)this.marker(xa,ya,col,t>=1?'2':'',Math.abs(ya-y1)<.15?24:0);
   if(t>=1){brace(this.X(Math.min(x1,x2)),this.G.y0+30,this.X(Math.max(x1,x2)),this.G.y0+30,'[A] '+fac(this.mult),AMBER,18);if(Math.abs(y2-y1)>.15)brace(this.G.x0+66,this.Y(Math.max(y1,y2)),this.G.x0+66,this.Y(Math.min(y1,y2)),'rate '+fac(y2/y1),col,-40);}
   /* right card */
   panel(555,20,225,470);txt(ORD[o].n,667,48,{s:20,c:col});
   txt('Math',667,86,{s:13,c:MUTED,w:500});txt(ORD[o].math,667,114,{s:30,c:INK});
   txt('Chemistry',667,154,{s:13,c:MUTED,w:500});txt(ORD[o].chem,667,182,{s:22,c:col});
   txt('looks like '+ORD[o].desc,667,214,{s:13,c:MUTED,w:500});
   seg(575,236,760,236,LINE,2);
   txt('[A] changes',667,262,{s:14,c:MUTED,w:500});pill(fac(this.mult),667,292,AMBER,'#fff',22);
   txt('so the rate changes',667,330,{s:14,c:MUTED,w:500});
   if(t>=1){var rf=y2/y1;txt('('+fac(this.mult).replace('×','×')+')'+sup(o)+' = '+fac(rf),667,368,{s:22,c:col});pill(fac(rf),667,412,col,'#fff',26);}
   else txt('?',667,380,{s:40,c:LINE});
   setReads([['[A] before',fx(x1)+' M'],['[A] after',t>=1?fx(x2)+' M':'…'],['rate before',fx(y1)],['rate after',t>=1?fx(y2):'…'],['[A] change',fac(this.mult)],['rate change',t>=1?fac(y2/y1):'?']]);}
  else{var res=[];[0,1,2].forEach(function(o){me.curve(o,OCOL[o],3.5);var y1=ORD[o].f(x1),y2=ORD[o].f(x2),ya=ORD[o].f(xa);
    var X1=me.X(x1),Y1=me.Y(y1);dotc(X1,Y1,7,OCOL[o]);if(t>0){var XA=me.X(xa),YA=me.Y(ya);seg(X1,Y1,X1,me.G.y0,OCOL[o],1.5,[5,5]);seg(XA,YA,XA,me.G.y0,OCOL[o],1.5,[5,5]);seg(XA,YA,me.G.x0,YA,OCOL[o],1.5,[5,5]);seg(X1,Y1,me.G.x0,Y1,OCOL[o],1.5,[5,5]);dotc(XA,YA,7,OCOL[o]);}
    res.push(y2/y1);});
   panel(555,20,225,470);txt('Same change in [A]:',667,48,{s:15,c:MUTED,w:500});pill('[A] '+fac(this.mult),667,82,AMBER,'#fff',20);
   [0,1,2].forEach(function(o,i){var y=140+i*110;rr(570,y-30,195,92,14);ctx.fillStyle='#f6f8fc';ctx.fill();txt(ORD[o].n,667,y-12,{s:16,c:OCOL[o]});txt(ORD[o].math,667,y+14,{s:18,c:INK});
    txt(t>=1?'rate '+fac(res[o]):'rate ?',667,y+42,{s:18,c:OCOL[o]});});
   setReads([['[A] change',fac(this.mult),1],['Zero order',t>=1?'rate '+fac(res[0]):'?'],['First order',t>=1?'rate '+fac(res[1]):'?'],['Second order',t>=1?'rate '+fac(res[2]):'?',1]]);}
 }};

/* =========================================================
   TAB 2  Two reactants: two beakers, same reaction, count products
   ========================================================= */
var RX=[{m:1,n:1,lab:'rate = k[A][B]'},{m:2,n:1,lab:'rate = k[A]²[B]'},{m:0,n:1,lab:'rate = k[B]'},{m:1,n:2,lab:'rate = k[A][B]²'}];
var T2={name:'Two reactants',c:CORAL,steps:RX.map(function(r){return r.lab;}),fa:2,fb:1,DUR:10,BASE:0.8,
 title:function(s){return 'Same reaction, two beakers: which one makes products faster?';},
 enter:function(s){var me=this;this.s=s;this.R=RX[s];
  $('controls').innerHTML='<span class="ctl">After beaker:</span><span class="ctl" style="color:#e2708a">[A]</span>'+[1,2,3].map(function(k){return '<button class="btn'+(k===me.fa?' sel':'')+'" data-fa="'+k+'">×'+k+'</button>';}).join('')+
   '<span class="ctl" style="color:#2b59c3;margin-left:8px">[B]</span>'+[1,2,3].map(function(k){return '<button class="btn'+(k===me.fb?' sel':'')+'" data-fb="'+k+'">×'+k+'</button>';}).join('')+
   '<button class="btn fill" id="run2" style="margin-left:8px">▶ Run for 10 s</button>';
  ['fa','fb'].forEach(function(key){Array.prototype.forEach.call(document.querySelectorAll('[data-'+key+']'),function(b){b.onclick=function(){me[key]=+b.getAttribute('data-'+key);Array.prototype.forEach.call(document.querySelectorAll('[data-'+key+']'),function(x){x.classList.toggle('sel',x===b);});me.reset();};});});
  $('run2').onclick=function(){me.reset();me.running=true;};
  this.reset();
  setQ(['Double [A], then run. Then try doubling [B] instead. Is it the same?','This reaction is second order in A. Predict: double [A], how many times more products?','Zero order in A: double or triple [A]. Why does the After beaker not speed up?','Which has the bigger effect here: doubling [A] or doubling [B]?'][s]);
  setRule(['The <b>order</b> belongs to the reaction: it is found by experiment','The beaker only changes the <b>concentration</b>','rate change = (A change)<sup>m</sup> × (B change)<sup>n</sup>']);},
 mk:function(x0,fa,fb){var p=[];for(var i=0;i<3*fa+3*fb;i++){var a=Math.random()*Math.PI*2;p.push({x:x0+25+Math.random()*270,y:105+Math.random()*135,vx:Math.cos(a)*60,vy:Math.sin(a)*60,A:i<3*fa});}return p;},
 reset:function(){this.t=0;this.running=false;this.B=[{x0:30,fa:1,fb:1,p:this.mk(30,1,1),n:0,acc:0,fl:[]},{x0:420,fa:this.fa,fb:this.fb,p:this.mk(420,this.fa,this.fb),n:0,acc:0,fl:[]}];},
 frame:function(dt){var me=this,R=this.R;clear();
  var f=Math.pow(this.fa,R.m)*Math.pow(this.fb,R.n),cap=Math.max(8,Math.floor(this.BASE*f*this.DUR+1e-9));
  if(this.running){this.t=Math.min(this.DUR,this.t+dt);if(this.t>=this.DUR)this.running=false;}
  this.B.forEach(function(b,k){var rate=me.BASE*(k?f:1),x0=b.x0;
   panel(x0-10,20,350,330);txt(k?'After':'Before',x0+165,44,{s:18,c:k?GREEN:MUTED});

function ac(){if(LV.mute)return null;try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;if(!AC||AC.state==='closed')AC=new C();if(AC.state!=='running'){var p=AC.resume();if(p&&p.catch)p.catch(function(){});}}catch(e){return null;}return AC;}
/* browsers pause page audio (switching windows, idle tabs); wake it on every click or key press */
function audioWake(){if(LV.mute)return;try{if(AC&&AC.state==='interrupted'){AC.close();AC=null;}var a=ac();if(!a)return;var b=a.createBuffer(1,1,22050),src=a.createBufferSource();src.buffer=b;src.connect(a.destination);src.start(0);}catch(e){}}
['pointerdown','touchend','keydown'].forEach(function(ev){document.addEventListener(ev,audioWake,true);});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&AC&&AC.state!=='running'){try{AC.resume();}catch(e){}}});
function tone(f,t0,d,type,vol){var a=ac();if(!a)return;var t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.05);}
var SFX={good:function(){tone(784,0,.15);tone(1175,.1,.35);},bad:function(){tone(233,0,.22,'triangle',.18);tone(175,.13,.32,'triangle',.15);},
 tick:function(){tone(1100,0,.05,'square',.04);},buzz:function(){tone(150,0,.7,'sawtooth',.07);},go:function(){tone(523,0,.12);tone(784,.12,.3);},
 part:function(){[659,784,988,1319].forEach(function(f,i){tone(f,i*.1,.28,'triangle',.16);});},
 fan:function(){[523,659,784,1047].forEach(function(f,i){tone(f,i*.14,.35,'triangle',.18);});tone(1047,.6,.9,'sine',.2);tone(1319,.6,.9,'sine',.12);tone(1568,.6,.9,'sine',.08);}};

var CF=null,CP=[],cfOn=false,CFC=[TEAL,BLUE,PLUM,AMBER,CORAL,GREEN];
function cfSize(){if(!CF)return;var d=window.devicePixelRatio||1;CF.width=innerWidth*d;CF.height=innerHeight*d;CF.getContext('2d').setTransform(d,0,0,d,0,0);}
function cfCanvas(){if(!CF){CF=document.createElement('canvas');CF.id='lvConf';document.body.appendChild(CF);cfSize();window.addEventListener('resize',cfSize);}return CF;}
function cfAdd(x,y,vx,vy){CP.push({x:x,y:y,vx:vx,vy:vy,a:Math.random()*6.3,va:(Math.random()-.5)*12,w:7+Math.random()*6,h:5+Math.random()*5,c:CFC[Math.floor(Math.random()*CFC.length)],t:0});}
function burst(el,n){cfCanvas();var r=el&&el.getBoundingClientRect?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0},x=r.left+r.width/2,y=r.top+Math.min(r.height/2,24);
 for(var i=0;i<(n||45);i++){var a=-Math.PI/2+(Math.random()-.5)*2.4,s=260+Math.random()*360;cfAdd(x,y,Math.cos(a)*s,Math.sin(a)*s);}cfRun();}
function rain(n){cfCanvas();for(var i=0;i<n;i++)cfAdd(Math.random()*innerWidth,-20-Math.random()*innerHeight*.7,(Math.random()-.5)*120,60+Math.random()*160);cfRun();}
function cfRun(){if(cfOn)return;cfOn=true;var last=performance.now();(function st(now){var dt=Math.min(.04,Math.max(0,(now-last)/1000)),g=CF.getContext('2d');last=now;g.clearRect(0,0,innerWidth,innerHeight);
 CP.forEach(function(p){p.t+=dt;p.vy=Math.min(p.vy+520*dt,300);p.vx*=.985;p.x+=p.vx*dt+Math.sin(p.t*4+p.a)*0.6;p.y+=p.vy*dt;p.a+=p.va*dt;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=p.c;g.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.a*1.3))+1);g.restore();});
 CP=CP.filter(function(p){return p.y<innerHeight+30&&p.t<8;});if(CP.length)requestAnimationFrame(st);else{cfOn=false;g.clearRect(0,0,innerWidth,innerHeight);}})(last);}

function fieldHtml(it,r,k,f,lock){var m=r.marks?r.marks[k]:null,a=r.ans?r.ans[k]:null,fin=lock||m===true,pk=T5.pk[k],shown=r.ok===false;
 if(f.t==='n')return (f.pre?'<span>'+f.pre+'</span>':'')+'<input id="lf'+k+'" class="'+(m===true?'ok':m===false?'no':'')+'" inputmode="decimal" autocomplete="off" value="'+(a==null?'':esc(a))+'"'+(fin?' disabled':'')+'>'+(f.post?'<span>'+f.post+'</span>':'');
 function cls(i,base,selC){return base+(pk===i?(m===true?' right':m===false?' wrong':' '+selC):'')+(shown&&i===f.want&&pk!==i?' right':'');}
 if(f.t==='c')return '<span>'+f.pre+'</span><span class="lv-ch">'+f.opts.map(function(o,i){return '<button class="'+cls(i,'btn lvc','sel')+'" data-f="'+k+'" data-o="'+i+'"'+(fin?' disabled':'')+'>'+o+'</button>';}).join('')+'</span>';
 return '<div class="lv-opts'+(f.tf?' tf':'')+(f.opts.some(function(o){return plain(o).length>26;})?' one':'')+'">'+f.opts.map(function(o,i){return '<button class="'+cls(i,'qzb lvc','pick')+'" data-f="'+k+'" data-o="'+i+'"'+(fin?' disabled':'')+'><span class="L">'+'ABCD'.charAt(i)+'</span><span>'+o+'</span></button>';}).join('')+'</div>';}

 if(r.tries>0)return '<div class="lvfb no" id="lvFb"><b>Not quite.</b> Fix what is marked in red'+(it.hint?' (the hint can help)':'')+' and submit again. You can do it!</div>';

 if(T5.pkFor!==it.id){T5.pkFor=it.id;T5.pk={};T5.hintOn=false;if(r.ans)it.f.forEach(function(f,k){if(f.t!=='n')T5.pk[k]=r.ans[k];});}

 if(it.sim)h+='<canvas id="mini" width="640" height="260" style="margin:2px 0 8px"></canvas><div class="stepbar" style="margin:0 0 6px"><button class="btn fill" id="miniRun">▶ Run</button><span class="small" id="miniNote"></span></div>';
 h+=fieldsHtml(it,r,fin)+'<div class="stepbar">'+(fin?'<button class="btn fill" id="lvNext">'+(LV.idx<p.items.length-1?'Next ▶':'Finish '+p.name+' ▶')+'</button>':

/* ---- actions ---- */
function lvSubmit(p){var it=p.items[LV.idx],r=R(it),ans=[],miss=false,maxT=p.tries||2;
 it.f.forEach(function(f,k){if(f.t==='n'){var e=$('lf'+k),v=e?e.value.trim():'';ans.push(v);if(v==='')miss=true;}else{var c=T5.pk[k];ans.push(c==null?null:c);if(c==null)miss=true;}});
 if(miss){$('lvFb').outerHTML='<div class="lvfb no" id="lvFb"><b>Answer every part first.</b></div>';return;}
 var marks=it.f.map(function(f,k){if(f.t!=='n')return ans[k]===f.want;var v=parseNum(ans[k]);return isFinite(v)&&Math.abs(v-f.want)<=Math.max(Math.abs(f.want)*.03,1e-3);}),ok=marks.every(Boolean);
 r.tries++;r.ans=ans;r.marks=marks;var fin=ok||r.tries>=maxT;
 if(ok){LV.streak++;r.ok=true;r.pts=(r.tries===1&&!r.hint)?100:50;r.msg=praise(r);}
 else{LV.streak=0;if(fin){r.ok=false;r.pts=0;r.msg=maxT>1?'Good try! Read the answer, then keep going.':'Not this time, but keep going!';}}
 T5.showSent=true;
 lvSend({game:it.tag,score:fin?r.pts:0,correct:ok?1:0,total:1,missed:'Try '+r.tries+(ok?' ✓ correct':' ✗ wrong')+(r.hint?' (used hint)':'')+' · answer: '+ansText(it,ans)+(fin&&!ok?' · correct: '+plain(wantHtml(it)):'')});
 T5.render();if(ok){SFX.good();burst($('lvFb'),40);}else SFX.bad();}
function lvFinish(){LV.done=true;LV.celebrate=true;var t=totals(),missed=[];
 PARTS.forEach(function(p){(p.items||[]).forEach(function(it){var r=LV.res[it.id];if(!r||!r.ok)missed.push(it.tag);});});
 lvSend({game:'FINAL',score:t.pts,correct:t.c,total:t.n,missed:(missed.length?'Missed: '+missed.join(', '):'Nothing missed!')+' · times: '+PARTS.filter(function(p){return p.secs;}).map(function(p){var tm=partTime(p);return p.name+' '+(tm==null?'–':mmss(tm))+(tm!=null&&tm<=p.secs?' (beat)':'');}).join(', ')});}
function lvNext(p){LV.idx++;T5.pk={};T5.pkFor=null;T5.showSent=false;
 if(LV.idx<p.items.length){lvSave();T5.render();return;}
 LV.ps[p.id].end=Date.now();LV.idx=0;LV.part++;LV.just=p.id;
 if(PARTS[LV.part].id==='end')lvFinish();else{SFX.part();rain(140);}
 lvSave();go(4,LV.part);}

var T5={name:'Live session',c:BLUE,steps:PARTS.map(function(p){return p.name;}),pk:{},pkFor:null,hintOn:false,
 mark:function(i){return LV.player&&(i<LV.part||LV.done)?'✓':i+1;},
 lock:function(i){return i>(LV.player?LV.part:0);},
 fix:function(s){return Math.min(s,LV.player?LV.part:0);},
 title:function(s){return ['Live session: get ready','Warm-up: refresh your memory','Challenge 1: find n by comparing trials 1 and 2','Challenge 2: find m by comparing trials 2 and 3','Exit ticket','Well done!'][s];},
 enter:function(s){this.s=s;$('cv').style.display='none';$('controls').innerHTML='';this.render();},
