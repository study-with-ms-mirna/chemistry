<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study with Ms. Mirna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@700&family=Pacifico&display=swap">
<style>
:root{--bg:#eaf0f8;--card:#fff;--ink:#18233a;--soft:#5b6780;--line:#c9d4e6;--blue:#2b59c3;--bluebg:#e3ebfb;--teal:#0f8b8d;--tealbg:#dcf2f2;--plum:#8a4fbf;
  --disp:"Fredoka","Trebuchet MS",sans-serif;--body:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--body);color:var(--ink);background:var(--bg);display:grid;grid-template-columns:270px 1fr;grid-template-rows:100%}
aside{background:var(--card);border-right:2px solid var(--line);padding:18px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.brand{font-family:var(--disp);font-size:26px;font-weight:700;line-height:1.05;padding:4px 8px 12px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Caveat',cursive;font-size:30px;line-height:.95}.brand .nm{color:var(--teal);font-family:'Pacifico',cursive;font-weight:400;font-size:25px;line-height:1.3}.bico{flex:none;width:60px}.bico svg{width:100%;height:auto;display:block}
h2{font-family:var(--disp);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:14px 8px 4px}
nav a{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);font-weight:700;padding:10px 12px;border-radius:12px;border:2px solid transparent}
nav a small{display:block;font-weight:400;color:var(--soft);font-size:13px}
nav a:hover{background:var(--bg)}
nav a.on{background:var(--bluebg);border-color:var(--blue)}
nav a:focus-visible,button:focus-visible{outline:3px solid #e8962a;outline-offset:2px}
.ico{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--tealbg)}.ico svg{width:34px;height:34px;display:block}.cico{width:64px;height:64px;border-radius:16px;background:var(--tealbg);display:grid;place-items:center}.cico svg{width:50px;height:50px;display:block}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--card);border-bottom:2px solid var(--line)}
.bar b{font-family:var(--disp);font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar a,.bar button{font:inherit;font-family:var(--disp);font-weight:600;font-size:14px;color:var(--blue);background:var(--bluebg);border:none;border-radius:10px;padding:7px 12px;text-decoration:none;cursor:pointer}
#menu{display:none}
iframe{flex:1;width:100%;border:0;background:var(--bg)}
.home{flex:1;overflow:auto;padding:28px 22px}
.home h1{font-family:var(--disp);font-size:clamp(34px,6vw,54px);margin:0 0 8px}
.home h1{font-family:'Caveat',cursive;font-weight:700;font-size:clamp(40px,6vw,64px);line-height:1.1}
.home h1 span{color:var(--teal);font-family:'Pacifico',cursive;font-weight:400;font-size:.82em;display:inline-block;transform:rotate(-3deg);padding:0 .1em}
.hero{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:8px}.hero>div:last-child{flex:1;min-width:260px}.hero .pic{flex:none;width:clamp(120px,22vw,190px)}.hero .pic svg{width:100%;height:auto;display:block}
.home p{color:var(--soft);max-width:56ch;margin:0 0 20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.cards a{display:grid;gap:6px;text-decoration:none;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 5px 0 #c3cfe3}
.cards a:hover{border-color:var(--blue);transform:translateY(-2px)}
.home h2.sec{font-family:var(--disp);font-size:20px;letter-spacing:.02em;text-transform:none;color:var(--ink);margin:22px 0 10px}
.cards b{font-family:var(--disp);font-size:20px}
.cards small{color:var(--soft)}
.tag{justify-self:start;font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-radius:8px;padding:2px 8px;background:var(--tealbg);color:var(--teal)}
.tag.q{background:#efe5f8;color:var(--plum)}
@media (max-width:760px){
  body{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:5;transform:translateX(-102%);transition:transform .2s;box-shadow:8px 0 30px rgba(0,0,0,.2)}
  body.open aside{transform:none}
  #menu{display:inline-block}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.grp{display:flex;align-items:center;gap:6px;width:100%;background:none;border:none;cursor:pointer;font-family:var(--disp);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:10px 0 2px;padding:6px 8px;border-radius:10px;text-align:left}
.grp:hover{background:var(--bg)}
.grp .n{margin-left:auto;font-size:11px;letter-spacing:0;background:var(--bg);border-radius:999px;padding:1px 8px}
.chev{display:inline-block;transition:transform .2s;font-size:12px}
.closed .chev{transform:rotate(-90deg)}
.gitems.hide,.cards.hide{display:none}
.home .sec{display:flex;align-items:center;gap:10px;background:none;border:none;cursor:pointer;font-family:var(--disp);font-size:20px;font-weight:700;color:var(--ink);margin:22px 0 10px;padding:4px 0}
.home .sec .chev{font-size:16px;color:var(--teal)}
.home .sec .n{font-size:13px;font-weight:600;color:var(--soft);background:var(--card);border:2px solid var(--line);border-radius:999px;padding:1px 10px}
/* tabs: white (closed) · light teal (open) · black text · teal accents */
:root{--tabblack:#1c1f24;--tabteal:#0f8b8d;--tablt:#d6f1f0}
.grp,.home .sec{background:#fff;color:var(--tabblack);border:2px solid var(--tabblack);font-weight:600;align-items:center}
.grp{border-radius:10px;margin:10px 0 4px;padding:6px 10px}
.home .sec{width:100%;border-radius:12px;padding:8px 16px}
.grp:hover,.home .sec:hover{background:#eefaf9;border-color:var(--tabteal)}
.grp:not(.closed),.home .sec:not(.closed){background:var(--tablt);border-color:var(--tabteal);color:var(--tabblack)}
.grp .chev,.home .sec .chev{color:var(--tabteal)}
.grp .n,.home .sec .n{background:var(--tabteal);color:#fff;border-color:var(--tabteal);font-weight:700}
.gico{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--tealbg)}
.gico svg{width:24px;height:24px;display:block}
.home .sec .gico{width:40px;height:40px;border-radius:11px}
.home .sec .gico svg{width:32px;height:32px}
.grp:not(.closed) .gico,.home .sec:not(.closed) .gico{display:none}
/* show / hide the sidebar */
#menu{display:inline-block}
body.noside{grid-template-columns:0 1fr}
body.noside aside{visibility:hidden;padding:0;border:0}
body:not(.noside) #menu{display:none}
#hideside{align-self:flex-end;font:inherit;font-family:var(--disp);font-weight:600;font-size:13px;color:#0f8b8d;background:#d6f1f0;border:1.5px solid #0f8b8d;border-radius:9px;padding:4px 10px;cursor:pointer;margin-bottom:-4px}
#hideside:hover{background:#0f8b8d;color:#fff}
@media (max-width:760px){ body:not(.noside) #menu,#menu{display:inline-block} body.noside{grid-template-columns:1fr} body.noside aside{visibility:visible;padding:18px 14px;border-right:2px solid var(--line)} body.open #menu{display:none} }
</style>
</head>

const CHEM=document.querySelector('.bico').innerHTML;
const nav=document.getElementById('nav'), view=document.getElementById('view'), title=document.getElementById('title'), full=document.getElementById('full');
const slug=f=>f.replace(/\.html$/,'');
const OPEN=(()=>{try{return JSON.parse(localStorage.getItem('mm_open')||'{}');}catch(e){return {};}})();
function saveOpen(){try{localStorage.setItem('mm_open',JSON.stringify(OPEN));}catch(e){}}
function isOpen(where,g,cur){const k=where+':'+g;if(where==='nav'&&cur&&cur.group===g)return true;if(k in OPEN)return OPEN[k];return where==='home'?true:(cur?cur.group===g:false);}
const GICON={'Revision Notes':ICON.note,'Game Quests':ICON.game,'Simulations':ICON.sim,'Assessments':ICON.assess,'SAAT Worksheets':ICON.sheet};
const gi=g=>`<span class="gico">${GICON[g]||''}</span>`;
function drawNav(cur){
  const groups=[...new Set(ITEMS.map(i=>i.group))];
  nav.innerHTML=`<a href="#" class="${cur?'':'on'}"><span class="ico">${ICON.home}</span><span>Home</span></a>`+
    groups.map(g=>{const its=ITEMS.filter(i=>i.group===g),op=isOpen('nav',g,cur);return `<button class="grp${op?'':' closed'}" data-w="nav" data-g="${g}" aria-expanded="${op}"><span class="chev">▼</span>${gi(g)}${g}<span class="n">${its.length}</span></button><div class="gitems${op?'':' hide'}">`+its.map(i=>`<a href="#${slug(i.file)}" class="${cur===i?'on':''}"><span class="ico">${i.icon}</span><span>${i.title}<small>${i.note}</small></span></a>`).join('')+'</div>';}).join('');
}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-g]');if(!b)return;const k=b.dataset.w+':'+b.dataset.g,op=!(b.getAttribute('aria-expanded')==='true');OPEN[k]=op;saveOpen();
  b.setAttribute('aria-expanded',op);b.classList.toggle('closed',!op);const box=b.nextElementSibling;if(box)box.classList.toggle('hide',!op);});
function route(){
  const h=location.hash.slice(1); const it=ITEMS.find(i=>slug(i.file)===h);
  document.body.classList.remove('open'); drawNav(it);
  if(it){ const fresh=it.file+'?v='+Date.now(); title.textContent=it.title; full.hidden=false; full.href=fresh;
    view.innerHTML=`<iframe src="${fresh}" title="${it.title}" allow="fullscreen"></iframe>`; }
  else{ title.textContent='Home'; full.hidden=true;
    view.innerHTML=`<div class="home"><div class="hero"><div class="pic">${CHEM}</div><div><h1>Study with <span>Ms. Mirna</span></h1><p>Chemistry revision for SAAT. Revise the notes, play a quest, explore a simulation or take an assessment.</p></div></div>
      ${[...new Set(ITEMS.map(i=>i.group))].map(g=>{const its=ITEMS.filter(i=>i.group===g),op=isOpen('home',g);return `<button class="sec${op?'':' closed'}" data-w="home" data-g="${g}" aria-expanded="${op}"><span class="chev">▼</span>${gi(g)}${g}<span class="n">${its.length}</span></button><div class="cards${op?'':' hide'}">${its.map(i=>`<a href="#${slug(i.file)}"><span class="cico">${i.icon}</span><b>${i.title}</b><small>${i.note}</small></a>`).join('')}</div>`;}).join('')}</div>`; }
}
addEventListener('hashchange',route);
const MOBILE=()=>matchMedia('(max-width:760px)').matches;
function setSide(show){ if(MOBILE()){document.body.classList.toggle('open',show);} else {document.body.classList.toggle('noside',!show); try{localStorage.setItem('mm_side',show?'1':'0');}catch(e){}} }
try{ if(localStorage.getItem('mm_side')==='0') document.body.classList.add('noside'); }catch(e){}
document.getElementById('menu').onclick=()=>setSide(MOBILE()?!document.body.classList.contains('open'):document.body.classList.contains('noside'));
document.getElementById('hideside').onclick=()=>setSide(false);
view.addEventListener('click',()=>document.body.classList.remove('open'));
