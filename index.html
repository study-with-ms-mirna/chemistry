<style>
:root{--bg:#eaf0f8;--card:#fff;--ink:#18233a;--soft:#5b6780;--line:#c9d4e6;--blue:#2b59c3;--bluebg:#e3ebfb;--teal:#0f8b8d;--tealbg:#dcf2f2;--plum:#8a4fbf;
  --disp:"Fredoka","Trebuchet MS",sans-serif;--body:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--body);color:var(--ink);background:var(--bg);display:grid;grid-template-columns:270px 1fr;grid-template-rows:100%}
aside{background:var(--card);border-right:2px solid var(--line);padding:18px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.brand{font-family:var(--disp);font-size:26px;font-weight:700;line-height:1.05;padding:4px 8px 12px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Caveat',cursive;font-size:30px;line-height:.95}.brand .nm{color:var(--teal);font-family:'Pacifico',cursive;font-weight:400;font-size:25px;line-height:1.3}.bico{flex:none;width:60px}.bico svg{width:100%;height:auto;display:block}
h2{font-family:var(--disp);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:14px 8px 4px}
nav a{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);font-weight:700;padding:10px 12px;border-radius:12px;border:2px solid transparent}
nav a small{display:block;font-weight:400;color:var(--soft);font-size:13px}
nav a:hover{background:var(--bg)}
nav a.on{background:var(--bluebg);border-color:var(--blue)}
nav a:focus-visible,button:focus-visible{outline:3px solid #e8962a;outline-offset:2px}
.ico{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--tealbg)}.ico svg{width:34px;height:34px;display:block}.cico{width:64px;height:64px;border-radius:16px;background:var(--tealbg);display:grid;place-items:center}.cico svg{width:50px;height:50px;display:block}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--card);border-bottom:2px solid var(--line)}
.bar b{font-family:var(--disp);font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar a,.bar button{font:inherit;font-family:var(--disp);font-weight:600;font-size:14px;color:var(--blue);background:var(--bluebg);border:none;border-radius:10px;padding:7px 12px;text-decoration:none;cursor:pointer}
#menu{display:none}
iframe{flex:1;width:100%;border:0;background:var(--bg)}
.home{flex:1;overflow:auto;padding:28px 22px}
.home h1{font-family:var(--disp);font-size:clamp(34px,6vw,54px);margin:0 0 8px}
.home h1{font-family:'Caveat',cursive;font-weight:700;font-size:clamp(40px,6vw,64px);line-height:1.1}
.home h1 span{color:var(--teal);font-family:'Pacifico',cursive;font-weight:400;font-size:.82em;display:inline-block;transform:rotate(-3deg);padding:0 .1em}
.hero{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:8px}.hero>div:last-child{flex:1;min-width:260px}.hero .pic{flex:none;width:clamp(120px,22vw,190px)}.hero .pic svg{width:100%;height:auto;display:block}
.home p{color:var(--soft);max-width:56ch;margin:0 0 20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.cards a{display:grid;gap:6px;text-decoration:none;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 5px 0 #c3cfe3}
.cards a:hover{border-color:var(--blue);transform:translateY(-2px)}
.home h2.sec{font-family:var(--disp);font-size:20px;letter-spacing:.02em;text-transform:none;color:var(--ink);margin:22px 0 10px}
.cards b{font-family:var(--disp);font-size:20px}
.cards small{color:var(--soft)}
.tag{justify-self:start;font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-radius:8px;padding:2px 8px;background:var(--tealbg);color:var(--teal)}
.tag.q{background:#efe5f8;color:var(--plum)}
@media (max-width:760px){
  body{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:5;transform:translateX(-102%);transition:transform .2s;box-shadow:8px 0 30px rgba(0,0,0,.2)}
  body.open aside{transform:none}
  #menu{display:inline-block}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const CHEM=document.querySelector('.bico').innerHTML;
const nav=document.getElementById('nav'), view=document.getElementById('view'), title=document.getElementById('title'), full=document.getElementById('full');
const slug=f=>f.replace(/\.html$/,'');
function drawNav(cur){
  const groups=[...new Set(ITEMS.map(i=>i.group))];
  nav.innerHTML=`<a href="#" class="${cur?'':'on'}"><span class="ico">${ICON.home}</span><span>Home</span></a>`+
    groups.map(g=>`<h2>${g}</h2>`+ITEMS.filter(i=>i.group===g).map(i=>`<a href="#${slug(i.file)}" class="${cur===i?'on':''}"><span class="ico">${i.icon}</span><span>${i.title}<small>${i.note}</small></span></a>`).join('')).join('');
}

  if(it){ const fresh=it.file+'?v='+Date.now(); title.textContent=it.title; full.hidden=false; full.href=fresh;
    view.innerHTML=`<iframe src="${fresh}" title="${it.title}" allow="fullscreen"></iframe>`; }
  else{ title.textContent='Home'; full.hidden=true;
    view.innerHTML=`<div class="home"><div class="hero"><div class="pic">${CHEM}</div><div><h1>Study with <span>Ms. Mirna</span></h1><p>Chemistry revision for SAAT. Revise the notes, play a quest, explore a simulation or take an assessment.</p></div></div>
      ${[...new Set(ITEMS.map(i=>i.group))].map(g=>`<h2 class="sec">${g}</h2><div class="cards">${ITEMS.filter(i=>i.group===g).map(i=>`<a href="#${slug(i.file)}"><span class="cico">${i.icon}</span><b>${i.title}</b><small>${i.note}</small></a>`).join('')}</div>`).join('')}</div>`; }
}
addEventListener('hashchange',route);
document.getElementById('menu').onclick=()=>document.body.classList.toggle('open');
view.addEventListener('click',()=>document.body.classList.remove('open'));
route();
</script>
</body>
</html>
