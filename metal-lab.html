<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metal Lab · Study with Ms. Mirna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@600&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eaf0f8; --grid:#dbe4f1; --ink:#18233a; --muted:#56637d;
    --card:#ffffff; --border:#c9d4e6; --shadow:#c3cfe3;
    --teal:#0f8b8d; --blue:#2b59c3; --plum:#8a4fbf; --amber:#e8962a; --coral:#e2708a; --red:#d4486e;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background-color:var(--bg);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:28px 28px;
    color:var(--ink);
    font-family:"Atkinson Hyperlegible",Arial,sans-serif;
    font-size:16px; line-height:1.45;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:18px 16px 40px}
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .logo{width:58px;height:58px;flex:none}
  .brand{font-family:"Caveat",cursive;font-size:22px;color:var(--muted);line-height:1}
  .brand b{font-family:"Pacifico",cursive;font-weight:400;font-size:20px;color:var(--teal)}
  h1{font-family:"Fredoka",sans-serif;font-weight:700;font-size:34px;margin:2px 0 0;line-height:1.1}
  .sub{color:var(--muted);margin:2px 0 0}
  .tabs{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 16px}
  .tab{
    -webkit-appearance:none;appearance:none;
    font-family:"Fredoka",sans-serif;font-size:16px;font-weight:600;color:var(--ink);
    background:#fff;border:2px solid var(--border);border-radius:16px;padding:9px 14px;
    box-shadow:0 4px 0 var(--shadow);cursor:pointer;display:flex;align-items:center;gap:8px;
  }
  .tab .n{display:inline-flex;width:26px;height:26px;border-radius:50%;align-items:center;justify-content:center;color:#fff;font-size:14px}
  .tab.active{border-color:var(--ink);transform:translateY(2px);box-shadow:0 2px 0 var(--shadow)}
  .grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
  @media (max-width:900px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:2px solid var(--border);border-radius:22px;box-shadow:0 6px 0 var(--shadow);padding:16px}
  canvas{display:block;width:100%;height:auto;border-radius:14px;background:#f7f9fd;border:2px solid #e2e9f4;touch-action:manipulation}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
  .group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .group-label{font-family:"Fredoka",sans-serif;font-weight:600;font-size:14px;color:var(--muted);margin-right:2px}
  .btn{
    -webkit-appearance:none;appearance:none;
    font-family:"Fredoka",sans-serif;font-size:15px;font-weight:600;
    color:#fff;background:var(--teal);border:none;border-radius:14px;padding:9px 14px;cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.18);line-height:1.1;
  }
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  .btn.blue{background:var(--blue)} .btn.plum{background:var(--plum)} .btn.amber{background:var(--amber)} .btn.coral{background:var(--red)}
  .btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--border);box-shadow:0 4px 0 var(--shadow)}
  .chip{
    -webkit-appearance:none;appearance:none;
    font-family:"Fredoka",sans-serif;font-size:15px;font-weight:600;color:var(--ink);
    background:#fff;border:2px solid var(--border);border-radius:12px;padding:7px 11px;cursor:pointer;line-height:1.1;
  }
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .readout{font-family:"Fredoka",sans-serif;font-weight:500;background:#f2f6fb;border:2px solid #e2e9f4;border-radius:12px;padding:8px 12px;margin-top:12px;font-size:15px}
  .slider-row{display:flex;align-items:center;gap:10px;flex:1 1 260px;min-width:220px}
  .slider-row label{font-family:"Fredoka",sans-serif;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:6px;background:linear-gradient(90deg,#2b59c3,#e8962a,#d4486e);outline:none;margin:0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--ink);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--ink);cursor:pointer}
  .temp{font-family:"Fredoka",sans-serif;font-weight:700;min-width:84px;text-align:right}
  h2{font-family:"Fredoka",sans-serif;font-size:24px;margin:0 0 4px}
  h3{font-family:"Fredoka",sans-serif;font-size:17px;margin:14px 0 6px;color:var(--teal)}
  .panel p{margin:4px 0}
  .panel ol{margin:4px 0;padding-left:22px}
  .panel li{margin:4px 0}
  .q li{margin:6px 0}
  .bigq{font-family:"Fredoka",sans-serif;font-weight:500;font-size:19px;line-height:1.35;background:#f2f6fb;border:2px solid #e2e9f4;border-radius:16px;padding:12px 14px;margin:10px 0 14px}
  .bigq span{display:block;font-size:14px;font-weight:600;color:var(--teal);margin-bottom:4px}
  .rule ul{margin:0;padding-left:20px} .rule li{margin:5px 0}
  .rule{display:none;margin-top:12px;border:2.5px dashed #c00000;border-radius:16px;padding:10px 12px;background:#fff6f6}
  .rule.show{display:block}
  .rule strong{font-family:"Fredoka",sans-serif;color:#c00000;font-size:17px;display:block;margin-bottom:2px}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:14px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:14px;height:14px;border-radius:50%;display:inline-block}
  table.data{border-collapse:collapse;width:100%;margin-top:12px;font-size:14px}
  table.data th,table.data td{border:2px solid #e2e9f4;padding:6px 6px;text-align:center}
  table.data th{background:#f2f6fb;font-family:"Fredoka",sans-serif;font-weight:600}
  table.data td.blank{color:#b3bfd3}
  .hidden{display:none !important}
  .fs-note{font-size:13px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <rect x="2" y="2" width="60" height="60" rx="16" fill="#fff" stroke="#c9d4e6" stroke-width="2"/>
      <rect x="10" y="22" width="44" height="28" rx="9" fill="#2b59c3" opacity=".12"/>
      <g fill="#d4486e"><circle cx="20" cy="30" r="6"/><circle cx="32" cy="30" r="6"/><circle cx="44" cy="30" r="6"/><circle cx="20" cy="43" r="6"/><circle cx="32" cy="43" r="6"/><circle cx="44" cy="43" r="6"/></g>
      <g fill="#fff" font-family="Arial" font-weight="700" font-size="9" text-anchor="middle"><text x="20" y="33">+</text><text x="32" y="33">+</text><text x="44" y="33">+</text><text x="20" y="46">+</text><text x="32" y="46">+</text><text x="44" y="46">+</text></g>
      <g fill="#0f8b8d"><circle cx="26" cy="25" r="2.2"/><circle cx="38" cy="36.5" r="2.2"/><circle cx="26" cy="36.5" r="2.2"/><circle cx="49" cy="37" r="2.2"/><circle cx="14" cy="48" r="2.2"/><circle cx="38" cy="25" r="2.2"/><circle cx="38" cy="49" r="2.2"/></g>
      <path d="M44 8 l8 4 -4 6z" fill="#e8962a"/><rect x="40" y="10" width="4" height="14" rx="2" transform="rotate(-30 42 17)" fill="#8a4fbf"/>
    </svg>
    <div>
      <div class="brand">Study with <b>Ms. Mirna</b></div>
      <h1>Metal Lab</h1>
      <p class="sub">Discover how the sea of electrons explains the properties of metals.</p>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <div class="grid">
    <div class="card">
      <canvas id="cv" width="1600" height="1000" aria-label="Metal Lab simulation"></canvas>
      <div class="controls" id="controls"></div>
      <div class="readout" id="readout"></div>
      <div id="extra"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="card panel" id="panel"></div>
  </div>
</div>

<script>
(function(){
"use strict";
var cv=document.getElementById('cv');
var ctx=cv.getContext('2d');
ctx.scale(2,2);
var W=800,H=500;
var C={ink:'#18233a',muted:'#56637d',teal:'#0f8b8d',blue:'#2b59c3',plum:'#8a4fbf',amber:'#e8962a',coral:'#e2708a',red:'#d4486e',grid:'#dbe4f1',green:'#3f9a52'};
var FONT='"Fredoka", Arial, sans-serif';
function rand(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function $(id){return document.getElementById(id);}

/* ---------- drawing helpers ---------- */
function circle(x,y,r,fill,stroke,lw){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||2;ctx.stroke();}}
function text(t,x,y,size,color,align,weight){ctx.font=(weight||600)+' '+size+'px '+FONT;ctx.fillStyle=color||C.ink;ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillText(t,x,y);}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function shade(hex,amt){var n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  if(amt>0){r=Math.round(r+(255-r)*amt);g=Math.round(g+(255-g)*amt);b=Math.round(b+(255-b)*amt);}else{r=Math.round(r*(1+amt));g=Math.round(g*(1+amt));b=Math.round(b*(1+amt));}
  return 'rgb('+r+','+g+','+b+')';}
function mix(h1,h2,t){var a=parseInt(h1.slice(1),16),b=parseInt(h2.slice(1),16);
  var r=Math.round(lerp((a>>16)&255,(b>>16)&255,t)),g=Math.round(lerp((a>>8)&255,(b>>8)&255,t)),bl=Math.round(lerp(a&255,b&255,t));
  return '#'+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1);}
function ball(x,y,r,col,label,labelSize){
  var g=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.15,x,y,r);
  g.addColorStop(0,shade(col,.55));g.addColorStop(1,col);
  circle(x,y,r,g,shade(col,-.25),1.5);
  if(label){text(label,x,y+1,labelSize||Math.max(9,r*.75),'#fff','center',700);}
}
function cation(x,y,r,label,col){ball(x,y,r,col||C.red,label,label&&label.length>2?Math.max(9,r*.62):Math.max(10,r*.8));}
function electron(x,y,col,r){r=r||4.2;circle(x,y,r+2.5,'rgba(15,139,141,0.18)');circle(x,y,r,col||C.teal);}
function sea(x,y,w,h,alpha){ctx.save();roundRect(x,y,w,h,26);ctx.fillStyle='rgba(43,89,195,'+(alpha==null?0.10:alpha)+')';ctx.fill();ctx.restore();}
function banner(msg,col){ctx.save();ctx.font='600 17px '+FONT;var w=ctx.measureText(msg).width+30;roundRect(W/2-w/2,14,w,34,14);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=col||C.teal;ctx.stroke();ctx.restore();text(msg,W/2,31,17,col||C.teal);}
function sup(n){return n===1?'⁺':(n===2?'²⁺':(n===3?'³⁺':'⁺'));}

/* ---------- UI helpers ---------- */
function mkBtn(label,cls,fn){var b=document.createElement('button');b.type='button';b.className='btn '+(cls||'');b.textContent=label;b.addEventListener('click',fn);return b;}
function mkChips(label,items,cur,fn){var g=document.createElement('div');g.className='group';var l=document.createElement('span');l.className='group-label';l.textContent=label;g.appendChild(l);
  items.forEach(function(it){var b=document.createElement('button');b.type='button';b.className='chip'+(it.v===cur?' on':'');b.textContent=it.t;b.addEventListener('click',function(){Array.prototype.forEach.call(g.querySelectorAll('.chip'),function(c){c.classList.remove('on');});b.classList.add('on');fn(it.v);});g.appendChild(b);});return g;}
function setReadout(h){$('readout').innerHTML=h;}
function setLegend(items){$('legend').innerHTML=items.map(function(i){return '<span><i class="dot" style="background:'+i[0]+(i[2]?';width:9px;height:9px':'')+'"></i>'+i[1]+'</span>';}).join('');}
/* ---------- short side panels: one question + a concise visual rule ---------- */
function sv(inner,h){return '<svg viewBox="0 0 300 '+(h||90)+'" width="100%" style="display:block;margin:4px 0 8px" aria-hidden="true">'+inner+'</svg>';}
function cat(x,y,r,t){r=r||11;return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="#d4486e"/><text x="'+x+'" y="'+(y+4)+'" font-size="'+(r>10?11:9)+'" font-weight="700" fill="#fff" text-anchor="middle" font-family="Fredoka,Arial">'+(t||'+')+'</text>';}
function an(x,y,r){r=r||12;return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="#0f8b8d"/><text x="'+x+'" y="'+(y+4)+'" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" font-family="Fredoka,Arial">−</text>';}
function el(x,y,c){return '<circle cx="'+x+'" cy="'+y+'" r="3.4" fill="'+(c||'#0f8b8d')+'"/>';}
function lab(x,y,t,c,s,a){return '<text x="'+x+'" y="'+y+'" font-size="'+(s||12)+'" font-weight="600" fill="'+(c||'#18233a')+'" text-anchor="'+(a||'middle')+'" font-family="Fredoka,Arial">'+t+'</text>';}
function seaBox(x,y,w,h){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="12" fill="#2b59c3" opacity=".12"/>';}
function arrow(x1,y1,x2,y2,c){c=c||'#18233a';var a=Math.atan2(y2-y1,x2-x1),hx=x2-9*Math.cos(a-0.45),hy=y2-9*Math.sin(a-0.45),kx=x2-9*Math.cos(a+0.45),ky=y2-9*Math.sin(a+0.45);
  return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="2.5" stroke-linecap="round"/><path d="M'+x2+' '+y2+' L'+hx+' '+hy+' L'+kx+' '+ky+' Z" fill="'+c+'"/>';}
function grid(x,y,cols,rows,sp,fn){var s='';for(var r=0;r<rows;r++)for(var c=0;c<cols;c++)s+=fn(x+c*sp,y+r*sp,r,c);return s;}
var ELS=[[0.5,0.5],[1.5,0.6],[2.4,0.4],[0.6,1.5],[1.4,1.4],[2.6,1.6],[3.4,0.5],[3.5,1.5]];
function metalPic(x,y,cols,rows,sp,t){var s=seaBox(x-16,y-16,(cols-1)*sp+32,(rows-1)*sp+32)+grid(x,y,cols,rows,sp,function(a,b){return cat(a,b,10,t);});
  for(var r=0;r<rows;r++)for(var c=0;c<cols-1;c++)s+=el(x+(c+0.5)*sp,y+r*sp+((r+c)%2?-7:7));
  for(var r2=0;r2<rows-1;r2++)for(var c2=0;c2<cols;c2++)if((r2+c2)%2===0)s+=el(x+c2*sp+((c2%3)-1)*6,y+(r2+0.5)*sp);
  return s;}

var PANELS=[
 {q:'What holds the positive metal cations together in a solid metal?',
  pic:sv(metalPic(40,22,6,2,44,'+')+lab(150,102,'cations + a sea of delocalized electrons','#2b59c3',12),108),
  rule:['Metal atoms give their valence electrons to a shared <b>sea</b> → they become <b>cations</b>.','The electrons are <b>delocalized</b>: free to move, not held by any one atom.','<b>Metallic bond</b> = attraction between the cations and the sea of electrons.']},
 {q:'Why does solid copper conduct electricity, but solid NaCl does not?',
  pic:sv(lab(70,10,'Copper (solid)','#18233a',11)+metalPic(36,32,3,2,34,'+')+arrow(24,86,116,86,'#0f8b8d')+lab(70,104,'electrons move ✓','#0f8b8d',11)+
   lab(230,10,'NaCl (solid)','#18233a',11)+grid(196,32,3,2,34,function(a,b,r,c){return (r+c)%2?an(a,b,12):cat(a,b,9);})+lab(230,104,'ions locked ✗','#c00000',11),110),
  rule:['Metals conduct <b>even as solids</b>: delocalized electrons are free to move.','Ionic solids: ions are locked in place → no current.','The moving electrons also carry <b>heat</b> quickly.']},
 {q:'Why does a metal bend when you hit it, but an ionic crystal shatters?',
  pic:sv(seaBox(14,8,122,62)+grid(46,22,3,1,30,function(a,b){return cat(a,b,10);})+grid(28,54,3,1,30,function(a,b){return cat(a,b,10);})+el(62,38)+el(94,40)+el(40,40)+el(116,52)+lab(75,86,'slides, still bonded ✓','#0f8b8d',11)+
   grid(185,22,3,1,30,function(a,b,r,c){return c%2?an(a,b,11):cat(a,b,9);})+grid(185,54,3,1,30,function(a,b,r,c){return c%2?an(a,b,11):cat(a,b,9);})+
   '<path d="M185 33 l4 6 -4 4 4 6" stroke="#c00000" stroke-width="2" fill="none"/><path d="M245 33 l4 6 -4 4 4 6" stroke="#c00000" stroke-width="2" fill="none"/>'+lab(215,86,'like charges repel ✗','#c00000',11),94),
  rule:['Metal: layers of cations <b>slide</b> and the sea moves with them → <b>malleable</b> (sheets) and <b>ductile</b> (wires).','Ionic crystal: sliding puts <b>like charges</b> together → they repel → it <b>shatters</b>.']},
 {q:'How does the number of electrons each atom adds to the sea change the hardness and melting point?',
  pic:sv('<rect x="20" y="52" width="70" height="16" rx="5" fill="#0f8b8d"/><rect x="115" y="38" width="70" height="30" rx="5" fill="#178a90"/><rect x="210" y="14" width="70" height="54" rx="5" fill="#2f4b7c"/>'+
   lab(55,46,'1 e⁻','#18233a',12)+lab(150,32,'2 e⁻','#18233a',12)+lab(245,9+0,'s + d e⁻','#18233a',11)+lab(55,84,'Group 1','#56637d',11)+lab(150,84,'Group 2','#56637d',11)+lab(245,84,'Transition','#56637d',11),92),
  rule:['More electrons in the sea → <b>stronger metallic bond</b>.','Stronger bond → <b>harder</b> and <b>higher melting point</b>: Group 1 &lt; Group 2 &lt; Transition.','<b>Boiling point ≫ melting point</b>: to boil, atoms must leave the sea completely.']},
 {q:'Why is steel (iron + carbon) harder than pure iron?',
  pic:sv(grid(25,18,3,3,22,function(a,b){return '<circle cx="'+a+'" cy="'+b+'" r="10" fill="#9aa7bd"/>';})+lab(47,96,'pure metal','#56637d',11)+
   grid(128,18,3,3,22,function(a,b,r,c){return '<circle cx="'+a+'" cy="'+b+'" r="10" fill="'+((r*3+c)%4===1?'#e8962a':'#9aa7bd')+'"/>';})+lab(150,96,'substitutional','#e8962a',11)+
   grid(231,18,3,3,22,function(a,b){return '<circle cx="'+a+'" cy="'+b+'" r="10" fill="#9aa7bd"/>';})+'<circle cx="242" cy="29" r="4.5" fill="#18233a"/><circle cx="264" cy="51" r="4.5" fill="#18233a"/><circle cx="242" cy="51" r="4.5" fill="#18233a"/><circle cx="264" cy="29" r="4.5" fill="#18233a"/>'+lab(253,96,'interstitial','#18233a',11),104),
  rule:['<b>Alloy</b> = a mixture of elements with metallic properties.','<b>Substitutional</b>: similar-size atoms replace some atoms (sterling silver, brass).','<b>Interstitial</b>: small atoms fill the holes (steel: Fe + C).','Extra atoms stop the layers sliding → alloys are <b>harder and stronger</b>.']},
 {q:'Why do metals look shiny?',
  pic:sv('<rect x="20" y="58" width="260" height="26" rx="8" fill="#2b59c3" opacity=".12"/>'+el(150,66)+'<circle cx="150" cy="66" r="9" fill="#f2c500" opacity=".35"/>'+
   arrow(40,10,145,58,'#f2c500')+arrow(155,58,260,10,'#f2c500')+lab(70,46,'light in','#56637d',11)+lab(232,46,'light out','#56637d',11)+lab(150,80,'electron absorbs & releases light','#0f8b8d',11),90),
  rule:['Delocalized electrons <b>absorb light and release it again</b> → the light bounces back → <b>luster</b>.','Silver sends back all colours → silver shine. Gold keeps some blue → <b>yellow</b> shine.','Nonmetals have no free electrons → <b>dull</b>.']}
];
function panel(i,m){
  var P=PANELS[i];
  $('panel').innerHTML='<h2>'+m.title+'</h2>'+
   '<div class="bigq"><span>Think about it</span>'+P.q+'</div>'+
   '<button type="button" class="btn coral" id="ruleBtn">Reveal our rule</button>'+

    s.els.forEach(function(e){if(e.fl>0){circle(e.x,e.y,12,e.fc+'55');circle(e.x,e.y,7,e.fc+'88');}electron(e.x,e.y);});
    s.ph.forEach(function(p){if(p.st!=='hold')s.wave(p);});
    if(s.slow){var hp=null;s.ph.forEach(function(p){if(p.st==='hold')hp=p;});if(hp){text(hp.fate==='absorb'?'electron keeps this '+hp.col.n+' light':'electron takes in the light… and releases it again',hp.x,s.surf-40,14,hp.fate==='absorb'?'#c00000':C.teal,'center',700);}}
    // what the eye sees
    var bx=W/2-110,by=104,bw=220,bh=58;text('What your eye sees',W/2,by-16,14,C.ink,'center',700);
    ctx.save();roundRect(bx,by,bw,bh,12);ctx.clip();
    if((s.mode==='s'?s.hits<15:s.seen.n<6)){ctx.fillStyle='#e6eaf1';ctx.fillRect(bx,by,bw,bh);ctx.restore();text(s.on?'collecting light…':'?',W/2,by+bh/2,15,C.muted,'center',600);}
    else{var shiny=s.mode!=='s',r=s.seen.r/s.seen.n,g=s.seen.g/s.seen.n,b=s.seen.b/s.seen.n;
      var m=Math.max(r,g,b)||1;r=r/m*255;g=g/m*255;b=b/m*255;
      var base='rgb('+Math.round(r*0.62)+','+Math.round(g*0.62)+','+Math.round(b*0.62)+')',hi='rgb('+Math.round(lerp(r,255,.75))+','+Math.round(lerp(g,255,.75))+','+Math.round(lerp(b,255,.75))+')';
      if(s.mode==='ag'){base='#8e98a8';hi='#ffffff';}if(s.mode==='au'){base='#a87a12';hi='#ffe48a';}
      if(s.mode==='s'){ctx.fillStyle='#cdbb5a';ctx.fillRect(bx,by,bw,bh);}
      else{var gr=ctx.createLinearGradient(bx,by,bx+bw,by+bh);gr.addColorStop(0,base);gr.addColorStop(0.42,hi);gr.addColorStop(0.5,'#ffffff');gr.addColorStop(0.58,hi);gr.addColorStop(1,base);ctx.fillStyle=gr;ctx.fillRect(bx,by,bw,bh);}
      ctx.restore();
      text(s.mode==='ag'?'shiny · white-silver':(s.mode==='au'?'shiny · golden yellow':'dull · no shine'),W/2,by+bh+16,14,shiny?C.teal:'#c00000','center',700);}
    ctx.save();roundRect(bx,by,bw,bh,12);ctx.lineWidth=2;ctx.strokeStyle='#c9d4e6';ctx.stroke();ctx.restore();
  }
};

/* ---------- tabs and main loop ---------- */
var missions=[M1,M2,M3,M4,M5,M6],cur=null;
var tabs=$('tabs');
missions.forEach(function(m,i){var b=document.createElement('button');b.type='button';b.className='tab';
  b.innerHTML='<span class="n" style="background:'+m.color+'">'+(i+1)+'</span>'+m.title.split('· ')[1];
  b.addEventListener('click',function(){select(i);});tabs.appendChild(b);});
function select(i){cur=missions[i];Array.prototype.forEach.call(tabs.children,function(t,j){t.classList.toggle('active',i===j);});
  panel(i,cur);cur.init();
  try{history.replaceState(null,'','#mission'+(i+1));}catch(e){}}
var start=0;var h=(location.hash||'').match(/mission(\d)/);if(h)start=clamp(+h[1]-1,0,5);
function frame(){ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#f7f9fd';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(219,228,241,0.7)';ctx.lineWidth=1;ctx.beginPath();for(var x=0;x<=W;x+=28){ctx.moveTo(x,0);ctx.lineTo(x,H);}for(var y=0;y<=H;y+=28){ctx.moveTo(0,y);ctx.lineTo(W,y);}ctx.stroke();
  if(cur){cur.update();cur.draw();}
  requestAnimationFrame(frame);}
function go(){select(start);requestAnimationFrame(frame);}
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(go);}else go();
})();
