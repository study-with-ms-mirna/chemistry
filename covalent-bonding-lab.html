<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Covalent Bonding Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf0f8;--grid:#dbe4f1;--ink:#18233a;--muted:#5a6780;--line:#c9d4e6;--shadow:#c3cfe3;
--teal:#0f8b8d;--blue:#2b59c3;--plum:#8a4fbf;--amber:#e8962a;--coral:#e2708a;--red:#d8434a;--accent:#0f8b8d}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.4}
.wrap{max-width:1260px;margin:0 auto;padding:18px 20px 34px}
header{display:flex;align-items:center;gap:14px;margin-bottom:16px}
header svg{flex:none}
h1{font-family:Fredoka,sans-serif;font-weight:600;font-size:32px;margin:0;line-height:1.1}
.sub{color:var(--muted);font-size:16px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
.tab{font-family:Fredoka,sans-serif;font-weight:500;font-size:18px;padding:10px 18px;border-radius:16px;border:2px solid var(--line);background:#fff;box-shadow:0 4px 0 var(--shadow);cursor:pointer;display:flex;align-items:center;gap:8px}
.tab i{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-block}
.tab.on{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 4px 0 rgba(24,35,58,.22)}
.tab.on i{background:#fff}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.step{font-family:Fredoka,sans-serif;font-size:16px;padding:6px 14px 6px 7px;border-radius:999px;border:2px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;gap:8px}
.step b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--line);font-weight:600;font-size:14px}
.step.on{border-color:var(--accent);color:var(--accent)}
.step.on b{background:var(--accent);color:#fff}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:960px){.main{grid-template-columns:1fr}}
.card{background:#fff;border:2px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--shadow);padding:16px}
.stage h2{font-family:Fredoka,sans-serif;font-weight:600;font-size:22px;margin:0 0 10px;color:var(--accent)}
canvas{width:100%;height:auto;display:block;border-radius:14px;background:#f6f8fc}
.controls{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin-top:14px}
.ctl{display:flex;align-items:center;gap:10px;font-family:Fredoka,sans-serif;font-size:16px}
.ctl output{min-width:84px;font-weight:600;color:var(--accent)}
.btn{font-family:Fredoka,sans-serif;font-weight:500;font-size:16px;padding:9px 16px;border-radius:14px;border:2px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer;box-shadow:0 3px 0 var(--shadow)}
.btn.fill{background:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn.sel{background:var(--accent);color:#fff}
input[type=range]{-webkit-appearance:none;appearance:none;width:260px;max-width:60vw;height:10px;border-radius:999px;background:#dfe6f2;outline:none;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;background:var(--accent);border:4px solid #fff;box-shadow:0 0 0 2px var(--accent),0 2px 3px rgba(0,0,0,.25);cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:4px solid #fff;box-shadow:0 0 0 2px var(--accent);cursor:pointer}
input[type=range]:disabled{opacity:.4}
.side{display:flex;flex-direction:column;gap:14px}
.lbl{font-family:Fredoka,sans-serif;font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.q{font-size:19px;font-weight:700}
.rule{border:3px dashed var(--red);border-radius:18px;padding:12px 14px;background:#fff}
.rule .lbl{color:var(--red)}
.rule ul{margin:0;padding-left:20px}
.rule li{margin:4px 0}
.reads{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rd{background:#f3f6fb;border-radius:14px;padding:8px 10px}
.rd span{display:block;font-size:13px;color:var(--muted)}
.rd b{font-family:Fredoka,sans-serif;font-weight:600;font-size:22px}
.rd.wide{grid-column:1/-1}
.bar{height:14px;border-radius:999px;background:#e6ebf3;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:999px;transition:width .15s}
.reads .rd b{font-size:19px}
.step.done b{background:#2e9e5b;color:#fff}
.fb{margin-top:12px;border-radius:14px;padding:10px 14px;font-size:17px;background:#f3f6fb;border:2px solid var(--line);display:none}
.fb.show{display:block}
.fb.ok{background:#e8f6ee;border-color:#2e9e5b}
.fb.bad{background:#fdeeee;border-color:#d8434a}
.fb.hint{background:#fff6e8;border-color:#e8962a}
.cnt{display:none;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-top:12px;padding:10px 14px;border-radius:14px;background:#f6f8fc}
.cnt.show{display:flex}
.stp{display:inline-flex;align-items:center;gap:8px;font-family:Fredoka,sans-serif;font-size:17px}
.stp button{width:34px;height:34px;border-radius:50%;border:2px solid var(--accent);background:#fff;color:var(--accent);font-family:Fredoka,sans-serif;font-size:20px;line-height:1;cursor:pointer;padding:0}
.stp b{min-width:26px;text-align:center;font-size:22px}
#cv.click{cursor:pointer}
sub{font-size:.65em}
.tab{font-size:15.5px;padding:8px 12px}
/* extra2 */
/* ===== show me / my turn panels ===== */
.modebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0 10px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.seg button{border:none;background:#fff;padding:8px 16px;font-size:16px;cursor:pointer;color:var(--ink);font-family:Fredoka,sans-serif;font-weight:500}
.seg button.on{background:var(--accent);color:#fff}
.small{font-size:14px;color:var(--muted)}
.task{font-size:18px;background:#f3f6fb;border-radius:14px;padding:10px 14px;margin-bottom:10px}
.molbox{display:flex;justify-content:center;align-items:center;background:#f6f8fc;border-radius:16px;padding:14px;min-height:150px}
.molbox svg{max-width:100%;height:auto}
.steps3{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.st{border:2px solid var(--line);border-radius:16px;padding:10px 14px;display:none;background:#fff}
.st.on{display:block;animation:fadein .45s ease}
.st.cur{border-color:var(--accent)}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.st .sh{display:flex;align-items:center;gap:8px;font-family:Fredoka,sans-serif;font-weight:600;font-size:18px}
.st .sh .n{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px;flex:none}
.st .ln{font-size:17px;margin-top:6px;line-height:1.6}
.st .mth{font-family:Fredoka,sans-serif;font-size:23px;font-weight:600}
.st .why{font-size:16px;color:var(--muted)}
.sg{color:#0f8b8d;font-weight:700}.pp{color:#e2708a;font-weight:700}
.stepbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.stepdots{display:flex;gap:6px}
.stepdots i{width:11px;height:11px;border-radius:50%;background:var(--line);display:block}
.stepdots i.on{background:var(--accent)}
.hintbox{display:none;margin-top:10px;background:#fff4e5;border:2px solid #e8962a;border-radius:14px;padding:10px 14px;font-size:16px}
.hintbox.on{display:block}
.feedback{margin-top:10px;font-size:17px}
.feedback .bad{color:#d8434a;font-family:Fredoka,sans-serif;font-weight:600}.feedback .good{color:#2e9e5b;font-family:Fredoka,sans-serif;font-weight:600}
.feedback ul{margin:4px 0 0;padding-left:20px}
.ansrow{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:12px;font-family:Fredoka,sans-serif;font-size:20px}
.ansrow input{width:70px;font-family:Fredoka,sans-serif;font-size:22px;font-weight:600;text-align:center;border:2px solid var(--line);border-radius:10px;padding:4px;-webkit-appearance:none;appearance:none;background:#fff;color:var(--ink)}
.ansrow input.ok{border-color:#2e9e5b;background:#e8f6ee}.ansrow input.no{border-color:#d8434a;background:#fdeeee}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:700px){.sumgrid{grid-template-columns:1fr}}
.sumc{border:2px solid var(--line);border-radius:18px;padding:12px;text-align:center;background:#fff}
.sumc h3{font-family:Fredoka,sans-serif;font-weight:600;font-size:20px;margin:0 0 4px}
.sumc .res{font-family:Fredoka,sans-serif;font-weight:600;font-size:26px;margin-top:4px}
.sumc svg{width:100%;height:auto;display:block}
.bigrule{margin-top:12px;border:3px dashed var(--red);border-radius:18px;padding:10px 14px;font-size:18px;text-align:center}
.qcard{font-size:19px;font-weight:700;margin-bottom:12px}
.opts{display:flex;gap:12px;flex-wrap:wrap}
.opt{flex:1 1 180px;border:2px solid var(--line);border-radius:18px;background:#fff;padding:12px;cursor:pointer;text-align:center;font-family:Fredoka,sans-serif;font-size:18px;box-shadow:0 4px 0 var(--shadow);color:var(--ink)}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:#2e9e5b;background:#e8f6ee}.opt.wrong{border-color:#d8434a;background:#fdeeee}
.opt:disabled{cursor:default}
.opt svg{display:block;margin:0 auto 4px}
.opt .val{display:block;font-size:14px;color:var(--muted);margin-top:4px;min-height:18px}
</style>
</head>

<div class="wrap">
  <header>
    <svg width="58" height="54" viewBox="0 0 58 54" aria-hidden="true">
      <circle cx="20" cy="27" r="16" fill="#dff1f1" stroke="#18233a" stroke-width="2.5"/>
      <circle cx="38" cy="27" r="16" fill="#fde8ee" stroke="#18233a" stroke-width="2.5" fill-opacity=".85"/>
      <circle cx="20" cy="27" r="4" fill="#18233a"/><circle cx="38" cy="27" r="4" fill="#18233a"/>
      <circle cx="29" cy="21" r="3.2" fill="#2b8fd8"/><circle cx="29" cy="33" r="3.2" fill="#e2708a"/>
    </svg>
    <div><h1>Covalent Bonding Lab</h1><div class="sub">Sharing electrons · single, double and triple bonds · sigma and pi bonds</div></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div class="steps" id="steps"></div>
  <div class="main">
    <section class="card stage">
      <h2 id="stitle"></h2>
      <canvas id="cv" width="800" height="500"></canvas>
      <div class="controls" id="controls"></div>
      <div class="cnt" id="cnt"></div>
      <div class="fb" id="fb"></div>
      <div id="panel"></div>
    </section>
    <aside class="side">
      <div class="card"><div class="lbl" id="qlbl">Think</div><div class="q" id="q"></div></div>
      <div class="card"><div class="lbl">Readings</div><div class="reads" id="reads"></div></div>
      <div class="rule"><div class="lbl">Our rule</div><ul id="rule"></ul></div>
    </aside>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=800,H=500;
function fit(){var d=window.devicePixelRatio||1;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);}fit();window.addEventListener('resize',fit);
function $(id){return document.getElementById(id);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}
var INK='#18233a',MUTED='#5a6780',LINE='#c9d4e6',TEAL='#0f8b8d',CORAL='#e2708a',AMBER='#e8962a',BLUE='#2b59c3',PLUM='#8a4fbf',RED='#d8434a',GREEN='#2e9e5b';
var EA='#2b8fd8',EB='#e2708a';
var VAL={H:1,C:4,N:5,O:6,F:7,Cl:7};
var USUAL={H:1,C:4,N:3,O:2,F:1,Cl:1};
function need(s){return s==='H'?2:8;}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function txt(s,x,y,o){o=o||{};ctx.font=(o.w||600)+' '+(o.s||15)+'px Fredoka, sans-serif';ctx.fillStyle=o.c||INK;ctx.textAlign=o.a||'center';ctx.textBaseline='middle';ctx.fillText(s,x,y);return ctx.measureText(s).width;}
function para(s,x,y,o){o=o||{};return txt(s,x,y,{s:o.s||16,w:o.w||400,c:o.c||INK,a:o.a||'left'});}
function dot(x,y,c,r){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r||5.5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();}
function ball(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(24,35,58,.3)';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.arc(x-r*.3,y-r*.3,r*.35,0,Math.PI*2);ctx.fill();}
function seg(x1,y1,x2,y2,c,w,dash){ctx.strokeStyle=c;ctx.lineWidth=w||2;ctx.setLineDash(dash||[]);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);}
function arrow(x1,y1,x2,y2,c,w){seg(x1,y1,x2,y2,c,w||4);var a=Math.atan2(y2-y1,x2-x1),h=11;ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x2+Math.cos(a)*4,y2+Math.sin(a)*4);ctx.lineTo(x2-Math.cos(a-.5)*h,y2-Math.sin(a-.5)*h);ctx.lineTo(x2-Math.cos(a+.5)*h,y2-Math.sin(a+.5)*h);ctx.closePath();ctx.fill();}
function ring(x,y,r,ok,label){ctx.strokeStyle=ok?GREEN:'#9aa6ba';ctx.lineWidth=2.5;ctx.setLineDash([7,6]);ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
  if(label){var w=txt(label,0,-999,{s:15});rr(x-w/2-10,y+r+6,w+20,24,12);ctx.fillStyle=ok?GREEN:'#9aa6ba';ctx.fill();txt(label,x,y+r+18,{s:15,c:'#fff'});}}
function pill(s,x,y,bg,fg,size){size=size||15;var w=txt(s,0,-999,{s:size});rr(x-w/2-10,y-size*.85,w+20,size*1.7,size*.85);ctx.fillStyle=bg;ctx.fill();txt(s,x,y,{s:size,c:fg||'#fff'});}
function panel(x,y,w,h){rr(x,y,w,h,14);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle=LINE;ctx.lineWidth=2;ctx.stroke();}
function clear(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#f6f8fc';ctx.fillRect(0,0,W,H);}

/* ---------- side panel helpers ---------- */
var lastReads='';
function setQ(h,lbl){$('q').innerHTML=h;$('qlbl').textContent=lbl||'Think';}
function setRule(a){$('rule').innerHTML=a.map(function(s){return '<li>'+s+'</li>';}).join('');}
function setReads(a){var h=a.map(function(r){return '<div class="rd'+(r[2]?' wide':'')+'"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>';}).join('');if(h!==lastReads){$('reads').innerHTML=h;lastReads=h;}}
function fb(msg,kind){var f=$('fb');if(!msg){f.className='fb';f.innerHTML='';return;}f.className='fb show '+(kind||'');f.innerHTML=msg;}

/* ---------- general Lewis structure renderer ---------- */
function angDiff(a,b){var d=Math.abs(a-b)%(Math.PI*2);return d>Math.PI?Math.PI*2-d:d;}
function lpDirs(m,i,n){var A=m.atoms[i],bs=[];m.bonds.forEach(function(b){if(b[0]===i||b[1]===i){var B=m.atoms[b[0]===i?b[1]:b[0]];bs.push(Math.atan2(B.y-A.y,B.x-A.x));}});
  var P=Math.PI,c=[-P/2,P/2,P,0,-3*P/4,-P/4,3*P/4,P/4].map(function(a){var md=bs.length?Math.min.apply(null,bs.map(function(b){return angDiff(a,b);})):P;return {a:a,md:md};});
  var main=c.slice(0,4).filter(function(o){return o.md>0.8;}),diag=c.slice(4).filter(function(o){return o.md>0.6;});
  main.sort(function(p,q){return q.md-p.md;});
  var out=main.concat(diag).slice(0,n).map(function(o){return o.a;});return out;}
function drawMol(m,o){o=o||{};var sz=o.sz||44,gap=o.gap||sz*.48,sp=o.sp||9,lw=o.lw||4;
  m.bonds.forEach(function(b,bi){var A=m.atoms[b[0]],B=m.atoms[b[1]],dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,px=-uy,py=ux,n=b[2]||1;
    var ga=gap*(A.s.length>1?1.25:1),gb=gap*(B.s.length>1?1.25:1);
    for(var k=0;k<n;k++){var off=(k-(n-1)/2)*sp,col=o.col||INK;
      if(o.sigpi){var isS=(n%2===1)?k===(n-1)/2:k===0;col=isS?TEAL:CORAL;}
      seg(A.x+ux*ga+px*off,A.y+uy*ga+py*off,B.x-ux*gb+px*off,B.y-uy*gb+py*off,col,lw);}
  });
  m.atoms.forEach(function(A,i){var c=(o.atomCol&&o.atomCol[i])||o.col||INK;txt(A.s,A.x,A.y+1,{s:sz,c:c});
    var n=A.lp||0;if(!n)return;var dirs=lpDirs(m,i,n),R=sz*.68+(A.s.length>1?sz*.2:0),sepd=sz*.15;
    dirs.forEach(function(a){var cx=A.x+Math.cos(a)*R,cy=A.y+Math.sin(a)*R*.92,pxx=-Math.sin(a),pyy=Math.cos(a);
      if(Math.abs(Math.sin(a))>0.9){cy=A.y+Math.sin(a)*sz*.76;}
      dot(cx+pxx*sepd,cy+pyy*sepd,o.lpCol||c,sz*.085);dot(cx-pxx*sepd,cy-pyy*sepd,o.lpCol||c,sz*.085);});
  });}
/* electron-dot symbol: singles first (top, right, bottom, left), then pairs */
function atomDots(s,x,y,v,sz,col){txt(s,x,y+1,{s:sz,c:INK});var R=sz*.62,sp=sz*.15,cnt=[0,0,0,0];for(var i=0;i<v;i++)cnt[i%4]++;
  [[0,-1],[1,0],[0,1],[-1,0]].forEach(function(d,k){var cx=x+d[0]*R*(s.length>1?1.3:1),cy=y+d[1]*R;
    if(cnt[k]===1)dot(cx,cy,col,sz*.09);else if(cnt[k]===2){dot(cx-d[1]*sp,cy-d[0]*sp,col,sz*.09);dot(cx+d[1]*sp,cy+d[0]*sp,col,sz*.09);}});}

/* =========================================================
   TAB 1  Sharing electrons (H2 energy curve)
   ========================================================= */
function E1(d){return 436*(Math.pow(1-Math.exp(-0.022*(d-74)),2)-1);}
var T1={name:'Sharing electrons',c:TEAL,steps:['Far apart','Getting closer','Bond forms','Too close'],D:[280,150,74,36],d:280,tgt:null,t:0,
 title:function(){return 'Two hydrogen atoms share a pair of electrons';},
 enter:function(s){var me=this;this.tgt=this.D[s];
  $('controls').innerHTML='<label class="ctl">Distance between nuclei <input type="range" id="dsl" min="30" max="300" step="1"><output id="dout"></output></label><button class="btn fill" id="bondb">Let them bond</button>';
  $('dsl').value=this.d;$('dsl').oninput=function(){me.tgt=null;me.d=+this.value;};$('bondb').onclick=function(){me.tgt=74;};
  setQ(['Two hydrogen atoms are far apart. Is there any force between them? What is the energy?',
        'As they get closer, each nucleus attracts the <b>other</b> atom’s electron. Does the energy go up or down?',
        'Find the distance where the energy is <b>lowest</b>. What happens to the two electrons here?',
        'Push the nuclei too close. Why does the energy shoot up?'][s]);
  setRule(['A <b>covalent bond</b> is a pair of electrons <b>shared</b> between two atoms.',
    'The bond forms at the distance of <b>lowest energy</b>, where attraction and repulsion balance (H<sub>2</sub>: 74 pm).',
    'Sharing gives each H atom <b>2 electrons</b>, like helium, so the molecule is more stable than the separate atoms.',
    'Forming a bond <b>releases</b> energy; breaking it needs the same amount (436 kJ/mol for H<sub>2</sub>).']);},

  else{$('cv').style.display='none';$('controls').innerHTML='';this.renderQ();setQ('Use the rule: shorter bond and more shared pairs → more energy to break.');}
  setRule(['<b>Bond dissociation energy</b> = the energy needed to <b>break</b> one bond.','A <b>shorter</b> bond is <b>stronger</b> and needs <b>more</b> energy to break, like the short stick.','More shared pairs (more overlap) → shorter bond: <b>single &lt; double &lt; triple</b>.','Breaking a bond always <b>absorbs</b> energy (endothermic).']);},
 renderQ:function(){var me=this,q=BQ[this.qi],ans=q.got!==null;
  var h='<div class="small" style="margin:6px 0 8px">Question '+(this.qi+1)+' of '+BQ.length+'</div><div class="qcard">'+q.q+'</div><div class="opts">'+q.o.map(function(o,i){var cls=ans?(i===q.a?' right':(i===q.got?' wrong':'')):'';
   return '<button class="opt'+cls+'" data-o="'+i+'"'+(ans?' disabled':'')+'>'+bondSvg(o)+(o[3]&&o[2]>0?'<span>'+o[3]+'</span>':'')+'<span class="val">'+(ans?q.v[i]:'')+'</span></button>';}).join('')+'</div>';
  h+='<div class="feedback" id="qFb">'+(ans?(q.got===q.a?'<span class="good">Correct! </span>':'<span class="bad">Not quite. </span>')+q.why:'')+'</div>';
  h+='<div class="stepbar"><button class="btn" id="qPrev"'+(this.qi===0?' disabled':'')+'>◀ Previous</button><button class="btn fill" id="qNext"'+(this.qi===BQ.length-1?' disabled':'')+'>Next question ▶</button><div class="stepdots">'+BQ.map(function(x,i){return '<i class="'+(x.got!==null?'on':'')+'"'+(x.got!==null&&x.got!==x.a?' style="background:#d8434a"':'')+'></i>';}).join('')+'</div></div>';
  $('panel').innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(b){b.onclick=function(){q.got=+b.getAttribute('data-o');me.renderQ();};});
  $('qPrev').onclick=function(){me.qi--;me.renderQ();};$('qNext').onclick=function(){me.qi++;me.renderQ();};
  var right=BQ.filter(function(x){return x.got===x.a;}).length,done=BQ.filter(function(x){return x.got!==null;}).length;
  setReads([['Answered',done+' / '+BQ.length],['Correct',right]]);},
 frame:function(dt){if(this.s===3)return;clear();if(this.s===0)return this.sticks(dt);this.bonds(dt);},
 sticks:function(dt){var me=this,F=this.F,TH=[34,80];$('fout').textContent=F+' N';
  [0,1].forEach(function(k){if(F>=TH[k])me.br[k]=1;});
  [[0,'Long stick (30 cm)',300,200],[1,'Short stick (12 cm)',120,600]].forEach(function(z){var k=z[0],L=z[2],cx=z[3],y=190,broken=me.br[k];
   panel(cx-180,40,360,300);txt(z[1],cx,70,{s:20,c:k?TEAL:CORAL});
   var x1=cx-L/2,x2=cx+L/2;ctx.fillStyle='#8d99b0';rr(x1-26,y+6,32,86,6);ctx.fill();rr(x2-6,y+6,32,86,6);ctx.fill();
   var sag=broken?0:Math.min(F,TH[k])*L*L/30000*(k?1:1.15);
   ctx.lineCap='round';
   if(!broken){ctx.strokeStyle='#a8692f';ctx.lineWidth=16;ctx.beginPath();ctx.moveTo(x1,y);ctx.quadraticCurveTo(cx,y+sag*2,x2,y);ctx.stroke();ctx.strokeStyle='#d39a5c';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(x1,y-2);ctx.quadraticCurveTo(cx,y+sag*2-2,x2,y-2);ctx.stroke();
    if(F>0)arrow(cx,y-70-F*.3,cx,y+sag-14,RED,5);}
   else{[[x1,1],[x2,-1]].forEach(function(e){ctx.save();ctx.translate(e[0],y);ctx.rotate(e[1]*.55);ctx.strokeStyle='#a8692f';ctx.lineWidth=16;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(e[1]*L/2-e[1]*6,0);ctx.stroke();ctx.restore();});
    txt('SNAP!',cx,y-40,{s:30,c:RED});}
   txt(broken?'Broke at '+TH[k]+' N':'Holding…',cx,y+124,{s:18,c:broken?RED:GREEN});});
  var msg=!this.br[0]?'Slowly push harder. Which stick breaks first?':!this.br[1]?'The long stick broke first! Keep pushing on the short stick…':'The short stick needed more than twice the force!';
  panel(20,356,760,130);txt(msg,400,384,{s:18,c:INK});
  if(this.br[1]){txt('Short stick  →  harder to break  →  needs MORE energy',400,420,{s:17,c:TEAL});txt('Short bond   →  stronger bond   →  greater bond dissociation energy',400,454,{s:17,c:BLUE});}
  setReads([['Force',F+' N'],['Long stick (30 cm)',this.br[0]?'broke at 34 N':'holding',1],['Short stick (12 cm)',this.br[1]?'broke at 80 N':'holding',1]]);},
 bonds:function(dt){var me=this,rows=BD[this.s-1],E=this.E;
  rows.forEach(function(r,k){var y=95+k*140,broke=E>=r[5];me.anim[k]=broke?Math.min(1,me.anim[k]+dt*1.2):0;var a=me.anim[k];
   panel(16,y-62,768,128);
   var d=r[4]*1.25,cx=272,sep=d+a*80,x1=cx-sep/2,x2=cx+sep/2,al=1-a;
   ctx.globalAlpha=al;
   if(r[3]>=3){ctx.fillStyle='rgba(138,79,191,.12)';ctx.strokeStyle=PLUM;ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.beginPath();ctx.ellipse(cx,y,d/2+30,40,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.setLineDash([]);}
   if(r[3]>=2){[-1,1].forEach(function(sg){ctx.fillStyle='rgba(226,112,138,.45)';ctx.strokeStyle=CORAL;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(cx,y+sg*24,d/2+22,11,0,0,Math.PI*2);ctx.fill();ctx.stroke();});}
   ctx.fillStyle='rgba(15,139,141,.55)';ctx.strokeStyle=TEAL;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(cx,y,d/2*.8,13,0,0,Math.PI*2);ctx.fill();ctx.stroke();
   ctx.globalAlpha=1;
   ball(x1,y,15,ACOL[r[1]]);txt(r[1],x1,y+1,{s:15,c:'#fff'});ball(x2,y,15,ACOL[r[2]]);txt(r[2],x2,y+1,{s:15,c:'#fff'});
   if(!broke){seg(cx-d/2,y+48,cx+d/2,y+48,MUTED,1.5);seg(cx-d/2,y+42,cx-d/2,y+54,MUTED,1.5);seg(cx+d/2,y+42,cx+d/2,y+54,MUTED,1.5);txt(r[4]+' pm',cx,y+38+20,{s:13,c:MUTED,w:500});}
   txt(r[0],36,y-34,{s:22,a:'left'});txt(['single: 1σ','double: 1σ + 1π','triple: 1σ + 2π'][r[3]-1],36,y-8,{s:13,a:'left',c:MUTED,w:500});
   var bx=440,bw=310;rr(bx,y-12,bw,24,12);ctx.fillStyle='#e6ebf3';ctx.fill();rr(bx,y-12,Math.max(24,bw*Math.min(E,r[5])/1000),24,12);ctx.fillStyle=broke?GREEN:AMBER;ctx.fill();
   var mx=bx+bw*r[5]/1000;seg(mx,y-20,mx,y+20,INK,2.5);txt(r[5]+' kJ/mol',mx,y-32,{s:14});
   txt(broke?'BROKEN: needed '+r[5]+' kJ/mol':'holding',bx,y+34,{s:15,a:'left',c:broke?GREEN:MUTED});});
  txt('Energy added: '+E+' kJ/mol',780,22,{s:17,a:'right',c:BLUE});
  ctx.fillStyle=TEAL;ctx.beginPath();ctx.arc(30,22,7,0,7);ctx.fill();para('σ overlap',42,22,{s:13,c:MUTED});ctx.fillStyle=CORAL;ctx.beginPath();ctx.arc(130,22,7,0,7);ctx.fill();para('π overlap',142,22,{s:13,c:MUTED});ctx.fillStyle=PLUM;ctx.beginPath();ctx.arc(230,22,7,0,7);ctx.fill();para('2nd π (front & back)',242,22,{s:13,c:MUTED});
  var r2=[['Energy added',E+' kJ/mol',1]];rows.forEach(function(r){r2.push([r[0]+' ('+r[4]+' pm)',E>=r[5]?'broken':'needs '+r[5]]);});setReads(r2);}
};

/* ---------- shell ---------- */
var TAB=[T1,T2,TL,T3,TS,TB],tabI=0,stepI=0;
function renderTabs(){$('tabs').innerHTML=TAB.map(function(t,i){return '<button class="tab'+(i===tabI?' on':'')+'" style="--c:'+t.c+'" data-i="'+i+'"><i></i>'+(i+1)+'. '+t.name+'</button>';}).join('');
  Array.prototype.forEach.call($('tabs').children,function(b){b.onclick=function(){go(+b.dataset.i,0);};});}
function renderSteps(){var t=TAB[tabI];$('steps').innerHTML=t.steps.map(function(l,i){var mk=t.mark?t.mark(i):i+1;return '<button class="step'+(i===stepI?' on':'')+(mk==='✓'?' done':'')+'" data-i="'+i+'"><b>'+mk+'</b>'+l+'</button>';}).join('');
  Array.prototype.forEach.call($('steps').children,function(b){b.onclick=function(){go(tabI,+b.dataset.i);};});}
var HASH=['sharing','multiple-bonds','lewis','sigma-pi','sigma-pi-practice','bond-energy'];
function go(t,s){tabI=t;stepI=s||0;document.documentElement.style.setProperty('--accent',TAB[t].c);$('cnt').className='cnt';fb('');$('cv').style.display='';hidePanel();
  renderTabs();renderSteps();$('stitle').textContent=TAB[t].title(stepI);lastReads='';TAB[t].enter(stepI);
  cv.className=(t===2||t===3)?'click':'';cv.style.touchAction=(t===2||t===3)?'none':'';
  try{history.replaceState(null,'','#'+HASH[t]);}catch(e){}}
function cpos(e){var r=cv.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];}
cv.addEventListener('pointerdown',function(e){var p=cpos(e),T=TAB[tabI];if(T.pdown){T.pdown(p[0],p[1]);try{cv.setPointerCapture(e.pointerId);}catch(err){}}});
cv.addEventListener('pointermove',function(e){var p=cpos(e),T=TAB[tabI];if(T.pmove)T.pmove(p[0],p[1]);});
cv.addEventListener('pointerup',function(e){var p=cpos(e),T=TAB[tabI];if(T.pup)T.pup(p[0],p[1]);});
cv.addEventListener('pointercancel',function(e){var T=TAB[tabI];if(T.pup)T.pup(-999,-999);});
var hi=HASH.indexOf(location.hash.slice(1));go(hi>=0?hi:0,0);
var last=performance.now();
function loop(now){var dt=Math.min(.05,(now-last)/1000);last=now;try{TAB[tabI].frame(dt);}catch(err){console.error(err);}requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
