<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Activation Energy Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#f3f8f8; --panel:#ffffff; --ink:#17323a; --muted:#587078; --line:#cfe0e2;
  --accent:#178a90; --accent-ink:#ffffff; --accent-soft:#dff2f3;
  --chamber:#0f2a33; --chamber-ink:#d9eef0; --wall:#6fb7bd;
  --good:#1f8f55; --bad:#c0504d; --gold:#f2b632; --slow:#c0504d; --fast:#1f8f55;
  --atomC:#5b6468; --atomO:#e0474c; --atomN:#3b82c4;
  --display:"Baloo 2","Trebuchet MS",sans-serif; --body:"Atkinson Hyperlegible",Verdana,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:18px 40px;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 24px;justify-content:space-between}
h1{font-family:var(--display);font-size:2.2rem;line-height:1;margin:0;color:var(--accent)}
.eq{font-family:var(--display);font-size:1.25rem;margin:0}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.key span{display:inline-flex;align-items:center;gap:5px}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{-webkit-appearance:none;appearance:none;font-family:var(--display);font-size:1.02rem;padding:6px 14px;border-radius:999px;border:2px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bench{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:820px){.bench{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
canvas{width:100%;height:auto;display:block;background:var(--chamber);border-radius:14px}
.controls{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.ctl{display:flex;flex-direction:column;gap:2px;min-width:180px;flex:1}
.ctl label{font-weight:700;font-size:.9rem}
.ctl input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:28px;background:transparent;margin:0;cursor:pointer}
.ctl input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:var(--line)}
.ctl input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--line)}
.ctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid var(--panel);box-shadow:0 0 0 1px var(--accent);margin-top:-7px}
.ctl input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--panel);box-shadow:0 0 0 1px var(--accent)}
.ctl small{color:var(--muted)}
.btn{-webkit-appearance:none;appearance:none;font-family:var(--display);font-size:1.05rem;padding:7px 18px;border-radius:10px;border:none;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:var(--accent-soft);color:var(--ink)}
.btn.ghost[aria-pressed="true"]{background:var(--gold);color:#3a2a00}
.btn:disabled{opacity:.5;cursor:not-allowed}
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.lane{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:8px 12px}
.lane h3{margin:0;font-family:var(--display);font-size:1.05rem;color:var(--c)}
.lane .clock{font-family:var(--display);font-size:2.1rem;line-height:1.05;font-variant-numeric:tabular-nums}
.lane .clock small{font-size:.95rem;color:var(--muted);margin-left:4px}
.lane .done{display:inline-block;margin-left:6px;font-size:.85rem;font-family:var(--body);font-weight:700;background:var(--gold);color:#3a2a00;border-radius:999px;padding:1px 9px;vertical-align:middle}
.lane .row{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.88rem;color:var(--muted)}
.lane .row b{color:var(--ink);font-variant-numeric:tabular-nums}
.prog{height:10px;border-radius:5px;background:var(--accent-soft);margin:6px 0 4px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--gold);border-radius:5px;transition:width .3s}
.note{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.note h2{font-family:var(--display);font-size:1.35rem;margin:0 0 6px;color:var(--accent);text-wrap:balance}
.note .q{font-size:1.08rem;font-weight:700;margin:0}
.note .hint{color:var(--muted);font-size:.9rem;margin:8px 0 0}
.rule{background:var(--accent-soft);border-radius:12px;padding:12px 14px}
.rule ul{margin:10px 0 0;padding-left:20px;font-weight:700}
.rule li{margin-bottom:6px}
.rule svg{display:block;width:100%;height:auto;margin-top:8px;background:var(--panel);border-radius:10px}
.logwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
.msg{font-weight:700;min-height:1.5em;margin:0}
</style></head><body>

<div class="wrap">
  <header>
    <div>
      <h1>Activation Energy Lab</h1>
      <p class="eq" id="eq">CO + NO<sub>2</sub> &rarr; CO<sub>2</sub> + NO</p>
    </div>
    <div class="key" aria-label="Key">
      <span><i class="dot" style="background:var(--atomC)"></i>carbon (C)</span>
      <span><i class="dot" style="background:var(--atomO)"></i>oxygen (O)</span>
      <span><i class="dot" style="background:var(--atomN)"></i>nitrogen (N)</span>
    </div>
  </header>

  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-m="1">Mission 1</button>
    <button role="tab" data-m="2">Mission 2</button>
    <button role="tab" data-m="3">Mission 3</button>
  </div>

  <div class="bench">
    <div class="col">
      <canvas id="cv" width="720" height="400" aria-label="Reaction chamber and energy diagram"></canvas>

      <div class="controls">
        <div class="ctl" id="eaCtl"><label for="ea">Activation energy (E<sub>a</sub>)</label><input type="range" id="ea" min="1" max="5" step="1" value="2" autocomplete="off"><small id="eaTxt">low</small></div>
        <button class="btn" id="startBtn">Start</button>
        <button class="btn ghost" id="fastBtn" aria-pressed="false">Speed up &times;3</button>
        <button class="btn ghost" id="pauseBtn">Pause</button>
        <button class="btn ghost" id="resetBtn">Start again</button>
      </div>

      <p class="msg" id="msg" aria-live="polite"></p>
      <div class="lanes" id="lanes"></div>

      <div class="logwrap" id="logwrap" hidden>
        <table><thead><tr><th>Try</th><th>E<sub>a</sub></th><th>Time for 5 CO<sub>2</sub></th><th>Collisions</th><th>Over the hill</th></tr></thead><tbody id="log"></tbody></table>
      </div>
    </div>

    <div class="col">
      <div class="note"><h2 id="mTitle"></h2><p class="q" id="mQ"></p><p class="hint" id="mHint"></p></div>
      <div class="rule"><button class="btn" id="ruleBtn">Check our rule</button><div id="ruleTxt" hidden></div></div>
    </div>
  </div>
</div>

<script>
(function(){
const W=720,H=400,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const dpr=Math.min(window.devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;
const $=id=>document.getElementById(id);
let col={};
function readColors(){const s=getComputedStyle(document.documentElement);['chamber','chamber-ink','wall','gold','atomC','atomO','atomN','bad','good','fast','slow'].forEach(k=>col[k]=s.getPropertyValue('--'+k).trim());}
readColors();

/* ---------- drawing (same molecules as the Collision Lab) ---------- */
const RA={C:11,O:11,N:12};
function atom(x,y,k){ctx.beginPath();ctx.arc(x,y,RA[k],0,7);ctx.fillStyle=col['atom'+k];ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='rgba(255,255,255,.75)';ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 11px Verdana,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(k,x,y+.5);}
function atomsOf(m){const c=Math.cos(m.a),s=Math.sin(m.a),r=[];
  if(m.t==='CO'){r.push(['O',m.x-9*c,m.y-9*s],['C',m.x+9*c,m.y+9*s]);}
  else if(m.t==='NO2'){const d=Math.PI/3;r.push(['O',m.x+17*Math.cos(m.a+d),m.y+17*Math.sin(m.a+d)],['O',m.x+17*Math.cos(m.a-d),m.y+17*Math.sin(m.a-d)],['N',m.x,m.y]);}
  else if(m.t==='CO2'){r.push(['O',m.x-18*c,m.y-18*s],['O',m.x+18*c,m.y+18*s],['C',m.x,m.y]);}
  else {r.push(['O',m.x-9*c,m.y-9*s],['N',m.x+9*c,m.y+9*s]);}
  return r;}
function drawMol(m){atomsOf(m).forEach(a=>atom(a[1],a[2],a[0]));}
const RM={CO:20,NO2:26,CO2:27,NO:20};
const NAME={CO:'CO',NO2:'NO₂',CO2:'CO₂',NO:'NO'};
function flash(f){const p=f.life/f.max;ctx.save();ctx.globalAlpha=p;
  if(f.ok){ctx.fillStyle=col.gold;ctx.beginPath();for(let i=0;i<16;i++){const r=(i%2?10:30)*(1.5-p*.5),a=i*Math.PI/8;ctx.lineTo(f.x+r*Math.cos(a),f.y+r*Math.sin(a));}ctx.closePath();ctx.fill();}
  else{ctx.strokeStyle=col['chamber-ink'];ctx.lineWidth=2;ctx.beginPath();ctx.arc(f.x,f.y,8+(1-p)*14,0,7);ctx.stroke();}
  ctx.restore();}
function text(t,x,y,size,color,align,bold){ctx.fillStyle=color||col['chamber-ink'];ctx.font=(bold===false?'':'bold ')+(size||12)+'px Verdana,sans-serif';ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillText(t,x,y);}
function pill(t,x,y,size,color){ctx.font='bold '+size+'px Verdana,sans-serif';const w=ctx.measureText(t).width+16;ctx.fillStyle='rgba(8,20,25,.78)';
  ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y-size,w,size*2,size);else ctx.rect(x,y-size,w,size*2);ctx.fill();text(t,x+w/2,y,size,color);}

/* ---------- energy hill ---------- */
const smooth=u=>(1-Math.cos(Math.PI*Math.max(0,Math.min(1,u))))/2;
/* energy along the reaction path, s from 0 to 1 */
function eAt(s,Ea,dH){if(s<=.25)return 0;if(s<=.5)return Ea*smooth((s-.25)/.25);if(s<.75)return dH+(Ea-dH)*smooth((.75-s)/.25);return dH;}
function sForE(E,Ea){return .25+.25*Math.acos(1-2*Math.min(1,E/Ea))/Math.PI;}
function hillPath(g,Ea,dH,steps){ctx.beginPath();for(let i=0;i<=(steps||80);i++){const s=i/(steps||80);const p=g(s,eAt(s,Ea,dH));i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}}

/* ---------- physics ---------- */
const SIG=1.0,KE=16.9,TARGET=5,NP=8;
const EAV=[30,60,90,120,150],EAW=['very low','low','medium','high','very high'];
function rayleigh(){return SIG*Math.sqrt(-2*Math.log(1-Math.random()));}
function makeChamber(o){const c=Object.assign({mols:[],flashes:[],climbers:[],marks:[],made:0,cols:0,over:0,steps:0,doneAt:null},o);
  for(let i=0;i<NP*2;i++){const t=i%2?c.B:c.A,r=RM[t];let x,y,ok=false,tr=0;
    while(!ok&&tr++<500){x=c.x+r+Math.random()*(c.w-2*r);y=c.y+r+Math.random()*(c.h-2*r);ok=c.mols.every(m=>Math.hypot(m.x-x,m.y-y)>m.r+r+4);}
    const a=Math.random()*6.283,v=rayleigh();c.mols.push({t,x,y,r,vx:v*Math.cos(a),vy:v*Math.sin(a),a:Math.random()*6.283,w:(Math.random()-.5)*.06});}
  return c;}
function step(c){
  c.steps++;
  const x0=c.x,x1=c.x+c.w,y0=c.y,y1=c.y+c.h;
  for(const m of c.mols){m.x+=m.vx;m.y+=m.vy;m.a+=m.w;let hit=false;
    if(m.x<x0+m.r){m.x=x0+m.r;m.vx=Math.abs(m.vx);hit=true;} if(m.x>x1-m.r){m.x=x1-m.r;m.vx=-Math.abs(m.vx);hit=true;}
    if(m.y<y0+m.r){m.y=y0+m.r;m.vy=Math.abs(m.vy);hit=true;} if(m.y>y1-m.r){m.y=y1-m.r;m.vy=-Math.abs(m.vy);hit=true;}
    /* the walls are kept at a fixed temperature */
    if(hit){const sp=Math.hypot(m.vx,m.vy)||1,nv=rayleigh();m.vx*=nv/sp;m.vy*=nv/sp;}}
  const ms=c.mols;
  for(let i=0;i<ms.length;i++)for(let j=i+1;j<ms.length;j++){
    const a=ms[i],b=ms[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,min=a.r+b.r-6;
    if(d>=min)continue;
    const nx=dx/d,ny=dy/d,rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny,p=(min-d)/2;a.x-=nx*p;a.y-=ny*p;b.x+=nx*p;b.y+=ny*p;
    if(rv>=0)continue;
    if((a.t===c.A&&b.t===c.B)||(a.t===c.B&&b.t===c.A)){
      const r1=a.t===c.A?a:b,r2=a.t===c.A?b:a,E=rv*rv*KE,ok=E>=c.Ea,fx=(a.x+b.x)/2,fy=(a.y+b.y)/2;
      c.cols++;
      if(ok){c.over++;c.made++;r1.t=c.C;r1.r=RM[c.C];r2.t=c.D;r2.r=RM[c.D];c.flashes.push({x:fx,y:fy,ok:true,life:40,max:40});
        if(c.made>=TARGET&&c.doneAt===null){c.doneAt=c.steps;c.snap={cols:c.cols,over:c.over};onDone(c);}}
      else c.flashes.push({x:fx,y:fy,ok:false,life:16,max:16});
      if(c.hill)c.climbers.push({s:.03,E,ok,ph:'go',t:0,stop:ok?.5:sForE(E,c.Ea)});
    }
    a.vx+=rv*nx;a.vy+=rv*ny;b.vx-=rv*nx;b.vy-=rv*ny;
  }
  if(c.hill)stepClimbers(c);
}
function timeOf(c){return ((c.doneAt===null?c.steps:c.doneAt)/60);}

/* ---------- climbers on the energy diagram ---------- */
function stepClimbers(c){
  for(const k of c.climbers){
    if(k.ph==='go'){const slope=k.s>.25?.0045:.012;k.s+=slope;
      if(k.s>=k.stop){k.s=k.stop;if(k.ok){k.ph='top';k.t=50;}else{k.ph='back';c.marks.push({E:k.E,life:900});}}}
    else if(k.ph==='back'){k.s-=k.s>.25?.006:.012;if(k.s<=.03){k.ph='gone';}}
    else if(k.ph==='top'){if(--k.t<=0)k.ph='down';}
    else if(k.ph==='down'){k.s+=.009;if(k.s>=.93){k.ph='fade';k.t=30;}}
    else if(k.ph==='fade'){if(--k.t<=0)k.ph='gone';}
  }
  c.climbers=c.climbers.filter(k=>k.ph!=='gone');
  c.marks.forEach(m=>m.life--);c.marks=c.marks.filter(m=>m.life>0).slice(-40);
}
function miniPair(x,y,t1,t2,sc,gap){ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);
  drawMol({t:t1,x:-gap,y:0,a:0});drawMol({t:t2,x:gap,y:0,a:Math.PI});ctx.restore();}

/* ---------- full energy diagram (Mission 2) ---------- */
const DG={x0:330,x1:708,y0:12,y1:388,zero:250,k:1.2};
function dgPt(s,e){return [DG.x0+44+s*(DG.x1-DG.x0-56),DG.zero-e*DG.k];}
function drawDiagram(c){
  const Ea=c.Ea,dH=c.dH,ink=col['chamber-ink'];
  ctx.save();
  ctx.fillStyle='rgba(255,255,255,.04)';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(DG.x0,DG.y0,DG.x1-DG.x0,DG.y1-DG.y0,12);else ctx.rect(DG.x0,DG.y0,DG.x1-DG.x0,DG.y1-DG.y0);ctx.fill();
  /* axes */
  const ax=DG.x0+26,ay=DG.y1-16;
  ctx.strokeStyle=ink;ctx.fillStyle=ink;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ax,DG.y0+22);ctx.moveTo(ax,ay);ctx.lineTo(DG.x1-12,ay);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ax,DG.y0+14);ctx.lineTo(ax-6,DG.y0+26);ctx.lineTo(ax+6,DG.y0+26);ctx.fill();
  ctx.beginPath();ctx.moveTo(DG.x1-4,ay);ctx.lineTo(DG.x1-16,ay-6);ctx.lineTo(DG.x1-16,ay+6);ctx.fill();
  ctx.save();ctx.translate(ax-13,(DG.y0+ay)/2);ctx.rotate(-Math.PI/2);text('Energy',0,0,12);ctx.restore();
  text('Reaction progress',(ax+DG.x1)/2,ay+9,11,ink,'center',false);
  /* peak line and Ea arrow */
  const pk=dgPt(.5,Ea),r0=dgPt(.12,0);
  ctx.setLineDash([5,5]);ctx.strokeStyle='rgba(217,238,240,.5)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(ax,pk[1]);ctx.lineTo(pk[0]+40,pk[1]);ctx.stroke();ctx.setLineDash([]);
  const axr=dgPt(.17,0)[0];ctx.strokeStyle=col.gold;ctx.fillStyle=col.gold;ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(axr,r0[1]-4);ctx.lineTo(axr,pk[1]+4);ctx.stroke();
  ctx.beginPath();ctx.moveTo(axr,pk[1]);ctx.lineTo(axr-6,pk[1]+10);ctx.lineTo(axr+6,pk[1]+10);ctx.fill();
  ctx.beginPath();ctx.moveTo(axr,r0[1]);ctx.lineTo(axr-6,r0[1]-10);ctx.lineTo(axr+6,r0[1]-10);ctx.fill();
  text('Eₐ',axr-16,(pk[1]+r0[1])/2,15,col.gold);
  /* fail marks: how high each weak collision got */
  for(const m of c.marks){const p=dgPt(sForE(m.E,Ea),m.E);ctx.globalAlpha=Math.min(1,m.life/200)*.9;ctx.strokeStyle=col.bad;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(p[0]-5,p[1]-5);ctx.lineTo(p[0]+5,p[1]+5);ctx.moveTo(p[0]+5,p[1]-5);ctx.lineTo(p[0]-5,p[1]+5);ctx.stroke();}
  ctx.globalAlpha=1;
  /* the curve */
  hillPath(dgPt,Ea,dH);ctx.strokeStyle=ink;ctx.lineWidth=3.5;ctx.stroke();
  const pr=dgPt(.88,dH);
  text(NAME[c.A]+' + '+NAME[c.B],dgPt(.1,0)[0]+6,r0[1]+18,12);
  text(NAME[c.C]+' + '+NAME[c.D],pr[0],pr[1]+18,12);
  text('activated complex',pk[0]+40,Math.max(24,pk[1]-10),12,col.gold,'left');
  /* climbers */
  for(const k of c.climbers){const p=dgPt(k.s,eAt(k.s,Ea,dH));ctx.save();
    if(k.ph==='fade')ctx.globalAlpha=k.t/30;
    if(k.ph==='top'){ctx.shadowColor=col.gold;ctx.shadowBlur=22;miniPair(p[0],p[1]-20,c.A,c.B,.62,16);ctx.shadowBlur=0;
      ctx.strokeStyle=col.gold;ctx.setLineDash([4,3]);ctx.lineWidth=1.5;ctx.strokeRect(p[0]-34,p[1]-38,68,36);ctx.setLineDash([]);}
    else if(k.ph==='down'||k.ph==='fade')miniPair(p[0],p[1]-18,c.C,c.D,.62,26);
    else miniPair(p[0],p[1]-18,c.A,c.B,.62,26);
    ctx.restore();}
  ctx.restore();
}

/* ---------- small hill badge in the race chambers ---------- */
function drawBadge(c,bx,by){const bw=118,bh=74;ctx.save();
  ctx.fillStyle='rgba(8,20,25,.82)';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(bx,by,bw,bh,10);else ctx.rect(bx,by,bw,bh);ctx.fill();
  const k=.24,zero=c.dH<0?by+44:by+44+c.dH*k;
  const g=(s,e)=>[bx+10+s*(bw-20),zero-e*k];
  hillPath(g,c.Ea,c.dH,40);ctx.strokeStyle=col['chamber-ink'];ctx.lineWidth=2;ctx.stroke();
  const a=g(.2,0),p=g(.5,c.Ea);ctx.lineWidth=2;
  if(c.dH>0){const m=g(.2,c.dH);ctx.strokeStyle=col.bad;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(a[0],m[1]);ctx.stroke();
    ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(a[0],m[1]);ctx.lineTo(g(.85,c.dH)[0],m[1]);ctx.stroke();ctx.setLineDash([]);
    ctx.strokeStyle=col.gold;ctx.beginPath();ctx.moveTo(a[0],m[1]);ctx.lineTo(a[0],p[1]);ctx.stroke();
    ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(a[0],p[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();ctx.setLineDash([]);
    text('Eₐ',a[0]-9,(m[1]+p[1])/2,10,col.gold);text('+',a[0]-9,(a[1]+m[1])/2,11,col.bad);}
  else{ctx.strokeStyle=col.gold;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(a[0],p[1]);ctx.stroke();
    ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(a[0],p[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();ctx.setLineDash([]);
    text('Eₐ',a[0]-9,(a[1]+p[1])/2,10,col.gold);}
  ctx.restore();}

/* ---------- state ---------- */
let mission=1,running=false,paused=false,fast=false,chambers=[],tries=0;
const RXN={fwd:{A:'CO',B:'NO2',C:'CO2',D:'NO',dH:-60},rev:{A:'CO2',B:'NO',C:'CO',D:'NO2',dH:60}};
const M={
 1:{title:'Mission 1: The race',
    q:'Both chambers have the same molecules at the same temperature. Only the activation energy is different. Which one makes 5 CO₂ first?',
    hint:'Predict first, then press Start. A gold star means a collision had enough energy to react.',
    rule:['Low Eₐ → many collisions have enough energy → <span style="color:var(--fast)">fast reaction</span>','High Eₐ → few collisions have enough energy → <span style="color:var(--slow)">slow reaction</span>'],svg:'race'},
 2:{title:'Mission 2: Climb the hill',
    q:'Each collision tries to climb the energy hill. What happens when Eₐ gets higher?',
    hint:'Try every activation energy and compare the times in your table. Red ✕ = how high a weak collision got before rolling back.',
    rule:['Collision energy less than Eₐ → the molecules roll back and bounce apart','Collision energy equal to or more than Eₐ → the activated complex forms at the top, then the products','Higher Eₐ → fewer collisions get over the hill → slower reaction'],svg:'hill'},
 3:{title:'Mission 3: Forward or reverse?',
    q:'At the same temperature, which is faster: the forward reaction or the reverse reaction?',
    hint:'Look at the hill in each chamber before you press Start.',
    rule:['Both directions climb the same hill, to the same top','Forward (exothermic): needs only Eₐ → faster','Reverse (endothermic): needs Eₐ + the energy absorbed → slower'],svg:'fr'}};

function setup(){
  chambers=[];readColors();
  if(mission===1){
    chambers.push(makeChamber(Object.assign({x:0,y:0,w:356,h:H,Ea:EAV[1],name:'Low activation energy',c:'fast'},RXN.fwd)));
    chambers.push(makeChamber(Object.assign({x:364,y:0,w:356,h:H,Ea:EAV[4],name:'High activation energy',c:'slow'},RXN.fwd)));
  }else if(mission===2){
    const v=+$('ea').value;
    chambers.push(makeChamber(Object.assign({x:0,y:0,w:318,h:H,Ea:EAV[v-1],name:'Eₐ: '+EAW[v-1],c:'fast',hill:true},RXN.fwd)));
  }else{
    chambers.push(makeChamber(Object.assign({x:0,y:0,w:356,h:H,Ea:EAV[1],name:'Forward',c:'fast'},RXN.fwd)));
    chambers.push(makeChamber(Object.assign({x:364,y:0,w:356,h:H,Ea:EAV[1]-RXN.fwd.dH,name:'Reverse',c:'slow'},RXN.rev)));
  }
  running=false;paused=false;$('pauseBtn').textContent='Pause';$('pauseBtn').disabled=true;$('startBtn').disabled=false;$('startBtn').textContent='Start';
  $('msg').textContent='';buildLanes();
}
function buildLanes(){const L=$('lanes');L.innerHTML='';
  chambers.forEach((c,i)=>{const d=document.createElement('div');d.className='lane';d.style.setProperty('--c','var(--'+(mission===2?'accent':c.c)+')');
    const eqn=mission===3?' <span style="font-weight:400;font-family:var(--body);font-size:.85rem;color:var(--muted)">'+NAME[c.A]+' + '+NAME[c.B]+' → '+NAME[c.C]+' + '+NAME[c.D]+'</span>':'';
    d.innerHTML='<h3>'+c.name+eqn+'</h3><div class="clock"><span id="t'+i+'">0.0</span><small>s</small><span class="done" id="d'+i+'" hidden>Finished!</span></div>'+
      '<div class="prog"><i id="p'+i+'"></i></div>'+
      '<div class="row"><span>'+NAME[c.C]+' made <b id="m'+i+'">0</b> / '+TARGET+'</span><span>collisions <b id="c'+i+'">0</b></span><span>enough energy <b id="o'+i+'">0</b></span></div>';
    L.appendChild(d);});}
function showLanes(){chambers.forEach((c,i)=>{$('t'+i).textContent=timeOf(c).toFixed(1);$('m'+i).textContent=Math.min(c.made,TARGET);const sn=c.snap||c;$('c'+i).textContent=sn.cols;$('o'+i).textContent=sn.over;
  $('p'+i).style.width=Math.min(100,c.made/TARGET*100)+'%';$('d'+i).hidden=c.doneAt===null;});}

function onDone(c){
  if(mission===2){tries++;const tr=document.createElement('tr');
    [tries,EAW[+$('ea').value-1],timeOf(c).toFixed(1)+' s',c.cols,c.over].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td);});
    $('log').prepend(tr);$('msg').textContent='5 CO₂ made in '+timeOf(c).toFixed(1)+' s. Change Eₐ and try again.';}
  else if(chambers.every(k=>k.doneAt!==null)){const a=chambers[0],b=chambers[1];
    $('msg').textContent=a.name+': '+timeOf(a).toFixed(1)+' s.   '+b.name+': '+timeOf(b).toFixed(1)+' s.';}
  else $('msg').textContent=c.name+' finished first!';
}

/* ---------- loop ---------- */
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  if(chambers.length===2){ctx.fillStyle=col.wall;ctx.fillRect(356,0,8,H);}
  for(const c of chambers){
    ctx.save();ctx.beginPath();ctx.rect(c.x,c.y,c.w,c.h);ctx.clip();
    c.mols.forEach(drawMol);c.flashes.forEach(flash);
    ctx.restore();
    pill(c.name,c.x+8,c.y+18,12,col['chamber-ink']);
    if(!c.hill)drawBadge(c,c.x+c.w-126,c.y+8);
    if(c.doneAt!==null){pill('Finished: '+timeOf(c).toFixed(1)+' s',c.x+8,c.y+c.h-20,12,col.gold);}
  }
  if(mission===2){ctx.fillStyle=col.wall;ctx.fillRect(318,0,6,H);drawDiagram(chambers[0]);}
  if(!running){ctx.fillStyle='rgba(8,20,25,.45)';ctx.fillRect(0,0,mission===2?318:W,H);
    pill('Press Start',(mission===2?159:W/2)-52,H/2,14,col.gold);}
}
function frame(){
  if(running&&!paused){const n=fast?3:1;for(let i=0;i<n;i++)chambers.forEach(step);
    chambers.forEach(c=>c.flashes=c.flashes.filter(f=>--f.life>0));showLanes();}
  draw();requestAnimationFrame(frame);
}

/* ---------- side panel visuals ---------- */
function svgHill(x,y,w,peak,end,color){const pts=[];for(let i=0;i<=40;i++){const s=i/40;pts.push((x+s*w).toFixed(1)+','+(y-eAt(s,peak,end)).toFixed(1));}
  return '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="3" stroke-linejoin="round"/>';}
function svgArrow(x,y1,y2){return '<line x1="'+x+'" y1="'+y1+'" x2="'+x+'" y2="'+(y2+6)+'" stroke="#c98a00" stroke-width="2.5"/><path d="M'+x+' '+y2+'l-5 9h10z" fill="#c98a00"/><text x="'+(x-6)+'" y="'+((y1+y2)/2+4)+'" text-anchor="end" font-size="13" font-weight="700" fill="#c98a00">Eₐ</text>';}
const SVG={
 race:'<svg viewBox="0 0 300 120" role="img" aria-label="Low hill fast, high hill slow">'+svgHill(20,90,120,25,-15,'#1f8f55')+svgArrow(48,90,65)+'<text x="80" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#1f8f55">low Eₐ: fast</text>'+
   svgHill(160,90,120,70,-15,'#c0504d')+svgArrow(188,90,20)+'<text x="220" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#c0504d">high Eₐ: slow</text></svg>',
 hill:'<svg viewBox="0 0 300 130" role="img" aria-label="One pair rolls back, one pair goes over the hill">'+svgHill(30,95,240,70,-20,'#17323a')+svgArrow(70,95,25)+
   '<circle cx="104" cy="78" r="7" fill="#c0504d"/><path d="M96 86 q-8 6 -18 6" fill="none" stroke="#c0504d" stroke-width="2" stroke-dasharray="4 3"/><path d="M76 92 l8 -5 l0 9z" fill="#c0504d"/><text x="116" y="100" font-size="12" font-weight="700" fill="#c0504d">not enough → back</text>'+
   '<circle cx="150" cy="17" r="8" fill="#f2b632" stroke="#c98a00"/><text x="164" y="20" font-size="12" font-weight="700" fill="#1f8f55">enough → products</text>'+
   '<text x="60" y="122" font-size="11" fill="#587078">reactants</text><text x="290" y="122" text-anchor="end" font-size="11" fill="#587078">products</text></svg>',
 fr:'<svg viewBox="0 0 340 175" role="img" aria-label="The forward and reverse reactions climb the same hill. The reverse needs the activation energy plus the energy absorbed."><line x1="12" y1="40" x2="336" y2="40" stroke="#9bb0b5" stroke-width="1.5" stroke-dasharray="4 4"/>'+svgHill(15,80,130,40,-50,'#1f8f55')+'<line x1="36" y1="80" x2="36" y2="46" stroke="#c98a00" stroke-width="2.5"/><path d="M36 40l-5 9h10z" fill="#c98a00"/><text x="30" y="64" text-anchor="end" font-size="13" font-weight="700" fill="#c98a00">Eₐ</text><text x="80" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#1f8f55">forward (exothermic)</text>'+svgHill(205,130,130,90,50,'#c0504d')+'<line x1="222" y1="80" x2="336" y2="80" stroke="#9bb0b5" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="222" y1="80" x2="222" y2="46" stroke="#c98a00" stroke-width="2.5"/><path d="M222 40l-5 9h10z" fill="#c98a00"/><line x1="222" y1="130" x2="222" y2="86" stroke="#c0504d" stroke-width="2.5"/><path d="M222 80l-5 9h10z" fill="#c0504d"/><text x="216" y="64" text-anchor="end" font-size="13" font-weight="700" fill="#c98a00">Eₐ</text><text x="216" y="104" text-anchor="end" font-size="11" font-weight="700" fill="#c0504d">+ energy</text><text x="216" y="117" text-anchor="end" font-size="11" font-weight="700" fill="#c0504d">absorbed</text><text x="270" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#c0504d">reverse (endothermic)</text><text x="80" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#1f8f55">needs Eₐ → fast</text><text x="265" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#c0504d">Eₐ + absorbed → slow</text></svg>'};

/* ---------- missions ---------- */
function setMission(n){mission=n;const m=M[n];
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.m==n));
  $('mTitle').textContent=m.title;$('mQ').textContent=m.q;$('mHint').textContent=m.hint;
  $('ruleTxt').hidden=true;$('ruleBtn').hidden=false;$('ruleTxt').innerHTML='<ul>'+m.rule.map(r=>'<li>'+r+'</li>').join('')+'</ul>'+SVG[m.svg];
  $('eaCtl').hidden=n!==2;$('logwrap').hidden=n!==2;
  $('eq').innerHTML=n===3?'CO + NO<sub>2</sub> &rlarr; CO<sub>2</sub> + NO':'CO + NO<sub>2</sub> &rarr; CO<sub>2</sub> + NO';
  if(n===2){$('log').innerHTML='';tries=0;}
  setup();
  try{history.replaceState(null,'','#mission'+n);}catch(e){}
}
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>setMission(+b.dataset.m)));
$('ruleBtn').addEventListener('click',()=>{$('ruleTxt').hidden=false;$('ruleBtn').hidden=true;});
$('startBtn').addEventListener('click',()=>{if(running)setup();running=true;$('startBtn').disabled=true;$('pauseBtn').disabled=false;});
$('pauseBtn').addEventListener('click',()=>{paused=!paused;$('pauseBtn').textContent=paused?'Play':'Pause';});
$('resetBtn').addEventListener('click',setup);
$('fastBtn').addEventListener('click',()=>{fast=!fast;$('fastBtn').setAttribute('aria-pressed',fast);});
$('ea').addEventListener('input',e=>{$('eaTxt').textContent=EAW[+e.target.value-1];setup();});
let start=1;const h=(location.hash||'').match(/mission([1-3])/);if(h)start=+h[1];
$('eaTxt').textContent=EAW[+$('ea').value-1];
setMission(start);
frame();
})();
</script>
